# The journalist's OWN fly.io app — replaced by `flyctl launch --name <their-app>` at setup.
# fly.io app names are globally unique; there is no shared central host. See skills/atelier/SKILL.md.
app = "CHANGE-ME-your-embeds-app"
primary_region = "cdg"

[build]

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
