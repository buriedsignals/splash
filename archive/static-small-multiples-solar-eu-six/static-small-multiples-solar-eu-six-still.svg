<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif" data-ladder="none"><desc>Six small line charts, one per country, all on the same scale, showing solar&#x27;s share of electricity generation from 2010 to 2024. Every line rises. Spain rises furthest, from 2.4% to 20.7%, a gain of 18.3 percentage points. Spain, Germany, Italy, Poland all end above 10%. France&#x27;s line is close to flat by comparison, ending at 4.4%, and Poland and Romania started the period at zero.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="138" fill="#000000" font-size="53" font-weight="700">Solar supplied under 3% of electricity in every one of the EU&#x27;s six</text><text x="85" y="204" fill="#000000" font-size="53" font-weight="700">largest countries in 2010. By 2024 it supplied more than a tenth in</text><text x="85" y="270" fill="#000000" font-size="53" font-weight="700">four of them</text><text x="85" y="327" fill="#616161" font-size="33">Solar&#x27;s share of each country&#x27;s own electricity generation, %. Every panel is drawn on the same scale, so a flat panel is</text><text x="85" y="371" fill="#616161" font-size="33">a flat trend — France really is at 4.4% while Spain is at 20.7%.</text><text x="85" y="995" fill="#616161" font-size="31">Source: Ember, via Our World in Data · annual data to 2024, extracted 9 August 2026</text><g><text x="154.060546875" y="477" fill="#000000" font-size="33" font-weight="700">Spain</text><g><line x1="154.060546875" x2="670.3736979166666" y1="623.5" y2="623.5" stroke="#d1d1d1" stroke-width="1"></line><text x="146.060546875" y="627.5" fill="#616161" font-size="26" text-anchor="end">0</text></g><g><line x1="154.060546875" x2="670.3736979166666" y1="592.0227272727273" y2="592.0227272727273" stroke="#d1d1d1" stroke-width="1"></line><text x="146.060546875" y="596.0227272727273" fill="#616161" font-size="26" text-anchor="