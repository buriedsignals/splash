<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Histogram of CO2 emissions per capita across 213 countries in 2023, in 4-tonne bins from 0 to 36 and above. The distribution is heavily right-skewed: 127 countries sit in the 0-4 tonne bin, more than any other bin; the rest thin out into a long tail, topped by Qatar alone above 36 tonnes, at 40.1 tonnes. A dashed median line sits at 3.1 tonnes.</desc><rect x="0" y="0" width="1080" height="1920" fill="#FFFFFF"></rect><text x="48" y="487.0" fill="#000000" font-size="30" font-weight="700">Six in ten countries emit under 4 tonnes of CO2 per person a year</text><text x="48" y="521.0" fill="#616161" font-size="17">Per-country distribution for 2023 — each of the 213 countries counts equally here, not weighted by population. A few oil and gas</text><text x="48" y="545.0" fill="#616161" font-size="17">producers sit far out on the right.</text><text x="48" y="571.0" fill="#616161" font-size="17">Source: Global Carbon Budget (2025), via Our World in Data · 2023 data, extracted 8 August 2026</text><g><line x1="155.484375" x2="1022" y1="1399.8" y2="1399.8" stroke="#616161" stroke-width="1"></line><text x="143.484375" y="1404.8" fill="#616161" font-size="16" text-anchor="end">0</text></g><g><line x1="155.484375" x2="1022" y1="1278.6" y2="1278.6" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="1283.6" fill="#616161" font-size="16" text-anchor="end">20</text></g><g><line x1="155.484375" x2="1022" y1="1157.4" y2="1157.4" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="1162.4" fill="#616161" font-size="16" text-anchor="end">40</text></g><g><line x1="155.484375" x2="1022" y1="1036.2" y2="1036.2" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="1041.2" fill="#616161" font-size="16" text-anchor="end">60</text></g><g><line x1="155.484375" x2="1022" y1="915.0" y2="915.0" stroke="#d1d1d1" str