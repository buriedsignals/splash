<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Ranking of the ten countries with the highest CO₂ emissions in 2024. China leads at 12.3 billion tonnes, 2.5 times the United States, and more than the United States, India, Russia, Japan and Indonesia added together. The remaining bars fall to 0.57 billion tonnes for Germany.</desc><rect x="0" y="0" width="1080" height="1920" fill="#FFFFFF"></rect><text x="48" y="90" fill="#000000" font-size="42" font-weight="700">China emitted more CO₂ in 2024 than the next</text><text x="48" y="143" fill="#000000" font-size="42" font-weight="700">five countries put together</text><text x="48" y="174" fill="#616161" font-size="26">Annual territorial CO₂ from fossil fuels and industry, billion tonnes. These ten</text><text x="48" y="209" fill="#616161" font-size="26">countries account for 69% of the world total.</text><text x="48" y="238" fill="#616161" font-size="17">Source: Global Carbon Budget 2025, via Our World in Data · 2024 data, extracted 9 August 2026</text><g><rect x="61.775999999999954" y="293" width="70.848" height="756.9230769230769" fill="#0B7A75"></rect><text x="97.19999999999996" y="283" fill="#000000" font-size="17" font-weight="600" text-anchor="middle">12.3</text><text x="97.19999999999996" y="1071.923076923077" fill="#000000" font-size="16" text-anchor="middle">China</text></g><g><rect x="160.17599999999996" y="747.8618495055014" width="70.848" height="302.06122741757554" fill="#616161"></rect><text x="195.59999999999997" y="737.8618495055014" fill="#000000" font-size="17" font-weight="600" text-anchor="middle">4.9</text><text x="195.59999999999997" y="1071.923076923077" fill="#000000" font-size="16" text-anchor="middle">United</text><text x="195.59999999999997" y="1090.923076923077" fill="#000000" font-size="16" text-anchor="middle">States</text></g><g><rect x="258.57599999999996" y="853.2260314557664" width="70.848" height="196.69704546731055" fill="#616161"></rect><text x="293.99999999999994" y="843.2260314557664" fill="#000000" font-size="17" font-weight="600" text-anchor="middle">3.2</text><text x="293.99999999999994" y="1071.923076923077" fill="#000000" font-size="16" text-anchor="middle">India</text></g><g><rect x="356.976" y="940.2545970100767" width="70.848" height="109.66847991300017" fill="#616161"></rect><text x="392.4" y="930.2545970100767" fill="#000000" font-size="17" font-weight="600" text-anchor="middle">1.8</text><text x="392.4" y="1071.923076923077" fill="#000000" font-size="16" text-anchor="middle">Russia</text></g><g><rect x="455.376" y="990.6784382823362" width="70.848" height="59.24463864074073" fill="#616161"></rect><text x="490.79999999999995" y="980.6784382823362" fill="#000000" font-size="17" font-weight="600" text-anchor="middle">0.96</text><text x="490.79999999999995" y="1071.923076923077" fill="#000000" font-size="16" text-anchor="middle">Japan</text></g><g><rect x="553.776" y="999.8957059481928" width="70.848" height="50.02737097488409" fill="#616161"></rect><text x="589.1999999999999" y="989.8957059481928" fill="#000000" font-size="17" font-weight="600" text-anchor="middle">0.81</text><text x="589.1999999999999" y="1071.923076923077" fill="#000000" font-size="16" text-anchor="middle">Indonesia</text></g><g><rect x="652.176" y="1001.102258272337" width="70.848" height="48.82081865073985" fill="#616161"></rect><text x="687.6" y="991.102258272337" fill="#000000" font-size="17" font-weight="600" text-anchor="middle">0.79</text><text x="687.6" y="1071.923076923077" fill="#000000" font-size="16" text-anchor="middle">Iran</text></g><g><rect x="750.576" y="1007.292249262493" width="70.848" height="42.63082766058392" fill="#616161"></rect><text x="786" y="997.292249262493" fill="#000000" font-size="17" font-weight="600" text-anchor="middle">0.69</text><text x="786" y="1071.923076923077" fill="#000000" font-size="16" text-anchor="middle">Saudi</text><text x="786" y="1090.923076923077" fill="#000000" font-size="16" text-anchor="middle">Arabia</text></g><g><rect x="848.976" y="1013.9723158266372" width="70.848" height="35.95076109643969" fill="#616161"></rect><text x="884.4" y="1003.9723158266372" fill="#000000" font-size="17" font-weight="600" text-anchor="middle">0.58</text><text x="884.4" y="1071.923076923077" fill="#000000" font-size="16" text-anchor="middle">South</text><text x="884.4" y="1090.923076923077" fill="#000000" font-size="16" text-anchor="middle">Korea</text></g><g><rect x="947.376" y="1014.6720163933983" width="70.848" height="35.251060529678625" fill="#616161"></rect><text x="982.8" y="1004.6720163933983" fill="#000000" font-size="17" font-weight="600" text-anchor="middle">0.57</text><text x="982.8" y="1071.923076923077" fill="#000000" font-size="16" text-anchor="middle">Germany</text></g><line x1="48" x2="1032" y1="293" y2="293" stroke="#0B7A75" stroke-width="1.5" stroke-dasharray="5 4"></line><text x="149.62399999999997" y="279" fill="#000000" font-size="17">more than the United States, India, Russia, Japan and Indonesia added together (11.7 bn t)</text><line x1="48" x2="1032" y1="1049.923076923077" y2="1049.923076923077" stroke="#000000" stroke-width="1"></line><line x1="48" x2="1032" y1="1581" y2="1581" stroke="#d1d1d1" stroke-width="1"></line><g><text x="48" y="1638" fill="#0B7A75" font-size="26" font-weight="700">The gap.</text><text x="165.142578125" y="1638" fill="#000000" font-size="26">China emits 12.3 billion tonnes, 2.5 times the United States&#x27;s 4.9 — and</text><text x="165.142578125" y="1678" fill="#000000" font-size="26">more than ranks two to six added together.</text></g><g><text x="48" y="1735" fill="#0B7A75" font-size="26" font-weight="700">The ten.</text><text x="157.9189453125" y="1735" fill="#000000" font-size="26">Between them these ten account for 69% of the 38.6 billion tonnes the</text><text x="157.9189453125" y="1775" fill="#000000" font-size="26">world emitted in 2024.</text></g><g><text x="48" y="1832" fill="#0B7A75" font-size="26" font-weight="700">The floor.</text><text x="175.2607421875" y="1832" fill="#000000" font-size="26">Tenth place, Germany, emits 0.57 billion tonnes — 21 times less than</text><text x="175.2607421875" y="1872" fill="#000000" font-size="26">China.</text></g></svg>