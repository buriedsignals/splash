<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switzerland's population bulges at ages 55-59, not among the youngest</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --ground: #FFFFFF;
  --accent: #0072B2;
  --ink: #000000;
  --muted: #616161;
  --grid: #d1d1d1;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: Helvetica, Arial, sans-serif;
}

/* THE FLUID FILL — the redesign this file exists to ship. .chart-figure and everything inside
   .chart-plot take the FULL width of whatever contains them, edge to edge, no max-width cap and
   no fixed rung to swap between. Height is never independently set on the plot: aspect-ratio
   (set per-render on .chart-plot's own inline style, from the component's real geometry) grows
   the height WITH the width, so a very wide container gets a taller chart rather than a flat,
   letterboxed strip -- the failure mode capping the width would otherwise avoid at the cost of
   empty gutters, and the failure mode letting width AND height both float freely would risk
   instead. The header block and the source line USED to carry a 640px reading-measure cap; they
   no longer do. A title that stops at 640px above a chart running to 1600 reads as a broken box,
   not as a comfortable measure -- see references/web-discipline.md, "The words take the same width
   as the graphic," for the reversal and what now bounds the line length instead.

   "Fills the container" is a claim about the FRAME's own edges, never about the content inside
   it -- FRAME_PAD_PX is the fixed inner margin that keeps that distinction real: title, caveat,
   filter, every axis label, the end label and the source line all sit inside it, so nothing ever
   touches the frame's own edge at any width. box-sizing:border-box (above) is what makes width:100%
   plus this padding still equal exactly 100% of the parent -- no overflow, no second width to
   reconcile. */
.chart-figure {
  margin: 0;
  width: 100%;
  padding: 24px;
  display: flex;
  flex-direction: column;
  /* THE WINDOW FIT. A beat is one thing a reader looks at, not a document they scroll through:
     the whole figure must be visible at once. Width filling its container and height following
     from aspect-ratio was only half the rule -- at 1600x800 the measured figure came to 902px
     against an 800px window (102px of it below the fold: the end label, the x-axis and the source
     line), and at 1920x950 it came to 1051px against 950. Clamping here, rather than capping the
     width or shortening the geometry, is what keeps the fill and the fit true at the same time.
     max-height, never height: when the frame's natural height already fits (a tall window, a
     narrow one), nothing changes at all and no empty space is reserved -- which matters because
     this file is embedded inside an article as often as it is opened on its own.
     Two declarations, not one: dvh is what a mobile browser's collapsing toolbar makes correct,
     vh is what an engine without dvh still understands, and the later declaration simply wins
     where it parses. */
  max-height: 100vh;
  max-height: 100dvh;
}
/* Everything except the plot keeps its natural height: words are never squeezed to make a chart
   fit, the chart is. flex-shrink:0 is the half of that rule the browser does not default to. */
.chart-header, .chart-source { flex: 0 0 auto; }
.chart-title {
  margin: 0 0 4px;
  font-size: var(--title-size);
  font-weight: var(--title-weight);
  color: var(--ink);
}
.chart-caveat, .chart-source {
  margin: 0;
  font-size: var(--subtitle-size);
  color: var(--muted);
}
.chart-source { font-size: var(--source-size); margin-top: 10px; }



.chart-plot {
  position: relative;
  width: 100%;
  display: grid;
  grid-template-columns: var(--y-gutter) 1fr;
  grid-template-rows: 1fr var(--x-axis-h);
  /* The one shrinkable item in the figure's column -- see .chart-figure's max-height above. Its
     flex BASE size is still the canonical aspect-ratio (set per-render on this element's own
     inline style, from the real geometry), so in a window with room the shape is exactly what it
     always was, byte for byte. Only when the column overflows does 1 (flex-shrink) let this box
     give the height back, and the <svg>'s own preserveAspectRatio="none" follows it down without
     letterboxing or clipping -- the same stretch that already absorbs the gutter drift this
     genre documents. A flatter plot is a real cost, paid knowingly: a slope read at a shallower
     angle is still the same series, whereas a chart whose end label is below the fold is not a
     chart the reader has seen.
     min-height is BOTH the floor (see PLOT_FLOOR_PX) and the override of flexbox's own
     min-height:auto, which would otherwise refuse to shrink this box below its content size and
     re-open the overflow this whole rule exists to close. */
  flex: 0 1 auto;
  min-height: 120px;
}
.chart-plot .y-axis { grid-column: 1; grid-row: 1; position: relative; }
svg.chart { grid-column: 2; grid-row: 1; width: 100%; height: 100%; display: block; }
/* pointer-events:none is load-bearing, not decoration: .overlay shares the exact grid cell the
   svg's own .hit-area occupies, and a plain div with no pointer-events override intercepts every
   mouse/touch event over the WHOLE plot before it ever reaches the svg beneath it -- caught only by
   driving a real browser (page.mouse.move landed on .overlay, not the hit-area, and the tooltip
   never appeared), never by the markup or a unit test. Inherited by every span inside it, which is
   correct: none of them is a control. */
.chart-plot .overlay { grid-column: 2; grid-row: 1; position: relative; pointer-events: none; }
.chart-plot .x-axis { grid-column: 2; grid-row: 2; position: relative; }

.axis-label {
  position: absolute;
  font-size: var(--axis-size);
  white-space: nowrap;
}
.axis-label.y { right: 10px; transform: translateY(-50%); }
.axis-label.x { top: 6px; transform: translateX(-50%); }

.note, .end-label {
  position: absolute;
  font-size: var(--note-size);
  white-space: nowrap;
  background: var(--ground);
  padding: 1px 4px;
  border-radius: 2px;
}
.note.reference-label { transform: translateY(-100%) translateY(-4px); }
.note.peak-label.above { transform: translate(-50%, -100%) translateY(-6px); }
.end-label {
  font-size: var(--label-size);
  font-weight: var(--label-weight);
  transform: translate(-100%, -50%) translateX(-10px);
}

/* THE HOVERABLE LINE's own contract with the components that draw one. pointer-events:stroke is
   the whole mechanism: it makes the STROKE the hit region rather than the bounding box, which for
   a diagonal connector is mostly empty space -- a reader aiming at the line they can see would
   otherwise be answered by a rectangle that also covers everything between the line and the frame.
   The twin is transparent and generously wide (the component states the width as a knob); nothing
   here paints it. .line-active is what a component may style to bring the visible line forward. */
.line-hit { pointer-events: stroke; cursor: pointer; fill: none; }
.line-hit:focus { outline: none; }
.line-hit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.pt { cursor: pointer; }
.pt:hover, .pt:focus, .pt-active {
  fill: var(--muted);
  outline: none;
}
.pt:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
#tooltip {
  position: fixed;
  max-width: 220px;
  padding: 6px 10px;
  font-size: 13px;
  line-height: 1.3;
  background: var(--ground);
  color: var(--ink);
  border: 1px solid var(--muted);
  border-radius: 3px;
  pointer-events: none;
  z-index: 10;
}
#tooltip[hidden] { display: none; }
</style>
<style>

/* The peak annotation hangs FROM the lowest row whose own bar leaves it clear — see
   SwissAgePyramidWeb.tsx's peakAnnotation() for how that row is derived and for why it cannot sit
   on the row it points at. translateY(-100%) is what "hangs from" means: the row the component
   computed is the label's BOTTOM edge, so the block grows upward into rows whose bars are shorter
   still, and the leader emerges from directly under it. */
.chart-plot.pyramid .overlay .note.peak-label {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
  top: var(--peak-top);
  transform: translateY(-100%);
}
/* The leader, in two segments, both HTML so they can follow a label the container query moves. A
   dashed BORDER rather than a stroked path: a border is a fixed number of CSS pixels at any
   stretch, which is what a 1px hairline has to be. Their geometry is written by
   peakAnnotationCss() in SwissAgePyramidWeb.tsx, from the peak bar's own coordinates. */
.chart-plot.pyramid .peak-leader-v { position: absolute; border-left: 1px dashed; }
.chart-plot.pyramid .peak-leader-h { position: absolute; border-top: 1px dashed; }
.chart-plot.pyramid .overlay .note.peak-label .band { font-weight: 700; }
/* THE MIRROR'S OWN GRID — three tracks, and the middle one is the whole reason this beat needed a
   layout of its own. The age labels sit in a reserved gutter down the CENTRE, and in a fluid frame
   that gutter cannot be measured in SVG user units: the label is fixed-pixel HTML while the viewBox
   stretches, so a user-unit gutter is ~50px on a laptop and ~20px on a phone while the label stays
   24px wide either way. It is a real CSS track instead (--band-gutter, measured in node), with one
   independent <svg> either side of it. Both flanking tracks are 1fr, so the mirror stays true. */
.chart-plot.pyramid {
  grid-template-columns: 1fr var(--band-gutter) 1fr;
  grid-template-rows: minmax(0, 1fr) var(--x-axis-h);
}
.chart-plot.pyramid svg.half {
  grid-row: 1;
  width: 100%;
  height: 100%;
  display: block;
}
.chart-plot.pyramid svg.half.left { grid-column: 1; }
.chart-plot.pyramid svg.half.right { grid-column: 3; }
.chart-plot.pyramid .overlay.left { grid-column: 1; grid-row: 1; }
.chart-plot.pyramid .band-labels {
  grid-column: 2;
  grid-row: 1;
  position: relative;
}
.chart-plot.pyramid .band-labels .band-label {
  position: absolute;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: var(--band-size);
  color: var(--muted);
  white-space: nowrap;
}
.chart-plot.pyramid .x-axis { grid-row: 2; }
.chart-plot.pyramid .x-axis.left { grid-column: 1; }
.chart-plot.pyramid .x-axis.right { grid-column: 3; }
/* The hit rows span BOTH halves and the gutter between them — which is exactly why they are HTML
   and not SVG rects: no rect can span two <svg> elements. They tile the plot edge to edge, so
   there is nothing to resolve by "nearest". */
.chart-plot.pyramid .hit-rows {
  grid-column: 1 / -1;
  grid-row: 1;
  position: relative;
}
.chart-plot.pyramid .row-hit {
  position: absolute;
  left: 0;
  right: 0;
  cursor: pointer;
}
.chart-plot.pyramid .row-hit:hover,
.chart-plot.pyramid .row-hit:focus,
.chart-plot.pyramid .row-hit.row-active {
  /* A FRAME, not a fill — the rule this beat has kept since its first build, and the reason is one
     line up: these rows sit ON TOP of both halves and the age label between them, so a translucent
     fill paints over the bars and the label it is meant to point at. An inset box-shadow outlines
     the active row without covering a pixel of it, and costs no layout. */
  box-shadow: inset 0 0 0 1.5px var(--ink);
  outline: none;
}
.chart-plot.pyramid .row-hit:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: -2px;
}
.chart-legend {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 18px;
  margin: 10px 0 6px;
  font-size: var(--legend-size);
  font-weight: var(--legend-weight);
  color: var(--ink);
}
.chart-legend .legend-key { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend .legend-swatch { width: 12px; height: 12px; display: inline-block; }
/* The alt text, readable by a screen reader and out of the layout — absolutely positioned, so it
   never claims one of the grid's own cells. */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

</style>

iv class="row-hit" style="top:62%;height:4.8%" tabindex="0" role="img" aria-label="Age 35-39: 321,756 men, 314,851 women" data-band="35-39" data-detail="35-39: men 321,756 · women 314,851"></div><div class="row-hit" style="top:66.8%;height:4.8%" tabindex="0" role="img" aria-label="Age 30-34: 316,016 men, 307,406 women" data-band="30-34" data-detail="30-34: men 316,016 · women 307,406"></div><div class="row-hit" style="top:71.6%;height:4.8%" tabindex="0" role="img" aria-label="Age 25-29: 273,794 men, 261,093 women" data-band="25-29" data-detail="25-29: men 273,794 · women 261,093"></div><div class="row-hit" style="top:76.4%;height:4.8%" tabindex="0" role="img" aria-label="Age 20-24: 236,265 men, 220,433 women" data-band="20-24" data-detail="20-24: men 236,265 · women 220,433"></div><div class="row-hit" style="top:81.2%;height:4.8%" tabindex="0" role="img" aria-label="Age 15-19: 220,727 men, 208,556 women" data-band="15-19" data-detail="15-19: men 220,727 · women 208,556"></div><div class="row-hit" style="top:86%;height:4.8%" tabindex="0" role="img" aria-label="Age 10-14: 228,691 men, 216,464 women" data-band="10-14" data-detail="10-14: men 228,691 · women 216,464"></div><div class="row-hit" style="top:90.8%;height:4.8%" tabindex="0" role="img" aria-label="Age 5-9: 232,332 men, 220,041 women" data-band="5-9" data-detail="5-9: men 232,332 · women 220,041"></div><div class="row-hit" style="top:95.6%;height:4.8%" tabindex="0" role="img" aria-label="Age 0-4: 222,640 men, 211,390 women" data-band="0-4" data-detail="0-4: men 222,640 · women 211,390"></div></div></div><p class="chart-source">Source: UN, World Population Prospects (2024), via Our World in Data · 2023 data, extracted 8 August 2026</p></figure>

<script>
// twin/proof/weby-population-pyramid-switzerland/pyramid-interaction.mjs
//
// This beat's OWN interaction script — not `chart-web/assets/interaction.mjs` (the line
// genre's own copy, which resolves hover/tap by NEAREST-X over one shared `.hit-area` overlay) and
// not `web-income-life-expectancy/scatter-interaction.mjs` (nearest-2D-point over one shared
// overlay, for a cloud with no natural tiling). Neither mechanic fits here: `render-web.mjs`
// bakes one `.row-hit` rect PER AGE BAND, sized to that band's own full row slot
// (`pyramid-geometry.ts`'s `hitY`/`hitHeight`), edge-to-edge with its neighbours — the 21 rows
// already TILE the entire plot rectangle exactly, with no gaps and no overlaps. That means each
// row's own native pointer events (`pointerenter`/`pointerleave`) already resolve correctly on
// their own; no shared overlay and no nearest-neighbour distance math is needed, unlike either
// prior beat.
//
// `data-detail` on every `.row-hit` already carries BOTH sexes' EXACT figures for that band, baked
// in server-side (`SwissAgePyramidWeb.tsx`) — this script never formats a number, it only reads the
// attribute back, the same discipline every other beat's own interaction script keeps.
//
// Keyboard: rows are rendered in visual top-to-bottom order (oldest band at the top —
// `SwissAgePyramidWeb.tsx`'s own `rowsTopToBottom`), so DOM order already matches the vertical axis
// a sighted reader would expect `ArrowUp`/`ArrowDown` to follow. `Home`/`End` jump to the oldest/
// youngest band.
//
// `initChart`/`initAll` are DOM wiring and are proven, per `doctrine`'s own rule, by driving a
// real browser, never by asserting against an unwatched DOM emulation.

/** Wires one `.chart-plot` — its `.row-hit` elements and the shared tooltip — to hover, tap and
 *  keyboard. Every row already carries its own `data-detail` string and its own `aria-label`, baked
 *  in server-side; this function never invents or recomputes either.
 *
 *  IT TAKES THE PLOT, NOT AN `<svg>` — changed when this beat moved to the fluid frame. A band's
 *  hit target spans BOTH halves of the mirror AND the age-label gutter between them, and the two
 *  halves are now two independent `<svg>` elements with a CSS track in the middle, so no SVG rect
 *  can cover a whole band. The rows are `<div class="row-hit">` in a layer over all three tracks
 *  instead. Nothing else about this file's mechanic changed: 21 rows still tile the plot exactly,
 *  so each row's own native pointer events still resolve on their own. */
function initChart(plot, tooltip) {
  const rows = Array.prototype.slice.call(plot.querySelectorAll(".row-hit"));
  if (rows.length === 0) return;

  function clear() {
    rows.forEach((r) => r.classList.remove("row-active"));
    tooltip.hidden = true;
  }

  function show(row, clientX, clientY) {
    rows.forEach((r) => r.classList.toggle("row-active", r === row));
    tooltip.textContent = row.getAttribute("data-detail");
    tooltip.hidden = false;
    const tw = tooltip.offsetWidth || 200;
    const th = tooltip.offsetHeight || 28;
    const x = Math.min(Math.max(clientX - tw / 2, 8), window.innerWidth - tw - 8);
    const y = Math.max(clientY - th - 14, 8);
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }

  // Hover and tap share one path: pointer events fire for mouse, pen and touch alike. Each row is
  // its own hit target (see this file's own header comment) — `pointerenter`/`pointerdown` on that
  // ONE row is enough, no coordinate math and no shared overlay required.
  rows.forEach((row) => {
    row.addEventListener("pointerenter", function (evt) {
      show(row, evt.clientX, evt.clientY);
    });
    row.addEventListener("pointerdown", function (evt) {
      show(row, evt.clientX, evt.clientY);
    });
    // MOUSE AND PEN ONLY. A touch pointer is destroyed the instant the finger lifts, and the
    // browser fires `pointerleave` immediately after `pointerup` for it — so an unguarded
    // `pointerleave` handler wipes the tooltip a tap has just opened. This beat's own caveat line
    // says "Hover, tap or focus any band for its exact figures", and the tap half of that was
    // false: the figures appeared and vanished inside one gesture. Measured by dispatching a real
    // touch sequence, not read off the source. A touch reader's tooltip is cleared by the
    // document-level `pointerdown` below instead: it stays up until they tap somewhere else.
    row.addEventListener("pointerleave", function (evt) {
      if (evt.pointerType === "touch") return;
      clear();
    });
  });

  // Keyboard: every row is already `tabIndex={0}` at build time (works with this script absent
  // entirely — the same invariant `web-discipline.md`, "Keyboard and touch", states for every web
  // beat). This layer adds the same detail box hover shows, plus ArrowUp/ArrowDown/Home/End to move
  // between rows without one Tab press per band — rows stack vertically, so Up/Down is this type's
  // own natural axis (`web-discipline.md`'s per-genre convention: whichever key matches the chart's
  // own layout direction), top = oldest, per this beat's own DOM order.
  rows.forEach((row, i) => {
    row.addEventListener("focus", function () {
      const rect = row.getBoundingClientRect();
      show(row, rect.left + rect.width / 2, rect.top);
    });
    row.addEventListener("blur", clear);
    row.addEventListener("keydown", function (evt) {
      let nextIndex = null;
      if (evt.key === "ArrowDown") nextIndex = Math.min(i + 1, rows.length - 1);
      else if (evt.key === "ArrowUp") nextIndex = Math.max(i - 1, 0);
      else if (evt.key === "Home") nextIndex = 0;
      else if (evt.key === "End") nextIndex = rows.length - 1;
      else if (evt.key === "Escape") {
        clear();
        row.blur();
        return;
      }
      if (nextIndex !== null && nextIndex !== i) {
        evt.preventDefault();
        rows[nextIndex].focus();
      }
    });
  });

  document.addEventListener("pointerdown", function (evt) {
    if (plot.contains(evt.target) || tooltip.contains(evt.target)) return;
    clear();
  });
}

function initAll() {
  const tooltip = document.getElementById("tooltip");
  if (!tooltip) return;
  document.querySelectorAll(".chart-plot").forEach(function (plot) {
    initChart(plot, tooltip);
  });
}

// Guarded rather than a bare top-level call: this file can also be read/imported in a context with
// no `document`. In the browser the guard is always true, so the inlined `<script>` self-starts the
// moment it is parsed, unchanged.
if (typeof document !== "undefined") initAll();

</script>
