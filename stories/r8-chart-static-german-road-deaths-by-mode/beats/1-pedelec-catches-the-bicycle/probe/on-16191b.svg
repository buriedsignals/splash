<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>probe render</desc><rect x="0" y="0" width="1920" height="1080" fill="#16191B"></rect><text x="85" y="142" fill="#FFFFFF" font-size="57" font-weight="700">Germany&#x27;s rise in cyclist deaths is all pedelecs: 36 riders killed</text><text x="85" y="217" fill="#FFFFFF" font-size="57" font-weight="700">in 2015, 214 in 2025</text><text x="85" y="274" fill="#a6a8a8" font-size="33">People killed in German road traffic, by what they were riding, 2014 to 2025. The statistic counts pedelecs separately</text><text x="85" y="318" fill="#a6a8a8" font-size="33">only from 2014; before that every bicycle was one column, so no series here reaches further back. Deaths, not risk: the</text><text x="85" y="362" fill="#a6a8a8" font-size="33">road-accident statistic records no distance ridden.</text><text x="85" y="995" fill="#a6a8a8" font-size="31">Source: Statistisches Bundesamt (Destatis), Verkehrsunfälle Zeitreihen, table 46241-11 — as of 7 July 2026</text><g><line x1="249.46533203125" x2="1294.68017578125" y1="893" y2="893" stroke="#404244" stroke-width="1"></line><text x="227.46533203125" y="902" fill="#a6a8a8" font-size="29" text-anchor="end">0</text></g><g><line x1="249.46533203125" x2="1294.68017578125" y1="776.75" y2="776.75" stroke="#404244" stroke-width="1"></line><text x="227.46533203125" y="785.75" fill="#a6a8a8" font-size="29" text-anchor="end">100</text></g><g><line x1="249.46533203125" x2="1294.68017578125" y1="660.5" y2="660.5" stroke="#404244" stroke-width="1"></line><text x="227.46533203125" y="669.5" fill="#a6a8a8" font-size="29" text-anchor="end">200</text></g><g><line x1="249.46533203125" x2="1294.68017578125" y1="544.25" y2="544.25" stroke="#404244" stroke-width="1"></line><text x="227.46533203125" y="553.25" fill="#a6a8a8" font-size="29" text-anchor="end">300</text></g><g><line x1="249.46533203125" x2="1294.68017578125" y1="428" y2="428" stroke="#404244" stroke-width="1"></line><text x="227.46533203125" y="437" fill="#a6a8a8" font-size="29" text-anchor="end">400 deaths</text></g><text x="249.46533203125" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2014</text><text x="439.50439453125" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2016</text><text x="629.54345703125" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2018</text><text x="819.5825195312499" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2020</text><text x="1009.62158203125" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2022</text><text x="1199.66064453125" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2024</text><path d="M249.5,478L344.5,489.6L439.5,508.2L534.5,528L629.5,479.2L724.6,512.9L819.6,562.9L914.6,612.8L1009.6,583.8L1104.6,595.4L1199.7,602.4L1294.7,604.7" fill="none" stroke="#a6a8a8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M249.5,847.7L344.5,851.2L439.5,820.9L534.5,813.9L629.5,789.5L724.6,755.8L819.6,727.9L914.6,740.7L1009.6,651.2L1104.6,672.1L1199.7,666.3L1294.7,644.2" fill="none" stroke="#D4A853" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"></path><circle cx="344.48486328125" cy="851.15" r="9" fill="#D4A853"></circle><text x="364.48486328125" y="816.15" fill="#D4A853" font-size="29">36</text><g><circle cx="1294.68017578125" cy="604.7" r="9" fill="#a6a8a8"></circle><line x1="1303.68017578125" x2="1307.68017578125" y1="604.7" y2="603.4625" stroke="#a6a8a8" stroke-width="2"></line><text x="1316.68017578125" y="614.4625" fill="#a6a8a8" font-size="33" font-weight="600">Bicycle without a motor 248</text></g><g><circle cx="1294.68017578125" cy="644.2249999999999" r="9" fill="#D4A853"></circle><line x1="1303.68017578125" x2="1307.68017578125" y1="644.2249999999999" y2="645.4625" stroke="#D4A853" stroke-width="2"></line><text x="1316.68017578125" y="656.4625" fill="#D4A853" font