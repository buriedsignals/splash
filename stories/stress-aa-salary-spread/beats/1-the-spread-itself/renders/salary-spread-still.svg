<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>A histogram of 234 annual salaries at one company, in 5,000 € bins from 10,000 € to 240,000 €. The mass rises to a peak of 56 employees in the 25,000–30,000 € bin, then falls away to the right in a long thin tail. A dashed rule marks the median at 31,420 € and a second the average at 36,516 €, to its right; 151 of the 234 sit below the average. 3 salaries stand alone above 100,000 €, the highest at 238,530 €. 6 of the 240 employees returned no salary and are not in the chart.</desc><rect x="0" y="0" width="1920" height="1080" fill="#16191B"></rect><text x="85" y="140" fill="#FFFFFF" font-size="55" font-weight="700">Half of this payroll earns less than 31,420 €, and the average is not</text><text x="85" y="210" fill="#FFFFFF" font-size="55" font-weight="700">where the people are</text><text x="85" y="272" fill="#a6a8a8" font-size="31">234 of the company&#x27;s 240 employees; 6 returned no salary and are not drawn. 151 of them — 65% — earn less than the</text><text x="85" y="316" fill="#a6a8a8" font-size="31">36,516 € average. One company, one payroll year, and the table carries no job title, grade or hours, so nothing here explains</text><text x="85" y="360" fill="#a6a8a8" font-size="31">the tail.</text><text x="85" y="995" fill="#a6a8a8" font-size="31">Source: not stated — company payroll extract, as of 21 August 2026</text><g><line x1="286.50830078125" x2="1817" y1="851" y2="851" stroke="#a6a8a8" stroke-width="1"></line><text x="264.50830078125" y="860" fill="#a6a8a8" font-size="29" text-anchor="end">0</text></g><g><line x1="286.50830078125" x2="1817" y1="781.6666666666667" y2="781.6666666666667" stroke="#404244" stroke-width="1"></line><text x="264.50830078125" y="790.6666666666667" fill="#a6a8a8" font-size="29" text-anchor="end">10</text></g><g><line x1="286.50830078125" x2="1817" y1="712.3333333333334" y2="712.333