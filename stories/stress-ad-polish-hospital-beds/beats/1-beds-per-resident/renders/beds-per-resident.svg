<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Wykres słupkowy poziomy: liczba łóżek szpitalnych na 10 tys. mieszkańców w 8 województwach w 2025 roku, uporządkowana malejąco. Śląskie 40,5, Łódzkie 40,2, Mazowieckie 38,8, Lubelskie 38,5, Wielkopolskie 37,0, Dolnośląskie 36,7, Małopolskie 35,4, Pomorskie 35,3. Średnia dla tych ośmiu województw wynosi 38,0. Mazowieckie, wyróżnione kolorem, jest 3. mimo że ma 21 400 łóżek — najwięcej w kraju.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="142" fill="#000000" font-size="57" font-weight="700">Mazowieckie ma najwięcej łóżek szpitalnych — ale nie na</text><text x="85" y="217" fill="#000000" font-size="57" font-weight="700">mieszkańca</text><text x="85" y="285" fill="#616161" font-size="33">Łóżka szpitalne na 10 tys. mieszkańców, 8 województw, 2025. Mazowieckie ma 21 400 łóżek, najwięcej w kraju, ale jest</text><text x="85" y="333" fill="#616161" font-size="33">3. w przeliczeniu na mieszkańca: wyprzedzają je Śląskie (40,5) i Łódzkie (40,2). Tabela obejmuje 8 z 16 województw,</text><text x="85" y="381" fill="#616161" font-size="33">więc nie da się z niej odczytać pełnego rankingu krajowego.</text><text x="85" y="995" fill="#616161" font-size="31">Źródło: Narodowy Fundusz Zdrowia, dane za 2025 r. — stan na 21 sierpnia 2026</text><rect x="316.30419921875" y="498" width="951.2119140625" height="33" fill="#d1d1d1"></rect><rect x="316.30419921875" y="549" width="944.3787468773023" height="33" fill="#d1d1d1"></rect><rect x="316.30419921875" y="600" width="913.2130939469096" height="33" fill="#5B8A8A"></rect><rect x="316.30419921875" y="651" width="906.1147200003425" height="33" fill="#d1d1d1"></rect><rect x="316.30419921875" y="702" width="869.1089830042094" height="33" fill="#d1d1d1"></rect><rect x="316.30419921875" y="753" width="862.4183288339295" height="33" fill="#d1d1d1"></rect><rect x="316.30419921875" y="804" width="831.8963516769747" height="33" fill="#d1d1d1"></rect><rect x="316.30419921875" y="855" width="830.4628042448601" height="33" fill="#d1d1d1"></rect><text x="285.30419921875" y="525.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Śląskie</text><text x="285.30419921875" y="576.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Łódzkie</text><text x="285.30419921875" y="627.5" fill="#000000" font-size="33" font-weight="700" text-anchor="end">Mazowieckie</text><text x="285.30419921875" y="678.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Lubelskie</text><text x="285.30419921875" y="729.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Wielkopolskie</text><text x="285.30419921875" y="780.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Dolnośląskie</text><text x="285.30419921875" y="831.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Małopolskie</text><text x="285.30419921875" y="882.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Pomorskie</text><text x="1352.79296875" y="525.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">40,5</text><text x="1352.79296875" y="576.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">40,2</text><text x="1352.79296875" y="627.5" fill="#000000" font-size="33" font-weight="700" text-anchor="end">38,8</text><text x="1352.79296875" y="678.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">38,5</text><text x="1352.79296875" y="729.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">37,0</text><text x="1352.79296875" y="780.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">36,7</text><text x="1352.79296875" y="831.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">35,4</text><text x="1352.79296875" y="882.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">35,3</text><line x1="1209.0050776228636" x2="1209.0050776228636" y1="476" y2="888" stroke="#000000" stroke-width="2" stroke-dasharray="6 5"></line><text x="1209.0050776228636" y="464.4" fill="#000000" font-size="29" text-anchor="middle">średnia ośmiu województw: 38,0</text><text x="1400.79296875" y="607.5" fill="#000000" font-size="29">21 400 łóżek — najwięcej w kraju,</text><text x="1400.79296875" y="647.5" fill="#000000" font-size="29">przy 5 510 000 mieszkańcach</text></svg>