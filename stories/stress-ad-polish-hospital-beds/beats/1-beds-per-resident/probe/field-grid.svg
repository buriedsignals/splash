<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>probe</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="142" fill="#000000" font-size="57" font-weight="700">Mazowieckie ma najwięcej łóżek szpitalnych — ale nie na</text><text x="85" y="217" fill="#000000" font-size="57" font-weight="700">mieszkańca</text><text x="85" y="285" fill="#616161" font-size="33">Łóżka szpitalne na 10 tys. mieszkańców, 8 województw, 2025. Mazowieckie ma 21 400 łóżek, najwięcej w kraju, ale jest</text><text x="85" y="333" fill="#616161" font-size="33">3. w przeliczeniu na mieszkańca: wyprzedzają je Śląskie (40,5) i Łódzkie (40,2).</text><text x="85" y="995" fill="#616161" font-size="31">Źródło: Narodowy Fundusz Zdrowia, dane za 2025 r.</text><rect x="316.30419921875" y="450" width="958.75927734375" height="37" fill="#d1d1d1"></rect><rect x="316.30419921875" y="507" width="951.8718925921553" height="37" fill="#d1d1d1"></rect><rect x="316.30419921875" y="564" width="920.4589566945442" height="37" fill="#5B8A8A"></rect><rect x="316.30419921875" y="621" width="913.3042609062413" height="37" fill="#d1d1d1"></rect><rect x="316.30419921875" y="678" width="876.0049029656361" height="37" fill="#d1d1d1"></rect><rect x="316.30419921875" y="735" width="869.2611619943334" height="37" fill="#d1d1d1"></rect><rect x="316.30419921875" y="792" width="838.4970090968734" height="37" fill="#d1d1d1"></rect><rect x="316.30419921875" y="849" width="837.0520872243308" height="37" fill="#d1d1d1"></rect><text x="285.30419921875" y="479.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Śląskie</text><text x="285.30419921875" y="536.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Łódzkie</text><text x="285.30419921875" y="593.5" fill="#000000" font-size="33" font-weight="700" text-anchor="end">Mazowieckie</text><text x="285.30419921875" y="650.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Lubelskie</text><text x="285.30419921875" y="707.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Wielkopolskie</text><text x="285.30419921875" y="764.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Dolnośląskie</text><text x="285.30419921875" y="821.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Małopolskie</text><text x="285.30419921875" y="878.5" fill="#616161" font-size="33" font-weight="400" text-anchor="end">Pomorskie</text><text x="1360.34033203125" y="479.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">40,5</text><text x="1360.34033203125" y="536.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">40,2</text><text x="1360.34033203125" y="593.5" fill="#000000" font-size="33" font-weight="700" text-anchor="end">38,8</text><text x="1360.34033203125" y="650.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">38,5</text><text x="1360.34033203125" y="707.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">37,0</text><text x="1360.34033203125" y="764.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">36,7</text><text x="1360.34033203125" y="821.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">35,4</text><text x="1360.34033203125" y="878.5" fill="#616161" font-size="33" font-weight="700" text-anchor="end">35,3</text><line x1="1216.0881867925455" x2="1216.0881867925455" y1="428" y2="886" stroke="#000000" stroke-width="2" stroke-dasharray="6 5"></line><text x="1216.0881867925455" y="416.4" fill="#000000" font-size="29" text-anchor="middle">średnia ośmiu województw: 38,0</text><text x="1408.34033203125" y="593.5" fill="#000000" font-size="29">21 400 łóżek — najwięcej w kraju</text></svg>