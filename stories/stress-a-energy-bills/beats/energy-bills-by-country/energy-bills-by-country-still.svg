<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Bar chart of reported household energy prices in seven European countries. Denmark&#x27;s reported price, €48,210.75, is far higher than every other country shown — 39.1 times Germany&#x27;s €1,234.50 and 67.7 times Spain&#x27;s €712.00. France and the Netherlands report prices in the same rough range as Germany and Spain. Italy and Poland report no price for this period.</desc><rect x="0" y="0" width="1920" height="1080" fill="#16191B"></rect><text x="85" y="138" fill="#FFFFFF" font-size="53" font-weight="700">Denmark&#x27;s reported energy price dwarfs every other country in this</text><text x="85" y="204" fill="#FFFFFF" font-size="53" font-weight="700">snapshot</text><text x="85" y="252" fill="#a6a8a8" font-size="33">Reported for one period in 2023; Italy and Poland reported no price. The article&#x27;s own comparison to other countries is</text><text x="85" y="296" fill="#a6a8a8" font-size="33">disputed, with an unclear methodology — this chart shows only the reported figures themselves.</text><text x="85" y="995" fill="#a6a8a8" font-size="31">Source: stress-a-energy-bills intake data (source/data.csv), as frozen at intake</text><g><rect x="125" y="384" width="169.99999999999997" height="448" fill="#D4A853"></rect><text x="210" y="366" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">€48,210.75</text><text x="210" y="872" fill="#FFFFFF" font-size="29" text-anchor="middle">Denmark</text></g><g><rect x="375" y="820.5283676358489" width="169.99999999999997" height="11.471632364151105" fill="#a6a8a8"></rect><text x="460" y="802.5283676358489" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">€1,234.50</text><text x="460" y="872" fill="#FFFFFF" font-size="29" text-anchor="middle">Germany</text></g><g><rect x="625" y="821.7559112853461" width="169.99999999999997" height="10.244088714653913" fill="#a6a8a8"></rect><text x="710" y="803.7559112853461" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">€1,102.40</text><text x="710" y="872" fill="#FFFFFF" font-size="29" text-anchor="middle">Netherlands,</text><text x="710" y="907" fill="#FFFFFF" font-size="29" text-anchor="middle">the</text></g><g><rect x="875" y="822.8259464953356" width="169.99999999999997" height="9.174053504664357" fill="#a6a8a8"></rect><text x="960" y="804.8259464953356" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">€987.25</text><text x="960" y="872" fill="#FFFFFF" font-size="29" text-anchor="middle">France</text></g><g><rect x="1125" y="825.3837162873425" width="169.99999999999997" height="6.616283712657491" fill="#a6a8a8"></rect><text x="1210" y="807.3837162873425" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">€712.00</text><text x="1210" y="872" fill="#FFFFFF" font-size="29" text-anchor="middle">Spain</text></g><g><text x="1460" y="814" fill="#a6a8a8" font-size="26" text-anchor="middle">no price reported</text><text x="1460" y="872" fill="#FFFFFF" font-size="29" text-anchor="middle">Italy</text></g><g><text x="1710" y="814" fill="#a6a8a8" font-size="26" text-anchor="middle">no price reported</text><text x="1710" y="872" fill="#FFFFFF" font-size="29" text-anchor="middle">Poland</text></g><line x1="85" x2="1835" y1="832" y2="832" stroke="#FFFFFF" stroke-width="1"></line></svg>