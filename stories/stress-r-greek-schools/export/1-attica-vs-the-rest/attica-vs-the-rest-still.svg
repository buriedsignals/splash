<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Slope chart, one line per Greek region, from its 2020 school count to its 2026 count. Attica&#x27;s line is nearly flat (1802 to 1744, -3.2%); the steepest declines are in Western Macedonia, the Peloponnese and Central Greece. Anatoliki Makedonia kai Thraki keeps its 2020 dot only -- its 2026 figure is corrupted in the source data and is shown as unavailable, not estimated.</desc><rect x="0" y="0" width="1920" height="1080" fill="#16191B"></rect><text x="85" y="142" fill="#FFFFFF" font-size="57" font-weight="700">Every Greek region lost schools between 2020 and 2026, but</text><text x="85" y="217" fill="#FFFFFF" font-size="57" font-weight="700">Attica&#x27;s decline was far smaller than the rest</text><text x="85" y="995" fill="#a6a8a8" font-size="31">Source: Greek Ministry of Education, released in response to a written request, as of 2026-08-21</text><text x="744.099609375" y="357" fill="#a6a8a8" font-size="31" font-weight="600">2020</text><text x="1538.6100769042969" y="357" fill="#a6a8a8" font-size="31" font-weight="600" text-anchor="end">2026</text><line x1="744.099609375" x2="744.099609375" y1="371" y2="832" stroke="#404244" stroke-width="1"></line><line x1="1538.6100769042969" x2="1538.6100769042969" y1="371" y2="832" stroke="#404244" stroke-width="1"></line><circle cx="744.099609375" cy="737.0340000000001" r="9" fill="#a6a8a8"></circle><g><line x1="744.099609375" x2="1538.6100769042969" y1="577.528" y2="596.6595" stroke="#a6a8a8" stroke-width="1.5" stroke-linecap="round" opacity="0.85"></line><circle cx="744.099609375" cy="577.528" r="9" fill="#a6a8a8"></circle><circle cx="1538.6100769042969" cy="596.6595" r="9" fill="#a6a8a8"></circle></g><g><line x1="744.099609375" x2="1538.6100769042969" y1="784.0559999999999" y2="790.2795" stroke="#a6a8a8" stroke-width="1.5" stroke-linecap="round" opacity="0.85"></line><ci