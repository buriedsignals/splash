<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Column chart of the share of vacant homes, 2019 to 2022. Four columns fall every year: 8.4% in 2019, then 8.1% in 2020, then 7.6% in 2021, then 7.2% in 2022. A 1.2 point drop from 2019 to 2022. The story&#x27;s own article claims the opposite (&quot;has risen steadily&quot;, &quot;the highest on record&quot;); that claim is contradicted by this same frozen data and is not repeated here.</desc><rect x="0" y="0" width="1920" height="1080" fill="#16191B"></rect><text x="85" y="142" fill="#FFFFFF" font-size="57" font-weight="700">The share of vacant homes fell every year from 2019 to 2022,</text><text x="85" y="217" fill="#FFFFFF" font-size="57" font-weight="700">from 8.4% to 7.2%.</text><text x="85" y="995" fill="#a6a8a8" font-size="31">Source: story intake, source/data.csv (frozen) — stress test fixture</text><g><rect x="155" y="305" width="297.5" height="584" fill="#D4A853"></rect><text x="303.75" y="283" fill="#FFFFFF" font-size="35" font-weight="600" text-anchor="middle">8.4%</text><text x="303.75" y="942" fill="#a6a8a8" font-size="31" text-anchor="middle">2019</text></g><g><rect x="592.5" y="325.8571428571429" width="297.5" height="563.1428571428571" fill="#D4A853"></rect><text x="741.25" y="303.8571428571429" fill="#FFFFFF" font-size="35" font-weight="600" text-anchor="middle">8.1%</text><text x="741.25" y="942" fill="#a6a8a8" font-size="31" text-anchor="middle">2020</text></g><g><rect x="1030" y="360.61904761904765" width="297.5" height="528.3809523809523" fill="#D4A853"></rect><text x="1178.75" y="338.61904761904765" fill="#FFFFFF" font-size="35" font-weight="600" text-anchor="middle">7.6%</text><text x="1178.75" y="942" fill="#a6a8a8" font-size="31" text-anchor="middle">2021</text></g><g><rect x="1467.5" y="388.42857142857144" width="297.5" height="500.57142857142856" fill="#D4A853"></rect><text x="1616.25" y="366.42857142857144" fill="#FFFFFF" font-size="35" font-weight="600" text-anchor="middle">7.2%</text><text x="1616.25" y="942" fill="#a6a8a8" font-size="31" text-anchor="middle">2022</text></g><line x1="85" x2="1835" y1="889" y2="889" stroke="#FFFFFF" stroke-width="1"></line></svg>