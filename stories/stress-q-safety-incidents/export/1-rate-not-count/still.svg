<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>A horizontal bar per district, sorted by incidents per 100,000 residents, zero baseline. Sul is longest at 233.0 per 100,000, accented. Centro follows at 205.0 per 100,000, annotated with its raw count of 412 -- the highest in the city, but not the highest rate. Norte 85.3 per 100,000; Leste 184.6 per 100,000; Oeste 87.4 per 100,000.</desc><rect x="0" y="0" width="900" height="560" fill="#16191B"></rect><text x="40" y="66" fill="#FFFFFF" font-size="26" font-weight="700">Sul has the worst safety record per resident, not Centro</text><text x="40" y="100" fill="#a6a8a8" font-size="15" font-weight="400">233.0 incidents per 100,000 residents in Sul, against 205.0 in Centro</text><line x1="99.8125" y1="126" x2="99.8125" y2="448" stroke="#404244" stroke-width="1"></line><g><text x="87.8125" y="163.45" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="600">Sul</text><rect x="99.8125" y="135.016" width="664.8232421875" height="46.368" fill="#D4A853"></rect><text x="776.6357421875" y="163.45" fill="#FFFFFF" font-size="15" font-weight="600">233.0 / 100k</text></g><g><text x="87.8125" y="227.85" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="600">Centro</text><rect x="99.8125" y="199.416" width="584.9734612000971" height="46.368" fill="#a6a8a8"></rect><text x="696.7859612000971" y="227.85" fill="#FFFFFF" font-size="15" font-weight="600">205.0 / 100k</text></g><g><text x="87.8125" y="292.25000000000006" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="600">Leste</text><rect x="99.8125" y="263.81600000000003" width="526.8693011257036" height="46.368" fill="#a6a8a8"></rect><text x="638.6818011257036" y="292.25000000000006" fill="#FFFFFF" font-size="15" font-weight="600">184.6 / 100k</text></g><g><text x="87.8125" y="356.65000000000003" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="600">Oeste</text><rect x="99.8125" y="328.216" width="249.4839446056255" height="46.368" fill="#a6a8a8"></rect><text x="361.29644460562554" y="356.65000000000003" fill="#FFFFFF" font-size="15" font-weight="600">87.4 / 100k</text></g><g><text x="87.8125" y="421.05000000000007" text-anchor="end" fill="#FFFFFF" font-size="15" font-weight="600">Norte</text><rect x="99.8125" y="392.61600000000004" width="243.36343909139643" height="46.368" fill="#a6a8a8"></rect><text x="355.17593909139646" y="421.05000000000007" fill="#FFFFFF" font-size="15" font-weight="600">85.3 / 100k</text></g><text x="40" y="482" fill="#a6a8a8" font-size="14" font-weight="400">Centro recorded the most incidents in raw terms (412) -- but not the highest rate.</text><text x="40" y="516" fill="#a6a8a8" font-size="14" font-weight="400">Source: municipal safety incident report and district population estimates · as of 21 August 2026</text></svg>