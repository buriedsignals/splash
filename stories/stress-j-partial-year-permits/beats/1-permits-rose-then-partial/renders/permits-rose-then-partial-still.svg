<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Line chart of building permits issued each year from 2020 (48,210) to 2025 (58,990), rising every year, a gain of 22.4%. A text note beside the line reports 2026: 14,205 permits, covering January-March only (3 of 12 months) — not plotted, because it is not a comparable annual figure.</desc><rect x="0" y="0" width="1920" height="1080" fill="#16191B"></rect><text x="85" y="142" fill="#FFFFFF" font-size="57" font-weight="700">Building permits rose every year from 2020 to 2025</text><text x="85" y="179.5" fill="#a6a8a8" font-size="35">Permits issued by the city registry. All values above are full-year totals; the 2026 reading (right) covers only 3 of</text><text x="85" y="227.5" fill="#a6a8a8" font-size="35">12 months and is not one.</text><text x="85" y="995" fill="#a6a8a8" font-size="31">City permits registry, frozen source/data.csv — 2026 reading as filed at the CSV freeze</text><g><line x1="297.77978515625" x2="1331.74072265625" y1="893" y2="893" stroke="#404244" stroke-width="1"></line><text x="275.77978515625" y="902" fill="#a6a8a8" font-size="29" text-anchor="end">48,000</text></g><g><line x1="297.77978515625" x2="1331.74072265625" y1="787.5454545454545" y2="787.5454545454545" stroke="#404244" stroke-width="1"></line><text x="275.77978515625" y="796.5454545454545" fill="#a6a8a8" font-size="29" text-anchor="end">50,000</text></g><g><line x1="297.77978515625" x2="1331.74072265625" y1="682.0909090909091" y2="682.0909090909091" stroke="#404244" stroke-width="1"></line><text x="275.77978515625" y="691.0909090909091" fill="#a6a8a8" font-size="29" text-anchor="end">52,000</text></g><g><line x1="297.77978515625" x2="1331.74072265625" y1="576.6363636363636" y2="576.6363636363636" stroke="#404244" stroke-width="1"></line><text x="275.77978515625" y="585.6363636363636" fill="#a6a8a8" font-size="29" text-anchor="end">54,000</t