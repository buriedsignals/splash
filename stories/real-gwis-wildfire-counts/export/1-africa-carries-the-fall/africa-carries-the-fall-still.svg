<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Stacked area chart of recorded wildfire events by continent, 2012 to 2025. The whole stack rises to 1,148,499 fires in 2015 and then falls to 626,326 in 2025, a drop of 45 per cent. Africa is the bottom band throughout and the largest: 610,110 in 2012 and 406,220 in 2025, 65 per cent of that year&#x27;s total. Above it, in stacking order: Asia 68,716, South America 67,532, Oceania 40,155, North America 25,408, Europe 18,295. 2026 is not drawn because the year is incomplete.</desc><rect x="0" y="0" width="1920" height="1080" fill="#16191B"></rect><text x="85" y="142" fill="#FFFFFF" font-size="57" font-weight="700">The world&#x27;s wildfire count has fallen by nearly half since 2015,</text><text x="85" y="217" fill="#FFFFFF" font-size="57" font-weight="700">and two thirds of what is left is in Africa</text><text x="85" y="276" fill="#a6a8a8" font-size="33">Fire events recorded per year, by continent, 2012 to 2025. 2026 is left out: that year is incomplete, last updated 21</text><text x="85" y="322" fill="#a6a8a8" font-size="33">August 2026.</text><text x="85" y="995" fill="#a6a8a8" font-size="31">Source: Global Wildfire Information System (2026), with minor processing by Our World in Data — as of 21 August 2026</text><g><line x1="297.80810546875" x2="1294.1484375" y1="893" y2="893" stroke="#404244" stroke-width="1"></line><text x="275.80810546875" y="902" fill="#a6a8a8" font-size="29" text-anchor="end">0</text></g><g><line x1="297.80810546875" x2="1294.1484375" y1="808.8333333333334" y2="808.8333333333334" stroke="#404244" stroke-width="1"></line><text x="275.80810546875" y="817.8333333333334" fill="#a6a8a8" font-size="29" text-anchor="end">200,000</text></g><g><line x1="297.80810546875" x2="1294.1484375" y1="724.6666666666667" y2="724.6666666666667" stroke="#404244" stroke-width="1"></line><text x="275.80810546875" y="733.6666666666667" fill="#a6a8a8" font-size="29" text-anchor="end">400,000</text></g><g><line x1="297.80810546875" x2="1294.1484375" y1="640.5" y2="640.5" stroke="#404244" stroke-width="1"></line><text x="275.80810546875" y="649.5" fill="#a6a8a8" font-size="29" text-anchor="end">600,000</text></g><g><line x1="297.80810546875" x2="1294.1484375" y1="556.3333333333333" y2="556.3333333333333" stroke="#404244" stroke-width="1"></line><text x="275.80810546875" y="565.3333333333333" fill="#a6a8a8" font-size="29" text-anchor="end">800,000</text></g><g><line x1="297.80810546875" x2="1294.1484375" y1="472.1666666666667" y2="472.1666666666667" stroke="#404244" stroke-width="1"></line><text x="275.80810546875" y="481.1666666666667" fill="#a6a8a8" font-size="29" text-anchor="end">1,000,000</text></g><g><line x1="297.80810546875" x2="1294.1484375" y1="388" y2="388" stroke="#404244" stroke-width="1"></line><text x="275.80810546875" y="397" fill="#a6a8a8" font-size="29" text-anchor="end">1,200,000 fires</text></g><text x="297.80810546875" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2012</text><text x="451.0912334735577" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2014</text><text x="604.3743614783654" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2016</text><text x="757.6574894831731" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2018</text><text x="910.9406174879807" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2020</text><text x="1064.2237454927886" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2022</text><text x="1217.5068734975962" y="946" fill="#a6a8a8" font-size="29" text-anchor="middle">2024</text><path d="M297.8,636.2L374.4,606.3L451.1,623.2L527.7,602.8L604.4,598.5L681,621.5L757.7,654.5L834.3,633.7L910.9,618L987.6,624.3L1064.2,635.9L1140.9,645.3L1217.5,690.3L1294.1,722L1294.1,893L1217.5,893L1140.9,893L1064.2,893L987.6,893L910.9,893L834.3,893L757.7,893L681,893L604.4,893L527.7,893L451.1,893L374