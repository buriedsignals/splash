<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>رسم بياني بأعمدة أفقية يرتّب 7 محافظات تونسية حسب استهلاك المياه سنة 2025. تونس في المقدمة بـ 142 مليون متر مكعب، أي 1.6 أضعاف صفاقس (89 مليون). ثم سوسة 61، نابل 54، بنزرت 47، القيروان 38، قابس 29. عمود صفاقس مرسوم بحدود لا بتعبئة لأن قيمته مكتوبة في المصدر بالأرقام الهندية العربية.</desc><rect x="0" y="0" width="1920" height="1080" fill="#16191B"></rect><text x="1835" y="142" fill="#FFFFFF" font-size="57" font-weight="700" text-anchor="end">⁧تستهلك محافظة تونس أكثر من غيرها من المياه، بواقع 142 مليون متر مكعب في⁩</text><text x="1835" y="217" fill="#FFFFFF" font-size="57" font-weight="700" text-anchor="end">⁧السنة⁩</text><text x="1835" y="309" fill="#a6a8a8" font-size="35" text-anchor="end">⁧الاستهلاك السنوي للمياه بملايين الأمتار المكعبة، سنة 2025، في 7 محافظات. تونس تستهلك 1.6 أضعاف ما تستهلكه صفاقس.⁩</text><text x="1835" y="357" fill="#a6a8a8" font-size="35" text-anchor="end">⁧الجدول لا يغطي كامل الجمهورية، فلا يُقرأ منه ترتيب وطني كامل.⁩</text><text x="1835" y="995" fill="#a6a8a8" font-size="31" text-anchor="end">⁧المصدر: الشركة الوطنية للمياه، أرقام السنة المدنية 2025 — بتاريخ 21 أوت 2026⁩</text><line x1="1699.44091796875" x2="1699.44091796875" y1="432" y2="907" stroke="#404244" stroke-width="1"></line><g><rect x="160.73779296875" y="444.89285714285717" width="1538.703125" height="42.07142857142858" fill="#1F6FB2" stroke="none" stroke-width="0"></rect><text x="1835" y="476.92857142857144" fill="#FFFFFF" font-size="33" font-weight="600" text-anchor="end">⁧تونس⁩</text><text x="138.73779296875" y="476.92857142857144" fill="#FFFFFF" font-size="33" font-weight="700" text-anchor="end">142</text></g><g><rect x="735.0424804687499" y="512.75" width="964.3984375000001" height="42.07142857142858" fill="none" stroke="#a6a8a8" stroke-width="2" stroke-dasharray="8 6"></rect><text x="1835" y="544.7857142857143" fill="#FFFFFF" font-size="33" font-weight="600" text-anchor="end">⁧صفاقس⁩</text><text x="713.0424804687499" y="544.7857142857143" fill="#a6a8a8" font-size="33" font-weight="700" text-anchor="end">89</text></g><g><rect x="1038.44873046875" y="580.6071428571429" width="660.9921875" height="42.07142857142858" fill="#a6a8a8" stroke="none" stroke-width="0"></rect><text x="1835" y="612.6428571428572" fill="#FFFFFF" font-size="33" font-weight="600" text-anchor="end">⁧سوسة⁩</text><text x="1016.44873046875" y="612.6428571428572" fill="#a6a8a8" font-size="33" font-weight="700" text-anchor="end">61</text></g><g><rect x="1114.30029296875" y="648.4642857142857" width="585.140625" height="42.07142857142858" fill="#a6a8a8" stroke="none" stroke-width="0"></rect><text x="1835" y="680.5" fill="#FFFFFF" font-size="33" font-weight="600" text-anchor="end">⁧نابل⁩</text><text x="1092.30029296875" y="680.5" fill="#a6a8a8" font-size="33" font-weight="700" text-anchor="end">54</text></g><g><rect x="1190.15185546875" y="716.3214285714286" width="509.2890625" height="42.07142857142858" fill="#a6a8a8" stroke="none" stroke-width="0"></rect><text x="1835" y="748.3571428571429" fill="#FFFFFF" font-size="33" font-weight="600" text-anchor="end">⁧بنزرت⁩</text><text x="1168.15185546875" y="748.3571428571429" fill="#a6a8a8" font-size="33" font-weight="700" text-anchor="end">47</text></g><g><rect x="1287.6752929687502" y="784.1785714285714" width="411.7656249999998" height="42.07142857142858" fill="#a6a8a8" stroke="none" stroke-width="0"></rect><text x="1835" y="816.2142857142858" fill="#FFFFFF" font-size="33" font-weight="600" text-anchor="end">⁧القيروان⁩</text><text x="1265.6752929687502" y="816.2142857142858" fill="#a6a8a8" font-size="33" font-weight="700" text-anchor="end">38</text></g><g><rect x="1385.19873046875" y="852.0357142857142" width="314.2421875" height="42.07142857142858" fill="#a6a8a8" stroke="none" stroke-width="0"></rect><text x="1835" y="884.0714285714286" fill="#FFFFFF" font-size="33" font-weight="600" text-anchor="end">⁧قابس⁩</text><text x="1363.19873046875" y="884.0714285714286" fill="#a6a8a8" font-size="33" font-weight="700" text-anchor="end">29</text></g><text x="611.3046874999999" y="538.75" fill="#a6a8a8" font-size="26" text-anchor="end">⁧قيمة صفاقس مكتوبة في المصدر بالأرقام الهندية⁩</text><text x="611.3046874999999" y="575.75" fill="#a6a8a8" font-size="26" text-anchor="end">⁧العربية (٨٩٠٠٠٠٠٠)، فلم تُقرأ آليًا كعدد. حُوِّلت رقمًا⁩</text><text x="611.3046874999999" y="612.75" fill="#a6a8a8" font-size="26" text-anchor="end">⁧برقم لرسم هذا العمود، ولذلك رُسم بحدود لا بتعبئة.⁩</text></svg>