<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Horizontal lollipop chart of public-transport network length in 2025 for six Portuguese cities, ranked longest first: Lisboa 148 km, Porto 67 km, Braga 22 km, Coimbra 19 km, Aveiro 12 km, Faro 9 km. Aveiro is highlighted at 12 km, fifth of six, and carries 14 m trips a year.</desc><rect x="0" y="0" width="1920" height="1080" fill="#16191B"></rect><text x="85" y="138" fill="#FFFFFF" font-size="53" font-weight="700">Aveiro&#x27;s network is 12 km — the second shortest of the six</text><text x="85" y="195" fill="#a6a8a8" font-size="33">Kilometres of public-transport network in 2025. This is the only column in the frozen table that describes the line itself:</text><text x="85" y="239" fill="#a6a8a8" font-size="33">there is no route, no stops and no opening date in the data, so the new Aveiro line cannot be drawn — only measured</text><text x="85" y="283" fill="#a6a8a8" font-size="33">against the five networks beside it.</text><text x="85" y="995" fill="#a6a8a8" font-size="31">Source: city network figures for 2025, compiled by Buried Signals · as of 21 August 2026</text><g><line x1="227.47705078125" x2="1690.81298828125" y1="434.3114754098361" y2="434.3114754098361" stroke="#a6a8a8" stroke-width="7"></line><circle cx="1690.81298828125" cy="434.3114754098361" r="15" fill="#a6a8a8"></circle><text x="1731.81298828125" y="445.4714754098361" fill="#FFFFFF" font-size="31" font-weight="600">148 km</text><text x="201.47705078125" y="445.4714754098361" fill="#FFFFFF" font-size="31" font-weight="400" text-anchor="end">Lisboa</text></g><g><line x1="227.47705078125" x2="889.9331846494932" y1="525.7868852459017" y2="525.7868852459017" stroke="#a6a8a8" stroke-width="7"></line><circle cx="889.9331846494932" cy="525.7868852459017" r="15" fill="#a6a8a8"></circle><text x="930.9331846494932" y="536.9468852459016" fill="#FFFFFF" font-size="31" font-weight="600">67 km</text><text x="201.47705078125" y="536.9468852459016" fill="#FFFFFF" font-size="31" font-weight="400" text-anchor="end">Porto</text></g><g><line x1="227.47705078125" x2="444.9999604096284" y1="617.2622950819672" y2="617.2622950819672" stroke="#a6a8a8" stroke-width="7"></line><circle cx="444.9999604096284" cy="617.2622950819672" r="15" fill="#a6a8a8"></circle><text x="485.9999604096284" y="628.4222950819671" fill="#FFFFFF" font-size="31" font-weight="600">22 km</text><text x="201.47705078125" y="628.4222950819671" fill="#FFFFFF" font-size="31" font-weight="400" text-anchor="end">Braga</text></g><g><line x1="227.47705078125" x2="415.33774546030406" y1="708.7377049180327" y2="708.7377049180327" stroke="#a6a8a8" stroke-width="7"></line><circle cx="415.33774546030406" cy="708.7377049180327" r="15" fill="#a6a8a8"></circle><text x="456.33774546030406" y="719.8977049180327" fill="#FFFFFF" font-size="31" font-weight="600">19 km</text><text x="201.47705078125" y="719.8977049180327" fill="#FFFFFF" font-size="31" font-weight="400" text-anchor="end">Coimbra</text></g><g><line x1="227.47705078125" x2="346.1259105785473" y1="800.2131147540983" y2="800.2131147540983" stroke="#D4A853" stroke-width="7"></line><circle cx="346.1259105785473" cy="800.2131147540983" r="15" fill="#D4A853"></circle><text x="387.1259105785473" y="811.3731147540983" fill="#FFFFFF" font-size="31" font-weight="600">12 km</text><text x="201.47705078125" y="811.3731147540983" fill="#FFFFFF" font-size="31" font-weight="700" text-anchor="end">Aveiro</text></g><g><line x1="227.47705078125" x2="316.46369562922297" y1="891.688524590164" y2="891.688524590164" stroke="#a6a8a8" stroke-width="7"></line><circle cx="316.46369562922297" cy="891.688524590164" r="15" fill="#a6a8a8"></circle><text x="357.46369562922297" y="902.848524590164" fill="#FFFFFF" font-size="31" font-weight="600">9 km</text><text x="201.47705078125" y="902.848524590164" fill="#FFFFFF" font-size="31" font-weight="400" text-anchor="end">Faro</text></g><text x="521.3129222972973" y="811.3731147540983" fill="#FFFFFF" font-size="31">Aveiro&#x27;s network carries 14 m trips a year</text><line x1="227.47705078125" x2="227.47705078125" y1="384" y2="942" stroke="#FFFFFF" stroke-width="1"></line></svg>