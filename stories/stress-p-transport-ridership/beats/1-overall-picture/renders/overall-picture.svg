<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Column chart ranking six Portuguese city public-transport networks by trips in 2025. Lisboa is far ahead at 214 million, 2.2 times Porto&#x27;s 96 million, and more than Porto, Braga, Coimbra, Aveiro and Faro added together (180 million). The remaining columns fall from 31 million (Braga) to 11 million (Faro).</desc><rect x="0" y="0" width="1920" height="1080" fill="#16191B"></rect><text x="85" y="138" fill="#FFFFFF" font-size="53" font-weight="700">Lisboa carries more trips than the other five city networks put</text><text x="85" y="204" fill="#FFFFFF" font-size="53" font-weight="700">together</text><text x="85" y="261" fill="#a6a8a8" font-size="33">Public-transport trips in 2025, millions. These six networks carried 394 million between them; Lisboa&#x27;s 214 million is</text><text x="85" y="305" fill="#a6a8a8" font-size="33">54% of that. Trips, not passengers — one person making a return journey is counted twice.</text><text x="85" y="995" fill="#a6a8a8" font-size="31">Source: city network figures for 2025, compiled by Buried Signals · as of 21 August 2026</text><g><rect x="125.83333333333337" y="406" width="210" height="479" fill="#D4A853"></rect><text x="230.83333333333337" y="388" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">214</text><text x="230.83333333333337" y="925" fill="#FFFFFF" font-size="29" text-anchor="middle">Lisboa</text></g><g><rect x="417.50000000000006" y="670.1214953271028" width="210" height="214.87850467289718" fill="#a6a8a8"></rect><text x="522.5" y="652.1214953271028" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">96</text><text x="522.5" y="925" fill="#FFFFFF" font-size="29" text-anchor="middle">Porto</text></g><g><rect x="709.1666666666667" y="815.6121495327103" width="210" height="69.3878504672897" fill="#a6a8a8"></rect><text x="814.1666666666667" y="797.6121495327103" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">31</text><text x="814.1666666666667" y="925" fill="#FFFFFF" font-size="29" text-anchor="middle">Braga</text></g><g><rect x="1000.8333333333334" y="822.3271028037383" width="210" height="62.672897196261715" fill="#a6a8a8"></rect><text x="1105.8333333333335" y="804.3271028037383" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">28</text><text x="1105.8333333333335" y="925" fill="#FFFFFF" font-size="29" text-anchor="middle">Coimbra</text></g><g><rect x="1292.5" y="853.6635514018692" width="210" height="31.3364485981308" fill="#a6a8a8"></rect><text x="1397.5" y="835.6635514018692" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">14</text><text x="1397.5" y="925" fill="#FFFFFF" font-size="29" text-anchor="middle">Aveiro</text></g><g><rect x="1584.166666666667" y="860.3785046728972" width="210" height="24.62149532710282" fill="#a6a8a8"></rect><text x="1689.166666666667" y="842.3785046728972" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">11</text><text x="1689.166666666667" y="925" fill="#FFFFFF" font-size="29" text-anchor="middle">Faro</text></g><line x1="335.83333333333337" x2="1835" y1="482.1028037383178" y2="482.1028037383178" stroke="#D4A853" stroke-width="3" stroke-dasharray="11 9"></line><text x="366.83333333333337" y="456.1028037383178" fill="#FFFFFF" font-size="31">more than Porto, Braga, Coimbra, Aveiro and Faro added together (180 m)</text><line x1="85" x2="1835" y1="885" y2="885" stroke="#FFFFFF" stroke-width="1"></line></svg>