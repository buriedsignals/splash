<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Splash compatibility</title>
    <style>
      :root { color-scheme: light dark; font-family: var(--font-sans, system-ui, sans-serif); }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; background: var(--color-background-primary, Canvas); color: var(--color-text-primary, CanvasText); }
      main { display: grid; gap: 14px; max-width: 42rem; }
      h1, p { margin: 0; }
      h1 { font-size: 1.15rem; }
      #status { width: fit-content; border: 1px solid currentColor; border-radius: 999px; padding: 3px 9px; font-weight: 700; }
      #status[data-kind="ready"] { color: var(--color-text-success, #087a42); }
      #status[data-kind="error"] { color: var(--color-text-danger, #b42318); }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      button { min-height: 44px; padding: 8px 12px; font: inherit; border: 1px solid var(--color-border-primary, currentColor); border-radius: 6px; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--color-ring-primary, #1d70b8); outline-offset: 2px; }
      button:disabled { cursor: not-allowed; opacity: 0.55; }
      .note { font-size: 0.9rem; color: var(--color-text-secondary, GrayText); }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <h1 id="title">Splash host compatibility</h1>
      <div id="status" data-kind="pending" role="status" aria-live="polite">Checking…</div>
      <p id="detail">Connecting to the Goose MCP App bridge…</p>
      <div class="actions">
        <button id="refresh" type="button" disabled>Refresh status</button>
        <button id="open-link" type="button" disabled>Test safe loopback link</button>
      </div>
      <p class="note">This fixture never asks for or transports credentials. Closing it changes nothing.</p>
    </main>
    <script type="module">/*__SPLASH_COMPATIBILITY_APP__*/</script>
  </body>
</html>
