<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif" data-ladder="R1: the axis title, its unit folded into the outermost tick label; R3: the standfirst keeps its first sentence only; packing: 27 rows in 2 columns — the width of the frame spent on the height it does not have"><desc>A diverging bar chart of the change in CO₂ emissions per person between 1990 and 2024 for all 27 EU member states, sorted from the largest rise to the largest fall. Exactly one bar points right of the zero line: Croatia, at +0.03 tonnes per person, drawn in the accent colour on a highlighted row. The other 26 point left, from Cyprus at −0.52 down to Luxembourg at −20.48. A dashed rule marks the average of those falls, −4.93.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="138" fill="#000000" font-size="53" font-weight="700">Croatia is the only EU country emitting more CO₂ per person than in</text><text x="85" y="204" fill="#000000" font-size="53" font-weight="700">1990</text><text x="85" y="261" fill="#616161" font-size="33">Croatia&#x27;s rise is +0.03 tonnes per person — the only one, and a small one: 4.73 in 1990 against 4.76 in 2024.</text><text x="85" y="953" fill="#616161" font-size="31">Source: Global Carbon Budget (2025); population based on various sources (2024) – with major processing by Our World in</text><text x="85" y="995" fill="#616161" font-size="31">Data · fossil fuels and industry only</text><g><g><line x1="432.5452291810076" x2="432.5452291810076" y1="411" y2="900" stroke="#d1d1d1" stroke-width="1"></line><text x="432.5452291810076" y="336" fill="#616161" font-size="29" font-weight="500" text-anchor="middle">−20 tonnes</text></g><g><line x1="541.5703354270133" x2="541.5703354270133" y1="411" y2="900" stroke="#d1d1d1" stroke-width="1"></line><text x="541.5703354270133" y="336" fill="#616161" font-size="29" font-weight="500" text-anchor="mid