<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Barres divergentes : la variation des émissions de CO2 par personne entre 1990 et 2024 dans les 27 pays de l’UE. La Croatie est la seule en hausse (+0,03 t) ; les 26 autres baissent, de 20,48 t pour le Luxembourg, la plus forte baisse."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · UNION EUROPÉENNE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La Croatie est le seul pays de</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">l’UE à émettre plus de CO2</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">par personne qu’en 1990</text><text x="52" y="218.6046867400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Variation des émissions de CO2 par personne entre 1990 et 2024, en</text><text x="52" y="237.4554941619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">tonnes, dans les 27 États membres. La hausse croate est de 0,03 t sur</text><text x="52" y="256.3063015838281" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">une base de 4,73 t, soit 0,67 %. Les 26 autres baissent, de 4,93 t en</text><text x="52" y="275.1571090057031" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">moyenne, et le Luxembourg de 20,48 t.</text><text x="52