<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Barres divergentes : la variation des émissions de CO2 par personne entre 1990 et 2024 dans les 27 pays de l’UE. La Croatie est la seule en hausse (+0,03 t) ; les 26 autres baissent, de 20,48 t pour le Luxembourg, la plus forte baisse."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · UNION EUROPÉENNE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La Croatie est le seul pays de l’UE</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">à émettre plus de CO2 par</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">personne qu’en 1990</text><text x="46" y="197.67367093776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Variation des émissions de CO2 par personne entre 1990 et 2024, en</text><text x="46" y="216.52301443776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">tonnes, dans les 27 États membres. La hausse croate est de 0,03 t sur</text><text x="46" y="235.3723579377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">une base de 4,73 t, soit 0,67 %. Les 26 autres baissent, de 4,93 t en</text><text x="46" y="254.2217014377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">moyenne, et le Luxembourg de 20,48 t.</