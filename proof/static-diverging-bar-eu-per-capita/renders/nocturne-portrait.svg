<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Barres divergentes : la variation des émissions de CO2 par personne entre 1990 et 2024 dans les 27 pays de l’UE. La Croatie est la seule en hausse (+0,03 t) ; les 26 autres baissent, de 20,48 t pour le Luxembourg, la plus forte baisse."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · UNION EUROPÉENNE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LA CROATIE EST LE</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SEUL PAYS DE L’UE À</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉMETTRE PLUS DE</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">CO2 PAR PERSONNE</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">QU’EN 1990</text><text x="56" y="308.74636141074217" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Variation des émissions de CO2 par personne entre 1990 et 2024, en</text><text x="56" y="326.87213777792965" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">tonnes, dans les 27 États membres. La hausse croate est de 0,03 t sur</text><text x="56" y="344.9979141451172" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">une base de 4,73 t, soit 0,67 %. Les 26 autres baissent, de 4,93 t en</text><text x="56" y="363.1236905123047" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">moyenne, et le Luxembourg de 20,48 t.</text><text x="56" y="867.748447265625" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Global Carbon Budget (2025) ; population d’après diverses</text><text x="56" y="885.8742236328126" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">sources (2024), traitement Our World in Data · combustibles fossiles et</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">industrie uniquement</text><text x="56" y="393.2492661559922" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">MOYENNE DES 26 BAISSES : −4,93</text><rect x="52" y="407.2492661559922" width="436" height="16.222142308422455" fill="#4FE0C0" fill-opacity="0.08"></rect><rect x="377.7800018787384" y="411.3048017330978" width="1" height="8.111071154211228" fill="#4FE0C0"></rect><rect x="371.13808050727374" y="427.52694404152027" width="6.641921371464668" height="8.111071154211228" fill="#a5a4b8"></rect><rect x="363.42987087182473" y="443.74908634994273" width="14.35013100691369" height="8.111071154211228" fill="#a5a4b8"></rect><rect x="361.61035910560105" y="459.9712286583652" width="16.16964277313734" height="8.111071154211228" fill="#a5a4b8"></rect><rect x="358.198274098736" y="476.1933709667876" width="19.58172778000237" height="8.111071154211228" fill="#a5a4b8"></rect><rect x="353.3546344112993" y="492.41551327521006" width="24.42536746743911" height="8.111071154211228" fill="#a5a4b8"></rect><rect x="344.7259914551658" y="508.6376555836325" width="33.054