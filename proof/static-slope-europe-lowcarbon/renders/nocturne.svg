<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Slope chart des 6 plus gros producteurs d’électricité parmi 16 pays européens : part de l’électricité bas-carbone en 2000 et en 2024. Toutes les lignes montent. Royaume-Uni passe de 25,2 % à 64,9 %, la plus forte hausse du plateau. La Finlande, 65,5 % en 2000 contre 90,7 % pour la France, atteint 95,3 % en 2024 et passe devant la France à 94,9 % — le seul croisement en tête du groupe."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Futura" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.05" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LES SEIZE PAYS ONT TOUS GAGNÉ DU</text><text x="56" y="145.09" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">BAS-CARBONE DEPUIS 2000 — UN SEUL A</text><text x="56" y="184.13" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DOUBLÉ LA FRANCE</text><text x="56" y="231.92000000000002" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Part de l’électricité produite à partir de sources bas-carbone — renouvelables et nucléaire réunis — en 2000 et en 2024. Les 6 plus gros producteurs du</text><text x="56" y="250.04500000000002" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">groupe de 16 pays étudiés ; les 16 ont progressé, le plus fort étant Danemark (+74 points, non dessiné). Ici, Royaume-Uni gagne le plus, +40 points.</text><text x="56" y="268.17" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">La Finlande était 25,1 points sous la France en 2000 ; elle est devant en 2024.</text><text x="56" y="437.875" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE LIGNE EST UN PAYS, D’UNE TEINTE D’UN BOUT À L’AUTRE. IL N’Y A PAS D’AXE : LA PENTE DONNE LE SENS, LES</text><text x="56" y="451.875" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">DEUX NOMBRES DONNENT LE NIVEAU, L’ÉCART EST ÉCRIT À DROITE, EN POINTS.</text><text x="56" y="484" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><line x1="199.09772232174873" x2="199.09772232174873" y1="308.43171875" y2="425.875" stroke="#3c3b66" stroke-width="0.8"></line><line x1="807.6287416994571" x2="807.6287416994571" y1="308.43171875" y2="425.875" stroke="#3c3b66" stroke-width="0.8"></line><text x="191.09772232174873" y="299.8340625" text-anchor="end" font-family="Futura" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2000</text><text x="815.6287416994571" y="299.8340625" text-anchor="start" font-family="Futura" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2024</text><g><path d="M 193.1 357.6 L 199.1 360.1 L 807.6 322.8 L 813.6 322.8" fill="none" stroke="#53e1c1" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="199.09772232174873" cy="360.06857460251183" r="3.4" fill="#53e1c1"></circle><circle cx="807.6287416994571" cy="322.8127289496528" r="3.4" fill="#53e1c1"></circle><text x="143.51171875" y="360.06170654296875" text-anchor="end" font-family="Futura" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">FINLANDE</text><text x="191.09772232174873" y="361.06300354003906" text-anchor="end" font-family="Futura" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">65,5</text><text x="815.6287416994571" y="326.2847290717231" font-family="Futura" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">95,3</text><text x="904" y="325.2834320746528" text-anchor="end" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#53e1c1">+29,8</text></g><g><path d="M 193.1 328.6 L 199.1 328.6 L 807.6 323.4 L 813.6 339.0" fill="none" stroke="#53e1c1" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="199.09772232174873" cy="328.632671824412" r="3.4" fill="#53e1c1"></circle><circle cx="807.6287416994571" cy="323.3750996249563" r="3.4" fill="#53e1c1"></circle><text x="143.51171875" y="331.103374949412" text-anchor="end" font-family="Futura" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">FRANCE</text><text x="191.09772232174873" y="332.1046719464823" text-anchor="end" font-family="Futura" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">90,7</text><text x="815.6287416994571" y="342.45272833930125" font-family="Futura" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">94,9</text><text x="904" y="341.45143134223093" text-anchor="end" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#53e1c1">+4,2</text></g><g><path d="M 193.1 373.8 L 199.1 387.3 L 807.6 346.1 L 813.6 355.1" fill="none" stroke="#807f9b" stroke-width="0.9900000000000001" stroke-linejoin="round"></path><circle cx="199.09772232174873" cy="387.281051816185" r="2.2" fill="#807f9b"></circle><circle cx="807.6287416994571" cy="346.0647123738611" r="2.2" fill="#807f9b"></circle><text x="143.51171875" y="376.2297058105469" text-anchor="end" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b