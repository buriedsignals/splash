<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Slope chart des 6 plus gros producteurs d’électricité parmi 16 pays européens : part de l’électricité bas-carbone en 2000 et en 2024. Toutes les lignes montent. Royaume-Uni passe de 25,2 % à 64,9 %, la plus forte hausse du plateau. La Finlande, 65,5 % en 2000 contre 90,7 % pour la France, atteint 95,3 % en 2024 et passe devant la France à 94,9 % — le seul croisement en tête du groupe."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LES SEIZE PAYS ONT TOUS GAGNÉ DU</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">BAS-CARBONE DEPUIS 2000 — UN SEUL A</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DOUBLÉ LA FRANCE</text><text x="56" y="231.91862718007812" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Part de l’électricité produite à partir de sources bas-carbone — renouvelables et nucléaire réunis — en 2000 et en 2024. Les 6 plus gros</text><text x="56" y="250.04440354726563" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">producteurs du groupe de 16 pays étudiés ; les 16 ont progressé, le plus fort étant Danemark (+74 points, non dessiné). Ici, Royaume-Uni gagne le</text><text x="56" y="268.1701799144531" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">plus, +40 points. La Finlande était 25,1 points sous la France en 2000 ; elle est devant en 2024.</text><text x="56" y="437.8737936328125" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE LIGNE EST UN PAYS, D’UNE TEINTE D’UN BOUT À L’AUTRE. IL N’Y A PAS D’AXE : LA PENTE DONNE LE</text><text x="56" y="451.87400863281255" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SENS, LES DEUX NOMBRES DONNENT LE NIVEAU, L’ÉCART EST ÉCRIT À DROITE, EN POINTS.</text><text x="56" y="484" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><line x1="200.01799482107162" x2="200.01799482107162" y1="307.2859465160156" y2="425.8742093563125" stroke="#3c3b66" stroke-width="0.8"></line><line x1="812.8080006718635" x2="812.8080006718635" y1="307.2859465160156" y2="425.8742093563125" stroke="#3c3b66" stroke-width="0.8"></line><text x="192.01799482107162" y="299.2959562816406" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2000</text><text x="820.8080006718635" y="299.2959562816406" text-anchor="start" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2024</text><g><path d="M 194.0 359.2 L 200.0 359.2 L 812.8 321.0 L 818.8 321.0" fill="none" stroke="#53e1c1" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="200.01799482107162" cy="359.24039808927165" r="3.4" fill="#53e1c1"></circle><circle cx="812.8080006718635" cy="321.01090763068805" r="3.4" fill="#53e1c1"></circle><text x="148.37999415397644" y="361.74039808927165" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" lett