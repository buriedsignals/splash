<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Slope chart des 6 plus gros producteurs d’électricité parmi 16 pays européens : part de l’électricité bas-carbone en 2000 et en 2024. Toutes les lignes montent. Royaume-Uni passe de 25,2 % à 64,9 %, la plus forte hausse du plateau. La Finlande, 65,5 % en 2000 contre 90,7 % pour la France, atteint 95,3 % en 2024 et passe devant la France à 94,9 % — le seul croisement en tête du groupe."><rect x="0" y="0" width="540" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Les seize pays ont tous gagné</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">du bas-carbone depuis 2000</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">— un seul a doublé la France</text><text x="52" y="219.9053924521875" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part de l’électricité bas-carbone en 2000 et en 2024 : les 6 plus gros</text><text x="52" y="238.7561998740625" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">producteurs des 16 pays étudiés, qui ont tous progressé. La Finlande</text><text x="52" y="257.6070072959375" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">est passée devant la France.</text><text x="52" y="469.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">(2025), via Our World in Data</text><line x1="189.7540243268013" x2="189.7540243268013" y1="298.9529319053125" y2="446.009130378195" stroke="#d1cfc3" stroke-width="1"></line><line x1="398.5323407649994" x2="398.5323407649994" y1="298.9529319053125" y2="446.009130378195" stroke="#d1cfc3" stroke-width="1"></line><text x="181.7540243268013" y="290.3103537803125" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000</text><text x="406.5323407649994" y="290.3103537803125" text-anchor="start" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2024</text><g><path d="M 183.8 362.5 L 189.8 362.5 L 398.5 314.6 L 404.5 314.6" fill="none" stroke="#1755b2" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="189.7540243268013" cy="362.46413510055294" r="3.4" fill="#1755b2"></circle><circle cx="398.5323407649994" cy="314.5774091635674" r="3.4" fill="#1755b2"></circle><text x="138.5670126080513" y="365.600380828092" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Finlande</text><text x="181.7540243268013" y="366.01638119430294" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">65,5</text><text x="406.5323407649994" y="318.1296552573174" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">95,3</text><text x="488" y="317.71365489110644" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#