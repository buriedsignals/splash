<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Slope chart des 6 plus gros producteurs d’électricité parmi 16 pays européens : part de l’électricité bas-carbone en 2000 et en 2024. Toutes les lignes montent. Royaume-Uni passe de 25,2 % à 64,9 %, la plus forte hausse du plateau. La Finlande, 65,5 % en 2000 contre 90,7 % pour la France, atteint 95,3 % en 2024 et passe devant la France à 94,9 % — le seul croisement en tête du groupe."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Les seize pays ont tous gagné</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">du bas-carbone depuis 2000</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">— un seul a doublé la France</text><text x="52" y="219.9053924521875" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part de l’électricité produite à partir de sources bas-carbone —</text><text x="52" y="238.7561998740625" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">renouvelables et nucléaire réunis — en 2000 et en 2024. Les 6 plus gros</text><text x="52" y="257.6070072959375" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">producteurs du groupe de 16 pays étudiés ; les 16 ont progressé, le plus</text><text x="52" y="276.4578147178125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">fort étant Danemark (+74 points, non dessiné). Ici, Royaume-Uni gagne</text><text x="52" y="295.3086221396875" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">le plus, +40 points. La Finlande était 25,1 points sous la France en 2000 ;</text><text x="52" y="314.1594295615625" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">elle est devant en 2024.</text><text x="52" y="815.6965677562501" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque ligne est un pays, d’une teinte d’un bout à l’autre. Il</text><text x="52" y="833.8971735562501" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">n’y a pas d’axe : la pente donne le sens, les deux nombres donnent le</text><text x="52" y="852.0977793562502" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">niveau, l’écart est écrit à droite, en points.</text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">(2025), via Our World in Data</text><line x1="189.7540243268013" x2="189.7540243268013" y1="355.5053541709375" y2="800.0968285250701" stroke="#d1cfc3" stroke-width="1"></line><line x1="398.5323407649994" x2="398.5323407649994" y1="355.5053541709375" y2="800.0968285250701" stroke="#d1cfc3" stroke-width="1"></line><text x="181.7540243268013" y="346.8627760459375" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000</text><text x="406.5323407649994" y="346.8627760459375" text-anchor="start" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2024</text><g><path d="M 183.8 537.4 L 189.8 537.4 L 398.5 382.1 L 404.5 382.1" fill="none" stroke="#1755b2" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="189.7540243268013" cy="537.3701809780297" r="3.4" fill="#1755b2"></circle><circle cx="398.5323407649994" cy="382.1496564618313" r="3.4" fill="#1755b2"></circle><text x="138.5670126080513" y="540.5064267055687" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Finlande</text><text x="181.7540243268013" y="540.9224270717797" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">65,5</text><text x="406.5323407649994" y="385.7019025555813" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">95,3</text><text x="488" y="385.28590218937035" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">+29,8</text></g><g><path d="M 183.8 406.4 L 189.8 406.4 L 398.5 384.5 L 404.5 398.5" fill="none" stroke="#1755b2" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="189.7540243268013" cy="406.3975179676971" r="3.4" fill="#1755b2"></circle><circle cx="398.5323407649994" cy="384.4926839696887" r="3.4" fill="#1755b2"></circle><text x="138.5670126080513" y="409.5337636952362" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">France</text><text x="181.7540243268013" y="409.9497640614471" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">90,7</text><text x="406.5323407649994" y="402.0134259930813" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">94,9</text><text x="488" y="401.59742562687035" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">+4,2</text></g><g><path d="M 183.8 650.7 L 189.8 650.7 L 398.5 479.0 L 404.5 479.0" fill="none" stroke="#89877f" stroke-width="1.375" stroke-linejoin="round"></path><circle cx="189.7540243268013" cy="650.746616607731" r="2.2" fill="#89877f"></circle><circle cx="398.5323407649994" cy="479.0253279142278" r="2.2" fill="#89877f"></circle><text x="138.5670126080513" y="653.88286233527" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Espagne</text><text x="181.7540243268013" y="654.298862701481" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">43,8</text><text x="406.5323407649994" y="482.5775740079778" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">76,7</text><text x="488" y="482.16157364176684" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">+33,0</text></g><g><path d="M 183.8 747.5 L 189.8 747.5 L 398.5 540.6 L 404.5 540.6" fill="none" stroke="#89877f" stroke-width="1.375" stroke-linejoin="round"></path><circle cx="189.7540243268013" cy="747.5294799908489" r="2.2" fill="#89877f"></circle><circle cx="398.5323407649994" cy="540.5502529084036" r="2.2" fill="#89877f"></circle><text x="138.5670126080513" y="750.665725718388" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Royaume-Uni</text><text x="