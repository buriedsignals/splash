ly="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Italie</text><text x="181.7540243268013" y="784.1092645154263" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">18,8</text><text x="406.5323407649994" y="620.967305013786" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">50,2</text><text x="488" y="620.5513046475751" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">+31,3</text></g></svg>