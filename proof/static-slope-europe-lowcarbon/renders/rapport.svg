<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Slope chart des 6 plus gros producteurs d’électricité parmi 16 pays européens : part de l’électricité bas-carbone en 2000 et en 2024. Toutes les lignes montent. Royaume-Uni passe de 25,2 % à 64,9 %, la plus forte hausse du plateau. La Finlande, 65,5 % en 2000 contre 90,7 % pour la France, atteint 95,3 % en 2024 et passe devant la France à 94,9 % — le seul croisement en tête du groupe."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Les seize pays ont tous gagné du bas-carbone depuis 2000 — un</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">seul a doublé la France</text><text x="46" y="166.03308223926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Part de l’électricité produite à partir de sources bas-carbone — renouvelables et nucléaire réunis — en 2000 et en 2024. Les 6 plus gros</text><text x="46" y="184.88242573926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">producteurs du groupe de 16 pays étudiés ; les 16 ont progressé, le plus fort étant Danemark (+74 points, non dessiné). Ici, Royaume-Uni</text><text x="46" y="203.73176923926093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">gagne le plus, +40 points. La Finlande était 25,1 points sous la France en 2000 ; elle est devant en 2024.</text><text x="46" y="447.15171118750004" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE LIGNE EST UN PAYS, D’UNE TEINTE D’UN BOUT À L’AUTRE. IL N’Y A PAS D’AXE : LA PENTE DONNE LE SENS, LES DEUX</text><text x="46" y="461.15118384375006" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">NOMBRES DONNENT LE NIVEAU, L’ÉCART EST ÉCRIT À DROITE, EN POINTS.</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><line x1="181.13916015625" x2="181.13916015625" y1="245.07622992676093" y2="435.1527631738282" stroke="#d1d1d1" stroke-width="1"></line><line x1="826.87177734375" x2="826.87177734375" y1="245.07622992676093" y2="435.1527631738282" stroke="#d1d1d1" stroke-width="1"></line><text x="173.13916015625" y="236.43365180176093" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">2000</text><text x="834.87177734375" y="236.43365180176093" text-anchor="start" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">2024</text><g><path d="M 175.1 325.5 L 181.1 325.5 L 826.9 262.0 L 832.9 262.0" fill="none" stroke="#1e5a88" stroke-width="2.2" stroke-linejoin="round"></path><circle cx="181.13916015625" cy="325.53289563197313" r="3.4" fill="#1e5a88"></circle><circle cx="826.87177734375" cy="261.95478787109676" r="3.4" fill="#1e5a88"></circle><text x="130.6064453125" y="327.90105969447313" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">FINLANDE</text><text x="173.13916015625" y="328.96673352259813" text-anchor="end" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">65,5</text><text x="834.87177734375" y="265.38862576172176" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">95,3</text><text x="914" y="264.32295193359676" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">+29,8</text></g><g><path d="M 175.1 271.9 L 181.1 271.9 L 826.9 262.9 L 832.9 277.8" fill="none" stroke="#1e5a88" stroke-width="2.2" stroke-linejoin="round"></path><circle cx="181.13916015625" cy="271.8866777200443" r="3.4" fill="#1e5a88"></circle><circle cx="826.87177734375" cy="262.91448863132524" r="3.4" fill="#1e5a88"></circle><text x="130.6064453125" y="274.2548417825443" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">FRANCE</text><text x="173.13916015625" y="275.3205156106693" text-anchor="end" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">90,7</text><text x="834.87177734375" y="281.22309841797176" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">94,9</text><text x="914" y="280.15742458984676" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">+4,2</text></g><g><path d="M 175.1 372.0 L 181.1 372.0 L 826.9 301.6 L 832.9 301.6" fill="none" stroke="#898989" stroke-width="1.2100000000000002" stroke-linejoin="round"></path><circle cx="181.13916015625" cy="371.9717236444179" r="2.2" fill="#898989"></circle><circle cx="826.87177734375" cy="301.6349261659842" r="2.2" fill="#898989"></circle><text x="130.6064453125" y="374.3398877069179" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">ESPAG