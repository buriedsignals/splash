<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Slope chart des 6 plus gros producteurs d’électricité parmi 16 pays européens : part de l’électricité bas-carbone en 2000 et en 2024. Toutes les lignes montent. Royaume-Uni passe de 25,2 % à 64,9 %, la plus forte hausse du plateau. La Finlande, 65,5 % en 2000 contre 90,7 % pour la France, atteint 95,3 % en 2024 et passe devant la France à 94,9 % — le seul croisement en tête du groupe."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LES SEIZE PAYS ONT</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">TOUS GAGNÉ DU</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">BAS-CARBONE</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DEPUIS 2000 — UN</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SEUL A DOUBLÉ LA</text><text x="56" y="301.24591515" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">FRANCE</text><text x="56" y="349.0362463800781" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Part de l’électricité produite à partir de sources bas-carbone —</text><text x="56" y="367.1620227472656" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">renouvelables et nucléaire réunis — en 2000 et en 2024. Les 6 plus gros</text><text x="56" y="385.28779911445315" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">producteurs du groupe de 16 pays étudiés ; les 16 ont progressé, le plus</text><text x="56" y="403.41357548164063" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">fort étant Danemark (+74 points, non dessiné). Ici, Royaume-Uni gagne le</text><text x="56" y="421.5393518488281" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">plus, +40 points. La Finlande était 25,1 points sous la France en 2000 ; elle</text><text x="56" y="439.6651282160156" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">est devant en 2024.</text><text x="56" y="811.7475872656249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE LIGNE EST UN PAYS, D’UNE TEINTE D’UN</text><text x="56" y="825.747802265625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">BOUT À L’AUTRE. IL N’Y A PAS D’AXE : LA PENTE DONNE LE</text><text x="56" y="839.748017265625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SENS, LES DEUX NOMBRES DONNENT LE NIVEAU, L’ÉCART EST</text><text x="56" y="853.7482322656249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">ÉCRIT À DROITE, EN POINTS.</text><text x="56" y="885.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">(2025), via Our World in Data</text><line x1="200.01799482107162" x2="200.01799482107162" y1="478.7808948175781" y2="799.7480029891249" stroke="#3c3b66" stroke-width="0.8"></line><line x1="392.80800067186357" x2="392.80800067186357" y1="478.7808948175781" y2="799.7480029891249" stroke="#3c3b66" stroke-width="0.8"></line><text x="192.01799482107162" y="470.7909045832031" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2000</text><text x="400.80800067186357" y="470.7909045832031" text-anchor="start" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2024</text><g><path d="M 194.0 611.2 L 200.0 611.2 L 392.8 500.0 L 398.8 500.0" fill="none" stroke="#53e1c1" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="200.01799482107162" cy="611.2376317631929" r="3.4" fill="#53e1c1"></circle><circle cx="392.80800067186357" cy="500.0013687222969" r="3.4" fill="#53e1c1"></circle><text x="148.37999415397644" y="613.7376317631929" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">FINLANDE</text><text x="192.01799482107162" y="614.7306279790132" text-anchor="end" font-family="Montserrat" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">65,5</text><text x="400.80800067186357" y="503.4943649381172" font-family="Montserrat" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">95,3</text><text x="484" y="502.5013687222969" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#53e1c1">+29,8</text></g><g><path d="M 194.0 517