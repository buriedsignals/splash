<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Slope chart des 6 plus gros producteurs d’électricité parmi 16 pays européens : part de l’électricité bas-carbone en 2000 et en 2024. Toutes les lignes montent. Royaume-Uni passe de 25,2 % à 64,9 %, la plus forte hausse du plateau. La Finlande, 65,5 % en 2000 contre 90,7 % pour la France, atteint 95,3 % en 2024 et passe devant la France à 94,9 % — le seul croisement en tête du groupe."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Les seize pays ont tous gagné du</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">bas-carbone depuis 2000 — un</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">seul a doublé la France</text><text x="46" y="198.97427563926092" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Part de l’électricité produite à partir de sources bas-carbone —</text><text x="46" y="217.82361913926093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">renouvelables et nucléaire réunis — en 2000 et en 2024. Les 6 plus gros</text><text x="46" y="236.6729626392609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">producteurs du groupe de 16 pays étudiés ; les 16 ont progressé, le plus</text><text x="46" y="255.5223061392609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">fort étant Danemark (+74 points, non dessiné). Ici, Royaume-Uni gagne</text><text x="46" y="274.3716496392609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">le plus, +40 points. La Finlande était 25,1 points sous la France en 2000 ;</text><text x="46" y="293.22099313926094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">elle est devant en 2024.</text><text x="46" y="834.3028950312499" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE LIGNE EST UN PAYS, D’UNE TEINTE D’UN BOUT À</text><text x="46" y="848.3023676874999" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">L’AUTRE. IL N’Y A PAS D’AXE : LA PENTE DONNE LE SENS, LES DEUX</text><text x="46" y="862.30184034375" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">NOMBRES DONNENT LE NIVEAU, L’ÉCART EST ÉCRIT À DROITE, EN POINTS.</text><text x="46" y="895.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="46" y="914" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">(2025), via Our World in Data</text><line x1="181.13916015625" x2="181.13916015625" y1="334.5654538267609" y2="822.303947017578" stroke="#d1d1d1" stroke-width="1"></line><line x1="406.87177734375" x2="406.87177734375" y1="334.5654538267609" y2="822.303947017578" stroke="#d1d1d1" stroke-width="1"></line><text x="173.13916015625" y="325.9228757017609" text-anchor="end" font-family="Open Sans" fon