<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Slope chart des 6 plus gros producteurs d’électricité parmi 16 pays européens : part de l’électricité bas-carbone en 2000 et en 2024. Toutes les lignes montent. Royaume-Uni passe de 25,2 % à 64,9 %, la plus forte hausse du plateau. La Finlande, 65,5 % en 2000 contre 90,7 % pour la France, atteint 95,3 % en 2024 et passe devant la France à 94,9 % — le seul croisement en tête du groupe."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Les seize pays ont tous gagné du bas-carbone depuis 2000</text><text x="52" y="137.6" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">— un seul a doublé la France</text><text x="52" y="183.29999999999998" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part de l’électricité produite à partir de sources bas-carbone — renouvelables et nucléaire réunis — en 2000 et en 2024. Les 6 plus gros</text><text x="52" y="202.14999999999998" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">producteurs du groupe de 16 pays étudiés ; les 16 ont progressé, le plus fort étant Danemark (+74 points, non dessiné). Ici, Royaume-Uni</text><text x="52" y="220.99999999999997" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">gagne le plus, +40 points. La Finlande était 25,1 points sous la France en 2000 ; elle est devant en 2024.</text><text x="52" y="432.75" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque ligne est un pays, d’une teinte d’un bout à l’autre. Il n’y a pas d’axe : la pente donne le sens, les deux nombres donnent le</text><text x="52" y="450.95" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">niveau, l’écart est écrit à droite, en points.</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><line x1="189.7540243268013" x2="189.7540243268013" y1="262.34511718749997" y2="417.15" stroke="#d1cfc3" stroke-width="1"></line><line x1="818.5323407649994" x2="818.5323407649994" y1="262.34511718749997" y2="417.15" stroke="#d1cfc3" stroke-width="1"></line><text x="181.7540243268013" y="253.70253906249997" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000</text><text x="826.5323407649994" y="253.70253906249997" text-anchor="start" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2024</text><g><path d="M 183.8 328.9 L 189.8 328.9 L 818.5 278.3 L 824.5 278.3" fill="none" stroke="#1755b2" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="189.7540243268013" cy="328.9385931220043" r="3.4" fill="#1755b2"></circle><circle cx="818.5323407649994" cy="278.2565827546296" r="3.4" fill="#1755b2"></circle><text x="138.5670126080513" y="332.07483884954337" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Finlande</text><text x="181.7540243268013" y="332.4908392157543" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">65,5</text><text x="826.5323407649994" y="281.8088288483796" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">95,3</text><text x="908" y="281.3928284821687" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">+29,8</text></g><g><path d="M 183.8 286.2 L 189.8 286.2 L 818.5 279.0 L 824.5 294.6" fill="none" stroke="#1755b2" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="189.7540243268013" cy="286.1739014987672" r="3.4" fill="#1755b2"></circle><circle cx="818.5323407649994" cy="279.021619110578" r="3.4" fill="#1755b2"></circle><text x="138.5670126080513" y="289.31014722630624" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">France</text><text x="181.7540243268013" y="289.7261475925172" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">90,7</text><text x="826.5323407649994" y="298.1203522858796" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">94,9</text><text x="908" y="297.7043519196687" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">+4,2</text></g><g><path d="M 183.8 364.6 L 189.8 366.0 L 818.5 309.9 L 824.5 310.9" fill="none" stroke="#89877f" stroke-width="1.375" stroke-linejoin="round"></path><circle cx="189.7540243268013" cy="365.9578320655041" r="2.2" fill="#89877f"></circle><circle cx="818.5323407649994" cy="309.8880554622506" r="2.2" fill="#89877f"></circle><text x="138.5670126080513" y="367.74815979003904" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Espagne</text><text x="181.7540243268013" y="368.16416015625" text-anchor