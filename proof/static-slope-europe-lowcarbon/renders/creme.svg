<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Slope chart des 6 plus gros producteurs d’électricité parmi 16 pays européens : part de l’électricité bas-carbone en 2000 et en 2024. Toutes les lignes montent. Royaume-Uni passe de 25,2 % à 64,9 %, la plus forte hausse du plateau. La Finlande, 65,5 % en 2000 contre 90,7 % pour la France, atteint 95,3 % en 2024 et passe devant la France à 94,9 % — le seul croisement en tête du groupe."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Les seize pays ont tous gagné du bas-carbone</text><text x="52" y="137.6" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">depuis 2000 — un seul a doublé la France</text><text x="52" y="183.29999999999998" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part de l’électricité produite à partir de sources bas-carbone — renouvelables et nucléaire réunis — en 2000 et en 2024. Les 6 plus gros</text><text x="52" y="202.14999999999998" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">producteurs du groupe de 16 pays étudiés ; les 16 ont progressé, le plus fort étant Danemark (+74 points, non dessiné). Ici, Royaume-Uni gagne</text><text x="52" y="220.99999999999997" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">le plus, +40 points. La Finlande était 25,1 points sous la France en 2000 ; elle est devant en 2024.</text><text x="52" y="432.75" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque ligne est un pays, d’une teinte d’un bout à l’autre. Il n’y a pas d’axe : la pente donne le sens, les</text><text x="52" y="450.95" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">deux nombres donnent le niveau, l’écart est écrit à droite, en points.</text><text x="52" y="488" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><line x1="201.86899653077126" x2="201.86899653077126" y1="262.2780090332031" y2="417.15" stroke="#d1cfc3" stroke-width="1"></line><line x1="813.3429967164993" x2="813.3429967164993" y1="262.2780090332031" y2="417.15" stroke="#d1cfc3" stroke-width="1"></line><text x="193.86899653077126" y="253.6379943847656" text-anchor="end" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000</text><text x="821.3429967164993" y="253.6379943847656" text-anchor="start" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2024</text><g><path d="M 195.9 328.8 L 201.9 328.8 L 813.3 278.1 L 819.3 278.1" fill="none" stroke="#1755b2" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="201.86899653077126" cy="328.8465722835725" r="3.4" fill="#1755b2"></circle><circle cx="813.3429967164993" cy="278.10733710394965" r="3.4" fill="#1755b2"></circle><text x="149.34399896860123" y="332.1420739925569" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Finlande</text><text x="193.86899653077126" y="332.35656679040846" text-anchor="end" font-family="Avenir Next" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">65,5</text><text x="821.3429967164993" y="281.6173316107856" font-family="Avenir Next" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">95,3</text><text x="908" y="281.402838812934" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">+29,8</text></g><g><path d="M 195.9 286.0 L 201.9 286.0 L 813.3 278.9 L 819.3 294.3" fill="none" stroke="#1755b2" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="201.86899653077126" cy="286.0335952543056" r="3.4" fill="#1755b2"></circle><circle cx="813.3429967164993" cy="278.8732372587393" r="3.4" fill="#1755b2"></circle><text x="149.34399896860123" y="289.32909696329" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">France</text><text x="193.86899653077126" y="289.54358976114156" text-anchor="end" font-family="Avenir Next" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">90,7</text><text x="821.3429967164993" y="297.8373328314887" font-family="Avenir Next" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">94,9</text><text x="908" y="297.62284003363715" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">+4,2</text></g><g><path d="M 195.9 364.9 L 201.9 365.9 L 813.3 309.8 L 819.3 310.5" fill="none" stroke="#89877f" stroke-width="1.375" stroke-linejoin="round"></path><circle cx="201.86899653077126" cy="365.90760947032976" r="2.2" fill="#89877f"></circle><circle cx="813.3429967164993" cy="309.77452475408586" r="2.2" fill="#89877f"></circle><text x="149.34399896860123" y="368.18549194335935" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Espagne</text><text x="1