<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif" data-ladder="none"><desc>Waterfall chart of Germany&#x27;s electricity generation, 2015 to 2024, in terawatt-hours: 639.2 TWh in 2015, plus 102.7 TWh from renewables growth, minus 91.8 TWh from the nuclear phase-out, minus 154.1 TWh from a falling fossil share, arriving at 496.0 TWh in 2024 — a net drop of 143.2 TWh.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="138" fill="#000000" font-size="53" font-weight="700">Germany generated 143 fewer terawatt-hours of electricity in 2024</text><text x="85" y="204" fill="#000000" font-size="53" font-weight="700">than in 2015</text><text x="85" y="266" fill="#616161" font-size="31">The nuclear phase-out and a falling fossil share together outweighed the renewables build-out — renewables alone grew, but</text><text x="85" y="310" fill="#616161" font-size="31">not enough to offset the other two.</text><text x="85" y="995" fill="#616161" font-size="31">Source: Ember, Energy Institute — Statistical Review of World Energy (2025), via Our World in Data · extracted 8 August 2026</text><g><rect x="85" y="350" width="26" height="26" fill="#0072B2"></rect><text x="125" y="372" fill="#000000" font-size="29" font-weight="600">Increase</text></g><g><rect x="320.878173828125" y="350" width="26" height="26" fill="#D55E00"></rect><text x="360.878173828125" y="372" fill="#000000" font-size="29" font-weight="600">Decrease</text></g><g><rect x="568.05615234375" y="350" width="26" height="26" fill="#616161"></rect><text x="608.05615234375" y="372" fill="#000000" font-size="29" font-weight="600">Total</text></g><g><line x1="178.60791015625" x2="1835" y1="887" y2="887" stroke="#616161" stroke-width="1"></line><text x="156.60791015625" y="896" fill="#616161" font-size="29" text-anchor="end">0</text></g><g><line x1="178.60791015625" x2="1835" y1="829.75" y2="829.75" stroke="#d1d1d1" stroke-width="1"></line><text x="156.60791015625" y="838.75" fill="#616161" font-size="29" text-anchor="end">100</text></g><g><line x1="178.60791015625" x2="1835" y1="772.5" y2="772.5" stroke="#d1d1d1" stroke-width="1"></line><text x="156.60791015625" y="781.5" fill="#616161" font-size="29" text-anchor="end">200</text></g><g><line x1="178.60791015625" x2="1835" y1="715.25" y2="715.25" stroke="#d1d1d1" stroke-width="1"></line><text x="156.60791015625" y="724.25" fill="#616161" font-size="29" text-anchor="end">300</text></g><g><line x1="178.60791015625" x2="1835" y1="658" y2="658" stroke="#d1d1d1" stroke-width="1"></line><text x="156.60791015625" y="667" fill="#616161" font-size="29" text-anchor="end">400</text></g><g><line x1="178.60791015625" x2="1835" y1="600.75" y2="600.75" stroke="#d1d1d1" stroke-width="1"></line><text x="156.60791015625" y="609.75" fill="#616161" font-size="29" text-anchor="end">500</text></g><g><line x1="178.60791015625" x2="1835" y1="543.5" y2="543.5" stroke="#d1d1d1" stroke-width="1"></line><text x="156.60791015625" y="552.5" fill="#616161" font-size="29" text-anchor="end">600</text></g><g><line x1="178.60791015625" x2="1835" y1="486.25" y2="486.25" stroke="#d1d1d1" stroke-width="1"></line><text x="156.60791015625" y="495.25" fill="#616161" font-size="29" text-anchor="end">700</text></g><g><line x1="178.60791015625" x2="1835" y1="429" y2="429" stroke="#d1d1d1" stroke-width="1"></line><text x="156.60791015625" y="438" fill="#616161" font-size="29" text-anchor="end">800</text></g><line x1="464.286328125" x2="521.286328125" y1="521.058" y2="521.058" stroke="#616161" stroke-width="1" stroke-dasharray="3 3"></line><line x1="806.9647460937499" x2="863.96474609375" y1="462.26225" y2="462.26225" stroke="#616161" stroke-width="1" stroke-dasharray="3 3"></line><line x1="1149.6431640625" x2="1206.6431640625" y1="462.26225" y2="462.26225" stroke="#616161" stroke-width="1" stroke-dasharray="3 3"></line><line x1="1492.32158203125" x2="1549.32158203125" y1="514.8177499999999" y2="514.8177499999999" stroke="#616161" stroke-width="1" stroke-dasharray="3 3"></line><g><rect x="178.60791015625" y="521.058" width="285.67841796875" height="365.942" fill="#616161"></rect><text x="321.447119140625" y="513.058" fill="#000000" font-size="29" font-weight="700" text-anchor="middle">639.2</text><text x="321.447119140625" y="935" fill="#616161" font-size="26" text-anchor="middle">2015 total generation</text></g><g><rect x="521.286328125" y="462.26225" width="285.67841796875" height="58.79575" fill="#0072B2"></rect><text x="664.1255371093749" y="454.26225" fill="#000000" font-size="29" font-weight="700" text-anchor="middle">+102.7</text><text x="664.1255371093749" y="935" fill="#616161" font-size="26" text-anchor="middle">Renewables</text></g><g><rect x="863.96474609375" y="462.26225" width="285.67841796875" height="52.55549999999994" fill="#D55E00"></rect><text x="1006.803955078125" y="454.26225" fill="#000000" font-size="29" font-weight="700" text-anchor="middle">−91.8</text><text x="1006.803955078125" y="935" fill="#616161" font-size="26" text-anchor="middle">Nuclear</text></g><g><rect x="1206.6431640625" y="514.8177499999999" width="285.67841796875" height="88.22225000000003" fill="#D55E00"></rect><text x="1349.4823730468752" y="506.81774999999993" fill="#000000" font-size="29" font-weight="700" text-anchor="middle">−154.1</text><text x="1349.4823730468752" y="935" fill="#616161" font-size="26" text-anchor="middle">Fossil fuel</text></g><g><rect x="1549.32158203125" y="603.04" width="285.67841796875" height="283.96000000000004" fill="#616161"></rect><text x="1692.1607910156251" y="595.04" fill="#000000" font-size="29" font-weight="700" text-anchor="middle">496.0</text><text x="1692.1607910156251" y="935" fill="#616161" font-size="26" text-anchor="middle">2024 total generation</text></g></svg>