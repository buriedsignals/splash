<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Graphique haltère : l’espérance de vie de 10 pays en 2000 et en 2023, une ligne par pays, classées par le gain. La Pologne gagne le plus (+5,0 ans, de 73,6 à 78,6) et les États-Unis le moins (+2,5, de 76,8 à 79,3). Tous les dix ont gagné."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">SANTÉ · EUROPE ET JAPON</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La Pologne a gagné 5,0 ans</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">d’espérance de vie depuis</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">2000, les États-Unis 2,5</text><text x="52" y="218.6046867400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Espérance de vie à la naissance en 2000 et en 2023, dans 10 pays. Tous</text><text x="52" y="237.4554941619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">les dix ont gagné des années : de 2,5 pour les États-Unis à 5,0 pour la</text><text x="52" y="256.3063015838281" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Pologne. Les rangs sont classés par le gain, pas par le niveau.</text><text x="52" y="805.9451832447451" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : le point pâle est 2000, le point plein 2023 — deux états d’une</text><text x="52" y="824.79599066662" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">même mesure, donc une seule teinte à deux intensités. La barre entre</text><text x="52" y="843.6467980884951" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">les deux EST le gain, et le gain est écrit à droite : un écart trop petit</text><text x="52" y="862.49760551037" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">pour être vu resterait sinon indistinguable d’une donnée manquante.</text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Our World in Data (UN WPP, HMD), espérance de vie à la</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">naissance · données 2023</text><g><circle cx="168.5670126080513" cy="291.7873610808984" r="8" fill="#a7bdd9"></circle><text x="181.3670126080513" y="294.92360680843746" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">2000</text><g><circle cx="239.517853307724" cy="291.7873610808984" r="8" fill="#1757B6"></circle><text x="252.31785330772402" y="294.92360680843746" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">2023</text></g></g><g><rect x="52" y="303.54811242367185" width="436" height="45.06017376565132" rx="7.84336229427522" fill="none" stroke="#1755b2" stroke-width="1.2"></rect><line x1="192.99998645819906" x2="291.3180441832318" y1="326.07819930649754" y2="326.07819930649754" stroke="#5d89c7" stroke-width="12" stroke-linecap="round"></line><circle cx="192.99998645819906" cy="326.07819930649754" r="8" fill="#a7bdd9"></circle><circle cx="291.3180441832318" cy="326.07819930649754" r="8" fill="#1757B6"></circle><text x="62" y="329.2144450340366" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Pologne</text><text x="448.5419921875" y="329.63044540024754" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">+5,0</text></g><g><line x1="299.4179098338886" x2="383.8169723388463" y1="373.13837307214885" y2="373.13837307214885" stroke="#5d89c7" stroke-width="12" stroke-linecap="round"></line><circle cx="299.4179098338886" cy="373.13837307214885" r="8" fill="#a7bdd9"></circle><circle cx="383.8169723388463" cy="373.13837307214885" r="8" fill="#1757B6"></circle><text x="62" y="376.2746187996879" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">France</text><text x="448.5419921875" y="376.69061916589885" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+4,3</text></g><g><line x1="306.6819655463904" x2="390.6177843356256" y1="420.19854683780017" y2="420.19854683780017" stroke="#5d89c7" stroke-width="12" stroke-linecap="round"></line><circle cx="306.6819655463904" cy="420.19854683780017" r="8" fill="#a7bdd9"></circle><circle cx="390.6177843356256" cy="420.19854683780017" r="8" fill="#1757B6"></circle><text x="62" y="423.3347925653392" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Espagne</text><text x="448.5419921875" y="423.75079293155017" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+4,3</text></g><g><line x1="314.9947261812943" x2="396.20233517240104" y1="467.2587206034515" y2="467.2587206034515" stroke="#5d89c7" stroke-width="12" stroke-linecap="round"></line><circle cx="314.9947261812943" cy="467.25872060