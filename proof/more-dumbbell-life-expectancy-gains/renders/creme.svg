<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique haltère : l’espérance de vie de 10 pays en 2000 et en 2023, une ligne par pays, classées par le gain. La Pologne gagne le plus (+5,0 ans, de 73,6 à 78,6) et les États-Unis le moins (+2,5, de 76,8 à 79,3). Tous les dix ont gagné."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">SANTÉ · EUROPE ET JAPON</text><text x="52" y="101" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La Pologne a gagné 5,0 ans d’espérance de vie</text><text x="52" y="137.6" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">depuis 2000, les États-Unis 2,5</text><text x="52" y="182" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Espérance de vie à la naissance en 2000 et en 2023, dans 10 pays. Tous les dix ont gagné des années : de 2,5 pour les États-Unis à 5,0 pour la</text><text x="52" y="200.85" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Pologne. Les rangs sont classés par le gain, pas par le niveau.</text><text x="52" y="461.34999999999997" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : point pâle 2000, point plein 2023 ; la barre entre les deux est le gain, écrit à droite.</text><text x="52" y="488" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Our World in Data (UN WPP, HMD), espérance de vie à la naissance · données 2023</text><g><circle cx="176.07279578256606" cy="236.12029418945312" r="4.72879681