<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Graphique haltère : l’espérance de vie de 10 pays en 2000 et en 2023, une ligne par pays, classées par le gain. La Pologne gagne le plus (+5,0 ans, de 73,6 à 78,6) et les États-Unis le moins (+2,5, de 76,8 à 79,3). Tous les dix ont gagné."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">SANTÉ · EUROPE ET JAPON</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LA POLOGNE A</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">GAGNÉ 5,0 ANS</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">D’ESPÉRANCE DE VIE</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DEPUIS 2000, LES</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉTATS-UNIS 2,5</text><text x="56" y="308.74636141074217" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Espérance de vie à la naissance en 2000 et en 2023, dans 10 pays. Tous</text><text x="56" y="326.87213777792965" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">les dix ont gagné des années : de 2,5 pour les États-Unis à 5,0 pour la</text><text x="56" y="344.9979141451172" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Pologne. Les rangs sont classés par le gain, pas par le niveau.</text><text x="56" y="771.1190732806874" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : LE POINT PÂLE EST 2000, LE POINT PLEIN 2023 —</text><text x="56" y="789.244849647875" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">DEUX ÉTATS D’UNE MÊME MESURE, DONC UNE SEULE TEINTE À</text><text x="56" y="807.3706260150624" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">DEUX INTENSITÉS. LA BARRE ENTRE LES DEUX EST LE GAIN, ET</text><text x="56" y="825.4964023822499" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LE GAIN EST ÉCRIT À DROITE : UN ÉCART TROP PETIT POUR</text><text x="56" y="843.6221787494374" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">ÊTRE VU RESTERAIT SINON INDISTINGUABLE D’UNE DONNÉE</text><text x="56" y="861.7479551166249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">MANQUANTE.</text><text x="56" y="885.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Our World in Data (UN WPP, HMD), espérance de vie à la</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">naissance · données 2023</text><g><circle cx="178.37999415397644" cy="375.0236905123047" r="8" fill="#295f73"></circle><text x="191.17999415397645" y="377.5236905123047" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">2000</text><g><circle cx="247.8399949938059" cy="375.02369