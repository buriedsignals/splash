<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique haltère : l’espérance de vie de 10 pays en 2000 et en 2023, une ligne par pays, classées par le gain. La Pologne gagne le plus (+5,0 ans, de 73,6 à 78,6) et les États-Unis le moins (+2,5, de 76,8 à 79,3). Tous les dix ont gagné."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">SANTÉ · EUROPE ET JAPON</text><text x="46" y="91.05" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La Pologne a gagné 5,0 ans d’espérance de vie depuis</text><text x="46" y="123.99" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">2000, les États-Unis 2,5</text><text x="46" y="164.73000000000002" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Espérance de vie à la naissance en 2000 et en 2023, dans 10 pays. Tous les dix ont gagné des années : de 2,5 pour les</text><text x="46" y="183.58" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">États-Unis à 5,0 pour la Pologne. Les rangs sont classés par le gain, pas par le niveau.</text><text x="46" y="431.45" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : LE POINT PÂLE EST 2000, LE POINT PLEIN 2023 — DEUX ÉTATS D’UNE MÊME MESURE, DONC UNE SEULE TEINTE À DEUX INTENSITÉS.</text><text x="46" y="450.3" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LA BARRE ENTRE LES DEUX EST LE GAIN, ET LE GAIN EST ÉCRIT À DROITE : UN ÉCART TROP PETIT POUR ÊTRE VU RESTERAIT SINON</te