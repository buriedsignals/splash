<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Dumbbell chart of life expectancy at birth in 2000 (blue) and 2023 (vermillion) for ten countries, sorted by the size of the gain, largest first. Every country&#x27;s 2023 dot sits to the right of its 2000 dot. Poland rose from 73.6 to 78.6 years, the largest gain (+5.0); United States rose from 76.8 to 79.3 years, the smallest gain (+2.5).</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="133" fill="#000000" font-size="48" font-weight="700">Every one of these ten countries added years of life expectancy between</text><text x="85" y="195" fill="#000000" font-size="48" font-weight="700">2000 and 2023 — Poland gained the most, +5.0 years; United States gained</text><text x="85" y="257" fill="#000000" font-size="48" font-weight="700">the least, +2.5 years</text><text x="85" y="995" fill="#616161" font-size="31">Source: UN, World Population Prospects (2024), via Our World in Data · 2000 and 2023, extracted 8 August 2026</text><g><circle cx="98" cy="314" r="13" fill="#0072B2"></circle><text x="137" y="323" fill="#000000" font-size="29" font-weight="600">2000</text></g><g><circle cx="398.45166015625" cy="314" r="13" fill="#D55E00"></circle><text x="437.45166015625" y="323" fill="#000000" font-size="29" font-weight="600">2023</text></g><g><line x1="549.6762288411458" x2="549.6762288411458" y1="380" y2="867" stroke="#d1d1d1" stroke-width="1"></line><text x="549.6762288411458" y="915" fill="#616161" font-size="26" text-anchor="middle">74</text></g><g><line x1="769.2611083984375" x2="769.2611083984375" y1="380" y2="867" stroke="#d1d1d1" stroke-width="1"></line><text x="769.2611083984375" y="915" fill="#616161" font-size="26" text-anchor="middle">76</text></g><g><line x1="988.8459879557292" x2="988.8459879557292" y1="380" y2="867" stroke="#d1d1d1" stroke-width="1"></line><text x="988.845987