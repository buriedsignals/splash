<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Nuage connecté de 16 pays européens entre 2000 et 2024. Chaque pays est un cercle vide (2000) relié par un arc pointillé à un cercle plein (2024). L’abscisse est sa part du bas-carbone des 16 pays, l’ordonnée la part de bas-carbone dans sa propre électricité. Tous les arcs montent : les 16 pays se sont nettoyés. 5 pointent vers la gauche, dont la France, qui perd 11,8 points de poids européen tout en gagnant 4,2 points de bas-carbone chez elle."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Les 16 pays ont tous nettoyé leur électricité — 5 pèsent pourtant</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">moins dans le bas-carbone européen</text><text x="46" y="167.33180200641095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Chaque pays est dessiné deux fois : le cercle vide est 2000, le cercle plein 2024, et l’arc pointillé les relie. En abscisse, sa part du bas-carbone</text><text x="46" y="186.18114550641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">des 16 pays ; en ordonnée, la part de bas-carbone dans sa propre électricité. La France a gagné 4,2 points chez elle et perdu 11,8 points de</text><text x="46" y="205.03048900641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">poids européen — elle a produit plus, les autres ont produit plus vite.</text><text x="46" y="236.03803563141093" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">part de bas-carbone dans sa propre électricité, en %</text><g><line x1="74.31005859375" x2="910" y1="422.6321994605468" y2="422.6321994605468" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="426.5584689917968" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">0</text></g><g><line x1="74.31005859375" x2="910" y1="377.58424444076286" y2="377.58424444076286" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="381.51051397201286" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">25</text></g><g><line x1="74.31005859375" x2="910" y1="332.53628942097885" y2="332.53628942097885" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="336.46255895222885" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">50</text></g><g><line x1="74.31005859375" x2="910" y1="287.4883344011949" y2="287.4883344011949" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="291.4146039324449" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">75</text></g><g><line x1="74.31005859375" x2="910" y1="242.44037938141093" y2="242.44037938141093" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="246.36664891266093" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">100</text></g><path d="M 143.9 291.4 Q 147.4 279.0 142.2 267.3" fill="none" stroke="#7da0bc" stroke-width="0.6" stroke-dasharray="3 3" stroke-linecap="round"></path><path d="M