<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Nuage connecté de 16 pays européens entre 2000 et 2024. Chaque pays est un cercle vide (2000) relié par un arc pointillé à un cercle plein (2024). L’abscisse est sa part du bas-carbone des 16 pays, l’ordonnée la part de bas-carbone dans sa propre électricité. Tous les arcs montent : les 16 pays se sont nettoyés. 5 pointent vers la gauche, dont la France, qui perd 11,8 points de poids européen tout en gagnant 4,2 points de bas-carbone chez elle."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Les 16 pays ont tous nettoyé leur électricité — 5 pèsent</text><text x="46" y="123.99" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">pourtant moins dans le bas-carbone européen</text><text x="46" y="167.33" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Chaque pays est dessiné deux fois : le cercle vide est 2000, le cercle plein 2024, et l’arc pointillé les relie. En abscisse,</text><text x="46" y="186.18" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">sa part du bas-carbone des 16 pays ; en ordonnée, la part de bas-carbone dans sa propre électricité. La France a gagné</text><text x="46" y="205.03" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">4,2 points chez elle et perdu 11,8 points de poids européen — elle a produit plus, les autres ont produit plus vite.</text><text x="46" y="235.88797119140625" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">part de bas-carbone dans sa propre électricité, en %</text><g><line x1="74.5020010471344" x2="910" y1="422.75700439453124" y2="422.75700439453124" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.5020010471344" y="426.65100158691405" text-anchor="end" font-family="Avenir Next" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">0</text></g><g><line x1="74.5020010471344" x2="910" y1="377.6397445678711" y2="377.6397445678711" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.5020010471344" y="381.5337417602539" text-anchor="end" font-family="Avenir Next" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">25</text></g><g><line x1="74.5020010471344" x2="910" y1="332.5224847412109" y2="332.5224847412109" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.5020010471344" y="336.41648193359373" text-anchor="end" font-family="Avenir Next" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">50</text></g><g><line x1="74.5020010471344" x2="910" y1="287.4052249145508" y2="287.4052249145508" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.5020010471344" y="291.2992221069336" text-anchor="end" font-family="Avenir Next" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">75</text></g><g><line x1="74.5020010471344" x2="910" y1="242.28796508789063" y2="242.28796508789063" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.5020010471344" y="246.18196228027344" text-anchor="end" font-family="Avenir Next" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">100</text></g><path d="M 144.1 291.3 Q 147.6 278.9 142.4 267.1" fill="none" stroke="#7da0bc" stroke-width="0.6" stroke-dasharray="3 3" stroke-linecap="round"></path><path d="M 153.3 315.5 Q 148