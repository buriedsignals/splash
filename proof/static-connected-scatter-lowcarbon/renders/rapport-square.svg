<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Nuage connecté de 16 pays européens entre 2000 et 2024. Chaque pays est un cercle vide (2000) relié par un arc pointillé à un cercle plein (2024). L’abscisse est sa part du bas-carbone des 16 pays, l’ordonnée la part de bas-carbone dans sa propre électricité. Tous les arcs montent : les 16 pays se sont nettoyés. 5 pointent vers la gauche, dont la France, qui perd 11,8 points de poids européen tout en gagnant 4,2 points de bas-carbone chez elle."><rect x="0" y="0" width="540" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Les 16 pays ont tous nettoyé leur</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">électricité — 5 pèsent pourtant</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">moins dans le bas-carbone</text><text x="46" y="189.87381259746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">européen</text><text x="46" y="233.21418880641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Le cercle vide est 2000, le plein 2024. En abscisse la part du bas-carbone</text><text x="46" y="252.06353230641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">européen, en ordonnée la part de bas-carbone dans sa propre électricité.</text><text x="46" y="270.91287580641097" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">La France : 4,2 points chez elle, -11,8 de poids européen.</text><text x="46" y="301.92042243141094" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">part de bas-carbone dans sa propre électricité, en %</text><g><line x1="74.31005859375" x2="490" y1="432.03632711250003" y2="432.03632711250003" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="435.96259664375003" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">0</text></g><g><line x1="74.31005859375" x2="490" y1="401.1079368797278" y2="401.1079368797278" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="405.0342064109778" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">25</text></g><g><line x1="74.31005859375" x2="490" y1="370.1795466469555" y2="370.1795466469555" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="374.1058161782055" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">50</text></g><g><line x1="74.31005859375" x2="490" y1="339.2511564141832" y2="339.2511564141832" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="343.1774259454332" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">75</text></g><g><line x1="74.31005859375" x2="490" y1="308.32276618141094" y2="308.32276618141094" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="312.24903571266094" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">100</text></g><