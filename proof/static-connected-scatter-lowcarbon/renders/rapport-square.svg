<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Nuage connecté de 16 pays européens entre 2000 et 2024. Chaque pays est un cercle vide (2000) relié par un arc pointillé à un cercle plein (2024). L’abscisse est sa part du bas-carbone des 16 pays, l’ordonnée la part de bas-carbone dans sa propre électricité. Tous les arcs montent : les 16 pays se sont nettoyés. 5 pointent vers la gauche, dont la France, qui perd 11,8 points de poids européen tout en gagnant 4,2 points de bas-carbone chez elle."><rect x="0" y="0" width="540" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Tous plus propres chez eux, 5 plus</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">légers en Europe</text><text x="46" y="167.33180200641095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Le cercle vide est 2000, le plein 2024. En abscisse la part du bas-carbone</text><text x="46" y="186.18114550641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">européen, en ordonnée la part de bas-carbone dans sa propre électricité.</text><text x="46" y="205.03048900641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">La France : 4,2 points chez elle, -11,8 de poids européen.</text><text x="46" y="236.03803563141093" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">part de bas-carbone dan