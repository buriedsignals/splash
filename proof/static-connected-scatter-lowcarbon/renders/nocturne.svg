<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Nuage connecté de 16 pays européens entre 2000 et 2024. Chaque pays est un cercle vide (2000) relié par un arc pointillé à un cercle plein (2024). L’abscisse est sa part du bas-carbone des 16 pays, l’ordonnée la part de bas-carbone dans sa propre électricité. Tous les arcs montent : les 16 pays se sont nettoyés. 5 pointent vers la gauche, dont la France, qui perd 11,8 points de poids européen tout en gagnant 4,2 points de bas-carbone chez elle."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Futura" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.05" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LES 16 PAYS ONT TOUS NETTOYÉ LEUR</text><text x="56" y="145.09" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉLECTRICITÉ — 5 PÈSENT POURTANT MOINS</text><text x="56" y="184.13" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DANS LE BAS-CARBONE EUROPÉEN</text><text x="56" y="233.17000000000002" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Chaque pays est dessiné deux fois : le cercle vide est 2000, le cercle plein 2024, et l’arc pointillé les relie. En abscisse, sa part du bas-carbone des 16</text><text x="56" y="251.29500000000002" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">pays ; en ordonnée, la part de bas-carbone dans sa propre électricité. La France a gagné 4,2 points chez elle et perdu 11,8 points de poids européen</text><text x="56" y="269.42" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">— elle a produit plus, les autres ont produit plus vite.</text><text x="56" y="300.54890625" font-family="Futura" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">part de bas-carbone dans sa propre électricité, en %</text><g><line x1="84.890234375" x2="900" y1="442.11328125" y2="442.11328125" stroke="#292857" stroke-width="0.48"></line><text x="78.890234375" y="445.8828125" text-anchor="end" font-family="Futura" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">0</text></g><g><line x1="84.890234375" x2="900" y1="408.3716015625" y2="408.3716015625" stroke="#292857" stroke-width="0.48"></line><text x="78.890234375" y="412.1411328125" text-anchor="end" font-family="Futura" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">25</text></g><g><line x1="84.890234375" x2="900" y1="374.62992187500004" y2="374.62992187500004" stroke="#292857" stroke-width="0.48"></line><text x="78.890234375" y="378.39945312500004" text-anchor="end" font-family="Futura" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">50</text></g><g><line x1="84.890234375" x2="900" y1="340.8882421875" y2="340.8882421875" stroke="#292857" stroke-width="0.48"></line><text x="78.890234375" y="344.6577734375" text-anchor="end" font-family="Futura" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">75</text></g><g><line x1="84.890234375" x2="900" y1="307.1465625" y2="307.1465625" stroke="#292857" stroke-width="0.48"></line><text x="78.890234375" y="310.91609375" text-anchor="end" font-family="Futura" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">100</text></g><path d="M 152.8 343.8 Q 155.2 334.5 151.1 325.7" fill="none" stroke="#35898c" stroke-width="0.48" stroke-dasharray="3 3" stroke-linecap="round"></path><path d="M 161