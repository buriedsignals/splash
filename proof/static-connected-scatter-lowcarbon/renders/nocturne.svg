<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Nuage connecté de 16 pays européens entre 2000 et 2024. Chaque pays est un cercle vide (2000) relié par un arc pointillé à un cercle plein (2024). L’abscisse est sa part du bas-carbone des 16 pays, l’ordonnée la part de bas-carbone dans sa propre électricité. Tous les arcs montent : les 16 pays se sont nettoyés. 5 pointent vers la gauche, dont la France, qui perd 11,8 points de poids européen tout en gagnant 4,2 points de bas-carbone chez elle."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.05" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LES 16 PAYS ONT TOUS NETTOYÉ LEUR</text><text x="56" y="145.09" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉLECTRICITÉ — 5 PÈSENT POURTANT MOINS</text><text x="56" y="184.13" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DANS LE BAS-CARBONE EUROPÉEN</text><text x="56" y="233.17000000000002" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Le cercle vide est 2000, le plein 2024. En abscisse la part du bas-carbone européen, en ordonnée la part de bas-carbone dans sa propre</text><text x="56" y="251.29500000000002" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">électricité. La France : 4,2 points chez elle, -11,8 de poids européen.</text><text x="56" y="281.62" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">part de bas-carbone dans sa