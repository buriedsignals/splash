<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Nuage connecté de 16 pays européens entre 2000 et 2024. Chaque pays est un cercle vide (2000) relié par un arc pointillé à un cercle plein (2024). L’abscisse est sa part du bas-carbone des 16 pays, l’ordonnée la part de bas-carbone dans sa propre électricité. Tous les arcs montent : les 16 pays se sont nettoyés. 5 pointent vers la gauche, dont la France, qui perd 11,8 points de poids européen tout en gagnant 4,2 points de bas-carbone chez elle."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Les 16 pays ont tous nettoyé leur électricité — 5 pèsent</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">pourtant moins dans le bas-carbone européen</text><text x="52" y="184.6028870835547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Le cercle vide est 2000, le plein 2024. En abscisse la part du bas-carbone européen, en ordonnée la part de bas-carbone dans sa propre</text><text x="52" y="203.4536945054297" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">électricité. La France : 4,2 points chez elle, -11,8 de poids européen.</text><text x="52" y="240.22899533550782" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">part de bas-carbone dans sa propre électricité, en %</text><g><line x1="80.14765625" x2="904" y1="444.88391390625" y2="444.88391390625" stro