<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Nuage connecté de 16 pays européens entre 2000 et 2024. Chaque pays est un cercle vide (2000) relié par un arc pointillé à un cercle plein (2024). L’abscisse est sa part du bas-carbone des 16 pays, l’ordonnée la part de bas-carbone dans sa propre électricité. Tous les arcs montent : les 16 pays se sont nettoyés. 5 pointent vers la gauche, dont la France, qui perd 11,8 points de poids européen tout en gagnant 4,2 points de bas-carbone chez elle."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Les 16 pays ont tous nettoyé leur</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">électricité — 5 pèsent pourtant</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">moins dans le bas-carbone</text><text x="46" y="189.87381259746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">européen</text><text x="46" y="233.21418880641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Chaque pays est dessiné deux fois : le cercle vide est 2000, le cercle plein</text><text x="46" y="252.06353230641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">2024, et l’arc pointillé les relie. En abscisse, sa part du bas-carbone des</text><text x="46" y="270.91287580641097" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">16 pays ; en ordonnée, la part de bas-carbone dans sa propre électricité.</text><text x="46" y="289.76221930641094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">La France a gagné 4,2 points chez elle et perdu 11,8 points de poids</text><text x="46" y="308.6115628064109" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">européen — elle a produit plus, les autres ont produit plus vite.</text><text x="46" y="339.61910943141095" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">part de bas-carbone dans sa propre électricité, en %</text><g><line x1="74.31005859375" x2="490" y1="809.7833833042968" y2="809.7833833042968" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="813.7096528355468" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">0</text></g><g><line x1="74.31005859375" x2="490" y1="693.8429007735753" y2="693.8429007735753" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="697.7691703048253" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">25</text></g><g><line x1="74.31005859375" x2="490" y1="577.9024182428539" y2="577.9024182428539" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="581.8286877741039" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">50</text></g><g><line x1="74.31005859375" x2="490" y1="461.96193571213246" y2="461.96193571213246" stroke="#e6e6e6" stroke-width="0.6"></line><text x="68.31005859375" y="465.88820524338246" t