<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Diagramme de Gantt : la présence de 16 pays dans les 10 plus gros émetteurs mondiaux de CO2 entre 1990 et 2024. 6 barres traversent tout le graphique — États-Unis, Russie, Chine, Japon, Allemagne, Inde — les autres commencent ou s’arrêtent en chemin, et 2 sont coupées en deux."><rect x="0" y="0" width="540" height="540" fill="#FFFCEE"></rect><text x="36" y="46" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="36" y="84.00024462890624" font-family="Merriweather" font-size="29" font-weight="700" font-style="normal" letter-spacing="-0.19333333333333336" fill="#000000">Six pays n’ont jamais quitté le</text><text x="36" y="119.38152642890626" font-family="Merriweather" font-size="29" font-weight="700" font-style="normal" letter-spacing="-0.19333333333333336" fill="#000000">top 10 des émetteurs depuis 1990</text><text x="36" y="162.5632723400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Présence dans les 10 plus gros émetteurs annuels de CO2, 1990–2024 : 16</text><text x="36" y="181.4140797619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">pays au moins une fois, 6 chaque année.</text><text x="36" y="485.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Global Carbon Budget (2025), via Our World in Data · combustibles</text><text x="36" y="504" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">fossiles et industrie uniquement</text><g><rect x="235.29348865151405" y="212.286542349776" width="268.70651134848595" height="9.532833709935254" fill="#ebe8db"></rect><rect x="235.29348865151405" y="212.