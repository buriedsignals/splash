<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Diagramme de Gantt : la présence de 16 pays dans les 10 plus gros émetteurs mondiaux de CO2 entre 1990 et 2024. 6 barres traversent tout le graphique — États-Unis, Russie, Chine, Japon, Allemagne, Inde — les autres commencent ou s’arrêtent en chemin, et 2 sont coupées en deux."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Six pays n’ont jamais quitté le top 10 des émetteurs depuis 1990</text><text x="46" y="131.79128413776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Présence dans les 10 plus gros émetteurs annuels de CO2 du monde, année par année, de 1990 à 2024. 16 pays y ont figuré au moins une fois</text><text x="46" y="150.64062763776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">; 6 chaque année, 10 sont entrés, sortis, ou les deux.</text><text x="46" y="431.4517955195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE BARRE EST UNE PRÉSENCE CONTINUE, POSÉE SUR L’AXE DES DATES — SA POSITION DIT QUAND, SA LONGUEUR COMBIEN DE</text><text x="46" y="450.30113901953126" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">TEMPS, ET LES DEUX ANNÉES SONT ÉCRITES DANS L’ÉTIQUETTE. UNE BARRE QUI TOUCHE LE BORD DROIT EST TOUJOURS EN COURS ; 2 RANGS</text><text x="46" y="469.1504825195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">SONT INTERROMPUS, ET LE TROU EST RÉEL.</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Global Carbon Budget (2025), via Our World in Data · combustibles fossiles et industrie uniquement</text><g><rect x="244.6830078125" y="183.16677814789745" width="669.3169921875" height="8.736848596605125" fill="#ebebeb"></rect><rect x="244.6830078125" y="183.16677814789745" width="669.3169921875" height="8.736848596605125" fill="#1F5C8B"></rect><text x="234.6830078125" y="189.9033665087" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">ÉTATS-UNIS  1990–</text></g><g><rect x="244.6830078125" y="197.25846943274442" width="669.3169921875" height="8.736848596605125" fill="#ebebeb"></rect><rect x="244.6830078125" y="197.25846943274442" width="669.3169921875" height="8.736848596605125" fill="#1F5C8B"></rect><text x="234.6830078125" y="203.99505779354698" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">RUSSIE  1990–</text></g><g><rect x="244.6830078125" y="211.3501607175914" width="669.3169921875" height="8.736848596605125" fill="#ebebeb"></rect><rect x="244.6830078125" y="211.3501607175914" width="669.3169921875" height="8.736848596605125" fill="#1F5C8B"></rect><text x="234.6830078125" y="218.08674907839395" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">CHINE  1990–</text></g><g><rect x="244.6830078125" y="225.44185200243837" width="669.3169921875" height="8.736848596605125" fill="#ebebeb"></rect><rect x="244.6830078125" y="225.44185200243837" width="669.3169921875" height="8.736848596605125" fill="#1F5C8B"></rect><text x="234.6830078125" y="232.17844036324092" text-anchor="end" font-family="Open 