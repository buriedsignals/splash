<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Diagramme de Gantt : la présence de 16 pays dans les 10 plus gros émetteurs mondiaux de CO2 entre 1990 et 2024. 6 barres traversent tout le graphique — États-Unis, Russie, Chine, Japon, Allemagne, Inde — les autres commencent ou s’arrêtent en chemin, et 2 sont coupées en deux."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="36" y="45.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="36" y="86.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SIX PAYS N’ONT JAMAIS</text><text x="36" y="125.08908955" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">QUITTÉ LE TOP 10 DES</text><text x="36" y="164.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉMETTEURS DEPUIS</text><text x="36" y="203.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">1990</text><text x="36" y="249.70715501074218" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Présence dans les 10 plus gros émetteurs annuels de CO2 du monde, année par</text><text x="36" y="267.8329313779297" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">année, de 1990 à 2024. 16 pays y ont figuré au moins une fois ; 6 chaque année,</text><text x="36" y="285.9587077451172" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">10 sont entrés, sortis, ou les deux.</text><text x="36" y="791.1190732806874" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE BARRE EST UNE PRÉSENCE CONTINUE, POSÉE</text><text x="36" y="809.244849647875" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SUR L’AXE DES DATES — SA POSITION DIT QUAND, SA LONGUEUR</text><text x="36" y="827.3706260150624" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">COMBIEN DE TEMPS, ET LES DEUX ANNÉES SONT ÉCRITES DANS</text><text x="36" y="845.4964023822499" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">L’ÉTIQUETTE. UNE BARRE QUI TOUCHE LE BORD DROIT EST</text><text x="36" y="863.6221787494374" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">TOUJOURS EN COURS ; 2 RANGS SONT INTERROMPUS, ET LE TROU</text><text x="36" y="881.7479551166249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">EST RÉEL.</text><text x="36" y="905.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Global Carbon Budget (2025), via Our World in Data · combustibles</text><text x="36" y="924" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">fossiles et industrie uniquement</text><g><rect x="257.6599865615368" y="319.7734819696174" width="246.3400134384632" height="11" fill="#242353"></rect><rect x="257.6599865615368" y="319.7734819696174" width="246.3400134384632" height="11" fill="#4FE0C0"></rect><text x="247.6599865615368" y="327.7734819696174" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">ÉTATS-UNIS  1990–</text></g><g><rect x="257.6