<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Diagramme de Gantt : la présence de 16 pays dans les 10 plus gros émetteurs mondiaux de CO2 entre 1990 et 2024. 6 barres traversent tout le graphique — États-Unis, Russie, Chine, Japon, Allemagne, Inde — les autres commencent ou s’arrêtent en chemin, et 2 sont coupées en deux."><rect x="0" y="0" width="540" height="540" fill="#FFFFFF"></rect><text x="36" y="45.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="36" y="81.05023239746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Six pays n’ont jamais quitté le top 10</text><text x="36" y="113.99142579746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">des émetteurs depuis 1990</text><text x="36" y="154.73247753776096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Présence dans les 10 plus gros émetteurs annuels de CO2 du monde, année</text><text x="36" y="173.58182103776096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">par année, de 1990 à 2024. 16 pays y ont figuré au moins une fois ; 6 chaque</text><text x="36" y="192.43116453776094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">année, 10 sont entrés, sortis, ou les deux.</text><text x="36" y="422.6024520195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : POSITION = QUAND, LONGUEUR = COMBIEN DE TEMPS ; LES DEUX</text><text x="36" y="441.4517955195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">ANNÉES SONT DANS L’ÉTIQUETTE, UNE BARRE AU BORD DROIT EST EN</text><text x="36" y="460.3011390195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">COURS, ET UN TROU DANS UN RANG EST RÉEL.</text><text x="36" y="485.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Global Carbon Budget (2025), via Our World in Data · combustibles</text><text x="36" y="504" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">fossiles et industrie uniquement</text><g><rect x="234.6830078125" y="220.3784193366558" width="269.3169921875" height="6.8466762204068825" fill="#ebebeb"></rect><rect x="234.6830078125" y="220.3784193366558" width="269.3169921875" height="6.8466762204068825" fill="#1F5C8B"></rect><text x="224.6830078125" y="226.16992150935926" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">ÉTATS-UNIS  1990–</text></g><g><rect x="234.6830078125" y="231.4214454986024" width="269.3169921875" height="6.8466762204068825" fill="#ebebeb"></rect><rect x="234.6830078125" y="231.4214454986024" width="269.3169921875" height="6.8466762204068825" fill="#1F5C8B"></rect><text x="224.6830078125" y="237.21294767130584" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">RUSSIE  1990–</text></g><g><rect x="234.6830078125" y="242.46447166054898" width="269.3169921875" height="6.8466762204068825" fill="#ebebeb"></rect><rect x="234.6830078125" y="242.46447166054898" width="269.3169921875" height="6.8466762204068825" fill="#1F5C8B"></rect><text x="224.6830078125" y="248.25597383325243" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a8