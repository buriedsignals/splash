<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Diagramme de Gantt : la présence de 16 pays dans les 10 plus gros émetteurs mondiaux de CO2 entre 1990 et 2024. 6 barres traversent tout le graphique — États-Unis, Russie, Chine, Japon, Allemagne, Inde — les autres commencent ou s’arrêtent en chemin, et 2 sont coupées en deux."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="36" y="46" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="36" y="85.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Six pays n’ont jamais quitté le</text><text x="36" y="121.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">top 10 des émetteurs depuis</text><text x="36" y="158.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">1990</text><text x="36" y="202.6046867400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Présence dans les 10 plus gros émetteurs annuels de CO2 du monde, année</text><text x="36" y="221.4554941619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">par année, de 1990 à 2024. 16 pays y ont figuré au moins une fois ; 6 chaque</text><text x="36" y="240.30630158382812" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">année, 10 sont entrés, sortis, ou les deux.</text><text x="36" y="821.9451832447451" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque barre est une présence continue, posée sur l’axe des dates</text><text x="36" y="840.79599066662" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">— sa position dit QUAND, sa longueur COMBIEN DE TEMPS, et les deux</text><text x="36" y="859.6467980884951" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">années sont écrites dans l’étiquette. Une barre qui touche le bord droit est</text><text x="36" y="878.49760551037" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">toujours en cours ; 2 rangs sont interrompus, et le trou est réel.</text><text x="36" y="905.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Global Carbon Budget (2025), via Our World in Data · combustibles</text><text x="36" y="924" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">fossiles et industrie uniquement</text><g><rect x="235.29348865151405" y="276.9677236916277" width="268.70651134848595" height="15.292510986328125" fill="#ebe8db"></rect><rect x="235.29348865151405" y="276.9677236916277" width="268.70651134848595" height="15.292510986328125" fill="#1757B6"></rect><text x="225.29348865151405" y="287.75022491233085" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">États-Unis  1990–</text></g><g><rect x="235.29348865151405" y="309.68085824980517" width="268.70651134848595" height="15.292510986328125" fill="#ebe8db"></rect><rect x="235.29348865151405" y="309.68085824980517" width="268.70651134848595" height="15.292510986328125" fill="#1757B6"></rect><text x="225.29348865151405" y="320.4633594705083" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Russie  1990–</text></g><g><rect x="235.29348865151405" y="342.3939928079826" width="268.70651134848595" height="15.292510986328125" fill="#ebe8db"></rect><rect x="235.29348865151405" y="342.3939928079826" width="268.70651134848595" height="15.292510986328125" fill="#1757B6"></rect><text x="225.29348865151405" y="353.17649402868574" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Chine  1990–</text></g><g><rect x="235.29348865151405" y="375.10712736616" width="268.70651134848595" height="15.292510986328125" fill="#ebe8db"></rect><rect x="235.29348865151405" y="375.10712736616" width="268.70651134848595" height="15.292510986328125" fill="#1757B6"></rect><text x="225.29348865151405" y="385.8896285868631" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Japon  1990–</text></g><g><rect x="235.29348865151405" y="407.82026192433744" width="268.70651134848595" height="15.292510986328125" fill="#ebe8db"></rect><rect x="235.29348865151405" y="407.82026192433744" width="268.70651134848595" height="15.292510986328125" fill="#1757B6"></rect><text x="225.29348865151405" y="418.60276314504057" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Allemagne  1990–</text></g><g><rect x="235.29348865151405" y="440.5333964825149" width="268.70651134848595" height="15.292510986328125" fill="#ebe8db"></rect><rect x="235.29348865151405" y="440.5333964825149" width="268.70651134848595" height="15.292510986328125" fill="#1757B6"></rect><text x="225.29348865151405" y="451.315897703218" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Inde  1990–</text></g><g><rect x="235.29348865151405" y="473.2465310406923" width="268.70651134848595" height="15.29251098