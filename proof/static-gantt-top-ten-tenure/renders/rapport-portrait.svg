<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Diagramme de Gantt : la présence de 16 pays dans les 10 plus gros émetteurs mondiaux de CO2 entre 1990 et 2024. 6 barres traversent tout le graphique — États-Unis, Russie, Chine, Japon, Allemagne, Inde — les autres commencent ou s’arrêtent en chemin, et 2 sont coupées en deux."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="36" y="45.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="36" y="81.05023239746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Six pays n’ont jamais quitté le top 10</text><text x="36" y="113.99142579746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">des émetteurs depuis 1990</text><text x="36" y="154.73247753776096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Présence dans les 10 plus gros émetteurs annuels de CO2 du monde, année</text><text x="36" y="173.58182103776096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">par année, de 1990 à 2024. 16 pays y ont figuré au moins une fois ; 6 chaque</text><text x="36" y="192.43116453776094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">année, 10 sont entrés, sortis, ou les deux.</text><text x="36" y="804.9037650195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE BARRE EST UNE PRÉSENCE CONTINUE, POSÉE SUR L’AXE</text><text x="36" y="823.7531085195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">DES DATES — SA POSITION DIT QUAND, SA LONGUEUR COMBIEN DE TEMPS,</text><text x="36" y="842.6024520195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">ET LES DEUX ANNÉES SONT ÉCRITES DANS L’ÉTIQUETTE. UNE BARRE QUI</text><text x="36" y="861.4517955195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">TOUCHE LE BORD DROIT EST TOUJOURS EN COURS ; 2 RANGS SONT</text><text x="36" y="880.3011390195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">INTERROMPUS, ET LE TROU EST RÉEL.</text><text x="36" y="905.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Global Carbon Budget (2025), via Our World in Data · combustibles</text><text x="36" y="924" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">fossiles et industrie uniquement</text><g><rect x="234.6830078125" y="229.97816566560925" width="269.3169921875" height="11.541015625" fill="#ebebeb"></rect><rect x="234.6830078125" y="229.97816566560925" width="269.3169921875" height="11.541015625" fill="#1F5C8B"></rect><text x="224.6830078125" y="238.11683754060925" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">ÉTATS-UNIS  1990–</text></g><g><rect x="234.6830078125" y="264.9150238900558" width="269.3169921875" height="11.541015625" fill="#ebebeb"></rect><rect x="234.6830078125" y="264.9150238900558" width="269.3169921875" height="11.541015625" fill="#1F5C8B"></rect><text x="224.6830078125" y="273.0536957650558" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">RUSSIE  1990–</text></g><g><rect x="234.68