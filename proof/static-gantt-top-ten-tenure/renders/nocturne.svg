<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Diagramme de Gantt : la présence de 16 pays dans les 10 plus gros émetteurs mondiaux de CO2 entre 1990 et 2024. 6 barres traversent tout le graphique — États-Unis, Russie, Chine, Japon, Allemagne, Inde — les autres commencent ou s’arrêtent en chemin, et 2 sont coupées en deux."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="56" y="106.05" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SIX PAYS N’ONT JAMAIS QUITTÉ LE TOP 10</text><text x="56" y="145.09" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DES ÉMETTEURS DEPUIS 1990</text><text x="56" y="191.63" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Présence dans les 10 plus gros émetteurs annuels de CO2 du monde, année par année, de 1990 à 2024. 16 pays y ont figuré au moins une fois ; 6</text><text x="56" y="209.755" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">chaque année, 10 sont entrés, sortis, ou les deux.</text><text x="56" y="441.75" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : POSITION = QUAND, LONGUEUR = COMBIEN DE TEMPS ; LES DEUX ANNÉES SONT DANS L’ÉTIQUETTE, UNE BARRE</text><text x="56" y="459.875" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">AU BORD DROIT EST EN COURS, ET UN TROU DANS UN RANG EST RÉEL.</text><text x="56" y="484" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="norma