<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Diagramme de Gantt : la présence de 16 pays dans les 10 plus gros émetteurs mondiaux de CO2 entre 1990 et 2024. 6 barres traversent tout le graphique — États-Unis, Russie, Chine, Japon, Allemagne, Inde — les autres commencent ou s’arrêtent en chemin, et 2 sont coupées en deux."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SIX PAYS N’ONT JAMAIS QUITTÉ LE TOP 10</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DES ÉMETTEURS DEPUIS 1990</text><text x="56" y="191.6287422107422" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Présence dans les 10 plus gros émetteurs annuels de CO2 du monde, année par année, de 1990 à 2024. 16 pays y ont figuré au moins une fois ; 6</text><text x="56" y="209.75451857792967" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">chaque année, 10 sont entrés, sortis, ou les deux.</text><text x="56" y="441.747955116625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : POSITION = QUAND, LONGUEUR = COMBIEN DE TEMPS ; LES DEUX ANNÉES SONT DANS L’ÉTIQUETTE, UNE BARRE</text><text x="56" y="459.8737314838125" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">AU BORD DROIT EST EN COURS, ET UN TROU DANS UN RANG EST RÉEL.</text><text x="56" y="484" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Global Carbon Budget (2025), via Our World in Data · combustibles fossiles et industrie uniquement</text><g><rect x="277.6599865615368" y="241.0044278037263" width="626.3400134384632" height="6.931482308040147" fill="#242353"></rect><rect x="277.6599865615368" y="241.0044278037263" width="626.3400134384632" height="6.931482308040147" fill="#4FE0C0"></rect><text x="267.6599865615368" y="246.97016895774635" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">ÉTATS-UNIS  1990–</text></g><g><rect x="277.6599865615368" y="252.1842379779846" width="626.3400134384632" height="6.931482308040147" fill="#242353"></rect><rect x="277.6599865615368" y="252.1842379779846" width="626.3400134384632" height="6.931482308040147" fill="#4FE0C0"></rect><text x="267.6599865615368" y="258.14997913200466" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">RUSSIE  1990–</text></g><g><rect x="277.6599865615368" y="263.36404815224284" width="626.3400134384632" height="6.931482308040147" fill="#242353"></rect><rect x="277.6599865615368" y="263.36404815224284" width="626.3400134384632" height="6.931482308040147" fill="#4FE0C0"></rect><text x="267.6599865615368" y="269.3297893062629" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">CHINE  1990–</text></g><g><rect x="277.6599865615368" y="274.54385832650115" width="626.3400134384632" height="6.931482308040147" fill="#242353"></rect><rect x="277.6599865615368" y="274.54385832650115" width="626.3400134384632" height="6.931482308040147" fill="#4FE0C0"></rect><text x="267.6599865615368" y="280.5095994805212" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" lett