<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Colonnes classant les dix pays qui ont le plus émis de CO2 en 2024. La Chine est très au-dessus avec 12,3 milliards de tonnes, 2,5 fois les 4,9 de les États-Unis, et davantage que États-Unis, Inde, Russie, Japon, Indonésie réunis (11,7). Les colonnes suivantes descendent jusqu&#x27;à 0,57 pour Allemagne."><rect x="0" y="0" width="540" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La Chine a émis plus de CO2 en</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">2024 que les cinq pays suivants</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">réunis</text><text x="46" y="197.67367093776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">CO2 territorial annuel, combustibles fossiles et industrie, en milliards de</text><text x="46" y="216.52301443776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">tonnes. Ces dix pays représentent 69 % du total mondial ; la Chine émet</text><text x="46" y="235.3723579377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">2,5 fois plus que les États-Unis, et le dixième, l’Allemagne, 0,57. Les</text><text x="46" y="254.2217014377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">émissions contenues dans les biens importés sont comptées là où les</text><text x="46" y="273.0710449377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">biens sont produits.</text><text x="46" y="475.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Global Carbon Budget 2025, via Our World in Data · données</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">2024, extraites le 9 août 2026</text><rect x="48.73170731707313" y="315.42129175807344" width="32.78048780487805" height="104.93187983105787" fill="#1F5C8B"></rect><rect x="94.26016260162598" y="378.4785698187007" width="32.78048780487805" height="41.874601770430615" fill="#616161"></rect><rect x="139.78861788617883" y="393.08515537009686" width="32.78048780487805" height="27.26801621903445" fill="#616161"></rect><rect x="185.31707317073167" y="405.14988329428235" width="32.78048780487805" height="15.20328829484896" fill="#616161"></rect><rect x="230.84552845528452" y="412.14011600658046" width="32.78048780487805" height="8.21305558255085" fill="#616161"></rect><rect x="276.3739837398374" y="413.4179013622814" width="32.78048780487805" height="6.935270226849923" fill="#616161"></rect><rect x="321.9024390243902" y="413.5851651270507" width="32.78048780487805" height="6.768006462080621" fill="#616161"></rect><rect x="367.4308943089431" y="414.4432805822892" width="32.78048780487805" height="5.909891006842088" fill="#616161"></rect><rect x="412.9593495934959" y="415.36933497717126" width="32.78048780487805" height="4.983836611960044" fill="#616161"></rect><rect x="458.48780487804873" y="415.4663341281121" width="32.78048780487805" height="4.886837461019184" fill="#616161"></rect><line x1="46" x2="494" y1="420.3531715891313" y2="420.3531715891313" stroke="#00