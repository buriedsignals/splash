spacing="0">4,9</text><text x="252.22979785950196" y="373.63090589660123" fill="#5f5e58" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0">3,2</text><text x="339.22166777820115" y="392.64101687362466" fill="#5f5e58" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0">1,8</text><text x="421.90323496252535" y="403.655363856918" fill="#5f5e58" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0">0,96</text><text x="510.0120482405996" y="405.66874050074557" fill="#5f5e58" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0">0,81</text><text x="595.9162716749238" y="405.9322941217374" fill="#5f5e58" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0">0,79</text><text x="682.908141593623" y="407.28440667145196" fill="#5f5e58" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0">0,69</text><text x="769.8926872935722" y="408.74356902704704" fill="#5f5e58" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0">0,58</text><text x="856.8699087747714" y="408.8964083314765" fill="#5f5e58" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0">0,57</text><text x="259.4091850337458" y="294.71873168945314" fill="#1755b2" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0">Les cinq suivants réunis : 11,7</text><text x="88.53658536585357" y="447.7" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#000000">Chine</text><text x="175.52845528455276" y="447.7" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">États-Unis</text><text x="262.520325