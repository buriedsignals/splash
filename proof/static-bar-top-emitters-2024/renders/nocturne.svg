<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Colonnes classant les dix pays qui ont le plus émis de CO2 en 2024. La Chine est très au-dessus avec 12,3 milliards de tonnes, 2,5 fois les 4,9 de les États-Unis, et davantage que États-Unis, Inde, Russie, Japon, Indonésie réunis (11,7). Les colonnes suivantes descendent jusqu&#x27;à 0,57 pour Allemagne."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Futura" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="56" y="106.05" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LA CHINE A ÉMIS PLUS DE CO2 EN 2024 QUE</text><text x="56" y="145.09" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LES CINQ PAYS SUIVANTS RÉUNIS</text><text x="56" y="191.63" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">CO2 territorial annuel, combustibles fossiles et industrie, en milliards de tonnes. Ces dix pays représentent 69 % du total mondial ; la Chine émet 2,5</text><text x="56" y="209.755" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">fois plus que les États-Unis, et le dixième, l’Allemagne, 0,57. Les émissions contenues dans les biens importés sont comptées là où les biens sont</text><text x="56" y="227.88" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">produits.</text><text x="56" y="484" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Global Carbon Budget 2025, via Our World in Data · données 2024, extraites le 9 août 2026</text><rect x="61.17073170731703" 