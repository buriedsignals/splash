<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Colonnes classant les dix pays qui ont le plus émis de CO2 en 2024. La Chine est très au-dessus avec 12,3 milliards de tonnes, 2,5 fois les 4,9 de les États-Unis, et davantage que États-Unis, Inde, Russie, Japon, Indonésie réunis (11,7). Les colonnes suivantes descendent jusqu&#x27;à 0,57 pour Allemagne."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LA CHINE A ÉMIS</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PLUS DE CO2 EN 2024</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">QUE LES CINQ PAYS</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SUIVANTS RÉUNIS</text><text x="56" y="269.70715501074216" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">CO2 territorial annuel, combustibles fossiles et industrie, en milliards de</text><text x="56" y="287.83293137792964" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">tonnes. Ces dix pays représentent 69 % du total mondial ; la Chine émet</text><text x="56" y="305.9587077451172" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">2,5 fois plus que les États-Unis, et le dixième, l’Allemagne, 0,57. Les</text><text x="56" y="324.08448411230466" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">émissions contenues dans les biens importés sont comptées là où les</text><text x="56" y="342.21026047949215" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">biens sont produits.</text><text x="56" y="885.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Global Carbon Budget 2025, via Our World in Data · données</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">2024, extraites le 9 août 2026</text><rect x="183.27010170188368" y="385.9798160507837" width="241.15973107891023" height="31.980066870146704" fill="#4FE0C0"></rect><rect x="183.27010170188368" y="431.665625865279" width="96.23831878598014" height="31.980066870146704" fill="#a5a4b8"></rect><rect x="183.27010170188368" y="477.3514356797743" width="62.66872821705957" height="31.980066870146704" fill="#a5a4b8"></rect><rect x="183.27010170188368" y="523.0372454942697" width="34.940962866613404" height="31.980066870146704" fill="#a5a4b8"></rect><rect x="183.27010170188368" y="568.7230553087649" width="18.87565798700075" height="31.980066870146704" fill="#a5a4b8"></rect><rect x="183.27010170188368" y="614.4088651232602" width="15.938987327392596" height="31.980066870146704" fill="#a5a4b8"></rect><rect x="183.27010170188368" y="660.0946749377555" width="15.554573319028464" height="31.980066870146704" fill="#a5a4b8"></rect><rect x="183.27010170188368" y="705.7804847522507" width="13.582409161165742" height="31.980066870146704" fill="#a5a4b8"></rect><rect x="183.27010170188368" y="751.466294566746" width="11.454104310497371" height="31.980066870146704" fill="#a5a4b8"></rect><rect x="183.27010170188368" y="797.1521043812413" width="11.