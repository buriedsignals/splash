<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Colonnes classant les dix pays qui ont le plus émis de CO2 en 2024. La Chine est très au-dessus avec 12,3 milliards de tonnes, 2,5 fois les 4,9 de les États-Unis, et davantage que États-Unis, Inde, Russie, Japon, Indonésie réunis (11,7). Les colonnes suivantes descendent jusqu&#x27;à 0,57 pour Allemagne."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La Chine a émis plus de CO2 en 2024 que les cinq pays suivants</text><text x="46" y="123.99" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">réunis</text><text x="46" y="164.73000000000002" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">CO2 territorial annuel, combustibles fossiles et industrie, en milliards de tonnes. Ces dix pays représentent 69 % du total mondial ; la Chine</text><text x="46" y="183.58" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">émet 2,5 fois plus que les États-Unis, et le dixième, l’Allemagne, 0,57. Les émissions contenues dans les biens importés sont comptées là où</text><text x="46" y="202.43" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">les biens sont produits.</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Global Carbon Budget 2025, via Our World in Data · données 2024, extraites le 9 août 2026</text><rect