<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Colonnes classant les dix pays qui ont le plus émis de CO2 en 2024. La Chine est très au-dessus avec 12,3 milliards de tonnes, 2,5 fois les 4,9 de les États-Unis, et davantage que États-Unis, Inde, Russie, Japon, Indonésie réunis (11,7). Les colonnes suivantes descendent jusqu&#x27;à 0,57 pour Allemagne."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La Chine a émis plus de CO2 en</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">2024 que les cinq pays suivants</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">réunis</text><text x="46" y="197.67367093776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">CO2 territorial annuel, combustibles fossiles et industrie, en milliards de</text><text x="46" y="216.52301443776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">tonnes. Ces dix pays représentent 69 % du total mondial ; la Chine émet</text><text x="46" y="235.3723579377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">2,5 fois plus que les États-Unis, et le dixième, l’Allemagne, 0,57. Les</text><text x="46" y="254.2217014377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacin