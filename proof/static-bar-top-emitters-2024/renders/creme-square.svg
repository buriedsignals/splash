<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Colonnes classant les sept premiers des dix pays qui ont le plus émis de CO2 en 2024. La Chine est très au-dessus avec 12,3 milliards de tonnes, 2,5 fois les 4,9 de les États-Unis, et davantage que États-Unis, Inde, Russie, Japon, Indonésie réunis (11,7). Les colonnes suivantes descendent jusqu&#x27;à 0,79 pour Iran."><rect x="0" y="0" width="540" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La Chine a émis plus de CO2</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">en 2024 que les cinq pays</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">suivants réunis</text><text x="52" y="218.6046867400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Les 7 premiers des 10 plus gros émetteurs. CO2 territorial annuel,</text><text x="52" y="237.4554941619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">combustibles fossiles et industrie, en milliards de tonnes. Ces dix pays</text><text x="52" y="256.3063015838281" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">représentent 69 % du total mondial.</text><text x="52" y="469.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Global Carbon Budg