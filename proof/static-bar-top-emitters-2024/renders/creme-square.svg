<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Colonnes classant les dix pays qui ont le plus émis de CO2 en 2024. La Chine est très au-dessus avec 12,3 milliards de tonnes, 2,5 fois les 4,9 de les États-Unis, et davantage que États-Unis, Inde, Russie, Japon, Indonésie réunis (11,7). Les colonnes suivantes descendent jusqu&#x27;à 0,57 pour Allemagne."><rect x="0" y="0" width="540" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La Chine a émis plus de CO2</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">en 2024 que les cinq pays</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">suivants réunis</text><text x="52" y="218.6046867400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">CO2 territorial annuel, combustibles fossiles et industrie, en milliards de</text><text x="52" y="237.4554941619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">tonnes. Ces dix pays représentent 69 % du total mondial ; la Chine émet</text><text x="52" y="256.3063015838281" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">2,5 fois plus que les États-Unis, et le dixième, l’Allemagne, 0,57. Les</text><text x="52" y="275.1571090057031" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">émissions contenues dans les biens importés sont comptées là où les</text><text x="52" y="294.0079164275781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">biens sont produits.</text><text x="52" y="469.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Global Carbon Budget 2025, via Our World in Data · données</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">2024, extraites le 9 août 2026</text><rect x="54.65853658536582" y="337.1700031463281" width="31.902439024390244" height="66.97721727661997" fill="#1757B6"></rect><rect x="98.96747967479672" y="377.41898201088884" width="31.902439024390244" height="26.728238412059227" fill="#61605a"></rect><rect x="143.27642276422762" y="386.7422539823859" width="31.902439024390244" height="17.40496644056219" fill="#61605a"></rect><rect x="187.58536585365852" y="394.4430776487727" width="31.902439024390244" height="9.704142774175352" fill="#61605a"></rect><rect x="231.8943089430894" y="398.9048897876529" width="31.902439024390244" height="5.242330635295161" fill="#61605a"></rect><rect x="276.2032520325203" y="399.7204904186475" width="31.902439024390244" height="4.426730004300566" fill="#61605a"></rect><rect x="320.5121951219512" y="399.8272536019003" width="31.902439024390244" height="4.319966821047785" fill="#61605a"></rect><rect x="364.8211382113821" y="400.37498214146774" width="31.902439024390244" height="3.772238281480327" fill="#61605a"></rect><rect x="409.130081300813" y="400.9660755871951" width="31.902439024390244" height="3.1811448357529457" fill="#61605a"></rect><rect x="453.4390243902439" y="401.02798940422264" width="31.902439024390244" height="3.1192310187254293" fill="#61605a"></rect><line x1="52" x2="488" y1="404.14722042294807" y2="404.14722042294807" stroke="#000000" strok