<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Colonnes classant les dix pays qui ont le plus émis de CO2 en 2024. La Chine est très au-dessus avec 12,3 milliards de tonnes, 2,5 fois les 4,9 de les États-Unis, et davantage que États-Unis, Inde, Russie, Japon, Indonésie réunis (11,7). Les colonnes suivantes descendent jusqu&#x27;à 0,57 pour Allemagne."><rect x="0" y="0" width="540" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LA CHINE A ÉMIS</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PLUS DE CO2 EN 2024</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">QUE LES CINQ PAYS</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SUIVANTS RÉUNIS</text><text x="56" y="269.70715501074216" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">CO2 territorial annuel, combustibles fossiles et industrie, en milliards de</text><text x="56" y="287.83293137792964" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">tonnes. Ces dix pays représentent 69 % du total mondial ; la Chine émet</text><text x="56" y="305.9587077451172" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">2,5 fois plus que les États-Unis, et le dixième, l’Allemagne, 0,57. Les</text>