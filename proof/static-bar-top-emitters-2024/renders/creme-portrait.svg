<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Colonnes classant les dix pays qui ont le plus émis de CO2 en 2024. La Chine est très au-dessus avec 12,3 milliards de tonnes, 2,5 fois les 4,9 de les États-Unis, et davantage que États-Unis, Inde, Russie, Japon, Indonésie réunis (11,7). Les colonnes suivantes descendent jusqu&#x27;à 0,57 pour Allemagne."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La Chine a émis plus de CO2</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">en 2024 que les cinq pays</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">suivants réunis</text><text x="52" y="218.6046867400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">CO2 territorial annuel, combustibles fossiles et industrie, en milliards de</text><text x="52" y="237.4554941619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">tonnes. Ces dix pays représentent 69 % du total mondial ; la Chine émet</text><text x="52" y="256.3063015838281" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">2,5 fois plus que les États-Unis, et le dixième, l’Allemagne, 0,57. Les</text><text x="52" y="275.1571090057031" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">émissions contenues dans les biens importés sont comptées là où les</text><text x="52" y="294.0079164275781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">biens sont produits.</text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Global Carbon Budget 2025, via Our World in Data · données</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">2024, extraites le 9 août 2026</text><rect x="157.10530356578388" y="340.1454240258186" width="265.4118946032786" height="34.71324359405643" fill="#1757B6"></rect><rect x="157.10530356578388" y="389.7357720173278" width="105.91649944270088" height="34.71324359405643" fill="#61605a"></rect><rect x="157.10530356578388" y="439.326120008837" width="68.97099202281501" height="34.71324359405643" fill="#61605a"></rect><rect x="157.10530356578388" y="488.9164680003462" width="38.45479140402668" height="34.71324359405643" fill="#61605a"></rect><rect x="157.10530356578388" y="538.5068159918553" width="20.773883458072447" height="34.71324359405643" fill="#61605a"></rect><rect x="157.10530356578388" y="588.0971639833646" width="17.541887303053414" height="34.71324359405643" fill="#61605a"></rect><rect x="157.10530356578388" y="637.6875119748737" width="17.11881480328117" height="34.71324359405643" fill="#61605a"></rect><rect x="157.10530356578388" y="687.277859966383" width="14.948320487064876" height="34.71324359405643" fill="#61605a"></rect><rect x="157.10530356578388" y="736.8682079578921" width="12.605983231246597" height="34.71324359405643" fill="#61605a"></rect><rect x="157.10530356578388" y="786.4585559494012" width="12.36063616925199" height="34.71324359405643" fill="#61605a"></rect><line x1="157.10530356578388" x2="157.10530356578388" y1="337.1700031463281" y2="824.147220422948