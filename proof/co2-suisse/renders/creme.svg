<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img"><desc>Courbe des émissions territoriales suisses de CO₂, 1950 à 2024 : une montée jusqu&#x27;à un pic en 1973, puis une baisse qui repasse sous le niveau de 1967 en 2024.</desc><rect x="0" y="0" width="900" height="560" fill="#FFFCEE"></rect><text x="52" y="62" fill="#1757B6" font-family="Avenir Next" font-size="10" font-weight="600" letter-spacing="1.9" text-anchor="start">CLIMAT · SUISSE</text><text x="52" y="112" fill="#000000" font-family="Georgia" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" text-anchor="start">En 2024, la Suisse a émis moins de CO₂ sur son</text><text x="52" y="149.5" fill="#000000" font-family="Georgia" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" text-anchor="start">territoire qu&#x27;en 1967.</text><text x="52" y="175.5" fill="#61605a" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" text-anchor="start">Émissions territoriales seulement, hors biens importés et aviation internationale.</text><line x1="52" x2="848" y1="195.5" y2="195.5" stroke="#d1cfc3" stroke-width="1"></line><text x="52" y="508" fill="#61605a" font-family="Avenir Next" font-size="12" font-weight="400" font-style="normal" text-anchor="start">Source : Global Carbon Budget 2025, via Our World in Data · données 2024</text><g><line x1="93.21599942445755" x2="734.2249899506569" y1="459" y2="459" stroke="#d1cfc3" stroke-width="1"></line><text x="81.21599942445755" y="463" fill="#61605a" font-family="Avenir Next" font-size="11" font-weight="500" letter-spacing="0.4" text-anchor="end">10</text></g><g><line x1="93.21599942445755" x2="734.2249899506569" y1="401.625" y2="401.625" stroke="#d1cfc3" stroke-width="1"></line><text x="81.21599942445755" y="405.625" fill="#61605a" font-family="Avenir Next" font-size="11" font-weight="500" letter-spacing="0.4" text-anchor="end">20</text></g><g><text x="81.215