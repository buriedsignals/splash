<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Histogram of solar electricity generation across 41 European countries in 2024, in bins of 10 TWh."><rect x="0" y="0" width="540" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ENERGY · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">8 in 10 European countries</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">generated under 10 TWh of</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">solar power in 2024</text><text x="52" y="218.6046867400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Distribution of 41 European countries&#x27; 2024 solar generation — each</text><text x="52" y="237.4554941619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">counts as one, unweighted by population or grid size. A handful of large</text><text x="52" y="256.3063015838281" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">producers sit far out to the right.</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source: Ember, via Our World in Data (2024)</text><g><line x1="90.43662109375" x2="488" y1="423.2000190907031" y2="423.2000190907031" stroke="#61605a" stroke-width="1"></line><text x="80.43662109375" y="427.05001909070313" text-anchor="end" font-fami