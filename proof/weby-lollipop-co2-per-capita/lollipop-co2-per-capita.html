<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switzerland's 2024 per-capita CO₂ emissions were the 3rd-lowest of these 15 European countries, at 3.6 tonnes — less than half of Belgium's 7.3 tonnes.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --ground: #FFFFFF;
  --accent: #0B7A75;
  --ink: #000000;
  --muted: #616161;
  --grid: #d1d1d1;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: Helvetica, Arial, sans-serif;
}

/* THE FLUID FILL — the redesign this file exists to ship. .chart-figure and everything inside
   .chart-plot take the FULL width of whatever contains them, edge to edge, no max-width cap and
   no fixed rung to swap between. Height is never independently set on the plot: aspect-ratio
   (set per-render on .chart-plot's own inline style, from the component's real geometry) grows
   the height WITH the width, so a very wide container gets a taller chart rather than a flat,
   letterboxed strip -- the failure mode capping the width would otherwise avoid at the cost of
   empty gutters, and the failure mode letting width AND height both float freely would risk
   instead. The header block and the source line USED to carry a 640px reading-measure cap; they
   no longer do. A title that stops at 640px above a chart running to 1600 reads as a broken box,
   not as a comfortable measure -- see references/web-discipline.md, "The words take the same width
   as the graphic," for the reversal and what now bounds the line length instead.

   "Fills the container" is a claim about the FRAME's own edges, never about the content inside
   it -- FRAME_PAD_PX is the fixed inner margin that keeps that distinction real: title, caveat,
   filter, every axis label, the end label and the source line all sit inside it, so nothing ever
   touches the frame's own edge at any width. box-sizing:border-box (above) is what makes width:100%
   plus this padding still equal exactly 100% of the parent -- no overflow, no second width to
   reconcile. */
.chart-figure {
  margin: 0;
  width: 100%;
  padding: 24px;
  display: flex;
  flex-direction: column;
  /* THE WINDOW FIT. A beat is one thing a reader looks at, not a document they scroll through:
     the whole figure must be visible at once. Width filling its container and height following
     from aspect-ratio was only half the rule -- at 1600x800 the measured figure came to 902px
     against an 800px window (102px of it below the fold: the end label, the x-axis and the source
     line), and at 1920x950 it came to 1051px against 950. Clamping here, rather than capping the
     width or shortening the geometry, is what keeps the fill and the fit true at the same time.
     max-height, never height: when the frame's natural height already fits (a tall window, a
     narrow one), nothing changes at all and no empty space is reserved -- which matters because
     this file is embedded inside an article as often as it is opened on its own.
     Two declarations, not one: dvh is what a mobile browser's collapsing toolbar makes correct,
     vh is what an engine without dvh still understands, and the later declaration simply wins
     where it parses. */
  max-height: 100vh;
  max-height: 100dvh;
}
/* Everything except the plot keeps its natural height: words are never squeezed to make a chart
   fit, the chart is. flex-shrink:0 is the half of that rule the browser does not default to. */
.chart-header, .chart-source { flex: 0 0 auto; }
.chart-title {
  margin: 0 0 4px;
  font-size: var(--title-size);
  font-weight: var(--title-weight);
  color: var(--ink);
}
.chart-caveat, .chart-source {
  margin: 0;
  font-size: var(--subtitle-size);
  color: var(--muted);
}
.chart-source { font-size: var(--source-size); margin-top: 10px; }



.chart-plot {
  position: relative;
  width: 100%;
  display: grid;
  grid-template-columns: var(--y-gutter) 1fr;
  grid-template-rows: 1fr var(--x-axis-h);
  /* The one shrinkable item in the figure's column -- see .chart-figure's max-height above. Its
     flex BASE size is still the canonical aspect-ratio (set per-render on this element's own
     inline style, from the real geometry), so in a window with room the shape is exactly what it
     always was, byte for byte. Only when the column overflows does 1 (flex-shrink) let this box
     give the height back, and the <svg>'s own preserveAspectRatio="none" follows it down without
     letterboxing or clipping -- the same stretch that already absorbs the gutter drift this
     genre documents. A flatter plot is a real cost, paid knowingly: a slope read at a shallower
     angle is still the same series, whereas a chart whose end label is below the fold is not a
     chart the reader has seen.
     min-height is BOTH the floor (see PLOT_FLOOR_PX) and the override of flexbox's own
     min-height:auto, which would otherwise refuse to shrink this box below its content size and
     re-open the overflow this whole rule exists to close. */
  flex: 0 1 auto;
  min-height: 120px;
}
.chart-plot .y-axis { grid-column: 1; grid-row: 1; position: relative; }
svg.chart { grid-column: 2; grid-row: 1; width: 100%; height: 100%; display: block; }
/* pointer-events:none is load-bearing, not decoration: .overlay shares the exact grid cell the
   svg's own .hit-area occupies, and a plain div with no pointer-events override intercepts every
   mouse/touch event over the WHOLE plot before it ever reaches the svg beneath it -- caught only by
   driving a real browser (page.mouse.move landed on .overlay, not the hit-area, and the tooltip
   never appeared), never by the markup or a unit test. Inherited by every span inside it, which is
   correct: none of them is a control. */
.chart-plot .overlay { grid-column: 2; grid-row: 1; position: relative; pointer-events: none; }
.chart-plot .x-axis { grid-column: 2; grid-row: 2; position: relative; }

.axis-label {
  position: absolute;
  font-size: var(--axis-size);
  white-space: nowrap;
}
.axis-label.y { right: 10px; transform: translateY(-50%); }
.axis-label.x { top: 6px; transform: translateX(-50%); }

.note, .end-label {
  position: absolute;
  font-size: var(--note-size);
  white-space: nowrap;
  background: var(--ground);
  padding: 1px 4px;
  border-radius: 2px;
}
.note.reference-label { transform: translateY(-100%) translateY(-4px); }
.note.peak-label.above { transform: translate(-50%, -100%) translateY(-6px); }
.end-label {
  font-size: var(--label-size);
  font-weight: var(--label-weight);
  transform: translate(-100%, -50%) translateX(-10px);
}

/* THE HOVERABLE LINE's own contract with the components that draw one. pointer-events:stroke is
   the whole mechanism: it makes the STROKE the hit region rather than the bounding box, which for
   a diagonal connector is mostly empty space -- a reader aiming at the line they can see would
   otherwise be answered by a rectangle that also covers everything between the line and the frame.
   The twin is transparent and generously wide (the component states the width as a knob); nothing
   here paints it. .line-active is what a component may style to bring the visible line forward. */
.line-hit { pointer-events: stroke; cursor: pointer; fill: none; }
.line-hit:focus { outline: none; }
.line-hit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.pt { cursor: pointer; }
.pt:hover, .pt:focus, .pt-active {
  fill: var(--muted);
  outline: none;
}
.pt:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
#tooltip {
  position: fixed;
  max-width: 220px;
  padding: 6px 10px;
  font-size: 13px;
  line-height: 1.3;
  background: var(--ground);
  color: var(--ink);
  border: 1px solid var(--muted);
  border-radius: 3px;
  pointer-events: none;
  z-index: 10;
}
#tooltip[hidden] { display: none; }



@media (prefers-reduced-motion: no-preference) {
  @keyframes chart-entrance-fade { from { opacity: 0; } }
  @keyframes chart-entrance-wipe { from { transform: scaleX(0); } }
  @keyframes chart-entrance-land { from { transform: scale(0); } }
  @keyframes chart-entrance-grow { from { transform: scale(var(--e-sx, 1), var(--e-sy, 1)); } }

  /* One class, added once, by an IntersectionObserver — never on load. An embed can sit far below
     the fold of an article, and an entrance nobody watched is a worse artifact than a static one.
     `backwards` and not `forwards`: the element holds the keyframe's FROM state through its own
     delay (without it every layer would be fully drawn until its turn came, which is no entrance at
     all), and once the animation is over the element returns to its own settled style rather than
     being frozen at a computed value. */
  .chart-figure.entered [data-entrance-motion] {
    animation-duration: var(--e-dur);
    animation-delay: var(--e-delay);
    animation-timing-function: var(--e-ease, linear);
    animation-fill-mode: backwards;
  }
  .chart-figure.entered [data-entrance-motion="fade"] { animation-name: chart-entrance-fade; }
  .chart-figure.entered [data-entrance-motion="wipe"] { animation-name: chart-entrance-wipe; }
  .chart-figure.entered [data-entrance-motion="land"] { animation-name: chart-entrance-land; }
  .chart-figure.entered [data-entrance-motion="grow"] { animation-name: chart-entrance-grow; }
  .chart-figure.entered [data-entrance-motion="wipe"],
  .chart-figure.entered [data-entrance-motion="land"] {
    transform-box: view-box;
    transform-origin: 0 0;
  }
  /* A grown mark states its OWN baseline, because there is no single one: a column grows up from
     the plot floor, a diverging bar out from a centre line, a stem right from wherever the value
     axis's zero landed. The fallback is the other two motions' own 0 0, so a missing pair is the
     old behaviour rather than an undefined one — and entranceLayer refuses to emit a grow layer
     without them, so the fallback is never what a delivered page runs. */
  .chart-figure.entered [data-entrance-motion="grow"] {
    transform-box: view-box;
    transform-origin: var(--e-ox, 0) var(--e-oy, 0);
  }
}
</style>
<style>

.chart-plot.lollipop { grid-template-columns: var(--y-gutter) 1fr var(--r-gutter); }
.chart-plot .y-axis .cat {
  font-size: var(--cat-size);
  font-weight: var(--cat-weight);
  color: var(--ink);
}
.chart-plot .overlay .dot {
  position: absolute;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
.chart-plot .overlay .value-label {
  position: absolute;
  transform: translateY(-50%) translateX(10px);
  font-size: var(--label-size);
  font-weight: var(--label-weight);
  color: var(--ink);
  background: var(--ground);
  padding: 1px 4px;
  border-radius: 2px;
  white-space: nowrap;
}
.row-hit { cursor: pointer; }
.row-hit:hover, .row-hit:focus, .row-active {
  fill: var(--muted);
  fill-opacity: 0.12;
  outline: none;
}
.row-hit:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: -2px;
}

</style>

<script>
// twin/proof/weby-lollipop-co2-per-capita/lollipop-interaction.mjs
//
// This beat's OWN interaction script — not `chart-web/assets/interaction.mjs` (the line
// genre's nearest-by-x mechanic over one shared `.hit-area`) and not
// `web-income-life-expectancy/scatter-interaction.mjs` (nearest-by-2D-distance over one shared
// `.hit-area`). Neither generalises here: a lollipop's rows already tile the plot's full height as
// disjoint, non-overlapping bands (`d3-scale`'s `scaleBand`), so there is nothing to resolve by
// "nearest" — the pointer is always inside exactly one row's own rect, or none. `render-web.mjs`
// inlines THIS file instead of the skill's own copy, the same swap
// `web-income-life-expectancy/render-web.mjs`'s `patchForThisBeat` performs for its own beat.
//
// Every `.row-hit` rect already carries its own `data-detail` string and its own `aria-label`,
// baked in server-side by `LollipopCo2Web.tsx` — this script never invents or recomputes either. It
// only ever toggles a rect's own `row-active` class and the shared `#tooltip`'s content/position; it
// has no code path that can touch the title, a stem, a dot, or a printed value label.

/** Wires one `<svg class="chart">` — its per-row `.row-hit` rects and the shared tooltip element —
 *  to hover, tap and keyboard. */
function initChart(svg, tooltip) {
  const rows = Array.prototype.slice.call(svg.querySelectorAll(".row-hit"));
  if (rows.length === 0) return;

  function clear() {
    rows.forEach((r) => r.classList.remove("row-active"));
    tooltip.hidden = true;
  }

  function show(row, clientX, clientY) {
    rows.forEach((r) => r.classList.toggle("row-active", r === row));
    tooltip.textContent = row.getAttribute("data-detail");
    tooltip.hidden = false;
    const tw = tooltip.offsetWidth || 160;
    const th = tooltip.offsetHeight || 28;
    const x = Math.min(Math.max(clientX - tw / 2, 8), window.innerWidth - tw - 8);
    const y = Math.max(clientY - th - 14, 8);
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }

  // Hover and tap share one path: pointer events fire for mouse, pen and touch alike. Each row's
  // own rect already spans the row's FULL band height and the plot's full width, so a touch reader
  // never has to land a tap on a thin stem or a 5px dot — anywhere in the row resolves to that row.
  rows.forEach((row, i) => {
    function fromPointer(evt) {
      show(row, evt.clientX, evt.clientY);
    }
    row.addEventListener("pointerenter", fromPointer);
    row.addEventListener("pointermove", fromPointer);
    row.addEventListener("pointerdown", fromPointer);
    // MOUSE AND PEN ONLY. A touch pointer is destroyed the instant the finger lifts, and the
    // browser fires `pointerleave` immediately after `pointerup` for it — so an unguarded
    // `pointerleave` handler wipes the tooltip a tap has just opened, and the reading this beat's
    // own alt text promises a tap reveals is never actually visible on a phone. Measured by
    // dispatching a real `Input.dispatchTouchEvent` sequence, not read off the source. A touch
    // reader's tooltip is cleared by the document-level `pointerdown` below instead: it stays up
    // until they tap somewhere else, which is the behaviour a tap-to-inspect control should have.
    row.addEventListener("pointerleave", function (evt) {
      if (evt.pointerType === "touch") return;
      clear();
    });

    // Keyboard: every row's rect is already `tabIndex={0}` at build time (works with this script
    // absent entirely — the same invariant `web-discipline.md`, "Keyboard and touch", states for
    // the line genre). This layer adds the same detail box hover shows, plus ArrowUp/ArrowDown/
    // Home/End to move between rows in their own printed (ranked) order without leaving focus.
    row.addEventListener("focus", function () {
      const rect = row.getBoundingClientRect();
      show(row, rect.left + rect.width / 2, rect.top);
    });
    row.addEventListener("blur", clear);
    row.addEventListener("keydown", function (evt) {
      let nextIndex = null;
      if (evt.key === "ArrowDown") nextIndex = Math.min(i + 1, rows.length - 1);
      else if (evt.key === "ArrowUp") nextIndex = Math.max(i - 1, 0);
      else if (evt.key === "Home") nextIndex = 0;
      else if (evt.key === "End") nextIndex = rows.length - 1;
      else if (evt.key === "Escape") {
        clear();
        row.blur();
        return;
      }
      if (nextIndex !== null && nextIndex !== i) {
        evt.preventDefault();
        rows[nextIndex].focus();
      }
    });
  });

  document.addEventListener("pointerdown", function (evt) {
    if (svg.contains(evt.target) || tooltip.contains(evt.target)) return;
    clear();
  });
}

function initAll() {
  const tooltip = document.getElementById("tooltip");
  if (!tooltip) return;
  document.querySelectorAll("svg.chart").forEach(function (svg) {
    initChart(svg, tooltip);
  });
}

// Guarded rather than a bare top-level call: this file can also be imported in a context with no
// `document`. In the browser the guard is always true, so the inlined `<script>` self-starts the
// moment it is parsed, unchanged.
if (typeof document !== "undefined") initAll();

</script>

// twin/skills/chart-web/assets/entrance-trigger.mjs
//
// THE ENTRANCE'S OWN SCRIPT, AND THE REASON IT IS NOT IN `interaction.mjs` ANY MORE.
//
// It used to be one function inside that file, called from its `initAll()`. Two things were wrong
// with that, and both were MEASURED on a real beat rather than reasoned about:
//
//   1. **A beat may replace the interaction script wholesale, and seven of them do.** Every
//      non-line beat in this repository (lollipop, dumbbell, boxplot, pyramid, scatter, diverging,
//      small multiples) writes its own hover mechanic — a lollipop's fifteen band rows have no
//      "nearest by x" to resolve — and its runner PATCHES the delivered file, swapping the genre's
//      inlined `<script>` for its own. The entrance CSS still shipped, the markup still declared its
//      layers, this guard's markup half still passed, and the `entered` class was never added by
//      anything: `verify-entrance.mjs` timed out waiting 5s for it on the first such beat migrated.
//      A page whose entrance silently does not exist, with every check green.
//   2. **`initAll()` returns early when there is no `#tooltip`**, so a beat with no hover at all
//      would lose its entrance to a guard clause about something else entirely.
//
// The entrance's CSS is emitted by `render-web.mjs` for a beat that DECLARED an entrance, and
// nothing else. Its trigger is now emitted by the same gate, in its own `<script>`, AFTER the
// beat's own — so a runner that swaps the first block leaves this one standing. One cost, one
// condition, one place. There is no second copy of this logic to walk.
//
// It is a classic script, not a module (`render-web.mjs`'s `inlineable` strips `export`), so it
// runs in a CMS iframe or a sandboxed embed that restricts module scripts.

/**
 * THE ENTRANCE TRIGGER — the whole of this genre's entrance that is script, and it is one class.
 *
 * WHAT IT DOES NOT DO, which is the point. It writes no opacity, no transform and no length. Every
 * number the entrance uses was computed server-side from the beat's own geometry and the entrance
 * contract (`assets/entrance.ts`) and written on the elements as custom properties; the keyframes
 * and the delays live in the stylesheet, inside `@media (prefers-reduced-motion: no-preference)`.
 * This function's entire job is to say WHEN, once, per figure.
 *
 * WHY AN OBSERVER AND NOT `DOMContentLoaded`. This genre's delivery model is an embed: a CMS drops
 * the file into an article and the figure may sit two screens below the fold. An entrance that
 * plays on load plays to nobody, and a reader who scrolls to it finds a finished chart with a
 * two-second build they never saw — strictly worse than never having animated it. So the trigger is
 * the figure ENTERING THE READER'S VIEW.
 *
 * THE MARGIN IS A FRACTION OF THE WINDOW, NOT OF THE FIGURE, and that is deliberate: a
 * `threshold: 0.35` never fires for a figure taller than the viewport, which on a phone is most of
 * them. `rootMargin: "0px 0px -15% 0px"` shrinks the observed region by 15 % of the window's own
 * height instead, so the entrance starts once the figure's top has come a sixth of the way up the
 * screen — reachable at every figure height there is.
 *
 * ONCE, AND THEN NEVER AGAIN: `unobserve` on the first intersection. A graphic that rebuilt itself
 * every time it scrolled past would be decoration, and the contract has no loop in it.
 *
 * NO OBSERVER AT ALL (an engine without `IntersectionObserver`): the class goes on immediately. The
 * entrance plays on load, which is the behaviour this function exists to improve on but is still
 * strictly better than a figure that never gets its class and — with `animation-fill-mode:
 * backwards` scoped to `.entered` — is complete either way. It is never the settled page that is at
 * risk here; only when the build runs.
 *
 * A figure whose beat declared no layers gets no observer: the query below finds nothing to watch.
 * Inert in a page that did not ask for it, exactly as `initLines` above is inert in a page with no
 * `.line-hit` — the shape this file already had.
 */
function initEntrance(root) {
  const figures = Array.prototype.slice
    .call(root.querySelectorAll(".chart-figure"))
    .filter(function (figure) {
      return figure.querySelector("[data-entrance-motion]") !== null;
    });
  if (figures.length === 0) return;

  if (typeof IntersectionObserver === "undefined") {
    figures.forEach(function (figure) {
      figure.classList.add("entered");
    });
    return;
  }

  const observer = new IntersectionObserver(
    function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add("entered");
        observer.unobserve(entry.target);
      });
    },
    { threshold: 0, rootMargin: "0px 0px -15% 0px" },
  );
  figures.forEach(function (figure) {
    observer.observe(figure);
  });
}

// Guarded rather than a bare call, for the same reason `interaction.mjs` guards its own: this file
// is read as text and inlined, and a `document`-less context must not throw on it.
if (typeof document !== "undefined") initEntrance(document);

</script>
</body>
</html>
