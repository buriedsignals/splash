<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Six paires de sucettes, une par pays, mesurant les tonnes de CO₂ par personne en 2000 (teinte claire) et en 2023 (plein), chaque tige partant de zéro. Sous chaque paire, un triangle donne le sens du changement, suivi du pourcentage et du nom du pays. La Chine monte de 2,9 à 8,6 tonnes, les États-Unis descendent de 21,4 à 14,3 : le rapport entre les deux passe de 7,5 à 1,7."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LA CHINE A TRIPLÉ SON CO₂ PAR</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PERSONNE DEPUIS 2000 ; L’AMÉRICAIN</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">MOYEN N’EN ÉMET PLUS QUE 1,7 FOIS PLUS</text><text x="56" y="233.16749317177735" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Les 6 pays qui émettent le plus de CO₂ — 63,9 % du total mondial en 2023. Chaque paire porte le niveau de 2000 en teinte claire et celui de 2023</text><text x="56" y="251.29326953896486" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">en plein, chacun mesuré depuis zéro : c’est ce qu’une paire de sucettes montre et qu’un haltère cache. La Chine passe de 2,9 à 8,6 t, les États-Unis</text><text x="56" y="269.41904590615235" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spac