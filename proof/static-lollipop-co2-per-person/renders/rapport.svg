<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Six paires de sucettes, une par pays, mesurant les tonnes de CO₂ par personne en 2000 (teinte claire) et en 2023 (plein), chaque tige partant de zéro. Sous chaque paire, un triangle donne le sens du changement, suivi du pourcentage et du nom du pays. La Chine monte de 2,9 à 8,6 tonnes, les États-Unis descendent de 21,4 à 14,3 : le rapport entre les deux passe de 7,5 à 1,7."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La Chine a triplé son CO₂ par personne depuis 2000 ; l’Américain</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">moyen n’en émet plus que 1,7 fois plus</text><text x="46" y="167.33180200641095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Les 6 pays qui émettent le plus de CO₂ — 63,9 % du total mondial en 2023. Chaque paire porte le niveau de 2000 en teinte claire et celui de</text><text x="46" y="186.18114550641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">2023 en plein, chacun mesuré depuis zéro : c’est ce qu’une paire de sucettes montre et qu’un haltère cache. La Chine passe de 2,9 à 8,6 t, les</text><text x="46" y="205.03048900641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">États-Unis de 21,4 à 14,3.</text><text x="46" y="233.58491063141093" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">tonnes de CO₂ par personne</text><line x1="46" x2="914" y1="374.7615939917968" y2="374.7615939917968" stroke="#404040" stroke-width="1"></line><g><line x1="92.33333333333333" x2="92.33333333333333" y1="374.7615939917968" y2="358.96648234828814" stroke="#8194a3" stroke-width="1.6"></line><circle cx="92.33333333333333" cy="358.96648234828814" r="7" fill="#8194a3"></circle><text x="92.33333333333333" y="346.96648234828814" text-anchor="middle" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#5f5f5f">2,9</text><line x1="144.33333333333331" x2="144.33333333333331" y1="374.7615939917968" y2="327.6734567130794" stroke="#1F5C8B" stroke-width="1.6"></line><circle cx="144.33333333333331" cy="327.6734567130794" r="7" fill="#1F5C8B"></circle><circle cx="144.33333333333331" cy="327.6734567130794" r="10.2" fill="none" stroke="#1e5a88" stroke-width="1"></circle><text x="144.33333333333331" y="312.6734567130794" text-anchor="middle" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">8,6</text><text x="92.33333333333333" y="388.6141330542968" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">2000</text><text x="144.33333333333331" y="388.6141330542968" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">2023</text><path d="M 85.56013997395833 402.1550119605468 L 89.07950520833333 408.48986938242183 L 82.04077473958333 408.48986938242183 Z" fill="#1e5a88"></path><text x="118.33333333333333" y="409.6077853980468" text-anchor="middle" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">+198 %</text><text x="118.33333333333333" y="426.2298557105468" text-anchor="middle" font-family="Open Sans