<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Six paires de sucettes, une par pays, mesurant les tonnes de CO₂ par personne en 2000 (teinte claire) et en 2023 (plein), chaque tige partant de zéro. Sous chaque paire, un triangle donne le sens du changement, suivi du pourcentage et du nom du pays. La Chine monte de 2,9 à 8,6 tonnes, les États-Unis descendent de 21,4 à 14,3 : le rapport entre les deux passe de 7,5 à 1,7."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05" font-family="Georgia" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La Chine a triplé son CO₂ par personne depuis 2000 ;</text><text x="46" y="123.99" font-family="Georgia" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">l’Américain moyen n’en émet plus que 1,7 fois plus</text><text x="46" y="167.33" font-family="Georgia" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Les 6 pays qui émettent le plus de CO₂ — 63,9 % du total mondial en 2023. Chaque paire porte le niveau de 2000 en teinte claire et celui de 2023 en</text><text x="46" y="186.18" font-family="Georgia" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">plein, chacun mesuré depuis zéro : c’est ce qu’une paire de sucettes montre et qu’un haltère cache. La Chine passe de 2,9 à 8,6 t, les États-Unis de 21,4 à</text><text x="46" y="205.03" font-family="Georgia" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">14,3.</text><text x="46" y="233.45597045898438" font-family="Helvetica Neue" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">tonnes de CO₂ par per