<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Six paires de sucettes, une par pays, mesurant les tonnes de CO₂ par personne en 2000 (teinte claire) et en 2023 (plein), chaque tige partant de zéro. Sous chaque paire, un triangle donne le sens du changement, suivi du pourcentage et du nom du pays. La Chine monte de 2,9 à 8,6 tonnes, les États-Unis descendent de 21,4 à 14,3 : le rapport entre les deux passe de 7,5 à 1,7."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La Chine a triplé son CO₂ par personne depuis 2000 ;</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">l’Américain moyen n’en émet plus que 1,7 fois plus</text><text x="52" y="184.6028870835547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Les 6 pays qui émettent le plus de CO₂ — 63,9 % du total mondial en 2023. Chaque paire porte le niveau de 2000 en teinte claire et celui de</text><text x="52" y="203.4536945054297" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">2023 en plein, chacun mesuré depuis zéro : c’est ce qu’une paire de sucettes montre et qu’un haltère cache. La Chine passe de 2,9 à 8,6 t, les</text><text x="52" y="222.3045019273047" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">États-Unis de 21,4 à 14,3.</text><text x="52" y="256.67681203472654" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">tonnes de CO₂ par personne</text><line x1="52" x2="908" y1="373.18617234758625" y2="373.18617234758625" stroke="#403f3c" stroke-width="1"></line><g><line x1="97.33333333333333" x2="97.33333333333333" y1="373.18617234758625" y2="360.5575657999692" stroke="#7e91a8" stroke-width="1.6"></line><circle cx="97.33333333333333" cy="360.5575657999692" r="7" fill="#7e91a8"></circle><text x="97.33333333333333" y="348.5575657999692" text-anchor="middle" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">2,9</text><line x1="149.33333333333331" x2="149.33333333333331" y1="373.18617234758625" y2="335.5379700319359" stroke="#1757B6" stroke-width="1.6"></line><circle cx="149.33333333333331" cy="335.5379700319359" r="7" fill="#1757B6"></circle><circle cx="149.33333333333331" cy="335.5379700319359" r="10.2" fill="none" stroke="#1755b2" stroke-width="1"></circle><text x="149.33333333333331" y="320.5379700319359" text-anchor="middle" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">8,6</text><text x="97.33333333333333" y="387.03871141008625" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000</text><text x="149.33333333333331" y="387.03871141008625" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2023</text><path d="M 89.70589192708333 400.67953172258626 L 93.34661458333333 407.2328325038362 L 86.06516927083332 407.2328325038362 Z" fill="#1755b2"></path><text x="123.33333333333333" y="408.38929734758625" text-anchor="middle" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">+198 %</text><text x="123.33333333333333" y="427.7753141932894" text-anchor="middle" font-family="Merriweather" font-size="1