<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Six paires de sucettes, une par pays, mesurant les tonnes de CO₂ par personne en 2000 (teinte claire) et en 2023 (plein), chaque tige partant de zéro. Sous chaque paire, un triangle donne le sens du changement, suivi du pourcentage et du nom du pays. La Chine monte de 2,9 à 8,6 tonnes, les États-Unis descendent de 21,4 à 14,3 : le rapport entre les deux passe de 7,5 à 1,7."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="52" y="101" font-family="Georgia" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La Chine a triplé son CO₂ par personne depuis 2000 ;</text><text x="52" y="137.6" font-family="Georgia" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">l’Américain moyen n’en émet plus que 1,7 fois plus</text><text x="52" y="184.6" font-family="Helvetica Neue" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Les 6 pays qui émettent le plus de CO₂ — 63,9 % du total mondial en 2023. Chaque paire porte le niveau de 2000 en teinte claire et celui de 2023</text><text x="52" y="203.45" font-family="Helvetica Neue" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">en plein, chacun mesuré depuis zéro : c’est ce qu’une paire de sucettes montre et qu’un haltère cache. La Chine passe de 2,9 à 8,6 t, les</text><text x="52" y="222.29999999999998" font-family="Helvetica Neue" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">États-Unis de 21,4 à 14,3.</text><text x="52" y="256.3997924804687" font-family="Helvetica Neue" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e