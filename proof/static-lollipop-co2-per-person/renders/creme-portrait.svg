<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Six paires de sucettes, une par pays, mesurant les tonnes de CO₂ par personne en 2000 (teinte claire) et en 2023 (plein), chaque tige partant de zéro. Sous chaque paire, un triangle donne le sens du changement, suivi du pourcentage et du nom du pays. La Chine monte de 2,9 à 8,6 tonnes, les États-Unis descendent de 21,4 à 14,3 : le rapport entre les deux passe de 7,5 à 1,7."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La Chine a triplé son CO₂ par</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">personne depuis 2000 ;</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">l’Américain moyen n’en émet</text><text x="52" y="210.80422262890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">plus que 1,7 fois plus</text><text x="52" y="257.80553908355466" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Les 6 pays qui émettent le plus de CO₂ — 63,9 % du total mondial en</text><text x="52" y="276.65634650542967" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">2023. Chaque paire porte le niveau de 2000 en teinte claire et celui de</text><text x="52" y="295.50715392730467" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">2023 en plein, chacun mesuré depuis zéro : c’est ce qu’une paire de</text><text x="52" y="314.3579613491797" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">sucettes montre et qu’un haltère cache. La Chine passe de 2,9 à 8,6 t,</text><text x="52" y="333.2087687710547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">les États-Unis de 21,4 à 14,3.</text><text x="52" y="364.93850075347655" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">tonnes de CO₂ par personne</text><line x1="167.95643138256713" x2="167.95643138256713" y1="384.28908669097655" y2="780.0333049370394" stroke="#403f3c" stroke-width="1"></line><g><line x1="167.95643138256713" x2="192.93902433691682" y1="399.967703115239" y2="399.967703115239" stroke="#7e91a8" stroke-width="1.6"></line><circle cx="192.93902433691682" cy="399.967703115239" r="6.801853751104203" fill="#7e91a8"></circle><text x="204.74087808802102" y="403.519949208989" text-anchor="start" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">2,9</text><line x1="167.95643138256713" x2="242.43414278869022" y1="420.82672128529185" y2="420.82672128529185" stroke="#1757B6" stroke-width="1.6"></line><circle cx="242.43414278869022" cy="420.82672128529185" r="6.801853751104203" fill="#1757B6"></circle><circle cx="242.43414278869022" cy="420.82672128529185" r="10.001853751104203" fill="none" stroke="#1755b2" stroke-width="1"></circle><text x="257.2359965397944" y="424.37896737904185" text-anchor="start" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">8,6</text><text x="161.3562519880359" y="402.572683583989" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" lette