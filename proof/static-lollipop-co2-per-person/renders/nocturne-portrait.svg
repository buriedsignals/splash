<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Six paires de sucettes, une par pays, mesurant les tonnes de CO₂ par personne en 2000 (teinte claire) et en 2023 (plein), chaque tige partant de zéro. Sous chaque paire, un triangle donne le sens du changement, suivi du pourcentage et du nom du pays. La Chine monte de 2,9 à 8,6 tonnes, les États-Unis descendent de 21,4 à 14,3 : le rapport entre les deux passe de 7,5 à 1,7."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LA CHINE A TRIPLÉ</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SON CO₂ PAR</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PERSONNE DEPUIS</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">2000 ; L’AMÉRICAIN</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">MOYEN N’EN ÉMET</text><text x="56" y="301.24591515" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PLUS QUE 1,7 FOIS</text><text x="56" y="340.28512155" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PLUS</text><text x="56" y="389.3243187717773" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spa