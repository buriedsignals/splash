<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Six paires de sucettes, une par pays, mesurant les tonnes de CO₂ par personne en 2000 (teinte claire) et en 2023 (plein), chaque tige partant de zéro. Sous chaque paire, un triangle donne le sens du changement, suivi du pourcentage et du nom du pays. La Chine monte de 2,9 à 8,6 tonnes, les États-Unis descendent de 21,4 à 14,3 : le rapport entre les deux passe de 7,5 à 1,7."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La Chine a triplé son CO₂ par</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">personne depuis 2000 ;</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">l’Américain moyen n’en émet plus</text><text x="46" y="189.87381259746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">que 1,7 fois plus</text><text x="46" y="233.21418880641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Les 6 pays qui émettent le plus de CO₂ — 63,9 % du total mondial en</text><text x="46" y="252.06353230641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">2023. Chaque paire porte le niveau de 2000 en teinte claire et celui de</text><text x="46" y="270.91287580641097" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">2023 en plein, chacun mesuré depuis zéro : c’est ce qu’une paire de</text><text x="46" y="289.76221930641094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">sucettes montre et qu’un haltère cache. La Chine passe de 2,9 à 8,6 t, les</text><text x="46" y="308.6115628064109" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">États-Unis de 21,4 à 14,3.</text><text x="46" y="334.52340630641095" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">tonnes de CO₂ par personne</text><line x1="159.91825947265625" x2="159.91825947265625" y1="353.51705865016095" y2="799.7833833042968" stroke="#404040" stroke-width="1"></line><g><line x1="159.91825947265625" x2="187.06890275633765" y1="371.1972626928821" y2="371.1972626928821" stroke="#8194a3" stroke-width="1.6"></line><circle cx="187.06890275633765" cy="371.1972626928821" r="7" fill="#8194a3"></circle><text x="199.06890275633765" y="374.6311005835071" text-anchor="start" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#5f5f5f">2,9</text><line x1="159.91825947265625" x2="240.85932826674028" y1="394.71921688819384" y2="394.71921688819384" stroke="#1F5C8B" stroke-width="1.6"></line><circle cx="240.85932826674028" cy="394.71921688819384" r="7" fill="#1F5C8B"></circle><circle cx="240.85932826674028" cy="394.71921688819384" r="10.2" fill="none" stroke="#1e5a88" stroke-width="1"></circle><text x="255.85932826674028" y="398.15305477881884" text-anchor="start" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">8,6</text><text x="153.318080078125" y="373.8022431616321" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fil