<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Graphique à puces : la part du bas-carbone dans l’électricité de six pays européens, 2015 contre 2024, sur une piste allant jusqu’à 100 %. Pologne progresse de 13,8 % à 31,1 %, soit +17,3 points, et reste la seule des six sous la moitié."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">POLOGNE : +17,3</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">POINTS DE</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">BAS-CARBONE</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DEPUIS 2015, ET</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">TOUJOURS LA SEULE</text><text x="56" y="301.24591515" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DES SIX SOUS LA</text><text x="56" y="340.28512155" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">MOITIÉ</text><text x="56" y="386.8247742107422" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Part du bas-carbone — nucléaire et renouvelables — dans la production</text><text x="56" y="404.9505505779297" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">électrique de chaque pays, en 2015 et en 2024. Pologne passe de 13,8 %</text><text x="56" y="423.0763269451172" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">à 31,1 % ; les trois pays déjà au-dessus de 95 % en 2015 gagnent moins</text><text x="56" y="441.2021033123047" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">d’un point chacun.</text><text x="56" y="771.1190732806874" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : LA BARRE ÉPAISSE ET PÂLE EST 2015, LA FINE ET</text><text x="56" y="789.244849647875" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SATURÉE 2024 — DEUX ÉTATS D’UNE MÊME MESURE, DONC UNE</text><text x="56" y="807.3706260150624" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SEULE TEINTE À DEUX INTENSITÉS. LA PISTE VA JUSQU’À 100 %,</text><text x="56" y="825.4964023822499" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SI BIEN QUE CE QUI RESTE À PARCOURIR SE LIT AUSSI. AUCUN</text><text x="56" y="843.6221787494374" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">OBJECTIF N’EST DESSINÉ ICI : 2015 EST UNE DATE, PAS UNE</text><text x="56" y="861.7479551166249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">CIBLE.</text><text x="56" y="885.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">(2025), via Our World in Data</text><g><rect x="149.04000152610243" y="487.22993904613725" width="256.92599789835515" height="24.696151115096562" fill="#222151"></rect><rect x="149.04000152610243" y="487.22993904613725" width="35.48174614920072" height="24.696151115096562" fill="#295f73"></rect><rect x="149.04000152610243" y="493.8978998472133" width="80.02441754201035" height="11.36022951294442" fill="#4FE0C0"></rect><text x="139.04000152610243" y="502.0780146036855" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">POLOGNE</text><text x="415.96599942445755" y="503.07101081950583" font-family="Montserrat" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">+17,3 pts</text></g><g><rect x="149.04000152610243" y="531.3302088945239" width="256.92599789835515" height="24.696151115096562" fill="#222151"></rect><rect x="149.04000152610243" y="531.3302088945239" width="112.52295100159043" height="24.696151115096562" fill="#295f73"></rect><rect x="149.04000152610243" y="537.9981696956" width="150.66734359304738" height="11.36022951294442" fill="#4FE0C0"></rect><text x="139.04000152610243" y="546.1782844520723" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#FFFFFF">ALLEMAGNE</text><text x="415.96599942445755" y="547.1712806678926" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#a7a6b9">+14,8 pts</text></g><g><rect x="149.04000152610243" y="575.4304787429106" width="256.92599789835515" height="24.696151115096562" fill="#222151"></rect><rect x="149.04000152610243" y="575.4304787429106" width="236.84680201285815" height="24.696151115096562" fill="#295f73"></rect><rect x="149.040001