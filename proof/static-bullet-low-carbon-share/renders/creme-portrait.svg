<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Graphique à puces : la part du bas-carbone dans l’électricité de six pays européens, 2015 contre 2024, sur une piste allant jusqu’à 100 %. Pologne progresse de 13,8 % à 31,1 %, soit +17,3 points, et reste la seule des six sous la moitié."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Pologne : +17,3 points de</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">bas-carbone depuis 2015, et</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">toujours la seule des six sous</text><text x="52" y="210.80422262890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">la moitié</text><text x="52" y="255.2060127400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part du bas-carbone — nucléaire et renouvelables — dans la production</text><text x="52" y="274.0568201619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">électrique de chaque pays, en 2015 et en 2024. Pologne passe de 13,8 %</text><text x="52" y="292.9076275838281" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">à 31,1 % ; les trois pays déjà au-dessus de 95 % en 2015 gagnent moins</text><text x="52" y="311.7584350057031" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">d’un point chacun.</text><text x="52" y="787.0943758228701" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : la barre épaisse et pâle est 2015, la fine et saturée 2024 —</text><text x="52" y="805.9451832447451" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">deux états d’une même mesure, donc une seule teinte à deux</text><text x="52" y="824.7959906666201" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">intensités. La piste va jusqu’à 100 %, si bien que ce qui reste à</text><text x="52" y="843.6467980884951" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">parcourir se lit aussi. Aucun objectif n’est dessiné ici : 2015 est une</text><text x="52" y="862.4976055103701" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">date, pas une cible.</text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">(2025), via Our World in Data</text><g><rect x="133.11250646412373" y="376.12339341830494" width="274.6540950983763" height="26" fill="#edeadd"></rect><rect x="133.11250646412373" y="376.12339341830494" width="37.93001471565526" height="26" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="383.1433934183049" width="85.54616568803132" height="11.96" fill="#1757B6"></rect><text x="123.11250646412373" y="392.259639145844" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Pologne</text><text x="417.7666015625" y="392.67563951205494" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">+17,3 pts</text></g><g><rect x="133.11250646412373" y="442.2826890521022" width="274.6540950983763" height="26" fill="#edeadd"></rect><rect x="133.11250646412373" y="442.2826890521022" width="120.28712367740738" height="26" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="449.3026890521022" width="161.06350954719596" height="11.96" fill="#1757B6"></rect><text x="123.11250646412373" y="458.4189347796413" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Allemagne</text><text x="417.7666015625" y="458.8349351458522" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+14,8 pts</text></g><g><rect x="133.11250646412373" y="508.44198468589946" width="274.6540950983763" height="26" fill="#edeadd"></rect><rect x="133.11250646412373" y="508.44198468589946" width="253.18941880502598" height="26" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="515.4619846858994" width="260.6422285927701" height="11.96" fill="#1757B6"></rect><text x="123.11250646412373" y="524.5782304134385" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">France</text><text x="417.7666015625" y="524.9942307796495" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+2,7 pts</text></g><g><rect x="133.11250646412373" y="574.6012803196968" width="274.6540950983763" height="26" fill="#edeadd"></rect><rect x="133.11250646412373" y="574.6012803196968" width="266.922043987691" height="26" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="581.6212803196968" width="269.4322678469206" height="11.96" fill="#1757B6"></rect><text x="123.11250646412373" y="590.7375260472359" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Suisse</text><text x="417.7666015625" y="591.1535264134468" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+0,9 pts</text></g><g><rect x="133.11250646412373" y="640.760575953494" width="274.6540950983763" height="26" fill="#edeadd"></rect><rect x="133.11250646412373" y="640.760575953494" width="269.31359880479675" height="26" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="647.780575953494" width="271.33559078350766" height="11.96" fill="#1757B6"></rect><text x="123.11250646412373" y="656.8968216810331" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Suède</text><text x="417.7666015625" y="657.312822047244" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+0,7 pts</text></g><g><rect x="133.11250646412373" y="706.9198715872914" width="274.6540950983763" height="26" fill="#edeadd"></rect><rect x="133.11250646412373" y="706.9198715872914" width="269.0265671358712" height="26" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="713.9398715872913" width="270.825615254538" height="11.96" fill="#1757B6"></rect><text x="123.11250646412373" y="723.0561173148304" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Norvège</text><text x="417.7666015625" y="723.4721176810414" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+0,7 pts</text></g><g><text x="165.042521179779" y="368.61338365267994" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">2015 : 14 %</text><text x="224.65867215215505" y="368.61338365267994" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">2024 : 31 %</text></g><line x1="133.11250646412373" x2="407.7666015625" y1="756.9995194041901" y2="756.9995194041901" stroke="#d1cfc3" stroke-width="0.6"></line><text x="133.11250646412373" y="766.8520584666901" text-anchor="start" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">0</text><text x="270.43955401331186" y="766.8520584666901" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">50</text><text x="407.7666015625" y="766.8520584666901" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">100 %</text></svg>