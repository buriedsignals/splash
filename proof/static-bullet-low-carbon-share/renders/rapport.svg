<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique à puces : la part du bas-carbone dans l’électricité de six pays européens, 2015 contre 2024, sur une piste allant jusqu’à 100 %. Pologne progresse de 13,8 % à 31,1 %, soit +17,3 points, et reste la seule des six sous la moitié."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Pologne : +17,3 points de bas-carbone depuis 2015, et</text><text x="46" y="123.99" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">toujours la seule des six sous la moitié</text><text x="46" y="164.73000000000002" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Part du bas-carbone — nucléaire et renouvelables — dans la production électrique de chaque pays, en 2015 et en 2024.</text><text x="46" y="183.58" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Pologne passe de 13,8 % à 31,1 % ; les trois pays déjà au-dessus de 95 % en 2015 gagnent moins d’un point chacun.</text><text x="46" y="431.45" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : LA BARRE ÉPAISSE ET PÂLE EST 2015, LA FINE ET SATURÉE 2024 — DEUX ÉTATS D’UNE MÊME MESURE, DONC UNE SEULE TEINTE À</text><text x="46" y="450.3" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">DEUX INTENSITÉS. LA PISTE VA JUSQU’À 100 %, SI BIEN QUE CE QUI RESTE À PARCOURIR SE LIT AUSSI. AUCUN OBJECTIF N’EST DESSINÉ ICI :</text><text x="46" y="469.15" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">2015 EST UNE DATE, PAS UNE CIBLE.</text><text x="46" y="494" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><rect x="132.19999481141568" y="227.44471270345053" width="698.6649995356798" height="16.817175748697917" fill="#ededed"></rect><rect x="132.19999481141568" y="227.44471270345053" width="96.48635933940702" height="16.817175748697917" fill="#aac1d3"></rect><rect x="132.19999481141568" y="231.98535015559898" width="217.6123090001615" height="7.735900844401042" fill="#1F5C8B"></rect><text x="122.19999481141568" y="238.19329691569013" text-anchor="end" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">POLOGNE</text><text x="840.8649943470955" y="239.2462906901042" font-family="Avenir Next" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">+17,3 pts</text></g><g><rect x="132.19999481141568" y="257.47538368326826" width="698.6649995356798" height="16.817175748697917" fill="#ededed"></rect><rect x="132.19999481141568" y="257.47538368326826" width="305.9863468561148" height="16.817175748697917" fill="#aac1d3"></rect><rect x="132.19999481141568" y="262.0160211354167" width="409.71330422981885" height="7.735900844401042" fill="#1F5C8B"></rect><text x="122.19999481141568" y="268.2239678955078" text-anchor="end" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#000000">ALLEMAGNE</text><text x="840.8649943470955" y="269.2769616699219" font-family="Avenir Next" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#5f5f5f">+14,8 pts</