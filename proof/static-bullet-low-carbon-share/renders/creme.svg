<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique à puces : la part du bas-carbone dans l’électricité de six pays européens, 2015 contre 2024, sur une piste allant jusqu’à 100 %. Pologne progresse de 13,8 % à 31,1 %, soit +17,3 points, et reste la seule des six sous la moitié."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Pologne : +17,3 points de bas-carbone depuis</text><text x="52" y="137.6" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">2015, et toujours la seule des six sous la moitié</text><text x="52" y="182" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part du bas-carbone — nucléaire et renouvelables — dans la production électrique de chaque pays, en 2015 et en 2024. Pologne passe de 13,8 %</text><text x="52" y="200.85" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">à 31,1 % ; les trois pays déjà au-dessus de 95 % en 2015 gagnent moins d’un point chacun.</text><text x="52" y="423.65" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : la barre épaisse et pâle est 2015, la fine et saturée 2024 — deux états d’une même mesure, donc une seule</text><text x="52" y="442.5" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">teinte à deux intensités. La piste va jusqu’à 100 %, si bien que ce qui reste à parcourir se lit aussi. Aucun objectif</text><text x="52" y="461.34999999999997" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">n’est dessiné ici : 2015 est une date, pas une cible.</text><text x="52" y="488" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><rect x="145.54700189828873" y="250.12303977457677" width="680.5730087757111" height="13.515469319661458" fill="#edeadd"></rect><rect x="145.54700189828873" y="250.12303977457677" width="93.98783669580573" height="13.515469319661458" fill="#a7bdd9"></rect><rect x="145.54700189828873" y="253.77221649088537" width="211.97721938453333" height="6.217115887044271" fill="#1757B6"></rect><text x="135.54700189828873" y="260.1762761433919" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Pologne</text><text x="836.1200106739998" y="260.39076894124344" font-family="Avenir Next" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">+17,3 pts</text></g><g><rect x="145.54700189828873" y="274.25780641682945" width="680.5730087757111" height="13.515469319661458" fill="#edeadd"></rect><rect x="145.54700189828873" y="274.25780641682945" width="298.0628038653016" height="13.515469319661458" fill="#a7bdd9"></rect><rect x="145.54700189828873" y="277.906983133138" width="399.1037426813108" height="6.217115887044271" fill="#1757B6"></rect><text x="135.54700189828873" y="284.31104278564453" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Allemagne</text><text x="836.1200106739998" y="284.5255355834961" font-family="Avenir Next" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+14,8 pts</text></g><g><rect x="145.54700189828873" y="298.392573059082" width="680.5730087757111" height="13.515469319661458" fill="#edeadd"></rect><rect x="145.54700189828873" y="298.392573059082" width="627.3850913622471" height="13.515469319661458" fill="#a7bdd9"></rect><rect x="145.54700189828873" y="302.04174977539054" width="645.8526156831982" height="6.217115887044271" fill="#1757B6"></rect><text x="135.54700189828873" y="308.4458094278971" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">France</text><text x="836.1200106739998" y="308.66030222574864" font-family="Avenir Next" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+2,7 pts</text></g><g><rect x="145.54700189828873" y="322.52733970133465" width="680.5730087757111" height="13.515469319661458" fill="#edeadd"></rect><rect x="145.54700189828873" y="322.52733970133465" width="661.4135446267354" height="13.515469319661458" fill="#a7bdd9"></rect><rect x="145.54700189828873" y="326.1765164176432" width="667.6336980308366" height="6.217115887044271" fill="#1757B6"></rect><text x="135.54700189828873" y="332.58057607014973" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Suisse</text><text x="836.1200106739998" y="332.7950688680013" font-family="Avenir Next" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+0,9 pts</text></g><g><rect x="145.54700189828873" y="346.6621063435872" width="680.5730087757111" height="13.515469319661458" fill="#edeadd"></rect><rect x="145.54700189828873" y="346.6621063435872" width="667.3396447161836" height="13.515469319661458" fill="#a7bdd9"></rect><rect x="145.54700189828873" y="350.31128305989574" width="672.3499947864372" height="6.217115887044271" fill="#1757B6"></rect><text x="135.54700189828873" y="356.7153427124023" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Suède</text><text x="836.1200106739998" y="356.92983551025384" font-family="Avenir Next" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+0,7 pts</text></g><g><rect x="145.54700189828873" y="370.79687298583985" width="680.5730087757111" height="13.515469319661458" fill="#edeadd"></rect><rect x="145.54700189828873" y="370.79687298583985" width="666.6284009735236" height="13.515469319661458" fill="#a7bdd9"></rect><rect x="145.54700189828873" y="374.4460497021484" width="671.0863122623205" height="6.217115887044271" fill="#1757B6"></rect><text x="135.54700189828873" y="380.85010935465493" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Norvège</text><text x="836.1200106739998" y="381.0646021525065" font-family="Avenir Next" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+0,7 pts</text></g><g><text x="233.53483859409445" y="243.05504661051427" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">2015 : 14 %</text><text x="363.52422128282205" y="243.05504661051427" font-family="Superclarendon" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">2024 : 31 %</text></g><line x1="145.54700189828873" x2="826.1200106739998" y1="393.62199096679683" y2="393.62199096679683" stroke="#d1cfc3" stroke-width="0.6"></line><text x="145.54700189828873" y="403.40998535156245" text-anchor="start" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">0</text><text x="485.83350628614426" y="403.40998535156245" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">50</text><text x="826.12