<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique à puces : la part du bas-carbone dans l’électricité de six pays européens, 2015 contre 2024, sur une piste allant jusqu’à 100 %. Pologne progresse de 13,8 % à 31,1 %, soit +17,3 points, et reste la seule des six sous la moitié."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Pologne : +17,3 points de bas-carbone depuis 2015, et</text><text x="52" y="137.6" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">toujours la seule des six sous la moitié</text><text x="52" y="182" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part du bas-carbone — nucléaire et renouvelables — dans la production électrique de chaque pays, en 2015 et en 2024. Pologne passe de</text><text x="52" y="200.85" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">13,8 % à 31,1 % ; les trois pays déjà au-dessus de 95 % en 2015 gagnent moins d’un point chacun.</text><text x="52" y="442.5" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : la barre épaisse et pâle est 2015, la fine et saturée 2024 — deux états d’une même mesure, donc une seule teinte à deux intensités.</text><text x="52" y="461.35" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">La piste va jusqu’à 100 %, si bien que ce qui reste à parcourir se lit aussi. Aucun objectif n’est dessiné ici : 2015 est une date, pas une cible.</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><rect x="133.11250646412373" y="251.1210837605794" width="694.6540950983763" height="15.238568766276043" fill="#edeadd"></rect><rect x="133.11250646412373" y="251.1210837605794" width="95.93244928656213" height="15.238568766276043" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="255.23549732747395" width="216.36303763783377" height="7.00974163248698" fill="#1757B6"></rect><text x="123.11250646412373" y="261.8766138712565" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Pologne</text><text x="837.7666015625" y="262.29261423746743" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">+17,3 pts</text></g><g><rect x="133.11250646412373" y="278.33281370035803" width="694.6540950983763" height="15.238568766276043" fill="#edeadd"></rect><rect x="133.11250646412373" y="278.33281370035803" width="304.2297367537408" height="15.238568766276043" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="282.4472272672525" width="407.3612171622689" height="7.00974163248698" fill="#1757B6"></rect><text x="123.11250646412373" y="289.0883438110351" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Allemagne</text><text x="837.7666015625" y="289.504344177246" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+14,8 pts</text></g><g><rect x="133.11250646412373" y="305.5445436401367" width="694.6540950983763" height="15.238568766276043" fill="#edeadd"></rect><rect x="133.11250646412373" y="305.5445436401367" width="640.3657172688152" height="15.238568766276043" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="309.65895720703116" width="659.2153355029484" height="7.00974163248698" fill="#1757B6"></rect><text x="123.11250646412373" y="316.30007375081374" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">France</text><text x="837.7666015625" y="316.7160741170247" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+2,7 pts</text></g><g><rect x="133.11250646412373" y="332.75627357991533" width="694.6540950983763" height="15.238568766276043" fill="#edeadd"></rect><rect x="133.11250646412373" y="332.75627357991533" width="675.0982207698917" height="15.238568766276043" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="336.8706871468098" width="681.4470694291587" height="7.00974163248698" fill="#1757B6"></rect><text x="123.11250646412373" y="343.5118036905924" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Suisse</text><text x="837.7666015625" y="343.9278040568033" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+0,9 pts</text></g><g><rect x="133.11250646412373" y="359.968003519694" width="694.6540950983763" height="15.238568766276043" fill="#edeadd"></rect><rect x="133.11250646412373" y="359.968003519694" width="681.1469321381302" height="15.238568766276043" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="364.08241708658846" width="686.2609465778729" height="7.00974163248698" fill="#1757B6"></rect><text x="123.11250646412373" y="370.72353363037104" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Suède</text><text x="837.7666015625" y="371.139533996582" font-family="Open Sans" font-size="15" font-weight="600" font-st