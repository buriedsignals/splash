<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique à puces : la part du bas-carbone dans l’électricité de six pays européens, 2015 contre 2024, sur une piste allant jusqu’à 100 %. Pologne progresse de 13,8 % à 31,1 %, soit +17,3 points, et reste la seule des six sous la moitié."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Pologne : +17,3 points de bas-carbone depuis 2015, et</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">toujours la seule des six sous la moitié</text><text x="52" y="182.0033607400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part du bas-carbone — nucléaire et renouvelables — dans la production électrique de chaque pays, en 2015 et en 2024. Pologne passe de</text><text x="52" y="200.8541681619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">13,8 % à 31,1 % ; les trois pays déjà au-dessus de 95 % en 2015 gagnent moins d’un point chacun.</text><text x="52" y="442.49760551037" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : la barre épaisse et pâle est 2015, la fine et saturée 2024 — deux états d’une même mesure, donc une seule teinte à deux intensités.</text><text x="52" y="461.348412932245" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">La piste va jusqu’à 100 %, si bien que ce qui reste à parcourir se lit aussi. Aucun objectif n’est dessiné ici : 2015 est une date, pas une cible.</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><rect x="133.11250646412373" y="251.12579866990413" width="694.6540950983763" height="15.237905231176487" fill="#edeadd"></rect><rect x="133.11250646412373" y="251.12579866990413" width="95.93244928656213" height="15.237905231176487" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="255.2400330823218" width="216.36303763783377" height="7.009436406341185" fill="#1757B6"></rect><text x="123.11250646412373" y="261.88099701303145" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Pologne</text><text x="837.7666015625" y="262.2969973792424" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">+17,3 pts</text></g><g><rect x="133.11250646412373" y="278.3363437255764" width="694.6540950983763" height="15.237905231176487" fill="#edeadd"></rect><rect x="133.11250646412373" y="278.3363437255764" width="304.2297367537408" height="15.237905231176487" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="282.45057813799406" width="407.3612171622689" height="7.009436406341185" fill="#1757B6"></rect><text x="123.11250646412373" y="289.0915420687037" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Allemagne</text><text x="837.7666015625" y="289.5075424349146" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+14,8 pts</text></g><g><rect x="133.11250646412373" y="305.5468887812487" width="694.6540950983763" height="15.237905231176487" fill="#edeadd"></rect><rect x="133.11250646412373" y="305.5468887812487" width="640.3657172688152" height="15.237905231176487" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="309.66112319366636" width="659.2153355029484" height="7.009436406341185" fill="#1757B6"></rect><text x="123.11250646412373" y="316.302087124376" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">France</text><text x="837.7666015625" y="316.7180874905869" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+2,7 pts</text></g><g><rect x="133.11250646412373" y="332.757433836921" width="694.6540950983763" height="15.237905231176487" fill="#edeadd"></rect><rect x="133.11250646412373" y="332.757433836921" width="675.0982207698917" height="15.237905231176487" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="336.87166824933865" width="681.4470694291587" height="7.009436406341185" fill="#1757B6"></rect><text x="123.11250646412373" y="343.5126321800483" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Suisse</text><text x="837.7666015625" y="343.9286325462592" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+0,9 pts</text></g><g><rect x="133.11250646412373" y="359.9679788925933" width="694.6540950983763" height="15.237905231176487" fill="#edeadd"></rect><rect x="133.11250646412373" y="359.9679788925933" width="681.1469321381302" height="15.237905231176487" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="364.08221330501095" width="686.2609465778729" height="7.009436406341185" fill="#1757B6"></rect><text x="123.11250646412373" y="370.7231772357206" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Suède</text><text x="837.7666015625" y="371.1391776019315" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+0,7 pts</text></g><g><rect x="133.11250646412373" y="387.1785239482656" width="694.6540950983763" height="15.237905231176487" fill="#edeadd"></rect><rect x="133.11250646412373" y="387.1785239482656" width="680.4209727302768" height="15.237905231176487" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="391.29275836068325" width="684.9711184051968" height="7.009436406341185" fill="#1757B6"></rect><text x="123.11250646412373" y="397.9337222913929" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Norvège</text><text x="837.7666015625" y="398.3497226576038" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+0,7 pts</text></g><g><text x="223.04495575068586" y="243.61578890427913" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">2015 : 14 %</text><text x="355.4755441019575" y="243.61578890427913" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">2024 : 31 %</text></g><line x1="133.11250646412373" x2="827.7666015625" y1="412.40274909169" y2="412.40274909169" stroke="#d1cfc3" stroke-width="0.6"></line><text x="133.11250646412373" y="422.25528815419" text-anchor="start" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">0</text><text x="480.43955401331186" y="422.25528815419" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">50</text><text x="827.7666015625" y="422.25528815419" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">100 %</text></s