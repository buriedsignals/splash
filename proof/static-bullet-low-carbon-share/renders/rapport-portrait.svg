<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Graphique à puces : la part du bas-carbone dans l’électricité de six pays européens, 2015 contre 2024, sur une piste allant jusqu’à 100 %. Pologne progresse de 13,8 % à 31,1 %, soit +17,3 points, et reste la seule des six sous la moitié."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Pologne : +17,3 points de</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">bas-carbone depuis 2015, et</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">toujours la seule des six sous la</text><text x="46" y="189.87381259746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">moitié</text><text x="46" y="230.61486433776096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Part du bas-carbone — nucléaire et renouvelables — dans la production</text><text x="46" y="249.46420783776097" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">électrique de chaque pays, en 2015 et en 2024. Pologne passe de 13,8 % à</text><text x="46" y="268.31355133776094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">31,1 % ; les trois pays déjà au-dessus de 95 % en 2015 gagnent moins</text><text x="46" y="287.162894837761" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">d’un point chacun.</text><text x="46" y="794.9037650195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : LA BARRE ÉPAISSE ET PÂLE EST 2015, LA FINE ET SATURÉE 2024</text><text x="46" y="813.7531085195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">— DEUX ÉTATS D’UNE MÊME MESURE, DONC UNE SEULE TEINTE À DEUX</text><text x="46" y="832.6024520195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">INTENSITÉS. LA PISTE VA JUSQU’À 100 %, SI BIEN QUE CE QUI RESTE À</text><text x="46" y="851.4517955195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">PARCOURIR SE LIT AUSSI. AUCUN OBJECTIF N’EST DESSINÉ ICI : 2015 EST</text><text x="46" y="870.3011390195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">UNE DATE, PAS UNE CIBLE.</text><text x="46" y="895.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="46" y="914" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">(2025), via Our World in Data</text><g><rect x="130.9078125" y="348.22586142989417" width="283.902490234375" height="26" fill="#ededed"></rect><rect x="130.9078125" y="348.22586142989417" width="39.207227653183" height="26" fill="#aac1d3"></rect><rect x="130.9078125" y="355.24586142989415" width="88.42675169338159" height="11.96" fill="#1F5C8B"></rect><text x="120.9078125" y="363.59402549239417" text-anchor="end" font-family="O