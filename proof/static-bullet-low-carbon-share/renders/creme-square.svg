<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Graphique à puces : la part du bas-carbone dans l’électricité de six pays européens, 2015 contre 2024, sur une piste allant jusqu’à 100 %. Pologne progresse de 13,8 % à 31,1 %, soit +17,3 points, et reste la seule des six sous la moitié."><rect x="0" y="0" width="540" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Pologne : +17,3 points de</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">bas-carbone</text><text x="52" y="182.0033607400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part du bas-carbone — nucléaire et renouvelables — dans la production</text><text x="52" y="200.8541681619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">électrique, en 2015 et en 2024. Pologne passe de 13,8 % à 31,1 %.</text><text x="52" y="423.64679808849496" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : la barre épaisse et pâle est 2015, la fine et saturée 2024. La</text><text x="52" y="442.49760551036997" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">piste va jusqu’à 100 %, si bien que ce qui reste à parcourir se lit aussi.</text><text x="52" y="469.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">(2025), via Our World in Data</text><g><rect x="133.11250646412373" y="250.4346023977687" width="274.6540950983763" height="13.478496538468148" fill="#edeadd"></rect><rect x="133.11250646412373" y="250.4346023977687" width="37.93001471565526" height="13.478496538468148" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="254.07379646315513" width="85.54616568803132" height="6.200108407695349" fill="#1757B6"></rect><text x="123.11250646412373" y="260.31009639454186" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Pologne</text><text x="417.7666015625" y="260.7260967607528" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">+17,3 pts</text></g><g><rect x="133.11250646412373" y="274.5033462164618" width="274.6540950983763" height="13.478496538468148" fill="#edeadd"></rect><rect x="133.11250646412373" y="274.5033462164618" width="120.28712367740738" height="13.478496538468148" fill="#a7bdd9"></rect><rect x="133.11250646412373" y="278.1425402818482" width="161.06350954719596" height="6.200108407695349" fill="#1757B6"></rect><text x="123.11250646412373" y="284.3788402132349" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Allemagne</text><text x="417.7666015625" y="284.79484057944586" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">+14,8 pts</text></g><g><rect x="133.11250646412373" y="298.57209003515493" width="274.6540950983763" height="13.478496538468148" fill="#edeadd"></rect><rect x="133.11250646412373" y="298.57209003515493" width="253.18941880502598" height="13.478496538468148" fill="#a7bdd9"></rect><r