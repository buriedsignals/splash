<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique à puces : la part du bas-carbone dans l’électricité de six pays européens, 2015 contre 2024, sur une piste allant jusqu’à 100 %. Pologne progresse de 13,8 % à 31,1 %, soit +17,3 points, et reste la seule des six sous la moitié."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.05" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">POLOGNE : +17,3 POINTS DE BAS-CARBONE</text><text x="56" y="145.09" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DEPUIS 2015, ET TOUJOURS LA SEULE DES</text><text x="56" y="184.13" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SIX SOUS LA MOITIÉ</text><text x="56" y="230.67000000000002" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Part du bas-carbone — nucléaire et renouvelables — dans la production électrique de chaque pays, en 2015 et en 2024. Pologne passe de 13,8 %</text><text x="56" y="248.79500000000002" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">à 31,1 % ; les trois pays déjà au-dessus de 95 % en 2015 gagnent moins d’un point chacun.</text><text x="56" y="423.625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : LA BARRE ÉPAISSE ET PÂLE EST 2015, LA FINE ET SATURÉE 2024 — DEUX ÉTATS D’UNE MÊME MESURE, DONC UNE</text><text x="56" y="441.75" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SEULE TEINTE À DEUX INTENSITÉS. LA PISTE VA JUSQU’À 100 %, SI BIEN QUE CE QUI RESTE À PARCOURIR SE LIT AUSSI.</text><text x="56" y="459.875" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">AUCUN OBJECTIF N’EST DESSINÉ ICI : 2015 EST UNE DATE, PAS UNE CIBLE.</text><text x="56" y="484" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><rect x="149.04000152610243" y="289.1355503580729" width="676.9259978983551" height="10.221400911458334" fill="#222151"></rect><rect x="149.04000152610243" y="289.1355503580729" width="93.48418072010756" height="10.221400911458334" fill="#295f73"></rect><rect x="149.04000152610243" y="291.89532860416665" width="210.84128949181277" height="4.7018444192708335" fill="#4FE0C0"></rect><text x="139.04000152610243" y="296.7462508138021" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">POLOGNE</text><text x="835.9659994244576" y="297.7392470296224" font-family="Montserrat" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">+17,3 pts</text></g><g><rect x="149.04000152610243" y="307.38805198567707" width="676.9259978983551" height="10.221400911458334" fill="#222151"></rect><rect x="149.04000152610243" y="307.38805198567707" width="296.4655640779238" height="10.221400911458334" fill="#295f73"></rect><rect x="149.04000152610243" y="310.1478302317708" width="396.96505120812026" height="4.7018444192708335" fill="#4FE0C0"></rect><text x="139.04000152610243" y="314.9987524414062" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#FFFFFF">ALLEMAGNE</text><text x="835.9659994244576" y="315.991748657