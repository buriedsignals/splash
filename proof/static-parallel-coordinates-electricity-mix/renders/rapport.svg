<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique en coordonnées parallèles : 16 pays européens, chacun une ligne traversant sept axes verticaux — nucléaire, éolien, solaire, hydraulique, bioénergie, gaz, charbon — chaque axe à sa propre échelle et portant sa part de la production du pays en 2024. Entre les deux premiers axes les lignes se croisent : 5 pays dépassent 25 % de nucléaire, 10 dépassent 20 % d’éolien, et seuls Finlande et Suède font les deux ; leurs lignes sont en couleur."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">2 pays sur 16 font les deux : plus de 25 % de nucléaire et</text><text x="46" y="123.99" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">plus de 20 % d’éolien</text><text x="46" y="167.33" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Chaque pays est une ligne qui traverse sept axes — sa part de chaque source dans sa propre électricité en 2024.</text><text x="46" y="186.18" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Chaque axe porte sa propre échelle, ajustée à sa propre colonne. Les deux premiers axes sont voisins parce que c’est</text><text x="46" y="205.03" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">là que se lit la revendication : 5 pays dépassent 25 % de nucléaire, 10 dépassent 20 % d’éolien, et 2 font les deux —</text><text x="46" y="223.88" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Finlande et Suède. La corrélation entre les deux parts est de -0,4.</text><text x="46" y="251.93398254394532" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">part de la production électrique du pays, en %, 2024</text><g><line x1="65.67749959230423" x2="65.67749959230423" y1="291.43001525878907" y2="421.75700439453124" stroke="#a6a6a6" stroke-width="1"></line><text x="65.67749959230423" y="270.36199157714844" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">Nucléaire</text></g><g><line x1="204.20291640857855" x2="204.20291640857855" y1="291.43001525878907" y2="421.75700439453124" stroke="#a6a6a6" stroke-width="1"></line><text x="204.20291640857855" y="270.36199157714844" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">Éolien</text></g><g><line x1="342.72833322485286" x2="342.72833322485286" y1="291.43001525878907" y2="421.75700439453124" stroke="#a6a6a6" stroke-width="1"></line><text x="342.72833322485286" y="270.36199157714844" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">Solaire</text></g><g><line x1="481.2537500411272" x2="481.2537500411272" y1="291.43001525878907" y2="421.75700439453124" stroke="#a6a6a6" stroke-width="1"></line><text x="481.2537500411272" y="270.36199157714844" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">Hydraulique</text></g><g><line x1="619.7791668574015" x2="619.7791668574015" y1="291.43001525878907" y2="421.75700439453124" stroke="#a6a6a6" stroke-width="1"></line><text x="619.7791668574015" y="270.36199157714844" text-anchor="middle" fon