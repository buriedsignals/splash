<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique en coordonnées parallèles : 16 pays européens, chacun une ligne traversant sept axes verticaux — nucléaire, éolien, solaire, hydraulique, bioénergie, gaz, charbon — chaque axe à sa propre échelle et portant sa part de la production du pays en 2024. Entre les deux premiers axes les lignes se croisent : 5 pays dépassent 25 % de nucléaire, 10 dépassent 20 % d’éolien, et seuls Finlande et Suède font les deux ; leurs lignes sont en couleur."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">2 pays sur 16 font les deux : plus de 25 % de nucléaire et plus de 20</text><text x="46" y="123.99" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">% d’éolien</text><text x="46" y="167.33" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Chaque pays est une ligne qui traverse sept axes — sa part de chaque source dans sa propre électricité en 2024. Chaque axe porte sa propre</text><text x="46" y="186.18" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">échelle, ajustée à sa propre colonne. Les deux premiers axes sont voisins parce que c’est là que se lit la revendication : 5 pays dépassent 25 %</text><text x="46" y="205.03" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">de nucléaire, 10 dépassent 20 % d’éolien, et 2 font les deux — Finlande et Suède. La corrélation entre les deux parts est de -0,4.<