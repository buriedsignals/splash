<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Graphique en coordonnées parallèles : 16 pays européens, chacun une ligne traversant sept axes verticaux — nucléaire, éolien, solaire, hydraulique, bioénergie, gaz, charbon — chaque axe à sa propre échelle et portant sa part de la production du pays en 2024. Entre les deux premiers axes les lignes se croisent : 5 pays dépassent 25 % de nucléaire, 10 dépassent 20 % d’éolien, et seuls Finlande et Suède font les deux ; leurs lignes sont en couleur."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">2 PAYS SUR 16 FONT</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LES DEUX : PLUS DE</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">25 % DE NUCLÉAIRE</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ET PLUS DE 20 %</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">D’ÉOLIEN</text><text x="56" y="311.2459059717773" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Chaque pays est une ligne qui traverse sept axes — sa part de chaque</text><text x="56" y="329.3716823389648" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">source dans sa propre électricité en 2024. Chaque axe porte sa propre</text><text x="56" y="347.4974587061523" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">échelle, ajustée à sa propre colonne. Les deux premiers axes sont voisins</text><text x="56" y="365.6232350733398" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">parce que c’est là que se lit la revendication : 5 pays dépassent 25 % de</text><text x="56" y="383.7490114405273" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">nucléaire, 10 dépassent 20 % d’éolien, et 2 font les deux — Finlande et</text><text x="56" y="401.87478780771477" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Suède. La corrélation entre les deux parts est de -0,4.</text><text x="56" y="429.1005641749023" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">part de la production électrique du pays, en %, 2024</text><g><line x1="78.31499968767166" x2="78.31499968767166" y1="476.0605251124023" y2="773.9452965435312" stroke="#646485" stroke-width="0.8"></line><text x="78.31499968767166" y="446.0905544092773" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Nucléaire</text></g><g><line x1="142.78249998291332" x2="142.78249998291332" y1="476.0605251124023" y2="773.9452965435312" stroke="#646485" stroke-width="0.8"></line><text x="142.78249998291332" y="457.0805446436523" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Éolien</text></g><g><line x1="207.25000027815497" x2="207.25000027815497" y1="476.0605251124023" y2="773.9452965435312" stroke="#646485" stroke-width="0.8"></line><text x="207.25000027815497" y="446.0905544092773" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Solaire</text></g><g><line x1="271.71750057339665" x2="271.71750057339665" y1="476.0605251124023" y2="773.9452965435312" stroke="#646485" stroke-width="0.8"></line><text x="271.71750057339665" y="457.0805446436523" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Hydraulique</text></g><g><line x1="336.1850008686383" x2="336.1850008686383" y1="476.0605251124023" y2="773.9452965435312" stroke="#646485" stroke-width="0.8"></line><text x="336.1850008686383" y="446.0905544092773" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Bioénergie</text></g><g><line x1="400.65250116388" x2="400.65250116388" y1="476.0605251124023" y2="773.9452965435312" stroke="#646485" stroke-width="0.8"></line><text x="400.65250116388" y="457.0805446436523" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Gaz</text></g><g><line x1="465.1200014591217" x2="465.1200014591217" y1="476.0605251124023" y2="773.9452965435312" stroke="#646485" stroke-width="0.8"></line><text x="465.1200014591217" y="446.0905544092773" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Charbon</text></g><path d="M 78.3 773.9 L 142.8 716.1 L 207.3 670.9 L 271.7 484.7 L 336.2 714.9 L 400.7 716.7 L 465.1 773.9" fill="none" stroke="#2d6e7c" stroke-width="0.8" stroke-linejoin="round"></path><path d="M 78.3 599.0 L 142.8 682.1 L 207.3 662.1 L 271.7 770.4 L 336.2 726.8 L 400.7 662.9 L 465.1 773.9" fill="none" stroke="#2d6e7c" stroke-width="0.8" stroke-linejoin="round"></path><path d="M 78.3