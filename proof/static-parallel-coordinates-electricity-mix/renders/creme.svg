<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique en coordonnées parallèles : 16 pays européens, chacun une ligne traversant sept axes verticaux — nucléaire, éolien, solaire, hydraulique, bioénergie, gaz, charbon — chaque axe à sa propre échelle et portant sa part de la production du pays en 2024. Entre les deux premiers axes les lignes se croisent : 5 pays dépassent 25 % de nucléaire, 10 dépassent 20 % d’éolien, et seuls Finlande et Suède font les deux ; leurs lignes sont en couleur."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">2 pays sur 16 font les deux : plus de 25 % de nucléaire et</text><text x="52" y="137.6" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">plus de 20 % d’éolien</text><text x="52" y="184.6" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Chaque pays est une ligne qui traverse sept axes — sa part de chaque source dans sa propre électricité en 2024. Chaque axe porte sa propre</text><text x="52" y="203.45" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">échelle, ajustée à sa propre colonne. Les deux premiers axes sont voisins parce que c’est là que se lit la revendication : 5 pays dépassent 25 %</text><text x="52" y="222.29999999999998" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">de nucléaire, 10 dépassent 20 % d’éolien, et 2 font les deux — Finlande et Suède. La corrélation entre les deux parts est de -0,4.</tex