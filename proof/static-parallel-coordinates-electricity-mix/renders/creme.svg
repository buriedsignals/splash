enir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Espagne</text></g><g><text x="760.4952503850063" y="333.4621276583972" text-anchor="start" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="none" stroke="#FFFCEE" stroke-width="3.4" stroke-linejoin="round">Royaume-Uni</text><text x="760.4952503850063" y="333.4621276583972" text-anchor="start" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Royaume-Uni</text></g><text x="52" y="410.8060034179688" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">En couleur : les pays qui passent les deux premiers seuils.</text><text x="52" y="430.865" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : seuls deux axes VOISINS se comparent — un croisement entre eux est une relation, une ligne qui monte</text><text x="52" y="449.065" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">trois axes plus loin n’est rien. L’ordre des axes est donc un choix, et il est dit ici : nucléaire et éolien côte à côte, le</text><text x="52" y="467.265" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">fossile au bout.</text><text x="52" y="488" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text></svg>