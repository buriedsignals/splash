<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique en coordonnées parallèles : 16 pays européens, chacun une ligne traversant sept axes verticaux — nucléaire, éolien, solaire, hydraulique, bioénergie, gaz, charbon — chaque axe à sa propre échelle et portant sa part de la production du pays en 2024. Entre les deux premiers axes les lignes se croisent : 5 pays dépassent 25 % de nucléaire, 10 dépassent 20 % d’éolien, et seuls Finlande et Suède font les deux ; leurs lignes sont en couleur."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">2 pays sur 16 font les deux : plus de 25 % de</text><text x="52" y="137.6" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">nucléaire et plus de 20 % d’éolien</text><text x="52" y="184.6" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Chaque pays est une ligne qui traverse sept axes — sa part de chaque source dans sa propre électricité en 2024. Chaque axe porte sa propre</text><text x="52" y="203.45" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">échelle, ajustée à sa propre colonne. Les deux premiers axes sont voisins parce que c’est là que se lit la revendication : 5 pays dépassent 25 % de</text><text x="52" y="222.29999999999998" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">nucléaire, 10 dépassent 20 % d’éolien, et 2 font les deux — Finlande et Suède. La corrélation entre les deux parts est de -0,4.</text><text x="52" y="253.7066955566406" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">part de la production électrique du pays, en %, 2024</text><g><line x1="71.48649982213973" x2="71.48649982213973" y1="293.2027282714844" y2="388.37799438476566" stroke="#a6a49b" stroke-width="1"></line><text x="71.48649982213973" y="272.13470458984375" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Nucléaire</text></g><g><line x1="208.08824993471302" x2="208.08824993471302" y1="293.2027282714844" y2="388.37799438476566" stroke="#a6a49b" stroke-width="1"></line><text x="208.08824993471302" y="272.13470458984375" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Éolien</text></g><g><line x1="344.6900000472863" x2="344.6900000472863" y1="293.2027282714844" y2="388.37799438476566" stroke="#a6a49b" stroke-width="1"></line><text x="344.6900000472863" y="272.13470458984375" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Solaire</text></g><g><line x1="481.2917501598596" x2="481.2917501598596" y1="293.2027282714844" y2="388.37799438476566" stroke="#a6a49b" stroke-width="1"></line><text x="481.2917501598596" y="272.13470458984375" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Hydraulique</text></g><g><line x1="617.8935002724329" x2="617.8935002724329" y1="293.2027282714844" y2="388.37799438476566" stroke="#a6a49b" stroke-width="1"></line><text x="617.8935002724329" y="272.13470458984375" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Bioénergie</text></g><g><line x1="754.495250385