<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Graphique en coordonnées parallèles : 16 pays européens, chacun une ligne traversant sept axes verticaux — nucléaire, éolien, solaire, hydraulique, bioénergie, gaz, charbon — chaque axe à sa propre échelle et portant sa part de la production du pays en 2024. Entre les deux premiers axes les lignes se croisent : 5 pays dépassent 25 % de nucléaire, 10 dépassent 20 % d’éolien, et seuls Finlande et Suède font les deux ; leurs lignes sont en couleur."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">2 pays sur 16 font les deux : plus</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">de 25 % de nucléaire et plus de 20</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">% d’éolien</text><text x="46" y="200.27299540641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Chaque pays est une ligne qui traverse sept axes — sa part de chaque</text><text x="46" y="219.12233890641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">source dans sa propre électricité en 2024. Chaque axe porte sa propre</text><text x="46" y="237.97168240641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">échelle, ajustée à sa propre colonne. Les deux premiers axes sont voisins</text><text x="46" y="256.8210259064109" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">parce que c’est là que se lit la revendication : 5 pays dépassent 25 % de</text><text x="46" y="275.67036940641094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">nucléaire, 10 dépassent 20 % d’éolien, et 2 font les deux — Finlande et</text><text x="46" y="294.5197129064109" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Suède. La corrélation entre les deux parts est de -0,4.</text><text x="46" y="322.6493298439109" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">part de la production électrique du pays, en %, 2024</text><g><line x1="66.118896484375" x2="66.118896484375" y1="374.7772595314109" y2="794.7848729429687" stroke="#a6a6a6" stroke-width="1"></line><text x="66.118896484375" y="341.1444470314109" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">Nucléaire</text></g><g><line x1="134.55916341145831" x2="134.55916341145831" y1="374.7772595314109" y2="794.7848729429687" stroke="#a6a6a6" stroke-width="1"></line><text x="134.55916341145831" y="353.6395642189109" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">Éolien</text></g><g><line x1="202.99943033854166" x2="202.99943033854166" y1="374.7772595314109" y2="794.7848729429687" stroke="#a6a6a6" stroke-width="1"></line><text x="202.99943033854166" y="341.1444470314109" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">Solaire</text></g><g><line x1="271.439697265625" x2="271.439697265625" y1="374.77725953