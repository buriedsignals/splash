italic" letter-spacing="0" fill="#5f5e58">Lecture : seuls deux axes VOISINS se comparent — un croisement</text><text x="52" y="832.0120928140625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">entre eux est une relation, une ligne qui monte trois axes plus loin</text><text x="52" y="850.2126986140626" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">n’est rien. L’ordre des axes est donc un choix, et il est dit ici : nucléaire</text><text x="52" y="868.4133044140625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">et éolien côte à côte, le fossile au bout.</text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">(2025), via Our World in Data</text></svg>