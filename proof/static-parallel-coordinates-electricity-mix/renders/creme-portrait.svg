<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Graphique en coordonnées parallèles : 16 pays européens, chacun une ligne traversant sept axes verticaux — nucléaire, éolien, solaire, hydraulique, bioénergie, gaz, charbon — chaque axe à sa propre échelle et portant sa part de la production du pays en 2024. Entre les deux premiers axes les lignes se croisent : 5 pays dépassent 25 % de nucléaire, 10 dépassent 20 % d’éolien, et seuls Finlande et Suède font les deux ; leurs lignes sont en couleur."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">2 pays sur 16 font les deux :</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">plus de 25 % de nucléaire et</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">plus de 20 % d’éolien</text><text x="52" y="221.2042130835547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Chaque pays est une ligne qui traverse sept axes — sa part de chaque</text><text x="52" y="240.0550205054297" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">source dans sa propre électricité en 2024. Chaque axe porte sa propre</text><text x="52" y="258.9058279273047" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">échelle, ajustée à sa propre colonne. Les deux premiers axes sont</text><text x="52" y="277.7566353491797" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">voisins parce que c’est là que se lit la revendication : 5 pays dépassent</text><text x="52" y="296.6074427710547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">25 % de nucléaire, 10 dépassent 20 % d’éolien, et 2 font les deux —</text><text x="52" y="315.4582501929297" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Finlande et Suède. La corrélation entre les deux parts est de -0,4.</text><text x="52" y="347.0263092017188" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">part de la production électrique du pays, en %, 2024</text><g><line x1="72.28017578125" x2="72.28017578125" y1="399.1542388892188" y2="771.1340424517394" stroke="#a6a49b" stroke-width="1"></line><text x="72.28017578125" y="365.5214263892188" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Nucléaire</text></g><g><line x1="138.689404296875" x2="138.689404296875" y1="399.1542388892188" y2="771.1340424517394" stroke="#a6a49b" stroke-width="1"></line><text x="138.689404296875" y="378.0165435767188" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Éolien</text></g><g><line x1="205.0986328125" x2="205.0986328125" y1="399.1542388892188" y2="771.1340424517394" stroke="#a6a49b" stroke-width="1"></line><text x="205.0986328125" y="365.5214263892188" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Solaire</text></g><g><line x1="271.50786132812505" x2="271.50786132812505" y1="399.1542388892188" y2="771.1340424517394" stroke="#a6a49b" stroke-width="1"></line><text x="271.50786132812505" y="378.0165435767188" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Hydraulique</text></g><g><line x1="337.91708984375" x2="337.91708984375" y1="399.1542388892188" y2="771.1340424517394" stroke="#a6a49b" stroke-width="1"></line><text x="337.91708984375" y="365.5214263892188" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Bioénergie</text></g><g><line x1="404.326318359375" x2="404.326318359375" y1="399.1542388892188" y2="771.1340424517394" stroke="#a6a49b" stroke-width="1"></line><text x="404.326318359375" y="378.0165435767188" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Gaz</text></g><g><line x1="470.73554687500007" x2="470.73554687500007" y1="399.1542388892188" y2="771.1340424517394" stroke="#a6a49b" stroke-width="1"></line><text x="470.73554687500007" y="365.5214263892188" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Charbon</text></g><path d="M 72.3 771.1 L 138.7 698.9 L 205.1 642.5 L 271.5 410.0 L 337.9 697.3 L 404.3 699.6 L 470.7 771.1" fill="none" stroke="#7c92af" stroke-width="1" stroke-linejoin="round"></path><path d="M 72.3 552.7 L 138.7 656.5 L 205.1 631.5 L 271.5 766.6 L 337.9 712.2 L 404.3 632.4 L 470.7 771.1" fill="none" stroke="#7c92af" stroke-width="1" stroke-linejoin="round"></path><path d="M 72.3 554.4 L 138.7 765.4 L 205.1 710.0 L 271.5 748.5 L 337.9 679.5 L 404.3 732.4 L 470.7 545.3" fill="none" stroke="#7c92af" stroke-width="1" stroke-linejoin="round"></path><path d="M 72.3 771.1 L 138.7 410.2 L 205.1 637.5 L 271.5 770.8 L 337.9 521.4 L 404.3 751.8 L 470.7 740.2" fill="none" stroke="#7c92af" stroke-width="1" stroke-linejoin="round"></path><p