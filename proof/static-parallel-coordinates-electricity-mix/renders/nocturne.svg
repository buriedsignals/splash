<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique en coordonnées parallèles : 16 pays européens, chacun une ligne traversant sept axes verticaux — nucléaire, éolien, solaire, hydraulique, bioénergie, gaz, charbon — chaque axe à sa propre échelle et portant sa part de la production du pays en 2024. Entre les deux premiers axes les lignes se croisent : 5 pays dépassent 25 % de nucléaire, 10 dépassent 20 % d’éolien, et seuls Finlande et Suède font les deux ; leurs lignes sont en couleur."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.05" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">2 PAYS SUR 16 FONT LES DEUX : PLUS DE 25</text><text x="56" y="145.09" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">% DE NUCLÉAIRE ET PLUS DE 20 %</text><text x="56" y="184.13" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">D’ÉOLIEN</text><text x="56" y="233.17000000000002" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Chaque pays est une ligne qui traverse sept axes — sa part de chaque source dans sa propre électricité en 2024. Chaque axe porte sa propre</text><text x="56" y="251.29500000000002" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">échelle, ajustée à sa propre colonne. Les deux premiers axes sont voisins parce que c’est là que se lit la revendication : 5 pays dépassent 25 % de</text><text x="56" y="269.42" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">nucléaire, 10 dépassent 20 % d’éolien, et 2 font les deux — Finlande et Suède. La corrélation entre les deux parts est de -0,4.</text><text x="56" y="296.64500000000004" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">part de la production électrique du pays, en %, 2024</text><g><line x1="78.31499968767166" x2="78.31499968767166" y1="332.61497070312504" y2="400.072509765625" stroke="#646485" stroke-width="0.8"></line><text x="78.31499968767166" y="313.63499023437504" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Nucléaire</text></g><g><line x1="212.78249998291335" x2="212.78249998291335" y1="332.61497070312504" y2="400.072509765625" stroke="#646485" stroke-width="0.8"></line><text x="212.78249998291335" y="313.63499023437504" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Éolien</text></g><g><line x1="347.250000278155" x2="347.250000278155" y1="332.61497070312504" y2="400.072509765625" stroke="#646485" stroke-width="0.8"></line><text x="347.250000278155" y="313.63499023437504" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Solaire</text></g><g><line x1="481.7175005733967" x2="481.7175005733967" y1="332.61497070312504" y2="400.072509765625" stroke="#646485" stroke-width="0.8"></line><text x="481.7175005733967" y="313.63499023437504" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Hydraulique</text></g><g><line x1="616.1850008686383" x2="616.1850008686383" y1="332.61497070312504" y2="400.072509765625" stroke="#646485" stroke-width="0.8"></line><text x="616.1850008686383" y="313.63499023437504" text-anchor="middle" font-family