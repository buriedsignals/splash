<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Treemap de la puissance bas-carbone installée en Europe : un rectangle par pays, sa surface proportionnelle à ses mégawatts, sur 469 GW au total. La France occupe le plus grand rectangle avec 97,2 GW. Les 10 pays où l’éolien et le solaire dépassent déjà la moitié de la puissance bas-carbone sont en couleur et pèsent 14,0 % du total ; le plus grand rectangle n’en fait pas partie. Chaque case porte sa puissance et son nombre de centrales."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">L’eau et l’atome portent</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">encore 77 % du bas-carbone</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">européen — mais 10 pays ont</text><text x="52" y="210.80422262890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">déjà basculé</text><text x="52" y="257.80553908355466" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Un rectangle par pays, sa surface est sa puissance bas-carbone installée</text><text x="52" y="276.65634650542967" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">: 469 GW en tout, sur 8 900 centrales. Les rectangles en couleur sont les</text><text x="52" y="295.50715392730467" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">10 pays où l’éolien et le solaire font déjà plus de la moitié de cette</text><text x="52" y="314.3579613491797" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">puissance — 14,0 % du total européen. Le plus grand rectangle, la</text><text x="52" y="333.2087687710547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">France, n’en fait pas partie : 14 % seulement.</text><text x="52" y="365.98678871734376" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">puissance bas-carbone installée</text><g><rect x="52" y="372.62936684234376" width="155.5685945809258" height="240.88167836945246" fill="#e6e3d6" stroke="#FFFCEE" stroke-width="1"></rect><text x="56" y="387.33737465484376" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#000000">97,2 GW</text><text x="56" y="402.7233915005469" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#000000">France</text><text x="56" y="417.0859403286719" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#4f4d4a">2 069 centrales</text></g><g><rect x="52" y="614.5110452117963" width="155.5685945809258" height="176.5222597252431" fill="#e6e3d6" stroke="#FFFCEE" stroke-width="1"></rect><text x="56" y="629.2190530242963" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#000000">71,4 GW</text><text x="56" y="644.6050698699994" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#000000">25 autres pays</text><text x="56" y="658.9676186981244" font-family="Open Sans" font-size="11" font-weight="500" fo