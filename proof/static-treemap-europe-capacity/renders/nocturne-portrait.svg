-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SUIT UN FIL, PAS UN MAXIMUM.</text><text x="56" y="885.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : WRI Global Power Plant Database v1.3.0 · puissance installée,</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">non production</text></svg>