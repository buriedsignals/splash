<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Treemap de la puissance bas-carbone installée en Europe : un rectangle par pays, sa surface proportionnelle à ses mégawatts, sur 469 GW au total. La France occupe le plus grand rectangle avec 97,2 GW. Les 10 pays où l’éolien et le solaire dépassent déjà la moitié de la puissance bas-carbone sont en couleur et pèsent 14,0 % du total ; le plus grand rectangle n’en fait pas partie. Chaque case porte sa puissance et son nombre de centrales."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">L’EAU ET L’ATOME</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PORTENT ENCORE 77</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">% DU BAS-CARBONE</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">EUROPÉEN — MAIS 10</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PAYS ONT DÉJÀ</text><text x="56" y="301.24591515" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">BASCULÉ</text><text x="56" y="350.2851123717773" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Un rectangle par pays, sa surface est sa puissance bas-carbone installée :</text><text x="56" y="368.4108887389648" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">469 GW en tout, sur 8 900 centrales. Les rectangles en couleur sont les 10</text><text x="56" y="386.5366651061523" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">pays où l’éolien et le solaire font déjà plus de la moitié de cette puissance</text><text x="56" y="404.6624414733398" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">— 14,0 % du total européen. Le plus grand rectangle, la France, n’en fait</text><text x="56" y="422.7882178405273" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">pas partie : 14 % seulement.</text><text x="56" y="451.0240039733398" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">puissance bas-carbone installée</text><g><rect x="56" y="457.0139942077148" width="173.00691829420364" height="169.1069183509521" fill="#292857" stroke="#111044" stroke-width="1"></rect><text x="60" y="470.81398200068355" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#FFFFFF">97,2 GW</text><text x="60" y="482.6279773620117" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#FFFFFF">FRANCE</text><text x="60" y="494.6279773620117" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#b6b6c5">2 069 centrales</text></g><g><rect x="56" y="627.1209125586669" width="173.00691829420364" height="162.82358361236433" fill="#292857" stroke="#111044" stroke-width="1"></rect><text x="60" y="640.9209003516356" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#FFFFFF">93,6 GW</text><text x="60" y="652.7348957129637" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#FFFFFF">27 AUTRES PAYS</text><text x="60" y="664.7348957129637" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#b6b6c5">1 283 centrales</text></g><g><rect x="230.00691829420364" y="457.0139942077148" width="140.47890975400747" height="103.96346457977133" fill="#4FE0C0" stroke="#111044" stroke-width="1"></rect><text x="234.00691829420364" y="470.81398200068355" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#111044">48,8 GW</text><text x="234.00691829420364" y="482.6279773620117" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#111044">ROYAUME-UNI</text><text x="234.00691829420364" y="494.6279773620117" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#26576d">2 309 centrales</text></g><g><rect x="371.48582804821115" y="457.0139942077148" width="111.51417195178888" height="103.96346457977133" fill="#292857" stroke="#111044" stroke-width="1"></rect><text x="375.48582804821115" y="470.81398200068355" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#FFFFFF">38,8 GW</text><text x="375.48582804821115" y="482.6279773620117" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#FFFFFF">ESPAGNE</text><text x="375.48582804821115" y="494.6279773620117" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#b6b6c5">704 centrales</text></g><g><rect x="230.00691829420364" y="561.9774587874862" width="87.82501394707062" height="117.72950114631404" fill="#292857" stroke="#111044" stroke-width="1"></rect><text x="234.00691829420364" y="575.