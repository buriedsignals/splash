ght="100.85052684165552" fill="#292857" stroke="#111044" stroke-width="1"></rect><text x="415.78580673916485" y="575.7774465804549" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#FFFFFF">24,2 GW</text><text x="415.78580673916485" y="587.591441941783" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#FFFFFF">SUÈDE</text></g><g><rect x="318.8319322412743" y="663.8279856291417" width="88.23804016058216" height="68.1872273494041" fill="#292857" stroke="#111044" stroke-width="1"></rect><text x="322.8319322412743" y="677.6279734221105" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#FFFFFF">20,3 GW</text><text x="322.8319322412743" y="689.4419687834386" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#FFFFFF">UKRAINE</text><text x="322.8319322412743" y="701.4419687834386" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#b6b6c5">41 centrales</text></g><g><rect x="318.8319322412743" y="733.0152129785458" width="88.23804016058216" height="56.92928319248551" fill="#4FE0C0" stroke="#111044" stroke-width="1"></rect><text x="322.8319322412743" y="746.8152007715146" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#111044">17,0 GW</text><text x="322.8319322412743" y="758.6291961328427" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#111044">9 PAYS</text><text x="322.8319322412743" y="767.6291961328427" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#111044">BASCULÉS</text><text x="322.8319322412743" y="779.6291961328427" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#26576d">58