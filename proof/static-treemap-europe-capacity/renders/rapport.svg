<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Treemap de la puissance bas-carbone installée en Europe : un rectangle par pays, sa surface proportionnelle à ses mégawatts, sur 469 GW au total. La France occupe le plus grand rectangle avec 97,2 GW. Les 10 pays où l’éolien et le solaire dépassent déjà la moitié de la puissance bas-carbone sont en couleur et pèsent 14,0 % du total ; le plus grand rectangle n’en fait pas partie. Chaque case porte sa puissance et son nombre de centrales."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’eau et l’atome portent encore 77 % du bas-carbone</text><text x="46" y="123.99" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">européen — mais 10 pays ont déjà basculé</text><text x="46" y="167.33" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Un rectangle par pays, sa surface est sa puissance bas-carbone installée : 469 GW en tout, sur 8 900 centrales. Les</text><text x="46" y="186.18" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">rectangles en couleur sont les 10 pays où l’éolien et le solaire font déjà plus de la moitié de cette puissance — 14,0 % du</text><text x="46" y="205.03" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">total européen. Le plus grand rectangle, la France, n’en fait pas partie : 14 % seulement.</text><text x="46" y="234.23196228027342" font-family="Avenir Next" f