<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Barres empilées : pour les 12 pays européens qui ont le plus ajouté, l’électricité bas-carbone produite en 2000 puis ce qui y a été ajouté d’ici 2024, en TWh. L’Espagne a le plus ajouté, 119 TWh, en partant de 97 ; la France a ajouté 50 en partant de 483 et reste le premier producteur avec 533 TWh. Aucun pays n’a reculé."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">L’Espagne a ajouté plus d’électricité bas-carbone</text><text x="52" y="137.6" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">que la France depuis 2000</text><text x="52" y="183.29999999999998" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Électricité bas-carbone produite en 2000 et ce qui y a été ajouté d’ici 2024, en TWh : les 12 qui ont le plus ajouté sur 16 pays étudiés, qui ont</text><text x="52" y="202.14999999999998" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">tous progressé. L’Espagne a ajouté 119, la France 50.</text><text x="52" y="488" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><g><rect x="161.34399896860123" y="222.99999999999997" width="7.7271972656250005" height="7.7271972656250005" fill="#a7bdd9"></rect><text x="175.07119623422622" y="230.72719726562497" font-family="Superclarendon" font-si