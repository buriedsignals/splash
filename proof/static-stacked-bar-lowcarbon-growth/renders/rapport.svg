<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Barres empilées : pour les 12 pays européens qui ont le plus ajouté, l’électricité bas-carbone produite en 2000 puis ce qui y a été ajouté d’ici 2024, en TWh. L’Espagne a le plus ajouté, 119 TWh, en partant de 97 ; la France a ajouté 50 en partant de 483 et reste le premier producteur avec 533 TWh. Aucun pays n’a reculé."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’Espagne a ajouté plus d’électricité bas-carbone que la</text><text x="46" y="123.99" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">France depuis 2000</text><text x="46" y="166.03" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Électricité bas-carbone — renouvelables et nucléaire réunis — produite en 2000, et ce que chaque pays y a ajouté d’ici</text><text x="46" y="184.88" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">2024, en TWh. L’Espagne partait 5 fois plus bas que la France et en a ajouté 119 contre 50 ; la France reste de loin le</text><text x="46" y="203.73" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">premier producteur, à 533 TWh. Les 12 qui ont le plus ajouté sur 16 pays étudiés ; les 4 autres (Autriche, Grèce,</text><text x="46" y="222.57999999999998" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Irlande, Belgique) ont aussi progressé.</text><text x="46" y="447.15" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE BARRE EST UN PAYS. LE SEGMENT PÂLE EST SA PRODUCTION BAS-CARBONE DE 2000, LE SEGMENT PLEIN CE QU’IL A</text><text x="46" y="461.15" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">AJOUTÉ DEPUIS ; LE TOTAL DE 2024 EST ÉCRIT AU BOUT. RIEN À ADDITIONNER : CHAQUE SEGMENT PORTE SON PROPRE NOMBRE.</text><text x="46" y="494" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><g><rect x="143.00999110937119" y="243.43" width="5.6639892578125" height="5.6639892578125" fill="#aac1d3"></rect><text x="154.67398036718367" y="249.0939892578125" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#697883">PRODUIT EN 2000</text></g><g><rect x="276.96998221874236" y="243.43" width="5.6639892578125" height="5.6639892578125" fill="#1F5C8B"></rect><text x="288.63397147655485" y="249.0939892578125" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">AJOUTÉ DEPUIS</text></g><text x="914" y="249.0939892578125" text-anchor="end" font-family="Avenir Next" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">TWh</text></g><g><text x="133.00999110937119" y="270.5099776204427" text-anchor="end" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">ESPAGNE</text><rect x="143.00999110937119" y="262.90998046875" width="121.2617148735269" height="10.520001627604165" fill="#aac1d3"></rect><rect x="264.2717059828981" y="262.90998046875" width="149.1130353217278" height="10.520001