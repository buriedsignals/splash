<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Barres empilées : pour les 12 pays européens qui ont le plus ajouté, l’électricité bas-carbone produite en 2000 puis ce qui y a été ajouté d’ici 2024, en TWh. L’Espagne a le plus ajouté, 119 TWh, en partant de 97 ; la France a ajouté 50 en partant de 483 et reste le premier producteur avec 533 TWh. Aucun pays n’a reculé."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’Espagne a ajouté plus d’électricité bas-carbone que la France</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">depuis 2000</text><text x="46" y="166.03308223926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Électricité bas-carbone — renouvelables et nucléaire réunis — produite en 2000, et ce que chaque pays y a ajouté d’ici 2024, en TWh.</text><text x="46" y="184.88242573926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">L’Espagne partait 5 fois plus bas que la France et en a ajouté 119 contre 50 ; la France reste de loin le premier producteur, à 533 TWh. Les 12</text><text x="46" y="203.73176923926093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">qui ont le plus ajouté sur 16 pays étudiés ; les 4 autres (Autriche, Grèce, Irlande, Belgique) ont aussi progressé.</text><text x="46" y="447.15171118750004" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE BARRE EST UN PAYS. LE SEGMENT PÂLE EST SA PRODUCTION BAS-CARBONE DE 2000, LE SEGMENT PLEIN CE QU’IL A AJOUTÉ</text><text x="46" y="461.15118384375006" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">DEPUIS ; LE TOTAL DE 2024 EST ÉCRIT AU BOUT. RIEN À ADDITIONNER : CHAQUE SEGMENT PORTE SON PROPRE NOMBRE.</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><g><rect x="142.6064453125" y="224.58111273926093" width="5.7109375" height="5.7109375" fill="#aac1d3"></rect><text x="154.3173828125" y="230.29205023926093" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#697883">PRODUIT EN 2000</text></g><g><rect x="273.139453125" y="224.58111273926093" width="5.7109375" height="5.7109375" fill="#1F5C8B"></rect><text x="284.850390625" y="230.29205023926093" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">AJOUTÉ DEPUIS</text></g><text x="914" y="230.29205023926093" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">TWh</text></g><g><text x="132.6064453125" y="252.53323554382624" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">ESPAGNE</text><rect x="142.6064453125" y="244.12212836426093" width="122.52649851749783" height="12.085886234130605" fill="#aac1d3"></rect><rect x="265.1329438299978" y="244.12212836426093" width="150.66831374059637" height="12.085886234130605" fill="#1F5C8B"></rect><text x="203.8696945712489" y="252.53323554382624" text-anchor="middle" font-fami