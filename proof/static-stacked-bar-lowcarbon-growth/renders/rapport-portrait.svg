<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Barres empilées : pour les 12 pays européens qui ont le plus ajouté, l’électricité bas-carbone produite en 2000 puis ce qui y a été ajouté d’ici 2024, en TWh. L’Espagne a le plus ajouté, 119 TWh, en partant de 97 ; la France a ajouté 50 en partant de 483 et reste le premier producteur avec 533 TWh. Aucun pays n’a reculé."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’Espagne a ajouté plus</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">d’électricité bas-carbone que la</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">France depuis 2000</text><text x="46" y="198.97427563926092" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Électricité bas-carbone — renouvelables et nucléaire réunis — produite</text><text x="46" y="217.82361913926093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">en 2000, et ce que chaque pays y a ajouté d’ici 2024, en TWh. L’Espagne</text><text x="46" y="236.6729626392609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">partait 5 fois plus bas que la France et en a ajouté 119 contre 50 ; la</text><text x="46" y="255.5223061392609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">France reste de loin le premier producteur, à 533 TWh. Les 12 qui ont le</text><text x="46" y="274.3716496392609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">plus ajouté sur 16 pays étudiés ; les 4 autres (Autriche, Grèce, Irlande,</text><text x="46" y="293.22099313926094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Belgique) ont aussi progressé.</text><text x="46" y="820.303422375" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE BARRE EST UN PAYS. LE SEGMENT PÂLE EST SA</text><text x="46" y="834.3028950312499" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">PRODUCTION BAS-CARBONE DE 2000, LE SEGMENT PLEIN CE QU’IL A</text><text x="46" y="848.3023676875" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">AJOUTÉ DEPUIS ; LE TOTAL DE 2024 EST ÉCRIT AU BOUT. RIEN À</text><text x="46" y="862.30184034375" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">ADDITIONNER : CHAQUE SEGMENT PORTE SON PROPRE NOMBRE.</text><text x="46" y="895.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="46" y="914" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">(2025), via Our World in Data</text><g><g><rect x="142.6064453125" y="314.0703366392609" width="5.7109375" height="5.7109375" fill="#aac1d3"></rect><text x="154.3173828125" y="319.7812741392609" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#697883">PRODUIT EN 2000</text></g><g><rect x="273.139453125" y="314.0703366392609" width="5.7109375" height="5.7109375" fill="#1F5C8B"></rect><text x="284.850390625" y="319.7812741392609" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">AJOUTÉ DEPUIS</text></g><text x="494" y="319.7812741392609" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">TWh</text></g><g><text x="132.6064453125" y="353.8417297474721" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">ESPAGNE</text><rect x="142.6064453125" y="343.7030578724721" width="45.07185661434983" height="15.541015625" fill="#aac1d3"></rect><rect x="187.67830192684983" y="343.7030578724721" width="55.423934539941484" height="15.541015625" fill="#1F5C8B"></rect><text x="165.1423736196749" y="353.8417297474721" text-anchor="middle" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#000000">97</text><text x="215.39026919682055" y="353.8417297474721" text-anchor="middle" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#d1d1d1">119</text><text x="494" text-anchor="end" y="354.9074035755971" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">216</text></g><g><text x="132.6064453125" y="393.56615658889433" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">ROYAUME-UNI</text><rect x="142.6064453125" y="383.42748471389433" width="44.26550385382424" height="15.541015625" fill="#aac1d3"></rect><rect x="186.87194916632424" y="383.42748471389433" width="41.734581605469344" height="15.541015625" fill="#1F5C8B"></rect><text x="164.73919723