<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Barres empilées : pour les 12 pays européens qui ont le plus ajouté, l’électricité bas-carbone produite en 2000 puis ce qui y a été ajouté d’ici 2024, en TWh. L’Espagne a le plus ajouté, 119 TWh, en partant de 97 ; la France a ajouté 50 en partant de 483 et reste le premier producteur avec 533 TWh. Aucun pays n’a reculé."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">L’ESPAGNE A AJOUTÉ</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PLUS D’ÉLECTRICITÉ</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">BAS-CARBONE QUE</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LA FRANCE DEPUIS</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">2000</text><text x="56" y="309.9970399800781" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Électricité bas-carbone — renouvelables et nucléaire réunis — produite</text><text x="56" y="328.1228163472656" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">en 2000, et ce que chaque pays y a ajouté d’ici 2024, en TWh. L’Espagne</text><text x="56" y="346.24859271445314" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">partait 5 fois plus bas que la France et en a ajouté 119 contre 50 ; la</text><text x="56" y="364.3743690816406" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">France reste de loin le premier producteur, à 533 TWh. Les 12 qui ont le</text><text x="56" y="382.5001454488281" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">plus ajouté sur 16 pays étudiés ; les 4 autres (Autriche, Grèce, Irlande,</text><text x="56" y="400.6259218160156" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Belgique) ont aussi progressé.</text><text x="56" y="797.7473722656249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE BARRE EST UN PAYS. LE SEGMENT PÂLE EST</text><text x="56" y="811.7475872656249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SA PRODUCTION BAS-CARBONE DE 2000, LE SEGMENT PLEIN</text><text x="56" y="825.747802265625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">CE QU’IL A AJOUTÉ DEPUIS ; LE TOTAL DE 2024 EST ÉCRIT AU</text><text x="56" y="839.7480172656249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">BOUT. RIEN À ADDITIONNER : CHAQUE SEGMENT PORTE SON</text><text x="56" y="853.7482322656249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">PROPRE NOMBRE.</text><text x="56" y="885.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">(2025), via Our World in Data</text><g><g><rect x="160.37999415397644" y="420.7516981832031" width="5.6000000000000005" height="5.6000000000000005" fill="#295f73"></rect><text x="171.97999415397643" y="426.3516981832031" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#618997">PRODUIT EN 2000</text></g><g><rect x="304.96999044418334" y="420.7516981832031" width="5.6000000000000005" height="5.6000000000000005" fill="#4FE0C0"></rect><text x="316.56999044418336" y="426.3516981832031" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">AJOUTÉ DEPUIS</text></g><text x="484" y="426.3516981832031" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">TWh</text></g><g><text x="150.37999415397644" y="454.7515352584498" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">ESPAGNE</text><rect x="160.37999415397644" y="444.7515352584498" width="39.0308002684867" height="15" fill="#295f73"></rect><rect x="199.41079442246314" y="444.7515352584498" width="47.995371871000515" height="15" fill="#4FE0C0"></rect><text x="179.8953942882198" y="454.7515352584498" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#ffffff">97</text><text x="223.4084803579634" y="454.7515352584498" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#525252">119</text><text x="484" text-anchor="end" y="455.7445314742701" font-family="Montserrat" font-size="14" font-weight="700" font-style="normal" letter-spacing=