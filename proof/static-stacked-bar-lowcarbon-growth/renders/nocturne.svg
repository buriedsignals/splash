<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Barres empilées : pour les 12 pays européens qui ont le plus ajouté, l’électricité bas-carbone produite en 2000 puis ce qui y a été ajouté d’ici 2024, en TWh. L’Espagne a le plus ajouté, 119 TWh, en partant de 97 ; la France a ajouté 50 en partant de 483 et reste le premier producteur avec 533 TWh. Aucun pays n’a reculé."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Futura" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.05" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">L’ESPAGNE A AJOUTÉ PLUS D’ÉLECTRICITÉ</text><text x="56" y="145.09" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">BAS-CARBONE QUE LA FRANCE DEPUIS 2000</text><text x="56" y="192.88" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Électricité bas-carbone — renouvelables et nucléaire réunis — produite en 2000, et ce que chaque pays y a ajouté d’ici 2024, en TWh. L’Espagne</text><text x="56" y="211.005" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">partait 5 fois plus bas que la France et en a ajouté 119 contre 50 ; la France reste de loin le premier producteur, à 533 TWh. Les 12 qui ont le plus</text><text x="56" y="229.13" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">ajouté sur 16 pays étudiés ; les 4 autres (Autriche, Grèce, Irlande, Belgique) ont aussi progressé.</text><text x="56" y="484" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy I