<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Barres empilées : pour les 12 pays européens qui ont le plus ajouté, l’électricité bas-carbone produite en 2000 puis ce qui y a été ajouté d’ici 2024, en TWh. L’Espagne a le plus ajouté, 119 TWh, en partant de 97 ; la France a ajouté 50 en partant de 483 et reste le premier producteur avec 533 TWh. Aucun pays n’a reculé."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">L’Espagne a ajouté plus</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">d’électricité bas-carbone que</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">la France depuis 2000</text><text x="52" y="219.9053924521875" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Électricité bas-carbone — renouvelables et nucléaire réunis — produite</text><text x="52" y="238.7561998740625" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">en 2000, et ce que chaque pays y a ajouté d’ici 2024, en TWh. L’Espagne</text><text x="52" y="257.6070072959375" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">partait 5 fois plus bas que la France et en a ajouté 119 contre 50 ; la</text><text x="52" y="276.4578147178125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">France reste de loin le premier producteur, à 533 TWh. Les 12 qui ont le</text><text x="52" y="295.3086221396875" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">plus ajouté sur 16 pays étudiés ; les 4 autres (Autriche, Grèce, Irlande,</text><text x="52" y="314.1594295615625" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Belgique) ont aussi progressé.</text><text x="52" y="797.4959619562501" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque barre est un pays. Le segment pâle est sa production</text><text x="52" y="815.69656775625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">bas-carbone de 2000, le segment plein ce qu’il a ajouté depuis ; le total</text><text x="52" y="833.8971735562501" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">de 2024 est écrit au bout. Rien à additionner : chaque segment porte</text><text x="52" y="852.09777935625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">son propre nombre.</text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">(2025), via Our World in Data</text><g><g><rect x="150.5670126080513" y="335.0102369834375" width="7.826000976562501" height="7.826000976562501" fill="#a7bdd9"></rect><text x="164.3930135846138" y="342.83623796" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#687587">produit en 2000</text></g><g><rect x="276.5323494076729" y="335.0102369834375" width="7.826000976562501" height="7.826000976562501" fill="#1757B6"></rect><text x="290.3583503842354" y="342.83623796" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">ajouté depuis</text></g><text x="488" y="342.83623796" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">TWh</text></g><g><text x="140.5670126080513" y="377.17205514544236" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Espagne</text><rect x="150.5670126080513" y="364.38955392473923" width="41.52859368812102" height="19.292510986328125" fill="#a7bdd9"></rect><rect x="192.09560629617232" y="364.38955392473923" width="51.06685703675768" height="19.292510986328125" fill="#1757B6"></rect><text x="171.3313094521118" y="377.17205514544236" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#000000">97</text><text x="217.62903481455118" y="377.17205514544236" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#d6d6d6">119</text><text x="488" text-anchor="end" y="377.5880555116533" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">216</text></g><g><text x="140.5670126080513" y="412.6381780417177" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Royaume-Uni</text><rect x="150.5670126080513" y="399.8556768210146" width="40.785631257092575" height="19.292510986328125" fill="#a7bdd9"></rect><rect x="191.35264386514388" y="399.8556768210146" width="38.45367403137908" height="19.292