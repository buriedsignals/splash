<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Six anneaux, un par pays, où un tour complet vaut 100 % du CO₂ mondial. Sur chaque anneau, un arc pour 2000 et un arc concentrique pour 2023. La Chine passe de 14,7 à 32,9 % du total mondial et les États-Unis de 24,4 à 13,3 % : les deux ont échangé leurs places. Sous chaque anneau, les tonnes des deux années, parce que le total mondial a grossi de 50 % entre-temps."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="36" y="45.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="36" y="81.05023239746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">En 2000 les États-Unis émettaient</text><text x="36" y="113.99142579746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">un quart du CO₂ mondial et la Chine</text><text x="36" y="146.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">un septième ; en 2023, c’est l’inverse</text><text x="36" y="190.27299540641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Un anneau par pays : l’arc gris est sa part du CO₂ mondial en 2000, l’arc</text><text x="36" y="209.12233890641096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">plein sa part en 2023, et un tour complet vaut 100 % du monde — la même</text><text x="36" y="227.97168240641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">échelle sur les six anneaux. La Chine passe de 14,7 à 32,9 %, les États-Unis</text><text x="36" y="246.82102590641094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">de 24,4 à 13,3 %. Mais le total mondial a grossi de 50 % entre les deux dates</text><text x="36" y="265.67036940641094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">: une part qui rétrécit n’est pas un chiffre qui baisse, et les tonnes sont</text><text x="36" y="284.519712906411" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">écrites sous chaque anneau.</text><text x="36" y="313.14542359391095" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">part du CO₂ mondial — un tour complet = 100 %</text><g><circle cx="153" cy="380.8298308998086" r="61.04182918089764" fill="none" stroke="#e8e8e8" stroke-width="5"></circle><circle cx="153" cy="380.8298308998086" r="53.54182918089764" fill="none" stroke="#e8e8e8" stroke-width="5"></circle><path d="M 153.00 319.79 A 61.04182918089764 61.04182918089764 0 0 1 201.79 344.14" fill="none" stroke="#929292" stroke-width="5" stroke-linecap="butt"></path><path d="M 153.00 327.29 A 53.54182918089764 53.54182918089764 0 0 1 200.09 406.31" fill="none" stroke="#1F5C8B" stroke-width="5" stroke-linecap="butt"></path><circle cx="153" cy="380.8298308998086" r="31.6951904296875" fill="none" stroke="#1e5a88" stroke-width="0.6"></circle><text x="153" y="384.2636687904336" text-anchor="middle" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">32,9 %</text><text x="153" y="457.01033195570625" text-anchor="middle" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">CHINE</text><text x="153" y="472.26521476820625" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">2000 · 3,6 Gt</text><text x="153" y="484.76033195570625" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">2023 · 12,2 Gt</text></g><g><circle cx="387" cy="380.8298308998086" r="61.04182918089764" fill="none" stroke="#e8e8e8" stroke-width="5"></circle><circle cx="387" cy="380.8298308998086" r="53.54182918089764" fill="none" stroke="#e8e8e8" stroke-width="5"></circle><path d="M 387.00 319.79 A 61.04182918089764 61.04182918089764 0 0 1 447.99 378.39" fill="none" stroke="#929292" stroke-width="5" stroke-linecap="butt"></path><path d="M 387.00 327.29 A 53.54182918089764 53.54182918089764 0 0 1 426.70 344.90" fill="none" stroke="#1F5C8B" stroke-width="5" stroke-linecap="butt"></path><text x="387" y="384.2636687904336" text-anchor="middle" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#000000">13,3 %</text><text x="387" y="457.01033195570625" text-anchor="middle" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">ÉTATS-UNIS</text><text x="387" y="472.26521476820625" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">2000 · 6,0 Gt</text><text x="387" y="484.76033195570625" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">2023 · 4,9 Gt</text></g><g><circle cx="153" cy="556.4447392616039" r="61.04182918089764" fill="none" stroke="#e8e8e8" stroke-width="5"></circle><circle cx="153" cy="556.4447392616039" r="53.54182918089764" fill="none" stroke="#e8e8e8" stroke-width="5"></circle><path d="M 153.00 495.40 A 61.04182918089764 61.04182918089764 0 0 1 168.15 497.31" fill="none" stroke="#929292" stroke-width="5" stroke-linecap="butt"></path><path d="M 153.00 502.90 A 53.5418291808