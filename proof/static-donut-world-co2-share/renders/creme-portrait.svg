<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Six anneaux, un par pays, où un tour complet vaut 100 % du CO₂ mondial. Sur chaque anneau, un arc pour 2000 et un arc concentrique pour 2023. La Chine passe de 14,7 à 32,9 % du total mondial et les États-Unis de 24,4 à 13,3 % : les deux ont échangé leurs places. Sous chaque anneau, les tonnes des deux années, parce que le total mondial a grossi de 50 % entre-temps."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="36" y="46" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="36" y="85.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">En 2000 les États-Unis</text><text x="36" y="121.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">émettaient un quart du CO₂</text><text x="36" y="158.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">mondial et la Chine un</text><text x="36" y="194.80422262890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">septième ; en 2023, c’est</text><text x="36" y="231.40554862890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">l’inverse</text><text x="36" y="278.4068650835547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Un anneau par pays : l’arc gris est sa part du CO₂ mondial en 2000, l’arc plein</text><text x="36" y="297.2576725054297" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">sa part en 2023, et un tour complet vaut 100 % du monde — la même échelle</text><text x="36" y="316.1084799273047" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">sur les six anneaux. La Chine passe de 14,7 à 32,9 %, les États-Unis de 24,4 à</text><text x="36" y="334.9592873491797" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">13,3 %. Mais le total mondial a grossi de 50 % entre les deux dates : une part</text><text x="36" y="353.8100947710547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">qui rétrécit n’est pas un chiffre qui baisse, et les tonnes sont écrites sous</text><text x="36" y="372.6609021929297" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">chaque anneau.</text><text x="36" y="404.4606720171484" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">part du CO₂ mondial — un tour complet = 100 %</text><g><circle cx="153" cy="452.7586878309453" r="41.65543768879692" fill="none" stroke="#e8e5d9" stroke-width="5"></circle><circle cx="153" cy="452.7586878309453" r="34.15543768879692" fill="none" stroke="#e8e5d9" stroke-width="5"></circle><path d="M 153.00 411.10 A 41.65543768879692 41.65543768879692 0 0 1 186.29 427.72" fill="none" stroke="#929088" stroke-width="5" stroke-linecap="butt"></path><path d="M 153.00 418.60 A 34.15543768879692 34.15543768879692 0 0 1 183.04 469.01" fill="none" stroke="#1757B6" stroke-width="5" stroke-linecap="butt"></path><circle cx="153" cy="452.7586878309453" r="32.031005859375" fill="none" stroke="#1755b2" stroke-width="0.6"></circle><text x="153" y="456.3109339246953" text-anchor="middle" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">32,9 %</text><text x="153" y="512.1966267404454" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Chine</text><text x="153" y="528.5591755685704" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000 · 3,6 Gt</text><text x="153" y="541.0542927560704" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2023 · 12,2 Gt</text></g><g><circle cx="387" cy="452.7586878309453" r="41.65543768879692" fill="none" stroke="#e8e5d9" stroke-width="5"></circle><circle cx="387" cy="452.7586878309453" r="34.15543768879692" fill="none" stroke="#e8e5d9" stroke-width="5"></circle><path d="M 387.00 411.10 A 41.65543768879692 41.65543768879692 0 0 1 428.62 451.09" fill="none" stroke="#929088" stroke-width="5" stroke-linecap="butt"></path><path d="M 387.00 418.60 A 34.15543768879692 34.15543768879692 0 0 1 412.32 429.84" fill="none" stroke="#1757B6" stroke-width="5" stroke-linecap="butt"></path><text x="387" y="456.3109339246953" text-anchor="middle" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#000000">13,3 %</text><text x="387" y="512.1966267404454" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">États-Unis</text><text x="387" y="528.5591755685704" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000 · 6,0 Gt</text><text x="387" y="541.0542927560704" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2023 · 4,9 Gt</text></g><g><circle cx="153" cy="593.3523085698673" r="41.65543768879692" fill="none" stroke="#e8e5d9" stroke-width="5"></circle><circle cx="153" cy="593.35230856