font-style="italic" letter-spacing="0" fill="#5f5e58">Russie</text><text x="387" y="669.1527963074923" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000 · 1,5 Gt</text><text x="387" y="681.6479134949923" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2023 · 1,7 Gt</text></g><g><circle cx="153" cy="733.9459293087892" r="41.65543768879692" fill="none" stroke="#e8e5d9" stroke-width="5"></circle><circle cx="153" cy="733.9459293087892" r="34.15543768879692" fill="none" stroke="#e8e5d9" stroke-width="5"></circle><path d="M 153.00 692.29 A 41.65543768879692 41.65543768879692 0 0 1 166.11 694.41" fill="none" stroke="#929088" stroke-width="5" stroke-linecap="butt"></path><path d="M 153.00 699.79 A 34.15543768879692 34.15543768879692 0 0 1 158.70 700.27" fill="none" stroke="#1757B6" stroke-width="5" stroke-linecap="butt"></path><text x="153" y="737.4981754025392" text-anchor="middle" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#000000">2,7 %</text><text x="153" y="793.3838682182893" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Japon</text><text x="153" y="809.7464170464143" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000 · 1,3 Gt</text><text x="153" y="822.2415342339143" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2023 · 1,0 Gt</text></g><g><circle cx="387" cy="733.9459293087892" r="41.65543768879692" fill="none" stroke="#e8e5d9" stroke-width="5"></circle><circle cx="387" cy="733.9459293087892" r="34.15543768879692" fill="none" stroke="#e8e5d9" stroke-width="5"></circle><path d="M 387.00 692.29 A 41.65543768879692 41.65543768879692 0 0 1 390.88 692.47" fill="none" stroke="#929088" stroke-width="5" stroke-linecap="butt"></path><path d="M 387.00 699.79 A 34.15543768879692 34.15543768879692 0 0 1 391.57 700.10" fill="none" stroke="#1757B6" stroke-width="5" stroke-linecap="butt"></path><text x="387" y="737.4981754025392" text-anchor="middle" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#000000">2,1 %</text><text x="387" y="793.3838682182893" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Iran</text><text x="387" y="809.7464170464143" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000 · 0,4 Gt</text><text x="387" y="822.2415342339143" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2023 · 0,8 Gt</text></g><text x="36" y="836.7366514214143" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Monde : 24,7 Gt en 2000, 37,0 Gt en 2023.</text><text x="36" y="866.8629002359374" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : l’écart entre les deux arcs est le changement de part. La Russie</text><text x="36" y="885.0635060359374" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">montre le piège : sa part baisse et ses tonnes montent, parce que le monde a</text><text x="36" y="903.2641118359375" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">grossi autour d’elle.</text><text x="36" y="924" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Sources : Global Carbon Budget 2025 · population, via Our World in Data</text></svg>