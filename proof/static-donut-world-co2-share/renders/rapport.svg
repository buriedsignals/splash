<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Six anneaux, un par pays, où un tour complet vaut 100 % du CO₂ mondial. Sur chaque anneau, un arc pour 2000 et un arc concentrique pour 2023. La Chine passe de 14,7 à 32,9 % du total mondial et les États-Unis de 24,4 à 13,3 % : les deux ont échangé leurs places. Sous chaque anneau, les tonnes des deux années, parce que le total mondial a grossi de 50 % entre-temps."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">En 2000 les États-Unis émettaient un quart du CO₂ mondial et la</text><text x="46" y="123.99" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Chine un septième ; en 2023, c’est l’inverse</text><text x="46" y="167.33" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Un anneau par pays : l’arc gris est sa part du CO₂ mondial en 2000, l’arc plein sa part en 2023, et un tour complet vaut 100 % du monde — la</text><text x="46" y="186.18" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">même échelle sur les six anneaux. La Chine passe de 14,7 à 32,9 %, les États-Unis de 24,4 à 13,3 %. Mais le total mondial a grossi de 50 %</text><text x="46" y="205.03" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">entre les deux dates : une part qui rétrécit n’est pas un chiffre qui baisse, et les tonnes sont écrites sous chaque anneau.</text><text x="46" y="233.6563671875" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">part du CO₂ mondial — un tour complet = 100 %</text><g><circle cx="118.33333333333333" cy="311.199453125" r="60.75999999999999" fill="none" stroke="#e8e8e8" stroke-width="7"></circle><circle cx="118.33333333333333" cy="311.199453125" r="50.25999999999999" fill="none" stroke="#e8e8e8" stroke-width="7"></circle><path d="M 118.33 250.44 A 60.75999999999999 60.75999999999999 0 0 1 166.90 274.68" fill="none" stroke="#929292" stroke-width="7" stroke-linecap="butt"></path><path d="M 118.33 260.94 A 50.25999999999999 50.25999999999999 0 0 1 162.54 335.12" fill="none" stroke="#1F5C8B" stroke-width="7" stroke-linecap="butt"></path><circle cx="118.33333333333333" cy="311.199453125" r="31.6951904296875" fill="none" stroke="#1e5a88" stroke-width="0.6"></circle><text x="118.33333333333333" y="314.633291015625" text-anchor="middle" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">32,9 %</text><text x="118.33333333333333" y="401.2386328125" text-anchor="middle" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">CHINE</text><text x="118.33333333333333" y="419.493515625" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">2000 · 3,6 Gt</text><text x="118.33333333333333" y="431.9886328125" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">2023 · 12,2 Gt</text></g><g><circle cx="263" cy="311.199453125" r="60.75999999999999" fill="none" stroke="#e8e8e8" stroke-width="7"></circle><circle cx="263" cy="311.199453125" r="50.25999999999999" fill="none" stroke="#e8e8e8" stroke-width="7"></circle><path d="M 263.00 250.44 A 60.75999999999999 60.75999999999999 0 0 1 323.71 308.77" fill="none" stroke="#929292" stroke-width="7"