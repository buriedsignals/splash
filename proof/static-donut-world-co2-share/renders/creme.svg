ll="#5f5e58">Iran</text><text x="836.6666666666666" y="403.9496862792969" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000 · 0,4 Gt</text><text x="836.6666666666666" y="416.4448034667969" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2023 · 0,8 Gt</text></g><text x="52" y="430.9399206542969" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">Monde : 24,7 Gt en 2000, 37,0 Gt en 2023.</text><text x="52" y="449.065" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : l’écart entre les deux arcs est le changement de part. La Russie montre le piège : sa part baisse et ses tonnes montent, parce que le</text><text x="52" y="467.265" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">monde a grossi autour d’elle.</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Sources : Global Carbon Budget 2025 · population, via Our World in Data</text></svg>