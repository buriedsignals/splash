<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Six anneaux, un par pays, où un tour complet vaut 100 % du CO₂ mondial. Sur chaque anneau, un arc pour 2000 et un arc concentrique pour 2023. La Chine passe de 14,7 à 32,9 % du total mondial et les États-Unis de 24,4 à 13,3 % : les deux ont échangé leurs places. Sous chaque anneau, les tonnes des deux années, parce que le total mondial a grossi de 50 % entre-temps."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="52" y="101" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">En 2000 les États-Unis émettaient un quart du CO₂</text><text x="52" y="137.6" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">mondial et la Chine un septième ; en 2023, c’est l’inverse</text><text x="52" y="184.6" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Un anneau par pays : l’arc gris est sa part du CO₂ mondial en 2000, l’arc plein sa part en 2023, et un tour complet vaut 100 % du monde — la</text><text x="52" y="203.45" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">même échelle sur les six anneaux. La Chine passe de 14,7 à 32,9 %, les États-Unis de 24,4 à 13,3 %. Mais le total mondial a grossi de 50 %</text><text x="52" y="222.29999999999998" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">entre les deux dates : une part qui rétrécit n’est pas un chiffre qui baisse, et les tonnes sont écrites sous chaque anneau.</text><text x="52" y="254.09896240234372" font-family="Open Sans" font-size="11" font-weight="700" font-style="normal" letter-spacing="0.4" fill="#5f5e58">part du CO₂ mondial — un tour complet = 100 %</text><g><circle cx="123.33333333333333" cy="311.7730883789062" r="51.03154785156252" fill="none" stroke="#e8e5d9" stroke-width="7"></circle><circle cx="123.33333333333333" cy="311.7730883789062" r="40.53154785156252" fill="none" stroke="#e8e5d9" stroke-width="7"></circle><path d="M 123.33 260.74 A 51.03154785156252 51.03154785156252 0 0 1 164.12 281.10" fill="none" stroke="#929088" stroke-width="7" stroke-linecap="butt"></path><path d="M 123.33 271.24 A 40.53154785156252 40.53154785156252 0 0 1 158.98 331.06" fill="none" stroke="#1757B6" stroke-width="7" stroke-linecap="butt"></path><circle cx="123.33333333333333" cy="311.7730883789062" r="32.031005859375" fill="none" stroke="#1755b2" stroke-width="0.6"></circle><text x="123.33333333333333" y="315.3253344726562" text-anchor="middle" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">32,9 %</text><text x="123.33333333333333" y="384.5871374511719" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">Chine</text><text x="123.33333333333333" y="403.9496862792969" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000 · 3,6 Gt</text><text x="123.33333333333333" y="416.4448034667969" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2023 · 12,2 Gt</text></g><g><circle cx="266" cy="311.7730883789062" r="51.03154785156252" fill="none" stroke="#e8e5d9" stroke-width="7"></circle><circle cx="266" cy="311.7730883789062" r="40.53154785156252" fill="none" stroke="#e8e5d9" stroke-width="7"></circle><path d="M 266.00 260.74 A 51.03154785156252 51.03154785156252 0 0 1 316.99 309.73" fill="none" stroke="#929088" stroke-width="7" stroke-linecap="butt"></path><path d="M 266.00 271.24 A 40.53154785156252 40.53154785156252 0 0 1 296.05 284.57" fill="none" stroke="#1757B6" stroke-width="7" stroke-linecap="butt"></path><text x="266" y="315.3253344726562" text-anchor="middle" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#000000">13,3 %</text><text x="266" y="384.5871374511719" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">États-Unis</text><text x="266" y="403.9496862792969" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000 · 6,0 Gt</text><text x="266" y="416.4448034667969" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2023 · 4,9 Gt</text></g><g><circle cx="408.66666666666663" cy="311.7730883789062" r="51.03154785156252" fill="none" stroke="#e8e5d9" stroke-width="7"></circle><circle cx="408.66666666666663" cy="311.7730883789062" r="40.53154785156252" fill="none" stroke="#e8e5d9" stroke-width="7"></circle><path d="M 408.67 260.74 A 51.03154785156252 51.03154785156252 0 0 1 421.33 262.34" fill="none" stroke="#929088" stroke-width="7" stroke-linecap="butt"></path><path d="M 408.67 271.24 A 40.53154785156252 40.53154785156252 0 0 1 428.81 276.60" fill="none" stroke="#1757B6" stroke-width="7" stroke-linecap="butt"></path><text x="408.66666666666663" y="315.3253344726562" text-anchor="middle" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#000000">8,3 %</text><text x="408.66666666666663" y="384.5871374511719" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Inde</text><text x="408.66666666666663" y="403.9496862792969" t