<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Six anneaux, un par pays, où un tour complet vaut 100 % du CO₂ mondial. Sur chaque anneau, un arc pour 2000 et un arc concentrique pour 2023. La Chine passe de 14,7 à 32,9 % du total mondial et les États-Unis de 24,4 à 13,3 % : les deux ont échangé leurs places. Sous chaque anneau, les tonnes des deux années, parce que le total mondial a grossi de 50 % entre-temps."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="36" y="45.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="36" y="86.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">EN 2000 LES</text><text x="36" y="125.08908955" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉTATS-UNIS</text><text x="36" y="164.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉMETTAIENT UN QUART</text><text x="36" y="203.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DU CO₂ MONDIAL ET LA</text><text x="36" y="242.20670875" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">CHINE UN SEPTIÈME ;</text><text x="36" y="281.24591515" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">EN 2023, C’EST</text><text x="36" y="320.28512155" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">L’INVERSE</text><text x="36" y="369.3243187717773" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Un anneau par pays : l’arc gris est sa part du CO₂ mondial en 2000, l’arc plein sa</text><text x="36" y="387.4500951389648" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">part en 2023, et un tour complet vaut 100 % du monde — la même échelle sur</text><text x="36" y="405.57587150615234" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">les six anneaux. La Chine passe de 14,7 à 32,9 %, les États-Unis de 24,4 à 13,3 %.</text><text x="36" y="423.7016478733398" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Mais le total mondial a grossi de 50 % entre les deux dates : une part qui rétrécit</text><text x="36" y="441.8274242405273" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">n’est pas un chiffre qui baisse, et les tonnes sont écrites sous chaque anneau.</text><text x="36" y="469.36321037333977" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">part du CO₂ mondial — un tour complet = 100 %</text><g><circle cx="153" cy="512.6494248617571" r="37.29622425404232" fill="none" stroke="#262655" stroke-width="5"></circle><circle cx="153" cy="512.6494248617571" r="29.796224254042322" fill="none" stroke="#262655" stroke-width="5"></circle><path d="M 153.00 475.35 A 37.29622425404232 37.29622425404232 0 0 1 182.81 490.23" fill="none" stroke="#676787" stroke-width="5" stroke-linecap="butt"></path><path d="M 153.00 482.85 A 29.796224254042322 29.796224254042322 0 0 1 179.21 526.83" fill="none" stroke="#4FE0C0" stroke-width="5" stroke-linecap="butt"></path><circle cx="153" cy="512.6494248617571" r="31.00099948141724" fill="none" stroke="#53e1c1" stroke-width="0.48"></circle><text x="153" y="516.1424210775774" text-anchor="middle" font-family="Montserrat" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">32,9 %</text><text x="153" y="564.9456491157994" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">CHINE</text><text x="153" y="578.9456491157994" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2000 · 3,6 Gt</text><text x="153" y="589.9356393501744" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2023 · 12,2 Gt</text></g><g><circle cx="387" cy="512.6494248617571" r="37.29622425404232" fill="none" stroke="#262655" stroke-width="5"></circle><circle cx="387" cy="512.6494248617571" r="29.796224254042322" fill="none" stroke="#262655" stroke-width="5"></circle><path d="M 387.00 475.35 A 37.29622425404232 37.29622425404232 0 0 1 424.27 511.16" fill="none" stroke="#676787" stroke-width="5" stroke-linecap="butt"></path><path d="M 387.00 482.85 A 29.796224254042322 29.796224254042322 0 0 1 409.09 492.65" fill="none" stroke="#4FE0C0" stroke-width="5" stroke-linecap="butt"></path><text x="387" y="516.1424210775774" text-anchor="middle" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#FFFFFF">13,3 %</text><text x="387" y="564.9456491157994" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">ÉTATS-UNIS</text><text x="387" y="578.9456491157994" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2000 · 6,0 Gt</text><text x="387" y="589.9356393501744" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2023 · 4,9 Gt</text></g><g><circle cx="153" cy="637.2218538385916" r="37.29622425404232" fill="none" stroke="#262655" stroke-width="5"></circle><circle cx="153" cy="637.2218538385916" r="29.796224254042322" fill="none" stroke="#262655" stroke-width="5"></circle><path d="M 153.00 599.93 A 37.29622425404232 37.29622425404232 0 0 1 162.26 601.09" fill="none" stroke="#676787" stroke-width="5" stroke-linecap="butt"></path><path d="M 153.00 607.43 A 29.796224254042322 29.796224254042322 0 0 1 167.81 611.37" fill="none" stroke="#4FE0C0" stroke-width="5" stroke-linecap="butt"></path><text x="153" y="640.714850054412" text-anchor="middle" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#FFFFFF">8,3 %</text><text x="153" y="689.518078092634" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">INDE</text><text x="153" y="703.518078092634" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2000 · 1,0 Gt</text><text x="153" y="714.508068327009" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2023 · 3,1 Gt</text></g><g><circle cx="387" cy="637.2218538385916" r="37.29622425404232" fill="none" stroke="#262655" stroke-width="5"></circle><circle cx="387" cy="637.2218538385916" r="29.796224254042322" fill="none" stroke="#262655" stroke-width="5"></circle><path d="M 387.00 599.93 A 37.29622425404232 37.29622425404232 0 0 1 400.70 602.53" fill="none" stroke="#676787" stroke-width="5" stroke-linecap="butt"></path><path d="M 387.00 607.43 A 29.796224254042322 29.796224254042322 0 0 1 395.64 608.71" fill="none" stroke="#4FE0C0" stroke-width="5" stroke-linecap="butt"></path><text x="387" y="640.714850054412" text-anchor="middle" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#FFFFFF">4,7 %</text><text x="387" y="689.518078092634" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">RUSSIE</text><text x="387" y="703.518078092634" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2000 · 1,5 Gt</text><text x="387" y="714.508068327009" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2023 · 1,7 Gt</text></g><g><circle cx="153" cy="761.7942828154263" r="37.29622425404232" fill="none" stroke="#262655" stroke-width="5"></circle><circle cx="153" cy="761.7942828154263" r="29.796224254042322" fill="none" stroke="#262655" stroke-width="5"></circle><path d="M 153.00 724.50 A 37.29622425404232 37.29622425404232 0 0 1 164.74 726.39" fill="none" stroke="#676787" stroke-width="5" stroke-linecap="butt"></path><path d="M 153.00 732.00 A 29.796224254042322 29.796224254042322 0 0 1 157.97 732.42" fill="none" stroke="#4FE0C0" stroke-width="5" stroke-linecap="butt"></path><text x="153" y="765.2872790312466" text-anchor="middle" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#FFFFFF">2,7 %</text><text x="153" y="814.0905070694687" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">JAPON</text><text x="153" y="828.0905070694687" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2000 · 1,3 Gt</text><text x="153" y="839.0804973038437" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2023 · 1,0 Gt</text></g><g><circle cx="387" cy="761.7942828154263" r="37.29622425404232" fill="none" stroke="#262655" stroke-width="5"></circle><circle cx="387" cy="761.7942828154263" r="29.796224254042322" fill="none" stroke="#262655" stroke-width="5"></circle><path d="M 387.00 724.50 A 37.29622425404232 37.29622425404232 0 0 1 390.48 724.66" fill="none" stroke="#676787" stroke-width="5" stroke-linecap="butt"></path><path d="M 387.00 732.00 A 29.796224254042322 29.796224254042322 0 0 1 390.98 732.27" fill="none" stroke="#4FE0C0" stroke-width="5" stroke-linecap="butt"></path><text x="387" y="765.2872790312466" text-anchor="middle" font-family="Montserrat" font-size="14" font-weight="600" font-style="normal" letter-spacing="0" fill="#FFFFFF">2,1 %</text><text x="387" y="814.0905070694687" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">IRAN</text><text x="387" y="828.0905070694687" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2000 · 0,4 Gt</text><text x="387" y="839.0804973038437" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2023 · 0,8 Gt</text></g><text x="36" y="852.0704875382187" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">Monde : 24,7 Gt en 2000, 37,0 Gt en 2023.</text><text x="36" y="876.0612159960937" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : L’ÉCART ENTRE LES DEUX ARCS EST LE CHANGEMENT DE</text><text x="36" y="890.0614309960937" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">PART. LA RUSSIE MONTRE LE PIÈGE : SA PART BAISSE ET SES TONNES</text><text x="36" y="904.0616459960937" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">MONTENT, PARCE QUE LE MONDE A GROSSI AUTOUR D’ELLE.</text><text x="36" y="924" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Sources : Global Carbon Budget 2025 · population, via Our World in Data</text></svg>