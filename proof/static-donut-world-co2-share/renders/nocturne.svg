<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Six anneaux, un par pays, où un tour complet vaut 100 % du CO₂ mondial. Sur chaque anneau, un arc pour 2000 et un arc concentrique pour 2023. La Chine passe de 14,7 à 32,9 % du total mondial et les États-Unis de 24,4 à 13,3 % : les deux ont échangé leurs places. Sous chaque anneau, les tonnes des deux années, parce que le total mondial a grossi de 50 % entre-temps."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">EN 2000 LES ÉTATS-UNIS ÉMETTAIENT UN</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">QUART DU CO₂ MONDIAL ET LA CHINE UN</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SEPTIÈME ; EN 2023, C’EST L’INVERSE</text><text x="56" y="233.16749317177735" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Un anneau par pays : l’arc gris est sa part du CO₂ mondial en 2000, l’arc plein sa part en 2023, et un tour complet vaut 100 % du monde — la</text><text x="56" y="251.29326953896486" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">même échelle sur les six anneaux. La Chine passe de 14,7 à 32,9 %, les États-Unis de 24,4 à 13,3 %. Mais le total mondial a grossi de 50 % entre les</text><text x="56" y="269.41904590615235" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">deux dates : une part qui rétrécit n’est pas un chiffre qui baisse, et les tonnes sont écrites sous chaque anneau.</text><text x="56" y="296.9548320389648" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">part du CO₂ mondial — un tour complet = 100 %</text><g><circle cx="126.66666666666667" cy="347.51787967140433" r="44.57305739806449" fill="none" stroke="#262655" stroke-width="7"></circle><circle cx="126.66666666666667" cy="347.51787967140433" r="34.07305739806449" fill="none" stroke="#262655" stroke-width="7"></circle><path d="M 126.67 302.94 A 44.57305739806449 44.57305739806449 0 0 1 162.29 320.73" fill="none" stroke="#676787" stroke-width="7" stroke-linecap="butt"></path><path d="M 126.67 313.44 A 34.07305739806449 34.07305739806449 0 0 1 156.63 363.73" fill="none" stroke="#4FE0C0" stroke-width="7" stroke-linecap="butt"></path><circle cx="126.66666666666667" cy="347.51787967140433" r="31.00099948141724" fill="none" stroke="#53e1c1" stroke-width="0.48"></circle><text x="126.66666666666667" y="351.01087588722464" text-anchor="middle" font-family="Montserrat" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">32,9 %</text><text x="126.66666666666667" y="411.0909370694688" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#53e1c1">CHINE</text><text x="126.66666666666667" y="428.0909370694688" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2000 · 3,6 Gt</text><text x="126.66666666666667" y="439.0809273038438" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2023 · 12,2 Gt</text></g><g><circle cx="268" cy="347.51787967140433" r="44.57305739806449" fill="none" stroke="#262655" stroke-width="7"></circle><circ