<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Barres empilées divergentes : le mix électrique de six pays européens en 2024, fossile à gauche, renouvelable à droite, nucléaire à cheval sur l’axe. France porte 67,7 % de nucléaire, plus que ses 5,1 % de fossile et ses 27,2 % de renouvelable réunis ; Pologne penche à gauche avec 68,9 % de fossile et Norvège à droite avec 98,6 %."><rect x="0" y="0" width="540" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LE NUCLÉAIRE TIENT</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LE CENTRE</text><text x="56" y="191.6287422107422" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Mix électrique 2024, en parts de la production de chaque pays. À gauche</text><text x="56" y="209.75451857792967" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">le fossile, à droite le renouvelable, et au centre le nucléaire — qui n’est ni</text><text x="56" y="227.88029494511719" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">l’un ni l’autre. France : 67,7 % de nucléaire contre 5,1 % de fossile et 27,2</text><text x="56" y="246.0060713123047" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">% de renouvelable. Pologne penche le plus à gauche (68,9 %), Norvège le</text><text x="56" y="264.1318476794922" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">plus à droite (98,6 %).</text><text x="56" y="465.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="56" y="484" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">(2025), via Our World in Data</text><text x="191.1260046508163" y="310.65783904667967" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">← FOSSILE</text><text x="441.9139968752861" y="310.65783904667967" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#53e1c1">RENOUVELABLE →</text><text x="316.5200007630512" y="296.65762404667964" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">NUCLÉAIRE</text><g><rect x="316.5200007630512" y="322.24332693379284" width="0.6" height="11.70001310531664" fill="#32315e"></rect><rect x="248.4027649014781" y="322.24332693379284" width="68.1172358615731" height="11.70001310531664" fill="#cfcfd9"></rect><rect x="245.08796893174377" y="322.24332693379284" width="3.3147959697343055" height="11.70001310531664" fill="#abaabd"></rect><rect x="230.1823149667407" y="322.24332693379284" width="14.905653965003056" height="11.70001310531664" fill="#8786a1"></rect><rect x="316.5200007630512" y="322.24332693379284" width="5.7917863647006005" height="11.70001310531664" fill="#244e69"></rect><rect x="322.3117871277518" y="322.24332693379284" width="0.6" height="11.70001310531664" fill="#2f737f"></rect><rect x="322.3117871277518" y="322.24332693379284" width="1.5371910980526122" height="11.70001310531664" fill="#3a9795"></rect><rect x="323.84897822580444" y="322.24332693379284" width