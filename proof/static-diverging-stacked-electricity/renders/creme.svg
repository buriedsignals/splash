<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Barres empilées divergentes : le mix électrique de six pays européens en 2024, fossile à gauche, renouvelable à droite, nucléaire à cheval sur l’axe. France porte 67,7 % de nucléaire, plus que ses 5,1 % de fossile et ses 27,2 % de renouvelable réunis ; Pologne penche à gauche avec 68,9 % de fossile et Norvège à droite avec 98,6 %."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Le nucléaire tient le centre : en France il pèse</text><text x="52" y="137.6" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">plus que le fossile et le renouvelable réunis</text><text x="52" y="182" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Mix électrique 2024, en parts de la production de chaque pays. À gauche le fossile, à droite le renouvelable, et au centre le nucléaire — qui n’est</text><text x="52" y="200.85" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">ni l’un ni l’autre. France : 67,7 % de nucléaire contre 5,1 % de fossile et 27,2 % de renouvelable. Pologne penche le plus à gauche (68,9 %),</text><text x="52" y="219.7" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Norvège le plus à droite (98,6 %).</text><text x="52" y="423.65" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque rang fait 100 %. La masse nucléaire est posée À CHEVAL sur l’axe, moitié de chaque côté, donc elle</text><text x="52" y="442.5" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">ne fait pencher ni l’un ni l’autre — le penchant se lit au côté le plus long. Dans chaque camp, la teinte fonce vers</text><text x="52" y="461.34999999999997" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">l’extérieur : gaz, pétrole, charbon à gauche ; bioénergie, autres, hydraulique, solaire, éolien à droite.</text><text x="52" y="488" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><text x="188.22200191020966" y="260.3907958984375" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">← Fossile</text><text x="865.3249999880791" y="260.3907958984375" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">Renouvelable →</text><text x="526.7735009491444" y="260.3907958984375" text-anchor="middle" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Nucléaire</text><g><rect x="526.7735009491444" y="273.3051237894694" width="0.6" height="12.551197530110676" fill="#dbd9cd"></rect><rect x="342.8636406183264" y="273.3051237894694" width="183.90986033081802" height="12.551197530110676" fill="#343330"></rect><rect x="333.9140163990192" y="273.3051237894694" width="8.949624219307184" height="12.551197530110676" fill="#5a5954"></rect><rect x="293.6702116678049" y="273.3051237894694" width="40.2438047312143" height="12.551197530110676" fill="#817f78"></rect><rect x="526.7735009491444" y="273.3051237894694" width="15.637255504064203" height="12.551197530110676" fill="#b9cbdd"></rect><rect x="542.4107564532086" y="273.3051237894694" width="0.6" height="12.551197530110676" fill="#91aed3"></rect><rect x="542.4107564532086" y="273.3051237894694" width="4.150265297305091" height="12.551197530110676" fill="#6891ca"></rect><rect x="546.5610217505136" y="273.3051237894694" width="34.7363436731791" height="12.551197530110676" fill="#4074c0"></rect><rect x="581.2973654236928" y="273.3051237894694" width="50.92434528304682" height="12.551197530110676" fill="#1757b6"></rect><text x="135.54700189828873" y="282.87622426350913" text-anchor="end" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Pologne</text><g><text x="285.6702116678049" y="283.0907170613607" text-anchor="end" font-family="Avenir Next" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="none" stroke="#FFFCEE" stroke-width="3.4" stroke-linejoin="round">68,9</text><text x="285.6702116678049" y="283.0907170613607" text-anchor="end" font-family="Avenir Next" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">68,9</text></g><g><text x="640.2217107067396" y="283.0907170613607" text-anchor="start" font-family="Avenir Next" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="none" stroke="#FFFCEE" stroke-width="3.4" stroke-linejoin="round">31,1</text><text x="640.2217107067396" y="283.0907170613607" text-anchor="start" font-family="Avenir Next" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">31,1</text></g></g><g><rect x="526.7735009491444" y="293.5489907735188" width="0.6" height="12.551197530110676" fill="#dbd9cd"></rect><rect x="454.19506006765494" y="293.5489907735188" width="72.57844088148941" height="12.551197530110676" fill="#343330"></rect><rect x="440.2773095779195" y="293.5489907735188" width="13.917750489735438" height="12.551197530110676" fill="#5a5954">