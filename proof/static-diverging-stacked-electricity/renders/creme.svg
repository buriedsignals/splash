<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Barres empilées divergentes : le mix électrique de six pays européens en 2024, fossile à gauche, renouvelable à droite, nucléaire à cheval sur l’axe. France porte 67,7 % de nucléaire, plus que ses 5,1 % de fossile et ses 27,2 % de renouvelable réunis ; Pologne penche à gauche avec 68,9 % de fossile et Norvège à droite avec 98,6 %."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Le nucléaire tient le centre : en France il pèse plus que le</text><text x="52" y="137.6" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">fossile et le renouvelable réunis</text><text x="52" y="182" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Mix électrique 2024, en parts de la production de chaque pays. À gauche le fossile, à droite le renouvelable, et au centre le nucléaire — qui</text><text x="52" y="200.85" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">n’est ni l’un ni l’autre. France : 67,7 % de nucléaire contre 5,1 % de fossile et 27,2 % de renouvelable. Pologne penche le plus à gauche (68,9 %),</text><text x="52" y="219.7" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Norvège le plus à droite (98,6 %).</text><text x="52" y="423.65" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque rang fait 100 %. La masse nucléaire est posée À CHEVAL sur l’axe, moitié de chaque côté, donc elle ne fait pencher ni l’un</text><text x="52" y="442.5" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">ni l’autre — le penchant se lit au côté le plus long. Dans chaque camp, la teinte fonce vers l’extérieur : gaz, pétrole, charbon à gauche ;</text><text x="52" y="461.34999999999997" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">bioénergie, autres, hydraulique, solaire, éolien à droite.</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><text x="174.65840490162373" y="260.343994140625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">← Fossile</text><text x="866.4541015625" y="260.343994140625" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">Renouvelable →</text><text x="520.5562532320619" y="260.343994140625" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Nucléaire</text><g><rect x="520.5562532320619" y="273.6856984049479" width="0.6" height="12.503424153645831" fill="#dbd9cd"></rect><rect x="332.65566748435117" y="273.6856984049479" width="187.90058574771072" height="12.503424153645831" fill="#343330"></rect><rect x="323.511842188607" y="273.6856984049479" width="9.14382529574421" height="12.503424153645831" fill="#5a5954"></rect><rect x="282.394772836755" y="273.6856984049479" width="41.11706935185199" height="12.503424153645831" fill="#817f78"></rect><rect x="520.5562532320619" y="273.6856984049479" width="15.976573868388234" height="12.503424153645831" fill="#b9cbdd"></rect><rect x="536.53282710045" y="273.6856984049479" width="0.6" height="12.503424153645831" fill="#91aed3"></rect><rect x="536.53282710045" y="273.6856984049479" width="4.240323378905557" height="12.503424153645831" fill="#6891ca"></rect><rect x="540.7731504793556" y="273.6856984049479" width="35.49009993908632" height="12.503424153645831" fill="#4074c0"></rect><rect x="576.263250418442" y="273.6856984049479" width="52.02937074875112" height="12.503424153645831" fill="#1757b6"></rect><text x="123.11250646412373" y="283.0736562093099" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Pologne</text><g><text x="274.394772836755" y="283.4896565755208" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="none" stroke="#FFFCEE" stroke-width="3.4" stroke-linejoin="round">68,9</text><text x="274.394772836755" y="283.4896565755208" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">68,9</text></g><g><text x="636.2926211671931" y="283.4896565755208" text-anchor="start" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="none" stroke="#FFFCEE" stroke-width="3.4" stroke-linejoin="round">31,1</text><text x="636.2926211671931" y="283.4896565755208" text-anchor="start" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#5f5e58">31,1</text></g></g><g><rect x="520.5562532320619" y="293.85251155598957" width="0.6" height="12.503424153645831" fill="#dbd9cd"></rect><rect x="446.40290696908176" y="293.85251155598957" width="74.15334626298008" height="12.503424153645831" fill="#343330"></rect><rect x="432.18315026540296" y="293.85251155598957" width="14.219756703678774" height="12.503424153645831" fill="#5a5954"></rect><rect x="377.5008980272739" y="293.8525