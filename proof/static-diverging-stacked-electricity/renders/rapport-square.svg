<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Barres empilées divergentes : le mix électrique de six pays européens en 2024, fossile à gauche, renouvelable à droite, nucléaire à cheval sur l’axe. France porte 67,7 % de nucléaire, plus que ses 5,1 % de fossile et ses 27,2 % de renouvelable réunis ; Pologne penche à gauche avec 68,9 % de fossile et Norvège à droite avec 98,6 %."><rect x="0" y="0" width="540" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Le nucléaire tient le centre : en</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">France il pèse plus que le fossile et</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">le renouvelable réunis</text><text x="46" y="197.67367093776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Mix électrique 2024, en parts de la production de chaque pays. À gauche</text><text x="46" y="216.52301443776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">le fossile, à droite le renouvelable, et au centre le nucléaire — qui n’est ni</text><text x="46" y="235.3723579377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">l’un ni l’autre. France : 67,7 % de nucléaire contre 5,1 % de fossile et 27,2</text><text x="46" y="254.2217014377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">% de renouvelable. Pologne penche le plus à gauche (68,9 %), Norvège le</text><text x="46" y="273.0710449377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">plus à droite (98,6 %).</text><text x="46" y="475.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">(2025), via Our World in Data</text><text x="171.67416992187498" y="306.36179468776095" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">← FOSSILE</text><text x="453.233642578125" y="306.36179468776095" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">RENOUVELABLE →</text><text x="312.45390625" y="306.36179468776095" text-anchor="middle" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">NUCLÉAIRE</text><g><rect x="312.45390625" y="318.71904674332234" width="0.6" height="12.905490260252991" fill="#dbdbdb"></rect><rect x="235.97874155862368" y="318.71904674332234" width="76.4751646913763" height="12.905490260252991" fill="#343434"></rect><rect x="232.25722284904333" y="318.71904674332234" width="3.721518709580343" height="12.905490260252991" fill="#5a5a5a"></rect><rect x="215.5226573989304" y="318.71904674332234" width="16.73456545011293" height="12.905490260252991" fill="#818181"></rect><rect x="312.45390625" y="318.71904674332234" width="6.502433789266754" height="12.905490260252991" fill="#bccedc"></rect><rect x="318.95634003926676" y="318.71904674332234" width="0.6" height="12.