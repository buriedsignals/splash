<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Barres empilées divergentes : le mix électrique de six pays européens en 2024, fossile à gauche, renouvelable à droite, nucléaire à cheval sur l’axe. France porte 67,7 % de nucléaire, plus que ses 5,1 % de fossile et ses 27,2 % de renouvelable réunis ; Pologne penche à gauche avec 68,9 % de fossile et Norvège à droite avec 98,6 %."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LE NUCLÉAIRE TIENT</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LE CENTRE : EN</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">FRANCE IL PÈSE PLUS</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">QUE LE FOSSILE ET LE</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">RENOUVELABLE</text><text x="56" y="301.24591515" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">RÉUNIS</text><text x="56" y="347.7855678107422" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Mix électrique 2024, en parts de la production de chaque pays. À gauche</text><text x="56" y="365.91134417792966" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">le fossile, à droite le renouvelable, et au centre le nucléaire — qui n’est ni</text><text x="56" y="384.0371205451172" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">l’un ni l’autre. France : 67,7 % de nucléaire contre 5,1 % de fossile et 27,2</text><text x="56" y="402.1628969123047" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">% de renouvelable. Pologne penche le plus à gauche (68,9 %), Norvège le</text><text x="56" y="420.2886732794922" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">plus à droite (98,6 %).</text><text x="56" y="752.9932969135" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE RANG FAIT 100 %. LA MASSE NUCLÉAIRE</text><text x="56" y="771.1190732806875" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">EST POSÉE À CHEVAL SUR L’AXE, MOITIÉ DE CHAQUE CÔTÉ,</text><text x="56" y="789.244849647875" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">DONC ELLE NE FAIT PENCHER NI L’UN NI L’AUTRE — LE</text><text x="56" y="807.3706260150625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">PENCHANT SE LIT AU CÔTÉ LE PLUS LONG. DANS CHAQUE</text><text x="56" y="825.4964023822499" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">CAMP, LA TEINTE FONCE VERS L’EXTÉRIEUR : GAZ, PÉTROLE,</text><text x="56" y="843.6221787494375" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">CHARBON À GAUCHE ; BIOÉNERGIE, AUTRES, HYDRAULIQUE,</text><text x="56" y="861.747955116625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SOLAIRE, ÉOLIEN À DROITE.</text><text x="56" y="885.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">(2025), via Our World in Data</text><text x="191.1260046508163" y="466.81466464667966" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">← FOSSILE</text><text x="441.9139968752861" y="466.81466464667966" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#53e1c1">RENOUVELABLE →</text><text x="316.5200007630512" y="452.81444964667963" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">NUCLÉAIRE</text><g><rect x="316.5200007630512" y="482.73730596173294" width="0.6" height="25.852829554384353" fill="#32315e"></rect><rect x="248.4027649014781" y="482.73730596173294" width="68.1172358615731" height="25.852829554384353" fill="#cfcfd9"></rect><rect x="245.08796893174377" y="482.73730596173294" width="3.3147959697343055" height="25.852829554384353" fill="#abaabd"></rect><rect x="230.1823149667407" y="482.73730596173294" width="14.905653965003056" height="25.852829554384353" fill="#8786a1"></rect><rect x="316.5200007630512" y="482.73730596173294" width="5.7917863647006005" height="25.852829554384353" fill="#244e69"></rect><rect x="322.3117871277518" y="482.73730596173294" width="0.6" height="25.852829554384353" fill="#2f737f"></rect><rect x="322.3117871277518" y="482.73730596173294" width="1.5371910980526122" height="25