<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Barres empilées divergentes : le mix électrique de six pays européens en 2024, fossile à gauche, renouvelable à droite, nucléaire à cheval sur l’axe. France porte 67,7 % de nucléaire, plus que ses 5,1 % de fossile et ses 27,2 % de renouvelable réunis ; Pologne penche à gauche avec 68,9 % de fossile et Norvège à droite avec 98,6 %."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Futura" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.05" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LE NUCLÉAIRE TIENT LE CENTRE : EN FRANCE</text><text x="56" y="145.09" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">IL PÈSE PLUS QUE LE FOSSILE ET LE</text><text x="56" y="184.13" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">RENOUVELABLE RÉUNIS</text><text x="56" y="230.67000000000002" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Mix électrique 2024, en parts de la production de chaque pays. À gauche le fossile, à droite le renouvelable, et au centre le nucléaire — qui n’est ni</text><text x="56" y="248.79500000000002" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">l’un ni l’autre. France : 67,7 % de nucléaire contre 5,1 % de fossile et 27,2 % de renouvelable. Pologne penche le plus à gauche (68,9 %), Norvège le</text><text x="56" y="266.92" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">plus à droite (98,6 %).</text><text x="56" y="423.625" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE RANG FAIT 100 %. LA MASSE NUCLÉAIRE EST POSÉE À CHEVAL SUR L’AXE, MOITIÉ DE CHAQUE CÔTÉ, DONC</text><text x="56" y="441.75" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">ELLE NE FAIT PENCHER NI L’UN NI L’AUTRE — LE PENCHANT SE LIT AU CÔTÉ LE PLUS LONG. DANS CHAQUE CAMP, LA TEINTE FONCE</text><text x="56" y="459.875" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">VERS L’EXTÉRIEUR : GAZ, PÉTROLE, CHARBON À GAUCHE ; BIOÉNERGIE, AUTRES, HYDRAULIQUE, SOLAIRE, ÉOLIEN À DROITE.</text><text x="56" y="484" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><text x="189.9771115124226" y="300.57234375" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">← FOSSILE</text><text x="858.9599978625774" y="300.57234375" text-anchor="end" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#53e1c1">RENOUVELABLE →</text><text x="524.4685546875" y="300.57234375" text-anchor="middle" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">NUCLÉAIRE</text><g><rect x="524.4685546875" y="311.8717455729167" width="0.6" height="8.816222395833332" fill="#32315e"></rect><rect x="342.7642208688285" y="311.8717455729167" width="181.70433381867153" height="8.816222395833332" fill="#cfcfd9"></rect><rect x="333.9219244102728" y="311.8717455729167" width="8.842296458555671" height="8.816222395833332" fill="#abaabd"></rect><rect x="294.16074077465765" y="311.8717455729167" width="39.76118363561518" height="8.816222395833332" fill="#8786a1