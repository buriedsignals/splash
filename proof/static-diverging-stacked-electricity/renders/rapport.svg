<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Barres empilées divergentes : le mix électrique de six pays européens en 2024, fossile à gauche, renouvelable à droite, nucléaire à cheval sur l’axe. France porte 67,7 % de nucléaire, plus que ses 5,1 % de fossile et ses 27,2 % de renouvelable réunis ; Pologne penche à gauche avec 68,9 % de fossile et Norvège à droite avec 98,6 %."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Le nucléaire tient le centre : en France il pèse plus que</text><text x="46" y="123.99" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">le fossile et le renouvelable réunis</text><text x="46" y="164.73000000000002" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Mix électrique 2024, en parts de la production de chaque pays. À gauche le fossile, à droite le renouvelable, et au</text><text x="46" y="183.58" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">centre le nucléaire — qui n’est ni l’un ni l’autre. France : 67,7 % de nucléaire contre 5,1 % de fossile et 27,2 % de</text><text x="46" y="202.43" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">renouvelable. Pologne penche le plus à gauche (68,9 %), Norvège le plus à droite (98,6 %).</text><text x="46" y="431.45" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE RANG FAIT 100 %. LA MASSE NUCLÉAIRE EST POSÉE À CHEVAL SUR L’AXE, MOITIÉ DE CHAQUE CÔTÉ, DONC ELLE NE FAIT</text><text x="46" y="450.3" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">PENCHER NI L’UN NI L’AUTRE — LE PENCHANT SE LIT AU CÔTÉ LE PLUS LONG. DANS CHAQUE CAMP, LA TEINTE FONCE VERS L’EXTÉRIEUR : GAZ,</text><text x="46" y="469.15" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">PÉTROLE, CHARBON À GAUCHE ; BIOÉNERGIE, AUTRES, HYDRAULIQUE, SOLAIRE, ÉOLIEN À DROITE.</text><text x="46" y="494" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><text x="176.15799573957923" y="235.53596313476567" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">← FOSSILE</text><text x="870.0419990718365" y="235.53596313476567" text-anchor="end" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">RENOUVELABLE →</text><text x="523.0999974057079" y="235.53596313476567" text-anchor="middle" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">NUCLÉAIRE</text><g><rect x="523.0999974057079" y="248.94201477254236" width="0.6" height="16.335556840006504" fill="#dbdbdb"></rect><rect x="334.63220077671053" y="248.94201477254236" width="188.46779662899738" height="16.335556840006504" fill="#343434"></rect><rect x="325.4607732402192" y="248.94201477254236" width="9.171427536491315" height="16.335556840006504" fill="#5a5a5a"></rect><rect x="284.21958480140336" y="248.94201477254236" width="41.2411884388159" height="16.335556840006504" fill="#818181"></rect><rect x="523.0999974057079" y="248.94201477254236" width=