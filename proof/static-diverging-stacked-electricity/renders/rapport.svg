<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Barres empilées divergentes : le mix électrique de six pays européens en 2024, fossile à gauche, renouvelable à droite, nucléaire à cheval sur l’axe. France porte 67,7 % de nucléaire, plus que ses 5,1 % de fossile et ses 27,2 % de renouvelable réunis ; Pologne penche à gauche avec 68,9 % de fossile et Norvège à droite avec 98,6 %."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Le nucléaire tient le centre : en France il pèse plus que le fossile et</text><text x="46" y="123.99" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">le renouvelable réunis</text><text x="46" y="164.73000000000002" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Mix électrique 2024, en parts de la production de chaque pays. À gauche le fossile, à droite le renouvelable, et au centre le nucléaire — qui</text><text x="46" y="183.58" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">n’est ni l’un ni l’autre. France : 67,7 % de nucléaire contre 5,1 % de fossile et 27,2 % de renouvelable. Pologne penche le plus à gauche (68,9 %),</text><text x="46" y="202.43" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Norvège le plus à droite (98,6 %).</text><text x="46" y="431.45" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE RANG FAIT 100 %. LA MASSE NUCLÉAIRE EST POSÉE À CHEVAL SUR L’AXE, MOITIÉ DE CHAQUE CÔTÉ, DONC ELLE NE FAIT</text><text x="46" y="450.3" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">PENCHER NI L’UN NI L’AUTRE — LE PENCHANT SE LIT AU CÔTÉ LE PLUS LONG. DANS CHAQUE CAMP, LA TEINTE FONCE VERS L’EXTÉRIEUR : GAZ,</text><text x="46" y="469.15" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">PÉTROLE, CHARBON À GAUCHE ; BIOÉNERGIE, AUTRES, HYDRAULIQUE, SOLAIRE, ÉOLIEN À DROITE.</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><text x="171.67416992187503" y="235.72140625000003" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">← FOSSILE</text><text x="873.233642578125" y="235.72140625000003" text-anchor="end" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">RENOUVELABLE →</text><text x="522.45390625" y="235.72140625000003" text-anchor="middle" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">NUCLÉAIRE</text><g><rect x="522.45390625" y="249.12173587239585" width="0.6" height="16.30921705729166" fill="#dbdbdb"></rect><rect x="331.90135368969504" y="249.12173587239585" width="190.55255256030497" height="16.30921705729166" fill="#343434"></rect><rect x="322.6284754634984" y="249.12173587239585" width="9.272878226196656" height="16.30921705729166" fill="#5a5a5a"></rect><rect x="280.93109337383163" y="249.12173587239585" width="41.69738208966673" height="16.30921705729166" fill="#818181"></rect><rect x="522.45390625" y="249.12173587239585" width="16.20206195566229" height="16.30921705729166