<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Barres empilées divergentes : le mix électrique de six pays européens en 2024, fossile à gauche, renouvelable à droite, nucléaire à cheval sur l’axe. France porte 67,7 % de nucléaire, plus que ses 5,1 % de fossile et ses 27,2 % de renouvelable réunis ; Pologne penche à gauche avec 68,9 % de fossile et Norvège à droite avec 98,6 %."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Le nucléaire tient le centre :</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">en France il pèse plus que le</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">fossile et le renouvelable</text><text x="52" y="210.80422262890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">réunis</text><text x="52" y="255.2060127400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Mix électrique 2024, en parts de la production de chaque pays. À</text><text x="52" y="274.0568201619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">gauche le fossile, à droite le renouvelable, et au centre le nucléaire —</text><text x="52" y="292.9076275838281" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">qui n’est ni l’un ni l’autre. France : 67,7 % de nucléaire contre 5,1 % de</text><text x="52" y="311.7584350057031" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">fossile et 27,2 % de renouvelable. Pologne penche le plus à gauche (68,9</text><text x="52" y="330.6092424275781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">%), Norvège le plus à droite (98,6 %).</text><text x="52" y="787.0943758228701" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque rang fait 100 %. La masse nucléaire est posée À</text><text x="52" y="805.9451832447451" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">CHEVAL sur l’axe, moitié de chaque côté, donc elle ne fait pencher ni</text><text x="52" y="824.7959906666201" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">l’un ni l’autre — le penchant se lit au côté le plus long. Dans chaque</text><text x="52" y="843.6467980884951" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">camp, la teinte fonce vers l’extérieur : gaz, pétrole, charbon à gauche ;</text><text x="52" y="862.4976055103701" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">bioénergie, autres, hydraulique, solaire, éolien à droite.</text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">(2025), via Our World in Data</text><text x="174.65840490162373" y="371.2540439900781" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">← Fossile</text><text x="446.4541015625" y="371.2540439900781" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">Renouvelable →</text><text x="310.55625323206186" y="371.2540439900781" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Nucléaire</text><g><rect x="310.55625323206186" y="396.891969497587" width="0.6" height="30" fill="#dbd9cd"></rect><rect x="236.7330553532798" y="396.891969497587" width="73.82319787878205" height="30" fill="#343330"></rect><rect x="233.1405895741519" y="396.891969497587" width="3.5924657791278958" height="30" fill="#5a5954"></rect><rect x="216.98633686185372" y="396.891969497587" width="16.15425271229819" height="30" fill="#817f78"></rect><rect x="310.55625323206186" y="396.891969497587" width="6.276945701992697" height="30" fill="#b9cbdd"></rect><rect x="316.83319893405456" y="396.891969497587" width="0.6" height="30" fill="#91aed3"></rect><rect x="316.83319893405456" y="396.891969497587" width="1.6659566580131562" height="30" fill="#6891ca"></rect><rect x="318.4991555920677" y="396.891969497587" width="13.943504540527176" height="30" fill="#4074c0"></rect><rect x="332.4426601325949" y="396.891969497587" width="20.441525059696975" height="30" fill="#1757b6"></rect><text x="123.11250646412373" y="415.0282152251261" text-anchor="end" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a">Pologne</text><g><text x="208.98633686185372" y="415.444215591337" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="none" stroke="#FFFCEE" stroke-width="3.4" stroke-linejoin="round">68,9</text><text x="208.98633686