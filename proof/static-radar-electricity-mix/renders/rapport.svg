<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Radar à neuf rayons comparant la part de chaque source dans la production électrique de France et de Allemagne en 2024. Le polygone français est étiré vers le nucléaire (67,7 %), celui de l’Allemagne vers l’éolien et le solaire (43,5 % à eux deux) et le charbon (21,4 %). L’Allemagne n’a plus de nucléaire."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La France et l’Allemagne produisent presque autant d’électricité,</text><text x="46" y="123.99" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">avec des mix opposés</text><text x="46" y="172.53" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Part de chaque source dans la production</text><text x="46" y="191.38" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">électrique du pays, en 2024. France 561,8 TWh,</text><text x="46" y="210.23" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Allemagne 496,0 TWh. Le nucléaire fait 67,7 %</text><text x="46" y="229.07999999999998" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">du mix français et 0,0 % du mix allemand ;</text><text x="46" y="247.93" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">l’éolien et le solaire réunis, 43,5 % en</text><text x="46" y="266.78" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Allemagne contre 12,5 % en France.</text><text x="46" y="317.63" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE RAYON EST UNE PART DE LA</text><text x="46" y="336.48" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">PRODUCTION DU PAYS LUI-MÊME — LES NEUF</text><text x="46" y="355.33" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">PARTS D’UN POLYGONE FONT 100 %. RAYONS</text><text x="46" y="374.18" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">RANGÉS PAR FAMILLE DANS LE SENS HORAIRE :</text><text x="46" y="393.03" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">RENOUVELABLES, NUCLÉAIRE, FOSSILES. CERCLE</text><text x="46" y="411.88" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">EXTÉRIEUR 70,0 % ; CHAQUE NOMBRE EST UNE</text><text x="46" y="430.73" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">PART, EN %.</text><text x="46" y="297.63" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#000000"><tspan fill="#1e5a88" font-weight="700">FRANCE</tspan><tspan fill="#5f5f5f" font-weight="700">   ·   ALLEMAGNE</tspan></text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><circle cx="641.5" cy="315.065" r="32.011313476562506" fill="none" stroke="#d1d1d1" str