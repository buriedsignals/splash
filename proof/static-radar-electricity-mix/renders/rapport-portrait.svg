<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Radar à neuf rayons comparant la part de chaque source dans la production électrique de France et de Allemagne en 2024. Le polygone français est étiré vers le nucléaire (67,7 %), celui de l’Allemagne vers l’éolien et le solaire (43,5 % à eux deux) et le charbon (21,4 %). L’Allemagne n’a plus de nucléaire."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La France et l’Allemagne</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">produisent presque autant</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">d’électricité, avec des mix opposés</text><text x="46" y="205.47352927806094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Part de chaque source dans la production électrique du pays, en 2024.</text><text x="46" y="224.32287277806094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">France 561,8 TWh, Allemagne 496,0 TWh. Le nucléaire fait 67,7 % du</text><text x="46" y="243.17221627806094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">mix français et 0,0 % du mix allemand ; l’éolien et le solaire réunis, 43,5</text><text x="46" y="262.0215597780609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic"