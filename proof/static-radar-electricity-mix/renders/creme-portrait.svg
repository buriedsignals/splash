<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Radar à neuf rayons comparant la part de chaque source dans la production électrique de France et de Allemagne en 2024. Le polygone français est étiré vers le nucléaire (67,7 %), celui de l’Allemagne vers l’éolien et le solaire (43,5 % à eux deux) et le charbon (21,4 %). L’Allemagne n’a plus de nucléaire."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La France et l’Allemagne</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">produisent presque autant</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">d’électricité, avec des mix</text><text x="52" y="210.80422262890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">opposés</text><text x="52" y="263.00647685125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part de chaque source dans la production électrique du pays, en 2024.</text><text x="52" y="281.857284273125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">France 561,8 TWh, Allemagne 496,0 TWh. Le nucléaire fait 67,7 % du mix</text><text x="52" y="300.708091695" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">français et 0,0 % du mix allemand ; l’éolien et le solaire réunis, 43,5 % en</text><text x="52" y="319.558899116875" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Allemagne contre 12,5 % en France.</text><text x="52" y="814.3963157466798" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque rayon est une part de la production du pays</text><text x="52" y="833.2471231685547" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">lui-même — les neuf parts d’un polygone font 100 %. Rayons rangés</text><text x="52" y="852.0979305904298" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">par famille dans le sens horaire : renouvelables, nucléaire, fossiles.</text><text x="52" y="870.9487380123047" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Cercle extérieur 70,0 % ; chaque nombre est une part, en %.</text><text x="52" y="354.00944576993004" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a"><tspan fill="#1755b2" font-weight="700">France</tspan><tspan fill="#5f5e58" font-weight="400">   ·   Allemagne</tspan></text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">(2025), via Our World in Data</text><circle cx="270" cy="579.8315039298283" r="27.768372636288404" fill="none" stroke="#d1cfc3" stroke-width="0.6" stroke-dasharray="3 4"></circle><circle cx="270" cy="579.8315039298283" r="55.53674527257681" fill="none" stroke="#d1cfc3" stroke-wi