<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Radar à neuf rayons comparant la part de chaque source dans la production électrique de France et de Allemagne en 2024. Le polygone français est étiré vers le nucléaire (67,7 %), celui de l’Allemagne vers l’éolien et le solaire (43,5 % à eux deux) et le charbon (21,4 %). L’Allemagne n’a plus de nucléaire."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Futura" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.05" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LA FRANCE ET L’ALLEMAGNE PRODUISENT</text><text x="56" y="145.09" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PRESQUE AUTANT D’ÉLECTRICITÉ, AVEC DES</text><text x="56" y="184.13" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">MIX OPPOSÉS</text><text x="56" y="238.17000000000002" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Part de chaque source dans la production</text><text x="56" y="256.295" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">électrique du pays, en 2024. France 561,8 TWh,</text><text x="56" y="274.42" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Allemagne 496,0 TWh. Le nucléaire fait 67,7 % du</text><text x="56" y="292.545" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">mix français et 0,0 % du mix allemand ; l’éolien et</text><text x="56" y="310.67" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">le solaire réunis, 43,5 % en Allemagne contre 12,5</text><text x="56" y="328.795" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">% en France.</text><text x="56" y="378.92" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : PART DE LA PRODUCTION DU PAYS</text><text x="56" y="397.045" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LUI-MÊME, EN %. RAYONS PAR FAMILLE,</text><text x="56" y="415.17" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SENS HORAIRE. CERCLE EXTÉRIEUR 70,0 %.</text><text x="56" y="358.92" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#FFFFFF"><tspan fill="#53e1c1" font-weight="700">FRANCE</tspan><tspan fill="#a7a6b9" font-weight="500">   ·   ALLEMAGNE</tspan></text><text x="56" y="484" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><circle cx="638" cy="343.58500000000004" r="22.454984436035154" fill="none" stroke="#3c3b66" stroke-width="0.48" stroke-dasharray="3 4"></circle><circle cx="638" cy="343.58500000000004" r="44.90996887207031" fill="none" stroke="#3c3b66" stroke-width="0.48" stroke-dasharray="3 4"></circle><circle cx="638" cy="343.58500000000004" r="67.36495330810547" fill="none" stroke="#3c3b66" stroke-width="0.48" stroke-dasharray="3 4"></circle><circle cx="638" cy="343.58500000000004" r="89.81993774414062" fill="none" stroke="#a7a6b9" stroke-width="0.8"></circle><g><text x="666.6681071207996" y="264.82002302709685" font-family="Futura" font-size="10" font-weight="400" font-style="normal