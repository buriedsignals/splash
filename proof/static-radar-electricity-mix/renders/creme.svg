<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Radar à neuf rayons comparant la part de chaque source dans la production électrique de France et de Allemagne en 2024. Le polygone français est étiré vers le nucléaire (67,7 %), celui de l’Allemagne vers l’éolien et le solaire (43,5 % à eux deux) et le charbon (21,4 %). L’Allemagne n’a plus de nucléaire."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La France et l’Allemagne produisent presque autant</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">d’électricité, avec des mix opposés</text><text x="52" y="189.80382485125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part de chaque source dans la production</text><text x="52" y="208.654632273125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">électrique du pays, en 2024. France 561,8 TWh,</text><text x="52" y="227.505439695" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Allemagne 496,0 TWh. Le nucléaire fait 67,7 %</text><text x="52" y="246.356247116875" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">du mix français et 0,0 % du mix allemand ;</text><text x="52" y="265.20705453875" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">l’éolien et le solaire réunis, 43,5 % en Allemagne</text><text x="52" y="284.057861960625" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">contre 12,5 % en France.</text><text x="52" y="344.50979405955997" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque rayon est une part de la</text><text x="52" y="363.36060148143497" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">production du pays lui-même — les neuf parts</text><text x="52" y="382.21140890331" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">d’un polygone font 100 %. Rayons rangés par</text><text x="52" y="401.062216325185" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">famille dans le sens horaire : renouvelables,</text><text x="52" y="419.91302374706" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">nucléaire, fossiles. Cercle extérieur 70,0 % ;</text><text x="52" y="438.763831168935" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">chaque nombre est une part, en %.</text><text x="52" y="318.50840861368" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a"><tspan fill="#1755b2" font-weight="700">France</tspan><tspan fill="#5f5e58" font-weight="400">   ·   Allemagne</tspan></text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><circle cx="639.5" cy="320.7012162588672" r="28.351720593603517" fill="none" stroke="#d1cfc3" stroke-width="