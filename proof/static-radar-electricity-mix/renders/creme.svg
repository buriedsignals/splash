<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Radar à neuf rayons comparant la part de chaque source dans la production électrique de France et de Allemagne en 2024. Le polygone français est étiré vers le nucléaire (67,7 %), celui de l’Allemagne vers l’éolien et le solaire (43,5 % à eux deux) et le charbon (21,4 %). L’Allemagne n’a plus de nucléaire."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La France et l’Allemagne produisent presque</text><text x="52" y="137.6" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">autant d’électricité, avec des mix opposés</text><text x="52" y="189.79999999999998" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part de chaque source dans la production</text><text x="52" y="208.64999999999998" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">électrique du pays, en 2024. France 561,8 TWh,</text><text x="52" y="227.49999999999997" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Allemagne 496,0 TWh. Le nucléaire fait 67,7 %</text><text x="52" y="246.34999999999997" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">du mix français et 0,0 % du mix allemand ;</text><text x="52" y="265.2" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">l’éolien et le solaire réunis, 43,5 % en Allemagne</text><text x="52" y="284.04999999999995" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">contre 12,5 % en France.</text><text x="52" y="344.5" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : part de la production du pays</text><text x="52" y="363.35" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">lui-même, en %. Rayons par famille,</text><text x="52" y="382.2" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">sens horaire. Cercle extérieur 70,0 %.</text><text x="52" y="318.5" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#61605a"><tspan fill="#1755b2" font-weight="700">France</tspan><tspan fill="#5f5e58" font-weight="400">   ·   Allemagne</tspan></text><text x="52" y="488" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><circle cx="639.5" cy="320.7" r="28.40525207519532" fill="none" stroke="#d1cfc3" stroke-width="0.6" stroke-dasharray="3 4"></circle><circle cx="639.5" cy="320.7" r="56.81050415039064" fill="none" stroke="#d1cfc3" stroke-width="0.6" stroke-dasharray="3 4"></circle><circle cx="639.5" cy="320.7" r="85.21575622558596" fill="none" stroke="#d1cfc3" stroke-width="0.6" stroke-dasharray="3 4"></circle><circle cx="639.5" cy="320.7" r="113.62100830078128" fill="none" stroke="#5f5e58" stroke-width="1"></circle><g><text x="676.3085526838862" y="219.56933265821684" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="none" text-anchor="end" stroke="#FFFCEE" stroke-width="3.4" stroke-linejoin="round">70,0 