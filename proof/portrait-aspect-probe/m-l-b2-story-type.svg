<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" font-family="Helvetica, Arial, sans-serif"><desc>A line falling from 912 to 604 mm across 10 readings between 2015 and 2025, with no reading in 2019.</desc><rect x="0" y="0" width="1080" height="1920" fill="#FFFFFF"></rect><text x="76" y="144" fill="#000000" font-size="68" font-weight="700">Rainfall over the sample</text><text x="76" y="232" fill="#000000" font-size="68" font-weight="700">town fell by a third</text><text x="76" y="289" fill="#616161" font-size="39">Annual total, 2015 to 2025. Sample data — the</text><text x="76" y="344" fill="#616161" font-size="39">seed&#x27;s own file, kept so this probe compares layouts</text><text x="76" y="399" fill="#616161" font-size="39">and not stories.</text><text x="76" y="1844" fill="#616161" font-size="27">Sample data — not a real measurement</text><g><line x1="183.68408203125" x2="639.55615234375" y1="988" y2="988" stroke="#d1d1d1" stroke-width="1"></line><text x="164.68408203125" y="996" fill="#616161" font-size="25" text-anchor="end">600</text></g><g><line x1="183.68408203125" x2="639.55615234375" y1="913.1428571428571" y2="913.1428571428571" stroke="#d1d1d1" stroke-width="1"></line><text x="164.68408203125" y="921.1428571428571" fill="#616161" font-size="25" text-anchor="end">650</text></g><g><line x1="183.68408203125" x2="639.55615234375" y1="838.2857142857143" y2="838.2857142857143" stroke="#d1d1d1" stroke-width="1"></line><text x="164.68408203125" y="846.2857142857143" fill="#616161" font-size="25" text-anchor="end">700</text></g><g><line x1="183.68408203125" x2="639.55615234375" y1="763.4285714285713" y2="763.4285714285713" stroke="#d1d1d1" stroke-width="1"></line><text x="164.68408203125" y="771.4285714285713" fill="#616161" font-size="25" text-anchor="end">750</text></g><g><line x1="183.68408203125" x2="639.55615234375" y1="688.5714285714286" y2="688.5714285714286" stroke="#d1d1d1" stroke-width="1"></line><text x="164.68408203125" y="696.5714285714286" fill="#616161" font-size="25" text-anchor="end">800</text></g><g><line x1="183.68408203125" x2="639.55615234375" y1="613.7142857142858" y2="613.7142857142858" stroke="#d1d1d1" stroke-width="1"></line><text x="164.68408203125" y="621.7142857142858" fill="#616161" font-size="25" text-anchor="end">850</text></g><g><line x1="183.68408203125" x2="639.55615234375" y1="538.8571428571429" y2="538.8571428571429" stroke="#d1d1d1" stroke-width="1"></line><text x="164.68408203125" y="546.8571428571429" fill="#616161" font-size="25" text-anchor="end">900</text></g><g><line x1="183.68408203125" x2="639.55615234375" y1="464" y2="464" stroke="#d1d1d1" stroke-width="1"></line><text x="164.68408203125" y="472" fill="#616161" font-size="25" text-anchor="end">950 mm</text></g><text x="229.2712890625" y="1034" fill="#616161" font-size="25" text-anchor="middle">2016</text><text x="320.445703125" y="1034" fill="#616161" font-size="25" text-anchor="middle">2018</text><text x="411.6201171875" y="1034" fill="#616161" font-size="25" text-anchor="middle">2020</text><text x="502.79453125" y="1034" fill="#616161" font-size="25" text-anchor="middle">2022</text><text x="593.9689453125001" y="1034" fill="#616161" font-size="25" text-anchor="middle">2024</text><text x="366.03291015625" y="718.7828571428572" fill="#616161" font-size="23" text-anchor="middle">no data 2019</text><path d="M183.7,520.9L229.3,586.8L274.9,696.1L320.4,642.2M411.6,775.4L457.2,724.5L502.8,853.3L548.4,818.8L594,920.6L639.6,982" fill="none" stroke="#0B7A75" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path><circle cx="639.55615234375" cy="982.0114285714286" r="4" fill="#0B7A75"></circle><text x="658.55615234375" y="992.0114285714286" fill="#0B7A75" font-size="29" font-weight="600">the sample town 604 mm</text><line x1="76" x2="1004" y1="1093" y2="1093" stroke="#d1d1d1" stroke-width="1"></line><g><text x="76" y="1181" fill="#0B7A75" font-size="39" font-weight="700">The fall.</text><text x="239.7265625" y="1181" fill="#000000" font-size="39">912 mm in 2015 to 604 mm in 2025 — 308</text><text x="239.7265625" y="1241" fill="#000000" font-size="39">mm less, a drop of 34% over 10 years.</text></g><g><text x="76" y="1328" fill="#0B7A75" font-size="39" font-weight="700">The pace.</text><text x="272.27099609375" y="1328" fill="#000000" font-size="39">It is a drift, not a collapse: the largest</text><text x="272.27099609375" y="1388" fill="#000000" font-size="39">year-on-year change in the series is 89</text><text x="272.27099609375" y="1448" fill="#000000" font-size="39">mm, about 10% of the 2015 total.</text></g><g><text x="76" y="1535" fill="#0B7A75" font-size="39" font-weight="700">The gap.</text><text x="252.7138671875" y="1535" fill="#000000" font-size="39">No reading was taken in 2019. The line is</text><text x="252.7138671875" y="1595" fill="#000000" font-size="39">broken there rather than bridged, and the</text><text x="252.7138671875" y="1655" fill="#000000" font-size="39">axis is fitted to the readings&#x27; own range of</text><text x="252.7138671875" y="1715" fill="#000000" font-size="39">600 to 950 mm rather than anchored at</text><text x="252.7138671875" y="1775" fill="#000000" font-size="39">zero.</text></g></svg>