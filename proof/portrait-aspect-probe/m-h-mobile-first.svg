<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Histogram of CO2 emissions per capita across 213 countries in 2023, in 4-tonne bins from 0 to 36 and above. The distribution is heavily right-skewed: 127 countries sit in the 0-4 tonne bin, more than any other bin; the rest thin out into a long tail, topped by Qatar alone above 36 tonnes, at 40.1 tonnes. A dashed median line sits at 3.1 tonnes.</desc><rect x="0" y="0" width="1080" height="1920" fill="#FFFFFF"></rect><text x="72" y="341" fill="#000000" font-size="72" font-weight="700">Six in ten countries emit</text><text x="72" y="427" fill="#000000" font-size="72" font-weight="700">under 4 tonnes of CO2 per</text><text x="72" y="513" fill="#000000" font-size="72" font-weight="700">person a year</text><text x="72" y="598" fill="#616161" font-size="39" font-weight="600">Number of countries</text><g><line x1="149.4130859375" x2="1008" y1="1099" y2="1099" stroke="#616161" stroke-width="2"></line><text x="135.4130859375" y="1111" fill="#616161" font-size="39" text-anchor="end">0</text></g><g><line x1="149.4130859375" x2="1008" y1="1028.076923076923" y2="1028.076923076923" stroke="#d1d1d1" stroke-width="2"></line><text x="135.4130859375" y="1040.076923076923" fill="#616161" font-size="39" text-anchor="end">20</text></g><g><line x1="149.4130859375" x2="1008" y1="957.1538461538462" y2="957.1538461538462" stroke="#d1d1d1" stroke-width="2"></line><text x="135.4130859375" y="969.1538461538462" fill="#616161" font-size="39" text-anchor="end">40</text></g><g><line x1="149.4130859375" x2="1008" y1="886.2307692307692" y2="886.2307692307692" stroke="#d1d1d1" stroke-width="2"></line><text x="135.4130859375" y="898.2307692307692" fill="#616161" font-size="39" text-anchor="end">60</text></g><g><line x1="149.4130859375" x2="1008" y1="815.3076923076924" y2="815.3076923076924" stroke="#d1d1d1" stroke-width="2"></line><text x="135.41308593