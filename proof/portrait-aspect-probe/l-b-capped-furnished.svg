<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" font-family="Helvetica, Arial, sans-serif"><desc>A line falling from 912 to 604 mm across 10 readings between 2015 and 2025, with no reading in 2019.</desc><rect x="0" y="0" width="1080" height="1920" fill="#FFFFFF"></rect><text x="48" y="94" fill="#000000" font-size="46" font-weight="700">Rainfall over the sample town fell by a third</text><text x="48" y="130" fill="#616161" font-size="26">Annual total, 2015 to 2025. Sample data — the seed&#x27;s own file, kept so this probe</text><text x="48" y="167" fill="#616161" font-size="26">compares layouts and not stories.</text><text x="48" y="1872" fill="#616161" font-size="17">Sample data — not a real measurement</text><g><line x1="116.7578125" x2="806.0693359375" y1="1069.639404296875" y2="1069.639404296875" stroke="#d1d1d1" stroke-width="1"></line><text x="104.7578125" y="1074.639404296875" fill="#616161" font-size="16" text-anchor="end">600</text></g><g><line x1="116.7578125" x2="806.0693359375" y1="946.5480608258929" y2="946.5480608258929" stroke="#d1d1d1" stroke-width="1"></line><text x="104.7578125" y="951.5480608258929" fill="#616161" font-size="16" text-anchor="end">650</text></g><g><line x1="116.7578125" x2="806.0693359375" y1="823.4567173549108" y2="823.4567173549108" stroke="#d1d1d1" stroke-width="1"></line><text x="104.7578125" y="828.4567173549108" fill="#616161" font-size="16" text-anchor="end">700</text></g><g><line x1="116.7578125" x2="806.0693359375" y1="700.3653738839286" y2="700.3653738839286" stroke="#d1d1d1" stroke-width="1"></line><text x="104.7578125" y="705.3653738839286" fill="#616161" font-size="16" text-anchor="end">750</text></g><g><line x1="116.7578125" x2="806.0693359375" y1="577.2740304129464" y2="577.2740304129464" stroke="#d1d1d1" stroke-width="1"></line><text x="104.7578125" y="582.2740304129464" fill="#616161" font-size="16" text-anchor="end">800</text></g><g><line x1="116.7578125" x2="806.0693359375" y1="454.18268694196433" y2="454.18268694196433" stroke="#d1d1d1" stroke-width="1"></line><text x="104.7578125" y="459.18268694196433" fill="#616161" font-size="16" text-anchor="end">850</text></g><g><line x1="116.7578125" x2="806.0693359375" y1="331.0913434709822" y2="331.0913434709822" stroke="#d1d1d1" stroke-width="1"></line><text x="104.7578125" y="336.0913434709822" fill="#616161" font-size="16" text-anchor="end">900</text></g><g><line x1="116.7578125" x2="806.0693359375" y1="208" y2="208" stroke="#d1d1d1" stroke-width="1"></line><text x="104.7578125" y="213" fill="#616161" font-size="16" text-anchor="end">950 mm</text></g><text x="185.68896484375" y="1098.639404296875" fill="#616161" font-size="16" text-anchor="middle">2016</text><text x="323.55126953125" y="1098.639404296875" fill="#616161" font-size="16" text-anchor="middle">2018</text><text x="461.41357421875" y="1098.639404296875" fill="#616161" font-size="16" text-anchor="middle">2020</text><text x="599.27587890625" y="1098.639404296875" fill="#616161" font-size="16" text-anchor="middle">2022</text><text x="737.13818359375" y="1098.639404296875" fill="#616161" font-size="16" text-anchor="middle">2024</text><text x="392.482421875" y="616.5086931501116" fill="#616161" font-size="14" text-anchor="middle">no data 2019</text><path d="M116.8,301.5L185.7,409.9L254.6,589.6L323.6,501M461.4,720.1L530.3,636.4L599.3,848.1L668.2,791.5L737.1,958.9L806.1,1059.8" fill="none" stroke="#0B7A75" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path><circle cx="806.0693359375" cy="1059.7920968191963" r="4" fill="#0B7A75"></circle><text x="818.0693359375" y="1065.7920968191963" fill="#0B7A75" font-size="18" font-weight="600">the sample town 604 mm</text><line x1="48" x2="1032" y1="1498" y2="1498" stroke="#d1d1d1" stroke-width="1"></line><g><text x="48" y="1555" fill="#0B7A75" font-size="26" font-weight="700">The fall.</text><text x="156.484375" y="1555" fill="#000000" font-size="26">912 mm in 2015 to 604 mm in 2025 — 308 mm less, a drop of 34% over 10</text><text x="156.484375" y="1595" fill="#000000" font-size="26">years.</text></g><g><text x="48" y="1652" fill="#0B7A75" font-size="26" font-weight="700">The pace.</text><text x="178.1806640625" y="1652" fill="#000000" font-size="26">It is a drift, not a collapse: the largest year-on-year change in the series is</text><text x="178.1806640625" y="1692" fill="#000000" font-size="26">89 mm, about 10% of the 2015 total.</text></g><g><text x="48" y="1749" fill="#0B7A75" font-size="26" font-weight="700">The gap.</text><text x="165.142578125" y="1749" fill="#000000" font-size="26">No reading was taken in 2019. The line is broken there rather than bridged,</text><text x="165.142578125" y="1789" fill="#000000" font-size="26">and the axis is fitted to the readings&#x27; own range of 600 to 950 mm rather</text><text x="165.142578125" y="1829" fill="#000000" font-size="26">than anchored at zero.</text></g></svg>