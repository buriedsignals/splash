<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Histogram of CO2 emissions per capita across 213 countries in 2023, in 4-tonne bins from 0 to 36 and above. The distribution is heavily right-skewed: 127 countries sit in the 0-4 tonne bin, more than any other bin; the rest thin out into a long tail, topped by Qatar alone above 36 tonnes, at 40.1 tonnes. A dashed median line sits at 3.1 tonnes.</desc><rect x="0" y="0" width="1080" height="1920" fill="#FFFFFF"></rect><text x="48" y="92" fill="#000000" font-size="44" font-weight="700">Six in ten countries emit under 4 tonnes of</text><text x="48" y="148" fill="#000000" font-size="44" font-weight="700">CO2 per person a year</text><text x="48" y="182" fill="#616161" font-size="25">Per-country distribution for 2023 — each of the 213 countries counts equally here, not</text><text x="48" y="217" fill="#616161" font-size="25">weighted by population. A few oil and gas producers sit far out on the right.</text><text x="48" y="243" fill="#616161" font-size="17">Source: Global Carbon Budget (2025), via Our World in Data · 2023 data, extracted 8 August 2026</text><g><line x1="155.484375" x2="1022" y1="1071.7414772727273" y2="1071.7414772727273" stroke="#616161" stroke-width="1"></line><text x="143.484375" y="1076.7414772727273" fill="#616161" font-size="16" text-anchor="end">0</text></g><g><line x1="155.484375" x2="1022" y1="950.5504807692308" y2="950.5504807692308" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="955.5504807692308" fill="#616161" font-size="16" text-anchor="end">20</text></g><g><line x1="155.484375" x2="1022" y1="829.3594842657342" y2="829.3594842657342" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="834.3594842657342" fill="#616161" font-size="16" text-anchor="end">40</text></g><g><line x1="155.484375" x2="1022" y1="708.1684877622378" y2="708.1684877622378" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="713.1684877622378" fill="#616161" font-size="16" text-anchor="end">60</text></g><g><line x1="155.484375" x2="1022" y1="586.9774912587412" y2="586.9774912587412" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="591.9774912587412" fill="#616161" font-size="16" text-anchor="end">80</text></g><g><line x1="155.484375" x2="1022" y1="465.7864947552447" y2="465.7864947552447" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="470.7864947552447" fill="#616161" font-size="16" text-anchor="end">100</text></g><g><line x1="155.484375" x2="1022" y1="344.5954982517482" y2="344.5954982517482" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="349.5954982517482" fill="#616161" font-size="16" text-anchor="end">120 countries</text></g><rect x="155.484375" y="302.1786494755245" width="85.65156250000001" height="769.5628277972028" fill="#616161"></rect><rect x="242.1359375" y="750.5853365384614" width="85.65156250000001" height="321.1561407342658" fill="#616161"></rect><rect x="328.7875" y="980.8482298951049" width="85.65156249999995" height="90.8932473776224" fill="#616161"></rect><rect x="415.4390625" y="1017.2055288461539" width="85.65156250000001" height="54.53594842657333" fill="#616161"></rect><rect x="502.090625" y="1053.5628277972025" width="85.65156250000001" height="18.178649475524708" fill="#616161"></rect><rect x="588.7421875" y="1059.6223776223778" width="85.65156249999995" height="12.119099650349426" fill="#616161"></rect><rect x="675.39375" y="1053.5628277972025" width="85.65156250000007" height="18.178649475524708" fill="#616161"></rect><rect x="762.0453125" y="1071.7414772727273" width="85.65156249999995" height="0" fill="#616161"></rect><rect x="848.696875" y="1071.7414772727273" width="85.65156250000007" height="0" fill="#616161"></rect><rect x="935.3484375" y="1065.6819274475524" width="85.65156249999995" height="6.059549825174827" fill="#616161"></rect><text x="155.484375" y="1095.7414772727273" fill="#616161" font-size="16" text-anchor="middle">0</text><text x="242.1359375" y="1095.7414772727273" fill="#616161" font-size="16" text-anchor="middle">4</text><text x="328.7875" y="1095.7414772727273" fill="#616161" font-size="16" text-anchor="middle">8</text><text x="415.4390625" y="1095.7414772727273" fill="#616161" font-size="16" text-anchor="middle">12</text><text x="502.090625" y="1095.7414772727273" fill="#616161" font-size="16" text-anchor="middle">16</text><text x="588.7421875" y="1095.7414772727273" fill="#616161" font-size="16" text-anchor="middle">20</text><text x="675.39375" y="1095.7414772727273" fill="#616161" font-size="16" text-anchor="middle">24</text><text x="762.0453125" y="1095.7414772727273" fill="#616161" font-size="16" text-anchor="middle">28</text><text x="848.696875" y="1095.7414772727273" fill="#616161" font-size="16" text-anchor="middle">32</text><text x="935.3484375" y="1095.7414772727273" fill="#616161" font-size="16" text-anchor="middle">36</text><text x="1022" y="1095.7414772727273" fill="#616161" font-size="16" text-anchor="middle">40</text><text x="588.7421875" y="1123.7414772727273" fill="#616161" font-size="16" font-weight="600" text-anchor="middle">CO2 emissions per capita (tonnes/year)</text><line x1="223.48793635195312" x2="223.48793635195312" y1="284" y2="1071.7414772727273" stroke="#0B7A75" stroke-width="2" stroke-dasharray="6 4"></line><text x="233.48793635195312" y="303" fill="#000000" font-size="16" font-weight="700">Median: 3.1 t</text><line x1="48" x2="1032" y1="1581" y2="1581" stroke="#d1d1d1" stroke-width="1"></line><g><text x="48" y="1638" fill="#0B7A75" font-size="26" font-weight="700">The bulk.</text><text x="172.3662109375" y="1638" fill="#000000" font-size="26">127 of the 213 countries — 60% — emit less than 4 tonnes a head, and</text><text x="172.3662109375" y="1678" fill="#000000" font-size="26">the first bar is 2.4 times the height of the second.</text></g><g><text x="48" y="1735" fill="#0B7A75" font-size="26" font-weight="700">The middle.</text><text x="202.7080078125" y="1735" fill="#000000" font-size="26">Half of all countries fall below 3.1 tonnes and half above it. That is the</text><text x="202.7080078125" y="1775" fill="#000000" font-size="26">dashed rule, and it sits inside the first bar rather than in the middle of</text><text x="202.7080078125" y="1815" fill="#000000" font-size="26">the axis — which is what a right-skewed distribution looks like.</text></g><g><text x="48" y="1872" fill="#0B7A75" font-size="26" font-weight="700">The tail.</text><text x="156.484375" y="1872" fill="#000000" font-size="26">Qatar alone sits above 36 tonnes, at 40.1 — 13 times the median country.</text></g></svg>