<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Histogram of CO2 emissions per capita across 213 countries in 2023, in 4-tonne bins from 0 to 36 and above. The distribution is heavily right-skewed: 127 countries sit in the 0-4 tonne bin, more than any other bin; the rest thin out into a long tail, topped by Qatar alone above 36 tonnes, at 40.1 tonnes. A dashed median line sits at 3.1 tonnes.</desc><rect x="0" y="0" width="1080" height="1920" fill="#FFFFFF"></rect><text x="48" y="78" fill="#000000" font-size="30" font-weight="700">Six in ten countries emit under 4 tonnes of CO2 per person a year</text><text x="48" y="112" fill="#616161" font-size="17">Per-country distribution for 2023 — each of the 213 countries counts equally here, not weighted by population. A few oil and gas</text><text x="48" y="136" fill="#616161" font-size="17">producers sit far out on the right.</text><text x="48" y="162" fill="#616161" font-size="17">Source: Global Carbon Budget (2025), via Our World in Data · 2023 data, extracted 8 August 2026</text><g><line x1="155.484375" x2="1022" y1="1820" y2="1820" stroke="#616161" stroke-width="1"></line><text x="143.484375" y="1825" fill="#616161" font-size="16" text-anchor="end">0</text></g><g><line x1="155.484375" x2="1022" y1="1571.2307692307693" y2="1571.2307692307693" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="1576.2307692307693" fill="#616161" font-size="16" text-anchor="end">20</text></g><g><line x1="155.484375" x2="1022" y1="1322.4615384615386" y2="1322.4615384615386" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="1327.4615384615386" fill="#616161" font-size="16" text-anchor="end">40</text></g><g><line x1="155.484375" x2="1022" y1="1073.6923076923076" y2="1073.6923076923076" stroke="#d1d1d1" stroke-width="1"></line><text x="143.484375" y="1078.6923076923076" fill="#616161" font-size="16" text-anchor="en