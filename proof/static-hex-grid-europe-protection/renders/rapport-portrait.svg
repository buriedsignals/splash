 font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">pour 1 000 habitants en 2026-06. En nombre, l’Allemagne est première</text><text x="46" y="289.76221930641094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">avec 1 251 000 personnes ; par habitant elle est 11e, à 14,8 pour 1 000, et</text><text x="46" y="308.6115628064109" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">la France ferme la marche à 0,7.</text><g><path d="M 125.1 403.7 L 147.9 418.9 L 147.9 449.3 L 125.1 464.6 L 102.2 449.3 L 102.2 418.9 Z" fill="#52697b" stroke="#FFFFFF" stroke-width="1.2"></path><text x="125.05882352941177" y="436.7295745103404" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#FFFFFF">ISL</text></g><g><path d="M 283.2 403.7 L 306.0 418.9 L 306.0 449.3 L 283.2 464.6 L 260.4 449.3 L 260.4 418.9 Z" fill="#52697b" stroke="#FFFFFF" stroke-width="1.2"></path><text x="283.17647058823525" y="436.7295745103404" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#FFFFFF">NOR</text></g><g><path d="M 335.9 403.7 L 358.7 418.9 L 358.7 449.3 L 335.9 464.6 L 313.1 449.3 L 313.1 418.9 Z" fill="#8d9295" stroke="#FFFFFF" stroke-width="1.2"></path><text x="335.88235294117646" y="436.7295745103404" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#000000">SWE</text></g><g><path d="M 388.6 403.7 L 411.4 418.9 L 411.4 449.3 L 388.6 464.6 L 365.8 449.3 L 365.8 418.9 Z" fill="#52697b" stroke="#FFFFFF" stroke-width="1.2"></path><text x="388.5882352941176" y="436.7295745103404" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0