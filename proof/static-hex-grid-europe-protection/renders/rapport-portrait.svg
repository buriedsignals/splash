amily="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">personnes que les autres cases comptent.</text><text x="46" y="846.4174333374999" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE PAYS PÈSE UNE CASE, QUELLE QUE SOIT SA TAILLE —</text><text x="46" y="860.4169059937499" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">C’EST CE QUE CETTE FORME ACHÈTE, ET ELLE LE PAIE EN GÉOGRAPHIE. LA</text><text x="46" y="874.41637865" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">DISPOSITION EST DESSINÉE À LA MAIN.</text><text x="46" y="895.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Sources : Eurostat (migr_asytpsm), 2026-06 · population 2023, via Our</text><text x="46" y="914" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">World in Data</text></svg>