<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Grille d’hexagones : un hexagone par pays européen, tous de même taille, rangés à peu près comme la carte. La teinte donne le nombre d’Ukrainiens sous protection temporaire pour 1 000 habitants en 2026-06. La Tchéquie est la plus foncée à 36,1 pour 1 000, devant la Slovaquie et la Pologne ; l’Allemagne, première en nombre absolu, n’est que 11e ici avec 14,8, et la France est la plus claire à 0,7. L’Ukraine a sa case, hors du compte."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">MIGRATIONS · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PAR HABITANT, CE</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">N’EST PAS</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">L’ALLEMAGNE : LA</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">TCHÉQUIE ACCUEILLE</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">36,1 UKRAINIENS</text><text x="56" y="301.24591515" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">POUR 1 000</text><text x="56" y="340.28512155" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">HABITANTS</text><text x="56" y="389.3243187717773" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Un hexagone par pays, tous de même taille, rangés à peu près comme la</text><text x="56" y="407.4500951389648" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">carte : la couleur est le nombre d’Ukrainiens sous protection temporaire</text><text x="56" y="425.57587150615234" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">pour 1 000 habitants en 2026-06. En nombre, l’Allemagne est première</text><text x="56" y="443.7016478733398" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">avec 1 251 000 personnes ; par habitant elle est 11e, à 14,8 pour 1 000, et</text><text x="56" y="461.8274242405273" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">la France ferme la marche à 0,7.</text><g><path d="M 142.3 488.4 L 162.4 501.8 L 162.4 528.6 L 142.3 542.0 L 122.2 528.6 L 122.2 501.8 Z" fill="#6fa7ab" stroke="#111044" stroke-width="1.2"></path><text x="142.3468847781437" y="517.6584092855211" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#111044">ISL</text></g><g><path d="M 281.6 488.4 L 301.7 501.8 L 301.7 528.6 L 281.6 542.0 L 261.5 528.6 L 261.5 501.8 Z" fill="#6fa7ab" stroke="#111044" stroke-width="1.2"></path><text x="281.6048286565324" y="517.6584092855211" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#111044">NOR</text></g><g><path d="M 328.0 488.4 L 348.1 501.8 L 348.1 528.6 L 328.0 542.0 L 307.9 528.6 L 307.9 501.8 Z" fill="#596583" stroke="#111044" stroke-width="1.2"></path><text x="328.02414328266195" y="517.6584092855211" text-anchor="middle" font-family="Montserrat" font