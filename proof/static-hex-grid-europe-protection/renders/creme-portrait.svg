en Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">personnes que les autres cases comptent.</text><text x="52" y="832.0120928140625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque pays pèse une case, quelle que soit sa taille — c’est ce</text><text x="52" y="850.2126986140624" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">que cette forme achète, et elle le paie en géographie. La disposition est</text><text x="52" y="868.4133044140625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">dessinée à la main.</text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Sources : Eurostat (migr_asytpsm), 2026-06 · population 2023, via Our</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">World in Data</text></svg>