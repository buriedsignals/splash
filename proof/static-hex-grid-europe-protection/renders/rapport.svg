<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Grille d’hexagones : un hexagone par pays européen, tous de même taille, rangés à peu près comme la carte. La teinte donne le nombre d’Ukrainiens sous protection temporaire pour 1 000 habitants en 2026-06. La Tchéquie est la plus foncée à 36,1 pour 1 000, devant la Slovaquie et la Pologne ; l’Allemagne, première en nombre absolu, n’est que 11e ici avec 14,8, et la France est la plus claire à 0,7. L’Ukraine a sa case, hors du compte."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">MIGRATIONS · EUROPE</text><text x="46" y="91.05" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Par habitant, ce n’est pas l’Allemagne : la Tchéquie accueille 36,1</text><text x="46" y="123.99" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Ukrainiens pour 1 000 habitants</text><text x="46" y="167.33" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Un hexagone par pays, tous de même taille, rangés à peu près comme la carte : la couleur est le nombre d’Ukrainiens sous protection</text><text x="46" y="186.18" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">temporaire pour 1 000 habitants en 2026-06. En nombre, l’Allemagne est première avec 1 251 000 personnes ; par habitant elle est 11e, à 14,8</text><text x="46" y="205.03" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">pour 1 000, et la France ferme la marche à 0,7.</text><g><path d="M 396.1 232.4 L 409.3 241.3 L 409.3 258.9 L 396.1 267.7 L 382.9 258