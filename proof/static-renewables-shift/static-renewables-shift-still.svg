<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif" data-ladder="none"><desc>Slope chart of 6 countries&#x27; renewable share of electricity generation, 2015 versus 2024. Germany rises from 29% to 59%, the steepest climb at 29 percentage points. Norway moves least, from 98% to 99%, already near the top of the scale. The others: Sweden 63% to 69%, Switzerland 62% to 67%, Poland 14% to 31%, France 16% to 27%.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="138" fill="#000000" font-size="53" font-weight="700">Germany&#x27;s renewable electricity share nearly doubled in nine years</text><text x="85" y="200" fill="#616161" font-size="31">Share of each country&#x27;s own total generation. Norway was already near-total renewable in 2015, so it had almost no room left</text><text x="85" y="244" fill="#616161" font-size="31">to climb.</text><text x="85" y="995" fill="#616161" font-size="31">Source: Ember, Energy Institute — Statistical Review of World Energy (2025), via Our World in Data · extracted 8 August 2026</text><line x1="361.6064453125" x2="361.6064453125" y1="363" y2="898" stroke="#d1d1d1" stroke-width="1"></line><line x1="1558.3935546875" x2="1558.3935546875" y1="363" y2="898" stroke="#d1d1d1" stroke-width="1"></line><text x="361.6064453125" y="319" fill="#000000" font-size="31" font-weight="700" text-anchor="middle">2015</text><text x="1558.3935546875" y="319" fill="#000000" font-size="31" font-weight="700" text-anchor="middle">2024</text><g><line x1="361.6064453125" y1="375.1798756798756" x2="1558.3935546875" y2="371.2861264931152" stroke="#616161" stroke-width="3"></line><circle cx="361.6064453125" cy="375.1798756798756" r="8" fill="#616161"></circle><circle cx="1558.3935546875" cy="371.2861264931152" r="8" fill="#616161"></circle><line x1="343.6064453125" y1="375.1798756798756" x2="343.6064453125" y2="375.1798756798756" stroke="#