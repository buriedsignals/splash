<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif" data-ladder="none"><desc>A bump chart of world rank by annual CO₂ emissions, 1990 to 2024, for the 6 countries inside the top 10 in every one of those years. The top row is the world&#x27;s largest emitter. Every line is named at both ends. India&#x27;s line, the only one in the accent colour, starts at rank 8 in 1990 and climbs to rank 3 by 2024; three ringed crossings on it are captioned Germany in 1999, Japan in 2006 and Russia in 2009. The other lines are China, the United States, Russia, Japan and Germany. At the top of the chart China takes the top row from the United States in 2006; that swap is drawn but not marked, because this beat&#x27;s claim is India&#x27;s climb.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="138" fill="#000000" font-size="53" font-weight="700">India has risen from eighth to third among the world&#x27;s biggest CO₂</text><text x="85" y="204" fill="#000000" font-size="53" font-weight="700">emitters</text><text x="85" y="261" fill="#616161" font-size="33">World rank by annual CO₂ emissions, 1990–2024. Only the 6 countries that held a top-10 place in every year are drawn;</text><text x="85" y="305" fill="#616161" font-size="33">other countries hold the ranks left empty. Rank is position, not size — nothing here says how far ahead anyone is.</text><text x="85" y="953" fill="#616161" font-size="31">Source: Global Carbon Budget (2025) – with major processing by Our World in Data · fossil fuels and industry only; land-use</text><text x="85" y="995" fill="#616161" font-size="31">change is not included</text><text x="85" y="371" fill="#616161" font-size="29" font-weight="500">World rank</text><g><line x1="353.234375" x2="1619.79052734375" y1="419" y2="419" stroke="#d1d1d1" stroke-width="1"></line><text x="116.02490234375" y="428.86" fill="#616161" font-size="29" font-weight="500" text-anchor="end">1</text></g><g><line x1="353.234375" x2="1619.79052734375" y1="453.77777777777777" y2="453.77777777777777" stroke="#d1d1d1" stroke-width="1"></line><text x="116.02490234375" y="463.6377777777778" fill="#616161" font-size="29" font-weight="500" text-anchor="end">2</text></g><g><line x1="353.234375" x2="1619.79052734375" y1="488.55555555555554" y2="488.55555555555554" stroke="#d1d1d1" stroke-width="1"></line><text x="116.02490234375" y="498.41555555555556" fill="#616161" font-size="29" font-weight="500" text-anchor="end">3</text></g><g><line x1="353.234375" x2="1619.79052734375" y1="523.3333333333334" y2="523.3333333333334" stroke="#d1d1d1" stroke-width="1"></line><text x="116.02490234375" y="533.1933333333334" fill="#616161" font-size="29" font-weight="500" text-anchor="end">4</text></g><g><line x1="353.234375" x2="1619.79052734375" y1="558.1111111111111" y2="558.1111111111111" stroke="#d1d1d1" stroke-width="1"></line><text x="116.02490234375" y="567.9711111111111" fill="#616161" font-size="29" font-weight="500" text-anchor="end">5</text></g><g><line x1="353.234375" x2="1619.79052734375" y1="592.8888888888889" y2="592.8888888888889" stroke="#d1d1d1" stroke-width="1"></line><text x="116.02490234375" y="602.7488888888889" fill="#616161" font-size="29" font-weight="500" text-anchor="end">6</text></g><g><line x1="353.234375" x2="1619.79052734375" y1="627.6666666666667" y2="627.6666666666667" stroke="#d1d1d1" stroke-width="1"></line><text x="116.02490234375" y="637.5266666666668" fill="#616161" font-size="29" font-weight="500" text-anchor="end">7</text></g><g><line x1="353.234375" x2="1619.79052734375" y1="662.4444444444445" y2="662.4444444444445" stroke="#d1d1d1" stroke-width="1"></line><text x="116.02490234375" y="672.3044444444445" fill="#616161" font-size="29" font-weight="500" text-anchor="end">8</text></g><g><line x1="353.234375" x2="1619.79052734375" y1="697.2222222222222" y2="697.2222222222222" stroke="#d1d1d1" stroke-width="1