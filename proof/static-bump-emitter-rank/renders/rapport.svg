<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique de rangs : le rang mondial de 16 pays par émissions annuelles de CO2 entre 1990 et 2024, l’Inde passant du 8e au 3e."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’Inde est passée du 8e au 3e rang mondial des</text><text x="46" y="123.99" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">émetteurs de CO2</text><text x="46" y="164.73000000000002" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Rang mondial par émissions annuelles de CO2, 1990–2024. Les 16 pays qui ont occupé une place dans le top 10 au</text><text x="46" y="183.58" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">moins une fois sont dessinés ; ceux qui en sont sortis s’arrêtent là où ils sont sortis. Le rang est une position, pas une</text><text x="46" y="202.43" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">taille — rien ici ne dit de combien.</text><text x="46" y="494" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Global Carbon Budget (2025), via Our World in Data · combustibles fossiles et industrie uniquement</text><line x1="199.79350900650024" x2="760.2064909934998" y1="241.28000000000003" y2="241.28000000000003" stroke="#d1d1d1" stroke-width="1"></line><line x1="199.79350900650024" x2="760.2064909934998" y1="264.11