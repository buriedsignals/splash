<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique de rangs : le rang mondial de 16 pays par émissions annuelles de CO2 entre 1990 et 2024, l’Inde passant du 8e au 3e."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’Inde est passée du 8e au 3e rang mondial des émetteurs de CO2</text><text x="46" y="131.79128413776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Rang mondial par émissions annuelles de CO2, 1990–2024. Les 16 pays qui ont occupé une place dans le top 10 au moins une fois sont</text><text x="46" y="150.64062763776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">dessinés ; ceux qui en sont sortis s’arrêtent là où ils sont sortis. Le rang est une position, pas une taille — rien ici ne dit de combien.</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Global Carbon Budget (2025), via Our World in Data · combustibles fossiles et industrie uniquement</text><line x1="198.14990234375" x2="761.85009765625" y1="189.48961777447965" y2="189.48961777447965" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="761.85009765625" y1="218.07984184199302" y2="218.07984184199302" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="761.85009765625" y1="246.6700659095064" y2="246.6700659095064" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="761.85009765625" y1="275.2602899770198" y2="27