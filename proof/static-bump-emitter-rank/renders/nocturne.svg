<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique de rangs : le rang mondial de 16 pays par émissions annuelles de CO2 entre 1990 et 2024, l’Inde passant du 8e au 3e."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Futura" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="56" y="106.05" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">L’INDE EST PASSÉE DU 8E AU 3E RANG</text><text x="56" y="145.09" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">MONDIAL DES ÉMETTEURS DE CO2</text><text x="56" y="191.63" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Rang mondial par émissions annuelles de CO2, 1990–2024. Les 16 pays qui ont occupé une place dans le top 10 au moins une fois sont dessinés ;</text><text x="56" y="209.755" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">ceux qui en sont sortis s’arrêtent là où ils sont sortis. Le rang est une position, pas une taille — rien ici ne dit de combien.</text><text x="56" y="484" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Global Carbon Budget (2025), via Our World in Data · combustibles fossiles et industrie uniquement</text><line x1="216.56401252746582" x2="743.4359874725342" y1="247.88" y2="247.88" stroke="#3c3b66" stroke-width="0.8"></line><line x1="216.56401252746582" x2="743.4359874725342" y1="269.2266666666667" y2="269.2266666666667" stroke="#3c3b66" stroke-width="0.8"></line><line x1="216.56401252746582" x2="743.4359874725342" y1="290.5733333333333" y2="290.5733333333333" stroke="#3c3b66" stroke-wi