<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Graphique de rangs : le rang mondial de 16 pays par émissions annuelles de CO2 entre 1990 et 2024, l’Inde passant du 8e au 3e."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">L’Inde est passée du 8e au 3e rang mondial des émetteurs</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">de CO2</text><text x="52" y="182.0033607400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Rang mondial par émissions annuelles de CO2, 1990–2024. Les 16 pays qui ont occupé une place dans le top 10 au moins une fois sont</text><text x="52" y="200.8541681619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">dessinés ; ceux qui en sont sortis s’arrêtent là où ils sont sortis. Le rang est une position, pas une taille — rien ici ne dit de combien.</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Global Carbon Budget (2025), via Our World in Data · combustibles fossiles et industrie uniquement</text><line x1="204.94091796875" x2="755.05908203125" y1="245.70636102970812" y2="245.70636102970812" stroke="#d1cfc3" stroke-width="1"></line><line x1="204.94091796875" x2="755.05908203125" y1="267.38343414759646" y2="267.38343414759646" stroke="#d1cfc3" stroke-width="1"></line><line x1="204.94091796875" x2="755.05908203125" y1="289.0605072654