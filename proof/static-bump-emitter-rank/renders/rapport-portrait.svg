<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Graphique de rangs : le rang mondial de 16 pays par émissions annuelles de CO2 entre 1990 et 2024, l’Inde passant du 8e au 3e."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’Inde est passée du 8e au 3e rang</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">mondial des émetteurs de CO2</text><text x="46" y="164.73247753776096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Rang mondial par émissions annuelles de CO2, 1990–2024. Les 16 pays</text><text x="46" y="183.58182103776096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">qui ont occupé une place dans le top 10 au moins une fois sont dessinés ;</text><text x="46" y="202.43116453776094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">ceux qui en sont sortis s’arrêtent là où ils sont sortis. Le rang est une</text><text x="46" y="221.28050803776094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">position, pas une taille — rien ici ne dit de combien.</text><text x="46" y="895.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Global Carbon Budget (2025), via Our World in Data ·</text><text x="46" y="914" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">combustibles fossiles et industrie uniquement</text><line x1="117.94677734375" x2="360.378662109375" y1="260.1294981744797" y2="260.1294981744797" stroke="#d1d1d1" stroke-width="1"></line><line x1="117.94677734375" x2="360.378662109375" y1="325.44314180865973" y2="325.44314180865973" stroke="#d1d1d1" stroke-width="1"></line><line x1="117.94677734375" x2="360.378662109375" y1="390.7567854428397" y2="390.7567854428397" stroke="#d1d1d1" stroke-width="1"></line><line x1="117.94677734375" x2="360.378662109375" y1="456.07042907701975" y2="456.07042907701975" stroke="#d1d1d1" stroke-width="1"></line><line x1="117.94677734375" x2="360.378662109375" y1="521.3840727111998" y2="521.3840727111998" stroke="#d1d1d1" stroke-width="1"></line><line x1="117.94677734375" x2="360.378662109375" y1="586.6977163453798" y2="586.6977163453798" stroke="#d1d1d1" stroke-width="1"></line><line x1="117.94677734375" x2="360.378662109375" y1="652.0113599795598" y2="652.0113599795598" stroke="#d1d1d1" stroke-width="1"></line><line x1="117.94677734375" x2="360.378662109375" y1="717.3250036137399" y2="717.3250036137399" stroke="#d1d1d1" stroke-width="1"></line><line x1="117.94677734375" x2="360.378662109375" y1="782.6386472479198" y2="782.6386472479198" stroke="#d1d1d1" stroke-width="1"></line><line x1="117.94677734375" x2="360.378662109375" y1="847.9522908821" y2="847.9522908821" stroke="#d1d1d1" stroke-width="1"></line><text x="117.94677734375" y="867.7522908820999" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#616161">1990</text><text x="153.59852510340073" y="867.7522908820999" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#616161">1995</text><text x="189.25027286305146" y="867.7522908820999" text-anchor="middle" font-family="Open Sans" font-size="11" font-wei