<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Graphique de rangs : le rang mondial de 16 pays par émissions annuelles de CO2 entre 1990 et 2024, l’Inde passant du 8e au 3e."><rect x="0" y="0" width="540" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · MONDE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’Inde est passée du 8e au 3e rang</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">mondial des émetteurs de CO2</text><text x="46" y="164.73247753776096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Rang mondial par émissions annuelles de CO2, 1990–2024. Les 16 pays</text><text x="46" y="183.58182103776096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">qui ont occupé une place dans le top 10 au moins une fois sont dessinés ;</text><text x="46" y="202.43116453776094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">ceux qui en sont sortis s’arrêtent là où ils sont sortis. Le rang est une</text><text x="46" y="221.28050803776094" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">position, pas une taille — rien ici ne dit de combien.</text><text x="46" y="475.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Global Carbon Budget (2025), via Our World in Data ·</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">combustibles fossiles et industrie uniquement</text><line x1="198.14990234375" x2="341.85009765625" y1="260.1294981744797" y2="260.1294981744797" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="341.85009765625" y1="278.77647514199305" y2="278.77647514199305" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="341.85009765625" y1="297.42345210950646" y2="297.42345210950646" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="341.85009765625" y1="316.0704290770198" y2="316.0704290770198" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="341.85009765625" y1="334.71740604453316" y2="334.71740604453316" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="341.85009765625" y1="353.3643830120466" y2="353.3643830120466" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="341.85009765625" y1="372.0113599795599" y2="372.0113599795599" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="341.85009765625" y1="390.6583369470733" y2="390.6583369470733" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="341.85009765625" y1="409.3053139145867" y2="409.3053139145867" stroke="#d1d1d1" stroke-width="1"></line><line x1="198.14990234375" x2="341.85009765625" y1="427.95229088210004" y2="427.95229088210004" stroke="#d1d1d1" stroke-width="1"></line><text x="198.14990234375" y="447.75229088210006" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#616161">1990</text><text x="219.28228400735293" y="447.75229088210006" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#616161">1995</text><text x="240.41466567095588" y="447.75229088210006" text-anchor="middle" font-family="Open Sans" font-size="11" font-