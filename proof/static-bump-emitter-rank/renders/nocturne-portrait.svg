<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Graphique de rangs : le rang mondial de 16 pays par émissions annuelles de CO2 entre 1990 et 2024, l’Inde passant du 8e au 3e."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">L’INDE EST PASSÉE</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DU 8E AU 3E RANG</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">MONDIAL DES</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉMETTEURS DE CO2</text><text x="56" y="269.70715501074216" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Rang mondial par émissions annuelles de CO2, 1990–2024. Les 16 pays</text><text x="56" y="287.83293137792964" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">qui ont occupé une place dans le top 10 au moins une fois sont dessinés ;</text><text x="56" y="305.9587077451172" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">ceux qui en sont sortis s’arrêtent là où ils sont sortis. Le rang est une</text><text x="56" y="324.08448411230466" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">position, pas une taille — rien ici ne dit de combien.</text><text x="56" y="885.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Global Carbon Budget (2025), via Our World in Data ·</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">combustibles fossiles et industrie uniquement</text><line x1="125.76000262796879" x2="352.61200664937496" y1="362.21096762849214" y2="362.21096762849214" stroke="#3c3b66" stroke-width="0.8"></line><line x1="125.76000262796879" x2="352.61200664937496" y1="415.50688700191057" y2="415.50688700191057" stroke="#3c3b66" stroke-width="0.8"></line><line x1="125.76000262796879" x2="352.61200664937496" y1="468.80280637532894" y2="468.80280637532894" stroke="#3c3b66" stroke-width="0.8"></line><line x1="125.76000262796879" x2="352.61200664937496" y1="522.0987257487474" y2="522.0987257487474" stroke="#3c3b66" stroke-width="0.8"></line><line x1="125.76000262796879" x2="352.61200664937496" y1="575.3946451221658" y2="575.3946451221658" stroke="#3c3b66" stroke-width="0.8"></line><line x1="125.76000262796879" x2="352.61200664937496" y1="628.6905644955841" y2="628.6905644955841" stroke="#3c3b66" stroke-width="0.8"></line><line x1="125.76000262796879" x2="352.61200664937496" y1="681.9864838690025" y2="681.9864838690025" stroke="#3c3b66" stroke-width="0.8"></line><line x1="125.76000262796879" x2="352.61200664937496" y1="735.282403242421" y2="735.282403242421" stroke="#3c3b66" stroke-width="0.8"></line><line x1="125.76000262796879" x2="352.61200664937496" y1="788.5783226158394" y2="788.5783226158394" stroke="#3c3b66" stroke-width="0.8"></line><line x1="125.76000262796879" x2="352.61200664937496" y1="841.8742419892578" y2="841.8742419892578" stroke="#3c3b66" stroke-width="0.8"></line><text x="125.76000262796879" y="859.8742419892578" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="n