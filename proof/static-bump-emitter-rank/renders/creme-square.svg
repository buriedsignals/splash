<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Graphique de rangs : le rang mondial de 16 pays par émissions annuelles de CO2 entre 1990 et 2024, l’Inde passant du 8e au 3e."><rect x="0" y="0" width="540" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · MONDE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">L’Inde est passée du 8e au 3e</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">rang mondial des émetteurs</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">de CO2</text><text x="52" y="218.6046867400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Rang mondial par émissions annuelles de CO2, 1990–2024. Les 16 pays</text><text x="52" y="237.4554941619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">qui ont occupé une place dans le top 10 au moins une fois sont</text><text x="52" y="256.3063015838281" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">dessinés ; ceux qui en sont sortis s’arrêtent là où ils sont sortis. Le rang</text><text x="52" y="275.1571090057031" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">est une position, pas une taille — rien ici ne dit de combien.</text><text x="52" y="469.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Global Carbon Budget (2025), via Our World in Data ·</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">combustibles fossiles et industrie uniquement</text><line x1="204.94091796875" x2="335.05908203125" y1="320.00930187345807" y2="320.00930187345807" stroke="#d1cfc3" stroke-width="1"></line><line x1="204.94091796875" x2="335.05908203125" y1="331.33595851738806" y2="331.33595851738806" stroke="#d1cfc3" stroke-width="1"></line><line x1="204.94091796875" x2="335.05908203125" y1="342.66261516131806" y2="342.66261516131806" stroke="#d1cfc3" stroke-width="1"></line><line x1="204.94091796875" x2="335.05908203125" y1="353.9892718052481" y2="353.9892718052481" stroke="#d1cfc3" stroke-width="1"></line><line x1="204.94091796875" x2="335.05908203125" y1="365.3159284491781" y2="365.3159284491781" stroke="#d1cfc3" stroke-width="1"></line><line x1="204.94091796875" x2="335.05908203125" y1="376.6425850931081" y2="376.6425850931081" stroke="#d1cfc3" stroke-width="1"></line><line x1="204.94091796875" x2="335.05908203125" y1="387.9692417370381" y2="387.9692417370381" stroke="#d1cfc3" stroke-width="1"></line><line x1="204.94091796875" x2="335.05908203125" y1="399.2958983809681" y2="399.2958983809681" stroke="#d1cfc3" stroke-width="1"></line><line x1="204.94091796875" x2="335.05908203125" y1="410.62255502489813" y2="410.62255502489813" stroke="#d1cfc3" stroke-width="1"></line><line x1="204.94091796875" x2="335.05908203125" y1="421.9492116688281" y2="421.9492116688281" stroke="#d1cfc3" stroke-width="1"></line><text x="204.94091796875" y="441.74921166882814" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#61605a">1990</text><text x="224.07594209558823" y="441.74921166882814" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fil