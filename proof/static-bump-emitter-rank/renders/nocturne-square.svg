<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Graphique de rangs : le rang mondial de 16 pays par émissions annuelles de CO2 entre 1990 et 2024, l’Inde passant du 8e au 3e."><rect x="0" y="0" width="540" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · MONDE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">L’INDE EST PASSÉE</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DU 8E AU 3E RANG</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">MONDIAL DES</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉMETTEURS DE CO2</text><text x="56" y="269.70715501074216" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Rang mondial par émissions annuelles de CO2, 1990–2024. Les 16 pays</text><text x="56" y="287.83293137792964" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">qui ont occupé une place dans le top 10 au moins une fois sont dessinés ;</text><text x="56" y="305.9587077451172" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">ceux qui en sont sortis s’arrêtent là où ils sont sortis. Le rang est une</text><text x="56" y="324.08448411230466" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">position, pas une taille — rien ici ne d