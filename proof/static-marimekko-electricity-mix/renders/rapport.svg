<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Marimekko : six pays européens en 2024, chaque colonne aussi large que sa production (1 638 TWh au total) et haute de 100 % de son mix. La bande charbon, en accent, fait 12 % de l’ensemble et n’est visible que dans les colonnes Allemagne et Pologne."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Le charbon fait 12 % de l’électricité de ces six pays, et il</text><text x="46" y="123.99" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">tient dans deux colonnes</text><text x="46" y="164.73000000000002" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Production électrique 2024, par source. La LARGEUR de chaque colonne est la production du pays en TWh, sa</text><text x="46" y="183.58" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">hauteur son mix : l’aire d’une bande est donc une quantité. 200,9 TWh de charbon sur 1 638 au total, dont 99,5 % en</text><text x="46" y="202.43" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Allemagne et en Pologne.</text><text x="46" y="450.3" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE COLONNE FAIT 100 % DE HAUT ; LES PARTS SOUS 0,5 % NE SONT PAS CHIFFRÉES MAIS RESTENT DESSINÉES. LES SOURCES</text><text x="46" y="469.15000000000003" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">SONT NOMMÉES UNE FOIS, À DROITE, DANS L’ORDRE OÙ ELLES S’EMPILENT DANS TOUTES LES COLONNES.</text><text x="46" y="494" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><rect x="46" y="386.8064147612851" width="245.8799527334385" height="0.4" fill="#0c2335"></rect><rect x="46" y="384.3035436401563" width="245.8799527334385" height="2.5028711211288055" fill="#23394b"></rect><rect x="46" y="379.5549097520608" width="245.8799527334385" height="4.748633888095526" fill="#3a5060"></rect><rect x="46" y="279.7417736898543" width="245.8799527334385" height="99.81313606220647" fill="#516676"></rect><rect x="46" y="276.9398173404145" width="245.8799527334385" height="2.80195634943982" fill="#697c8b"></rect><rect x="46" y="276.790274726259" width="245.8799527334385" height="0.4" fill="#8092a1"></rect><rect x="46" y="258.13155416706826" width="245.8799527334385" height="18.658720559190726" fill="#97a9b6"></rect><rect x="46" y="251.60677379154697" width="245.8799527334385" height="6.5247803755212885" fill="#aebfcc"></rect><rect x="46" y="239.68796508789066" width="245.8799527334385" height="11.91880870365631" fill="#c5d5e1"></rect><rect x="297.8799527334385" y="355.47749535707527" width="217.08497589137772" height="31.596521976909116" fill="#0c2335"></rect><rect x="297.8799527334385" y="349.418498995661" width="217.08497589137772" height="6.058996361414245" fill="#23394b"></rect><rect x="297.8799527334385" y="326.1185527132436" width="217.08497589137772" height="23.29994628241741" fill="#3a5060"></rect><rect x="297.8799527334385" y="326.1185527132436" width="217.08497589137772" height="0.4" fill="#516676"></rect><rect x="297.8799527334385" y="310.9398605042667" width="217.08497589137772" height="15.17869220897694" fill="#697c