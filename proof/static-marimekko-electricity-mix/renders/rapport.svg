<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Marimekko : six pays européens en 2024, chaque colonne aussi large que sa production (1 638 TWh au total) et haute de 100 % de son mix. La bande charbon, en accent, fait 12 % de l’ensemble et n’est visible que dans les colonnes Allemagne et Pologne."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Le charbon fait 12 % de l’électricité de ces six pays, et il tient dans</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">deux colonnes</text><text x="46" y="164.73247753776096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Production électrique 2024, par source. La LARGEUR de chaque colonne est la production du pays en TWh, sa hauteur son mix : l’aire d’une</text><text x="46" y="183.58182103776096" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">bande est donc une quantité. 200,9 TWh de charbon sur 1 638 au total, dont 99,5 % en Allemagne et en Pologne.</text><text x="46" y="450.30113901953126" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE COLONNE FAIT 100 % DE HAUT ; LES PARTS SOUS 0,5 % NE SONT PAS CHIFFRÉES MAIS RESTENT DESSINÉES. LES SOURCES</text><text x="46" y="469.15048251953124" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">SONT NOMMÉES UNE FOIS, À DROITE, DANS L’ORDRE OÙ ELLES S’EMPILENT DANS TOUTES LES COLONNES.</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><rect x="46" y="386.62489794389415" width="246.29316373330556" height="0.4" fill="#0c2335"></rect><rect x="46" y="383.807042534259" width="246.29316373330556" height="2.817855409635172" fill="#23394b"></rect><rect x="46" y="378.4607969457478" width="246.29316373330556" height="5.346245588511181" fill="#3a5060"></rect><rect x="46" y="266.0862591474569" width="246.29316373330556" height="112.37453779829093" fill="#516676"></rect><rect x="46" y="262.9316788775509" width="246.29316373330556" height="3.1545802699059777" fill="#697c8b"></rect><rect x="46" y="262.76331644741543" width="246.29316373330556" height="0.4" fill="#8092a1"></rect><rect x="46" y="241.75641112946445" width="246.29316373330556" height="21.00690531795098" fill="#97a9b6"></rect><rect x="46" y="234.41049246723946" width="246.29316373330556" height="7.345918662224989" fill="#aebfcc"></rect><rect x="46" y="220.99171141276094" width="246.29316373330556" height="13.41878105447853" fill="#c5d5e1"></rect><rect x="298.29316373330556" y="351.3532595938691" width="217.4497957920934" height="35.572918488162145" fill="#0c2335"></rect><rect x="298.29316373330556" y="344.53174348389433" width="217.4497957920934" height="6.821516109974766" fill="#23394b"></rect><rect x="298.29316373330556" y="318.29951797221565" width="217.4497957920934" height="26.232225511678678" fill="#3a5060"></rect><rect x="298.29316373330556" y="318.29951797221565" width="217.4497957920934" height="0.4" fill="#516676"></rect><rect x="298.29316373330556" y="301.2105997330045" width="217.4497957920934" height="17.088918239211125" fill="#697c8b"></rect><rect x="298.29316373330556" y="301.13699828404947" width="217.4497957920934" height="