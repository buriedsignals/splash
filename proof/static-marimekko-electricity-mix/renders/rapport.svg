<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Marimekko : six pays européens en 2024, chaque colonne aussi large que sa production (1 638 TWh au total) et haute de 100 % de son mix. La bande charbon, en accent, fait 12 % de l’ensemble et n’est visible que dans les colonnes Allemagne et Pologne."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Le charbon fait 12 % de l’électricité de ces six pays, et il tient dans</text><text x="46" y="123.99" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">deux colonnes</text><text x="46" y="164.73000000000002" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Production électrique 2024, par source. La LARGEUR de chaque colonne est la production du pays en TWh, sa hauteur son mix : l’aire d’une</text><text x="46" y="183.58" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">bande est donc une quantité. 200,9 TWh de charbon sur 1 638 au total, dont 99,5 % en Allemagne et en Pologne.</text><text x="46" y="450.3" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE COLONNE FAIT 100 % DE HAUT ; LES PARTS SOUS 0,5 % NE SONT PAS CHIFFRÉES MAIS RESTENT DESSINÉES. LES SOURCES</text><text x="46" y="469.15000000000003" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">SONT NOMMÉES UNE FOIS, À DROITE, DANS L’ORDRE OÙ ELLES S’EMPILENT DANS TOUTES LES COLONNES.</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><rect x="46" y="386.6232324917561" width="246.29316373330556" height="0.4" fill="#0c2335"></rect><rect x="46" y="383.80538560398975" width="246.29316373330556" height="2.8178468877663363" fill="#23394b"></rect><rect x="46" y="378.45915618380417" width="246.29316373330556" height="5.34622942018558" fill="#3a5060"></rect><rect x="46" y="266.0849582329966" width="246.29316373330556" height="112.37419795080757" fill="#516676"></rect><rect x="46" y="262.9303875032959" width="246.29316373330556" height="3.1545707297007084" fill="#697c8b"></rect><rect x="46" y="262.7620255823287" width="246.29316373330556" height="0.4" fill="#8092a1"></rect><rect x="46" y="241.75518379428445" width="246.29316373330556" height="21.006841788044255" fill="#97a9b6"></rect><rect x="46" y="234.4092873478747" width="246.29316373330556" height="7.345896446409739" fill="#aebfcc"></rect><rect x="46" y="220.990546875" width="246.29316373330556" height="13.418740472874703" fill="#c5d5e1"></rect><rect x="298.29316373330556" y="351.3517008116028" width="217.4497957920934" height="35.572810907147186" fill="#0c2335"></rect><rect x="298.29316373330556" y="344.5302053315245" width="217.4497957920934" height="6.82149548007834" fill="#23394b"></rect><rect x="298.29316373330556" y="318.2980591523708" width="217.4497957920934" height="26.232146179153688" fill="#3a5060"></rect><rect x="298.29316373330556" y="318.2980591523708" width="217.4497957920934" height="0.4" fill="#516676"></rect><rect x="298.29316373330556" y="301.2091925941362" width="217.4497957920934" height="17.0888665582346" fill="#697c8b"></rect><rect x="298.29316373330556" y="301.1355913677695" width="217.4497957920934" height="0.4" fill="#8092a1"></rect><rect x="298.29316373330556" y="