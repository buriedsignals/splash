<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Marimekko : six pays européens en 2024, chaque colonne aussi large que sa production (1 638 TWh au total) et haute de 100 % de son mix. La bande charbon, en accent, fait 12 % de l’ensemble et n’est visible que dans les colonnes Allemagne et Pologne."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Le charbon fait 12 % de l’électricité de ces six</text><text x="52" y="137.6" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">pays, et il tient dans deux colonnes</text><text x="52" y="182" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Production électrique 2024, par source. La LARGEUR de chaque colonne est la production du pays en TWh, sa hauteur son mix : l’aire d’une</text><text x="52" y="200.85" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">bande est donc une quantité. 200,9 TWh de charbon sur 1 638 au total, dont 99,5 % en Allemagne et en Pologne.</text><text x="52" y="442.5" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque colonne fait 100 % de haut ; les parts sous 0,5 % ne sont pas chiffrées mais restent dessinées. Les</text><text x="52" y="461.35" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">sources sont nommées une fois, à droite, dans l’ordre où elles s’empilent dans toutes les colonnes.</text><text x="52" y="488" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><rect x="52" y="371.12325644272585" width="240.67218721113204" height="0.4" fill="#092145"></rect><rect x="52" y="368.97439397885023" width="240.67218721113204" height="2.1488624638756164" fill="#203758"></rect><rect x="52" y="364.89741173606734" width="240.67218721113204" height="4.07698224278289" fill="#384d6c"></rect><rect x="52" y="279.2019479644231" width="240.67218721113204" height="85.69546377164426" fill="#4f637f"></rect><rect x="52" y="276.79630319354345" width="240.67218721113204" height="2.4056447708796327" fill="#667992"></rect><rect x="52" y="276.6679120400414" width="240.67218721113204" height="0.4" fill="#7d8fa5"></rect><rect x="52" y="260.64830004519496" width="240.67218721113204" height="16.019611994846457" fill="#95a5b9"></rect><rect x="52" y="255.04639129502863" width="240.67218721113204" height="5.601908750166331" fill="#acbbcc"></rect><rect x="52" y="244.81339111328123" width="240.67218721113204" height="10.2330001817474" fill="#c3d1df"></rect><rect x="298.67218721113204" y="344.22553151666995" width="212.48709127211612" height="27.12747751653319" fill="#092145"></rect><rect x="298.67218721113204" y="339.02352581214524" width="212.48709127211612" height="5.202005704524709" fill="#203758"></rect><rect x="298.67218721113204" y="319.01914781843357" width="212.48709127211612" height="20.00437799371167" fill="#384d6c"></rect><rect x="298.67218721113204" y="319.01914781843357" width="212.48709127211612" height="0.4" fill="#4f637f"></rect><rect x="298.67218721113204" y="305.98734539630885" width="212.48709127211612" height="13.031802422124713" fill="#667992"></rect><rect x="298.67218721113204" y="305.9312178212723" width="212.48709127211612" height="0.4" fill="#7d8fa5"></rect><rect x="298.67218721113204" y="299.851