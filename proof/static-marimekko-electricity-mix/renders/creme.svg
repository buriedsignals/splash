<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Marimekko : six pays européens en 2024, chaque colonne aussi large que sa production (1 638 TWh au total) et haute de 100 % de son mix. La bande charbon, en accent, fait 12 % de l’ensemble et n’est visible que dans les colonnes Allemagne et Pologne."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Le charbon fait 12 % de l’électricité de ces six pays, et il</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">tient dans deux colonnes</text><text x="52" y="182.0033607400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Production électrique 2024, par source. La LARGEUR de chaque colonne est la production du pays en TWh, sa hauteur son mix : l’aire d’une</text><text x="52" y="200.8541681619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">bande est donc une quantité. 200,9 TWh de charbon sur 1 638 au total, dont 99,5 % en Allemagne et en Pologne.</text><text x="52" y="442.49760551037" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque colonne fait 100 % de haut ; les parts sous 0,5 % ne sont pas chiffrées mais restent dessinées. Les sources sont nommées</text><text x="52" y="461.348412932245" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">une fois, à droite, dans l’ordre où elles s’empilent dans toutes les colonnes.</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><rect x="52" y="370.4650031727972" width="246.69079187946187" height="0.4" fill="#092145"></rect><rect x="52" y="368.33288693247977" width="246.69079187946187" height="2.13211624031743" fill="#203758"></rect><rect x="52" y="364.28767687485424" width="246.69079187946187" height="4.045210057625525" fill="#384d6c"></rect><rect x="52" y="279.2600433707877" width="246.69079187946187" height="85.02763350406656" fill="#4f637f"></rect><rect x="52" y="276.8731459445203" width="246.69079187946187" height="2.38689742626741" fill="#667992"></rect><rect x="52" y="276.7457553515453" width="246.69079187946187" height="0.4" fill="#7d8fa5"></rect><rect x="52" y="260.85098522456616" width="246.69079187946187" height="15.894770126979154" fill="#95a5b9"></rect><rect x="52" y="255.29273251002775" width="246.69079187946187" height="5.558252714538412" fill="#acbbcc"></rect><rect x="52" y="245.13947875765624" width="246.69079187946187" height="10.153253752371512" fill="#c3d1df"></rect><rect x="304.69079187946187" y="343.7768939491835" width="217.80085774554863" height="26.916071337358403" fill="#092145"></rect><rect x="304.69079187946187" y="338.6154278101001" width="217.80085774554863" height="5.161466139083416" fill="#203758"></rect><rect x="304.69079187946187" y="318.7669452222859" width="217.80085774554863" height="19.848482587814146" fill="#384d6c"></rect><rect x="304.69079187946187" y="318.7669452222859" width="217.80085774554863" height="0.4" fill="#4f637f"></rect><rect x="304.69079187946187" y="305.8367004756268" width="217.80085774554863" height="12.930244746659127" fill="#667992"></rect><rect x="304.69079187946187" y="305.78101030639687" width="217.80085774554863" height="0.4" fill="#7d