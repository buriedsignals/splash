<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Marimekko : six pays européens en 2024, chaque colonne aussi large que sa production (1 638 TWh au total) et haute de 100 % de son mix. La bande charbon, en accent, fait 12 % de l’ensemble et n’est visible que dans les colonnes Allemagne et Pologne."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Le charbon fait 12 % de l’électricité de ces six pays, et il</text><text x="52" y="137.6" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">tient dans deux colonnes</text><text x="52" y="182" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Production électrique 2024, par source. La LARGEUR de chaque colonne est la production du pays en TWh, sa hauteur son mix : l’aire d’une</text><text x="52" y="200.85" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">bande est donc une quantité. 200,9 TWh de charbon sur 1 638 au total, dont 99,5 % en Allemagne et en Pologne.</text><text x="52" y="442.5" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque colonne fait 100 % de haut ; les parts sous 0,5 % ne sont pas chiffrées mais restent dessinées. Les sources sont nommées</text><text x="52" y="461.35" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">une fois, à droite, dans l’ordre où elles s’empilent dans toutes les colonnes.</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><rect x="52" y="370.46798898097376" width="246.69079187946187" height="0.4" fill="#092145"></rect><rect x="52" y="368.3357372964739" width="246.69079187946187" height="2.132251684499863" fill="#203758"></rect><rect x="52" y="364.2902702640369" width="246.69079187946187" height="4.045467032436989" fill="#384d6c"></rect><rect x="52" y="279.2572353198031" width="246.69079187946187" height="85.0330349442338" fill="#4f637f"></rect><rect x="52" y="276.87018626419945" width="246.69079187946187" height="2.3870490556036543" fill="#667992"></rect><rect x="52" y="276.74278757864755" width="246.69079187946187" height="0.4" fill="#7d8fa5"></rect><rect x="52" y="260.84700772522683" width="246.69079187946187" height="15.89577985342072" fill="#95a5b9"></rect><rect x="52" y="255.28840191877893" width="246.69079187946187" height="5.5586058064479005" fill="#acbbcc"></rect><rect x="52" y="245.1345031738281" width="246.69079187946187" height="10.153898744950823" fill="#c3d1df"></rect><rect x="304.69079187946187" y="343.77818437646783" width="217.80085774554863" height="26.917781199704052" fill="#092145"></rect><rect x="304.69079187946187" y="338.61639035162096" width="217.80085774554863" height="5.16179402484687" fill="#203758"></rect><rect x="304.69079187946187" y="318.76664687500295" width="217.80085774554863" height="19.849743476618016" fill="#384d6c"></rect><rect x="304.69079187946187" y="318.76664687500295" width="217.80085774554863" height="0.4" fill="#4f637f"></rect><rect x="304.69079187946187" y="305.8355807254602" width="217.80085774554863" height="12.931066149542744" fill="#667992"></rect><rect x="304.69079187946187" y="305.7798870184731" width="217.80085774554863" height="0.4" fill="#7d8fa5"></rect><rect x="304.69079187946187" y="299.7472459389194" width