<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Marimekko : six pays européens en 2024, chaque colonne aussi large que sa production (1 638 TWh au total) et haute de 100 % de son mix. La bande charbon, en accent, fait 12 % de l’ensemble et n’est visible que dans les colonnes Allemagne et Pologne."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Le charbon fait 12 % de</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">l’électricité de ces six pays, et il</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">tient dans deux colonnes</text><text x="46" y="197.67367093776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Production électrique 2024, par source. La LARGEUR de chaque colonne</text><text x="46" y="216.52301443776093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">est la production du pays en TWh, sa hauteur son mix : l’aire d’une</text><text x="46" y="235.3723579377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">bande est donc une quantité. 200,9 TWh de charbon sur 1 638 au total,</text><text x="46" y="254.2217014377609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">dont 99,5 % en Allemagne et en Pologne.</text><text x="46" y="794.9037650195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">NORVÈGE ET SUISSE PARTAGENT UNE COLONNE : À CETTE TAILLE, UNE</text><text x="46" y="813.7531085195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">COLONNE PLUS ÉTROITE AURAIT CESSÉ D’ENCODER SA LARGEUR. LEURS</text><text x="46" y="832.6024520195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">DEUX MIXES Y SONT ADDITIONNÉS. LECTURE : CHAQUE COLONNE FAIT 100</text><text x="46" y="851.4517955195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">% DE HAUT ; LES PARTS SOUS 0,5 % NE SONT PAS CHIFFRÉES MAIS</text><text x="46" y="870.3011390195313" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">RESTENT DESSINÉES. LES SOURCES SONT NOMMÉES UNE FOIS, À DROITE,</text><text x="46" y="889.1504825195314" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">DANS L’ORDRE OÙ ELLES S’EMPILENT DANS TOUTES LES COLONNES.</text><text x="46" y="914" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember / Energy Institute (2025), via Our World in Data</text><rect x="46" y="730.7301014644326" width="104.26319158029368" height="0.7987026175987921" fill="#0c2335"></rect><rect x="46" y="723.2598828645379" width="104.26319158029368" height="7.470218599894679" fill="#23394b"></rect><rect x="46" y="709.0868266110689" width="104.26319158029368" height="14.173056253468985" fill="#3a5060"></rect><rect x="46" y="411.17858066453476" width="104.26319158029368" height="297.9082459465341" fill="#516676"></rect><rect x="46" y="402.8156944332061" w