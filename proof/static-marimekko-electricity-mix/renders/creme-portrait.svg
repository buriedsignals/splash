<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Marimekko : six pays européens en 2024, chaque colonne aussi large que sa production (1 638 TWh au total) et haute de 100 % de son mix. La bande charbon, en accent, fait 12 % de l’ensemble et n’est visible que dans les colonnes Allemagne et Pologne."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Le charbon fait 12 % de</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">l’électricité de ces six pays, et</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">il tient dans deux colonnes</text><text x="52" y="218.6046867400781" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Production électrique 2024, par source. La LARGEUR de chaque colonne</text><text x="52" y="237.4554941619531" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">est la production du pays en TWh, sa hauteur son mix : l’aire d’une</text><text x="52" y="256.3063015838281" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">bande est donc une quantité. 200,9 TWh de charbon sur 1 638 au total,</text><text x="52" y="275.1571090057031" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">dont 99,5 % en Allemagne et en Pologne.</text><text x="52" y="787.09437582287" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Norvège et Suisse partagent une colonne : à cette taille, une colonne</text><text x="52" y="805.945183244745" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">plus étroite aurait cessé d’encoder sa largeur. Leurs deux mixes y sont</text><text x="52" y="824.79599066662" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">additionnés. Lecture : chaque colonne fait 100 % de haut ; les parts</text><text x="52" y="843.646798088495" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">sous 0,5 % ne sont pas chiffrées mais restent dessinées. Les sources</text><text x="52" y="862.49760551037" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">sont nommées une fois, à droite, dans l’ordre où elles s’empilent dans</text><text x="52" y="881.348412932245" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">toutes les colonnes.</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember / Energy Institute (2025), via Our World in Data</text><rect x="52" y="714.5710125004666" width="104.66081972645" height="0.7187230985753104" fill="#092145"></rect><rect x="52" y="707.8488376373219" width="104.66081972645" height="6.722174863144687" fill="#203758"></rect><rect x="52" y="695.0950257900558" width="104.66081972645" height="12.753811847266093" fill="#384d6c"></rect><rect x="52" y="427.01835632638586" width="104.66081972645" height="268.07666946367" fill="#4f637f"></rect><rect x="52" y="419.49290270601" width="104.66081972645" height="7.52545