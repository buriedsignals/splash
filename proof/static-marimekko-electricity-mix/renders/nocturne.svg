<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Marimekko : six pays européens en 2024, chaque colonne aussi large que sa production (1 638 TWh au total) et haute de 100 % de son mix. La bande charbon, en accent, fait 12 % de l’ensemble et n’est visible que dans les colonnes Allemagne et Pologne."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Futura" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.05" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LE CHARBON FAIT 12 % DE L’ÉLECTRICITÉ DE</text><text x="56" y="145.09" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">CES SIX PAYS, ET IL TIENT DANS DEUX</text><text x="56" y="184.13" font-family="Futura" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">COLONNES</text><text x="56" y="230.67000000000002" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Production électrique 2024, par source. La LARGEUR de chaque colonne est la production du pays en TWh, sa hauteur son mix : l’aire d’une bande</text><text x="56" y="248.79500000000002" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">est donc une quantité. 200,9 TWh de charbon sur 1 638 au total, dont 99,5 % en Allemagne et en Pologne.</text><text x="56" y="441.75" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE COLONNE FAIT 100 % DE HAUT ; LES PARTS SOUS 0,5 % NE SONT PAS CHIFFRÉES MAIS RESTENT DESSINÉES.</text><text x="56" y="459.875" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LES SOURCES SONT NOMMÉES UNE FOIS, À DROITE, DANS L’ORDRE OÙ ELLES S’EMPILENT DANS TOUTES LES COLONNES.</text><text x="56" y="484" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><rect x="56" y="377.28019566060186" width="237.38111264719288" height="0.4" fill="#bcf3e7"></rect><rect x="56" y="375.7361530035789" width="237.38111264719288" height="1.544042657022942" fill="#a9ddd7"></rect><rect x="56" y="372.8066800379486" width="237.38111264719288" height="2.929472965630339" fill="#95c8c6"></rect><rect x="56" y="311.2311004924194" width="237.38111264719288" height="61.575579545529195" fill="#82b2b6"></rect><rect x="56" y="309.50254959336235" width="237.38111264719288" height="1.7285508990570406" fill="#6f9da6"></rect><rect x="56" y="309.41029547234524" width="237.38111264719288" height="0.4" fill="#5b8795"></rect><rect x="56" y="297.89957075877436" width="237.38111264719288" height="11.51072471357088" fill="#487185"></rect><rect x="56" y="293.87437779439716" width="237.38111264719288" height="4.025192964377197" fill="#345c74"></rect><rect x="56" y="286.5215625" width="237.38111264719288" height="7.352815294397146" fill="#214664"></rect><rect x="299.3811126471929" y="357.95311663117303" width="209.58143412346683" height="19.492165351248843" fill="#bcf3e7"></rect><rect x="299.3811126471929" y="354.21526981924825" width="209.58143412346683" height="3.7378468119247827" fill="#a9ddd7"></rect><rect x="299.3811126471929" y="339.8413331579916" width="209.58143412346683" height="14.373936661256664" fill="#95c8c6"></rect><rect x="299.3811126471929" y="339.8413331579916" width="209.58143412346683" height="0.4" fill="#82b2b6"></rect><rect x="299.3811126471929" y="330.4774677752981" width="209.58143412346683" height="9.363865382693461" fill="#6f9da6"></rect><rect x="299.38111