<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Marimekko : six pays européens en 2024, chaque colonne aussi large que sa production (1 638 TWh au total) et haute de 100 % de son mix. La bande charbon, en accent, fait 12 % de l’ensemble et n’est visible que dans les colonnes Allemagne et Pologne."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LE CHARBON FAIT 12 % DE L’ÉLECTRICITÉ</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DE CES SIX PAYS, ET IL TIENT DANS DEUX</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">COLONNES</text><text x="56" y="230.6679486107422" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Production électrique 2024, par source. La LARGEUR de chaque colonne est la production du pays en TWh, sa hauteur son mix : l’aire d’une bande</text><text x="56" y="248.79372497792968" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">est donc une quantité. 200,9 TWh de charbon sur 1 638 au total, dont 99,5 % en Allemagne et en Pologne.</text><text x="56" y="423.62217874943747" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE COLONNE FAIT 100 % DE HAUT ; LES PARTS SOUS 0,5 % NE SONT PAS CHIFFRÉES MAIS RESTENT</text><text x="56" y="441.74795511662495" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">DESSINÉES. LES SOURCES SONT NOMMÉES UNE FOIS, À DROITE, DANS L’ORDRE OÙ ELLES S’EMPILENT DANS TOUTES LES</text><text x="56" y="459.87373148381243" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">COLONNES.</text><text x="56" y="484" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><rect x="56" y="361.86837746075514" width="235.33062676649214" height="0.4" fill="#bcf3e7"></rect><rect x="56" y="360.5626775567977" width="235.33062676649214" height="1.305699903957418" fill="#a9ddd7"></rect><rect x="56" y="358.0854062505472" width="235.33062676649214" height="2.477271306250543" fill="#95c8c6"></rect><rect x="56" y="306.0148057829773" width="235.33062676649214" height="52.070600467569875" fill="#82b2b6"></rect><rect x="56" y="304.55307884647146" width="235.33062676649214" height="1.4617269365058405" fill="#6f9da6"></rect><rect x="56" y="304.47506533019725" width="235.33062676649214" height="0.4" fill="#5b8795"></rect><rect x="56" y="294.741168352267" width="235.33062676649214" height="9.733896977930272" fill="#487185"></rect><rect x="56" y="291.337315457988" width="235.33062676649214" height="3.403852894278998" fill="#345c74"></rect><rect x="56" y="285.11950134511716" width="235.33062676649214" height="6.217814112870826" fill="#214664"></rect><rect x="297.3306267664922" y="345.5246805313188" width="207.77108044058608" height="16.483300063821787" fill="#bcf3e7"></rect><rect x="297.3306267664922" y="342.36381823186116" width="207.77108044058608" height="3.1608622994576194" fill="#a9ddd7"></rect><rect x="297.3306267664922" y="330.20868272914066" width="207.77108044058608" height="12.155135502720498" fill="#95c8c6"></rect><rect x="297.3306267664922" y="33