<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Marimekko : six pays européens en 2024, chaque colonne aussi large que sa production (1 638 TWh au total) et haute de 100 % de son mix. La bande charbon, en accent, fait 12 % de l’ensemble et n’est visible que dans les colonnes Allemagne et Pologne."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LE CHARBON DE CES</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SIX PAYS TIENT DANS</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DEUX COLONNES</text><text x="56" y="230.6679486107422" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Production électrique 2024, par source. La LARGEUR de chaque colonne</text><text x="56" y="248.79372497792968" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">est la production du pays en TWh, sa hauteur son mix : l’aire d’une bande</text><text x="56" y="266.91950134511717" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">est donc une quantité. 200,9 TWh de charbon sur 1 638 au total, dont</text><text x="56" y="285.0452777123047" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">99,5 % en Allemagne et en Pologne.</text><text x="56" y="752.9932969135" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">NORVÈGE ET SUISSE PARTAGENT UNE COLONNE : À CETTE</text><text x="56" y="771.1190732806875" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">TAILLE, UNE COLONNE PLUS ÉTROITE AURAIT CESSÉ</text><text x="56" y="789.244849647875" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">D’ENCODER SA LARGEUR. LEURS DEUX MIXES Y SONT</text><text x="56" y="807.3706260150625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">ADDITIONNÉS. LECTURE : CHAQUE COLONNE FAIT 100 % DE</text><text x="56" y="825.4964023822499" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">HAUT ; LES PARTS SOUS 0,5 % NE SONT PAS CHIFFRÉES MAIS</text><text x="56" y="843.6221787494375" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">RESTENT DESSINÉES. LES SOURCES SONT NOMMÉES UNE FOIS,</text><text x="56" y="861.747955116625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">À DROITE, DANS L’ORDRE OÙ ELLES S’EMPILENT DANS TOUTES</text><text x="56" y="879.8737314838124" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LES COLONNES.</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember / Energy Institute (2025), via Our World in Data</text><rect x="56" y="690.707290924155" width="93.30065461348026" height="0.671807835048071" fill="#bcf3e7"></rect><rect x="56" y="684.4239117610583" width="93.30065461348026" height="6.283379163096697" fill="#a9ddd7"></rect><rect x="56