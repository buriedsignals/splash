<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Histogram of CO2 emissions per capita across 213 countries in 2023, in 4-tonne bins from 0 to 36 and above. The distribution is heavily right-skewed: 127 countries sit in the 0-4 tonne bin, more than any other bin; the rest thin out into a long tail, topped by Qatar alone above 36 tonnes, at 40.1 tonnes. A dashed median line sits at 3.1 tonnes.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="140" fill="#000000" font-size="55" font-weight="700">Six in ten countries emit under 4 tonnes of CO2 per person a year</text><text x="85" y="202" fill="#616161" font-size="31">Per-country distribution for 2023 — each of the 213 countries counts equally here, not weighted by population. A few oil and gas</text><text x="85" y="246" fill="#616161" font-size="31">producers sit far out on the right.</text><text x="85" y="995" fill="#616161" font-size="31">Source: Global Carbon Budget (2025), via Our World in Data · 2023 data, extracted 8 August 2026</text><g><line x1="280.0654296875" x2="1817" y1="851" y2="851" stroke="#616161" stroke-width="1"></line><text x="258.0654296875" y="860" fill="#616161" font-size="29" text-anchor="end">0</text></g><g><line x1="280.0654296875" x2="1817" y1="769.4615384615385" y2="769.4615384615385" stroke="#d1d1d1" stroke-width="1"></line><text x="258.0654296875" y="778.4615384615385" fill="#616161" font-size="29" text-anchor="end">20</text></g><g><line x1="280.0654296875" x2="1817" y1="687.9230769230769" y2="687.9230769230769" stroke="#d1d1d1" stroke-width="1"></line><text x="258.0654296875" y="696.9230769230769" fill="#616161" font-size="29" text-anchor="end">40</text></g><g><line x1="280.0654296875" x2="1817" y1="606.3846153846154" y2="606.3846153846154" stroke="#d1d1d1" stroke-width="1"></line><text x="258.0654296875" y="615.3846153846154" fill="#616161" font-size