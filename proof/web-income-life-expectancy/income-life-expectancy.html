:root {
  --ground: #FFFFFF;
  --accent: #C1440E;
  --ink: #000000;
  --muted: #616161;
  --grid: #d1d1d1;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  /* The beat's OWN face, read off the markup it just drew (dominantFontStack) — not a literal.
     This rule used to say "Helvetica, Arial, sans-serif", which set every word the components do
     not style themselves, the tooltip above all, in a typeface nobody chose and nothing embedded. */
  font-family: Helvetica, Arial, sans-serif;
}

/* THE FLUID FILL — the redesign this file exists to ship. .chart-figure and everything inside
   .chart-plot take the FULL width of whatever contains them, edge to edge, no max-width cap and
   no fixed rung to swap between. Height is never independently set on the plot: aspect-ratio
   (set per-render on .chart-plot's own inline style, from the component's real geometry) grows
   the height WITH the width, so a very wide container gets a taller chart rather than a flat,
   letterboxed strip -- the failure mode capping the width would otherwise avoid at the cost of
   empty gutters, and the failure mode letting width AND height both float freely would risk
   instead. The header block and the source line USED to carry a 640px reading-measure cap; they
   no longer do. A title that stops at 640px above a chart running to 1600 reads as a broken box,
   not as a comfortable measure -- see references/web-discipline.md, "The words take the same width
   as the graphic," for the reversal and what now bounds the line length instead.

   "Fills the container" is a claim about the FRAME's own edges, never about the content inside
   it -- FRAME_PAD_PX is the fixed inner margin that keeps that distinction real: title, caveat,
   filter, every axis label, the end label and the source line all sit inside it, so nothing ever
   touches the frame's own edge at any width. box-sizing:border-box (above) is what makes width:100%
   plus this padding still equal exactly 100% of the parent -- no overflow, no second width to
   reconcile. */
.chart-figure {
  margin: 0;
  width: 100%;
  padding: 24px;
  display: flex;
  flex-direction: column;
  /* THE WINDOW FIT. A beat is one thing a reader looks at, not a document they scroll through:
     the whole figure must be visible at once. Width filling its container and height following
     from aspect-ratio was only half the rule -- at 1600x800 the measured figure came to 902px
     against an 800px window (102px of it below the fold: the end label, the x-axis and the source
     line), and at 1920x950 it came to 1051px against 950. Clamping here, rather than capping the
     width or shortening the geometry, is what keeps the fill and the fit true at the same time.
     max-height, never height: when the frame's natural height already fits (a tall window, a
     narrow one), nothing changes at all and no empty space is reserved -- which matters because
     this file is embedded inside an article as often as it is opened on its own.
     Two declarations, not one: dvh is what a mobile browser's collapsing toolbar makes correct,
     vh is what an engine without dvh still understands, and the later declaration simply wins
     where it parses. */
  max-height: 100vh;
  max-height: 100dvh;
}
/* Everything except the plot keeps its natural height: words are never squeezed to make a chart
   fit, the chart is. flex-shrink:0 is the half of that rule the browser does not default to. */
.chart-header, .chart-source { flex: 0 0 auto; }
.chart-title {
  margin: 0 0 4px;
  font-size: var(--title-size);
  font-weight: var(--title-weight);
  color: var(--ink);
}
.chart-caveat, .chart-source {
  margin: 0;
  font-size: var(--subtitle-size);
  color: var(--muted);
}
.chart-source { font-size: var(--source-size); margin-top: 10px; }

.chart-figure .chart-filter {
  flex: 0 0 auto;
  margin: 10px 0 0;
  padding: 0;
  border: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  align-items: center;
  font-size: var(--filter-size);
  /* A fieldset's default min-inline-size is min-content and a flex item's default min-width is auto,
     so a row of pills simply grows to its content and takes the DOCUMENT with it — measured at
     1351px wide in a 375px window on proof/web-slope-europe-lowcarbon. Both are load-bearing. */
  min-inline-size: 0;
  min-width: 0;
}
/* float:left is the HTML spec's own opt-out from becoming the "rendered legend" the browser lifts
   into the fieldset's border — inside a flex container the float itself does nothing. Without it
   the legend takes a row of its own, which this format's window-fit rule pays for in plot height. */
.chart-figure .chart-filter legend { float: left; font-weight: 600; padding: 0; color: var(--ink); }
.chart-figure .chart-filter .options { display: inline-flex; flex: 0 1 auto; flex-wrap: wrap; gap: 4px 12px; align-items: center; min-width: 0; }
.chart-figure .chart-filter label { position: relative; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--muted); }
.chart-figure .chart-filter input { cursor: pointer; margin: 0; }

/* THE SENTENCE THE CONTROL OWES THE READER. Its row is reserved whether or not an option is
   chosen, so choosing one never moves the plot underneath it. role="status" belongs on the
   container rather than on each note: the notes come and go by display, and a live region that
   itself comes and goes announces nothing. */
.chart-figure .filter-notes {
  flex: 0 0 auto;
  margin: 4px 0 8px;
  font-size: var(--source-size);
  color: var(--muted);
}
.chart-figure .filter-notes p { margin: 0; }

@supports selector(:has(*)) {
  .chart-figure .chart-filter .options {
    gap: 0;
    padding: 3px;
    border: 1px solid var(--grid);
    border-radius: 999px;
  }
  /* THE RING IS PAID FOR OUT OF THE PADDING. A transparent 1,5px edge at rest and an accent one when
     chosen means the pill's outer box is the same either way, so the row cannot shift sideways when
     a reader changes their mind. min-height rather than arithmetic on the direction's own font size
     is what keeps the 24x24 target real in every direction (WCAG 2.2 SC 2.5.8). */
  .chart-figure .chart-filter label {
    gap: 0;
    min-height: 24px;
    padding: 4px 10px;
    border: 1.5px solid transparent;
    border-radius: 999px;
    line-height: 1.2;
    white-space: nowrap;
    transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .chart-figure .chart-filter label input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 999px;
  }
  /* THREE DISTINCT STATES, AND NO TWO OF THEM ARE THE SAME CUE. Hover darkens the words and nothing
     else. Chosen fills the capsule, rings it and darkens the words. Focus draws an outline OUTSIDE
     the box, in ink, so a chosen pill that is also focused shows both and neither is mistaken for
     the other. Order matters and is the whole mechanism: hover and chosen weigh the same, so the
     later rule is what a hovered chosen pill takes. */
  .chart-figure .chart-filter label:hover { color: var(--ink); }
  /* NOT A SLAB OF INK — see this file's header for the three refusals and the three measured cues.
     An opaque color-mix and not a translucency: what the page paints behind the words is exactly the
     colour measured against them. Where color-mix is not understood the declaration drops and the
     ring and the darkened words still separate the chosen option, which is the same posture the
     @supports wrapper already takes. */
  .chart-figure .chart-filter label:has(input:checked) {
    background: color-mix(in srgb, var(--accent) 22%, var(--ground));
    border-color: var(--accent);
    color: var(--ink);
  }
  .chart-figure .chart-filter label:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
}

.chart-plot {
  position: relative;
  width: 100%;
  display: grid;
  /* THREE COLUMNS, THE THIRD NORMALLY EMPTY. The format has always had a left gutter and an
     x-axis band; a beat whose marks END somewhere meaningful (the bump's final ranks) also needs a
     right gutter, and it used to get one by declaring an IMPLICIT third column of its own. That was
     invisible to this stylesheet, and invisible is exactly what '--track-w' below cannot afford:
     the cell's own slack is measured from the track, and a track 127px narrower than assumed moved
     the bump's left gutter 63.5px off the drawing it labels. Declared here, defaulting to nothing,
     it costs a beat that has no end gutter exactly zero. */
  grid-template-columns: var(--y-gutter) 1fr var(--end-gutter, 0px);
  grid-template-rows: 1fr var(--x-axis-h);
  /* The one shrinkable item in the figure's column -- see .chart-figure's max-height above. Its
     flex BASE size is still the canonical aspect-ratio (set per-render on this element's own
     inline style, from the real geometry), so in a window with room the shape is exactly what it
     always was, byte for byte. Only when the column overflows does 1 (flex-shrink) let this box
     give the height back. A flatter plot is a real cost and it USED to be paid by the drawing:
     preserveAspectRatio="none" followed the box down and the geometry went with it.
     THAT REASONING IS NOW OVERTURNED, AND THE COMMENT IT REPLACES IS QUOTED SO THE COST IS MET
     RATHER THAN LOST: "A flatter plot is a real cost, paid knowingly: a slope read at a shallower
     angle is still the same series, whereas a chart whose end label is below the fold is not a
     chart the reader has seen." That held for a CURVE. It does not hold for a scatter, a
     pictogram, an arrowhead or a proportional symbol: a LENGTH in the plane may follow the
     stretch, because it is a distance and it belongs to the plane, but a SHAPE never may. The
     format already knew this for TEXT (which is why every word lives in HTML outside the viewBox)
     and for STROKES (vector-effect="non-scaling-stroke"); it had never written it down for filled
     shapes. The owner read it off a render before any guard did: "les cercles sont pas parfaits
     tout comme les fleches, on dirait que c'est etire" -- measured on the connected scatter at
     1512x860, a 1420x564 cell for an 820x460 viewBox, 1.41x wider than tall.
     min-height is BOTH the floor (see PLOT_FLOOR_PX) and the override of flexbox's own
     min-height:auto, which would otherwise refuse to shrink this box below its content size and
     re-open the overflow this whole rule exists to close. It is ALSO the worst stretcher of the
     two: the pictogram measured 2.15x at 375x812, where this floor pins the height while the
     width collapses -- worse than any wide-and-short window, and out of reach of any fix aimed at
     the clamp alone. */
  flex: 0 1 auto;
  min-height: 120px;

  /* THE CELL CARRIES THE VIEWBOX'S OWN RATIO, AT EVERY WINDOW SIZE, WHICH IS WHAT MAKES
     preserveAspectRatio="none" UNIFORM AND THEREFORE HARMLESS.
     Not a letterbox: switching the <svg> to "meet" would shift every HTML overlay positioned in %
     of the cell (the price the radar already paid by pulling its text inside the viewBox). The
     cell is made exact instead, and then the stretch has nothing left to stretch.
     WHY THE ASPECT-RATIO STAYS ON THIS ELEMENT. It looks as though the cell could simply carry
     'aspect-ratio: W / H' and the gutters be forgotten. It cannot: container-type: size implies
     contain: size, so a size container's own size must come from somewhere other than its
     contents. This box takes its height from its width (the inline aspect-ratio the component
     sets, gutters included), the grid then hands the plot cell a box definite in BOTH axes, and
     the min() pair below is what absorbs, with ONE mechanism, all three causes of anisotropy: the
     fixed-pixel gutters that only make the cell exactly W:H at one single width (~2 % drift at
     1464px), the height clamp, and the min-height floor.
     The numbers are the beat's own, read off the <svg> it just drew -- never typed here. */
  container-type: size;
  --track-w: calc(100cqw - var(--y-gutter) - var(--end-gutter, 0px));
  --track-h: calc(100cqh - var(--x-axis-h));
  --cell-w: min(var(--track-w), calc(var(--track-h) * 820 / 640));
  --cell-h: min(var(--track-h), calc(var(--track-w) * 640 / 820));
  /* Half of whatever the cell did not take, in each axis. The cell is CENTRED in its track, so a
     wide-and-short window gets even side margins and a legible drawing rather than a squashed one
     -- and the gutters travel with it (below), because an axis label that stays glued to the
     track's edge while the plot it labels moves is a worse defect than the one being fixed. */
  --cell-slack-x: calc((var(--track-w) - var(--cell-w)) / 2);
  --cell-slack-y: calc((var(--track-h) - var(--cell-h)) / 2);
}
/* BOTH GUTTERS FOLLOW THE CELL. Each is the cell's own height, so a label at 'top: 62%' lands on
   the same 62 % of the geometry it names; each translate carries it across whatever slack the cell
   left, so it stays flush against the drawing's own edge instead of the track's. */
.chart-plot .y-axis {
  grid-column: 1;
  grid-row: 1;
  position: relative;
  height: var(--cell-h);
  min-height: 0;
  margin-block: auto;
  transform: translateX(var(--cell-slack-x));
}
.chart-plot .end-axis {
  grid-column: 3;
  grid-row: 1;
  position: relative;
  height: var(--cell-h);
  min-height: 0;
  margin-block: auto;
  transform: translateX(calc(0px - var(--cell-slack-x)));
}
/* Every box that SHARES the plot cell takes the cell's exact size and centres in the track: the
   geometry itself, the HTML overlay that annotates it, and any layer a beat adds over both (the
   tree's own convention names one '...-layer' -- 'option-layer', 'verdict-layer', 'cell-layer').
   min-width/min-height: 0 overrides a grid item's automatic minimum size, which would otherwise
   refuse to let a box carrying intrinsic geometry shrink below it. */
svg.chart,
.chart-plot .overlay,
.chart-plot > [class*="-layer"] {
  grid-column: 2;
  grid-row: 1;
  width: var(--cell-w);
  height: var(--cell-h);
  min-width: 0;
  min-height: 0;
  margin: auto;
}
svg.chart { display: block; }
/* pointer-events:none is load-bearing, not decoration: .overlay shares the exact grid cell the
   svg's own .hit-area occupies, and a plain div with no pointer-events override intercepts every
   mouse/touch event over the WHOLE plot before it ever reaches the svg beneath it -- caught only by
   driving a real browser (page.mouse.move landed on .overlay, not the hit-area, and the tooltip
   never appeared), never by the markup or a unit test. Inherited by every span inside it, which is
   correct: none of them is a control. */
.chart-plot .overlay { position: relative; pointer-events: none; }
/* The x-axis band is the y-axis's mirror: the cell's width, and lifted by whatever vertical slack
   the cell left above it, so the tick under a mark stays under that mark. */
.chart-plot .x-axis {
  grid-column: 2;
  grid-row: 2;
  position: relative;
  width: var(--cell-w);
  min-width: 0;
  margin-inline: auto;
  transform: translateY(calc(0px - var(--cell-slack-y)));
}

.axis-label {
  position: absolute;
  font-size: var(--axis-size);
  white-space: nowrap;
}
.axis-label.y { right: 10px; transform: translateY(-50%); }
.axis-label.x { top: 6px; transform: translateX(-50%); }

.note, .end-label {
  position: absolute;
  font-size: var(--note-size);
  white-space: nowrap;
  background: var(--ground);
  padding: 1px 4px;
  border-radius: 2px;
}
.note.reference-label { transform: translateY(-100%) translateY(-4px); }
.note.peak-label.above { transform: translate(-50%, -100%) translateY(-6px); }
.end-label {
  font-size: var(--label-size);
  font-weight: var(--label-weight);
  transform: translate(-100%, -50%) translateX(-10px);
}

/* THE HOVERABLE LINE's own contract with the components that draw one. pointer-events:stroke is
   the whole mechanism: it makes the STROKE the hit region rather than the bounding box, which for
   a diagonal connector is mostly empty space -- a reader aiming at the line they can see would
   otherwise be answered by a rectangle that also covers everything between the line and the frame.
   The twin is transparent and generously wide (the component states the width as a knob); nothing
   here paints it. .line-active is what a component may style to bring the visible line forward. */
.line-hit { pointer-events: stroke; cursor: pointer; fill: none; }
.line-hit:focus { outline: none; }
.line-hit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.pt { cursor: pointer; }
.pt:hover, .pt:focus, .pt-active {
  fill: var(--muted);
  outline: none;
}
/* THE MARK ANSWERS, NOT A DOT ON TOP OF IT.
   A .pt is a circle r=5 at the reading's own position, and filling it is exactly right for a
   LINE: the reading is a point there, and the dot IS the mark. It is wrong for a bar or a column,
   where the mark is the whole rectangle and the dot prints a grey spot floating at its top -- the
   owner's own reading of the ranking beat, and the reason these two rules exist.
   A component says which it has by giving the point a data-mark-ref naming the shape that
   answers for it; interaction.mjs then puts .mark-active on [data-mark="<that name>"] on
   hover, focus and tap, and the point itself stays invisible. A beat that names no shape is
   unchanged to the byte: a line beat keeps its dot.
   WHAT THE ACTIVE MARK BECOMES IS THE BEAT'S, NEVER THIS FILE'S. --mark-active is read off the
   mark, so the one place that knows a column is drawn in the accent or in the neutral is the one
   place that says what it takes under a pointer -- and it is measured there against the ground, in
   each direction, rather than nudged here with a brightness filter, which lightens on a light
   ground and on a dark one alike. --muted is the fallback, which is what a mark with no declared
   colour already got. */
.pt[data-mark-ref]:hover, .pt[data-mark-ref]:focus, .pt[data-mark-ref].pt-active {
  fill: transparent;
}
.mark-active { fill: var(--mark-active, var(--muted)); }
.pt:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
#tooltip {
  position: fixed;
  max-width: 220px;
  padding: 6px 10px;
  font-size: 13px;
  line-height: 1.3;
  background: var(--ground);
  color: var(--ink);
  border: 1px solid var(--muted);
  border-radius: 3px;
  pointer-events: none;
  z-index: 10;
}
#tooltip[hidden] { display: none; }

/* The filter this beat declared: 6 options over "Filter by region".
   One rule per option, over [data-filter] — every element drawn from a hidden datum goes with it. */
.chart-figure [data-filter-note] { display: none; }
.chart-figure:has(#chart-filter-africa:checked) [data-filter]:not([data-filter~="africa"]) { display: none; }
.chart-figure:has(#chart-filter-africa:checked) [data-filter-note="africa"] { display: revert; }
.chart-figure:has(#chart-filter-asia:checked) [data-filter]:not([data-filter~="asia"]) { display: none; }
.chart-figure:has(#chart-filter-asia:checked) [data-filter-note="asia"] { display: revert; }
.chart-figure:has(#chart-filter-europe:checked) [data-filter]:not([data-filter~="europe"]) { display: none; }
.chart-figure:has(#chart-filter-europe:checked) [data-filter-note="europe"] { display: revert; }
.chart-figure:has(#chart-filter-north-america:checked) [data-filter]:not([data-filter~="north-america"]) { display: none; }
.chart-figure:has(#chart-filter-north-america:checked) [data-filter-note="north-america"] { display: revert; }
.chart-figure:has(#chart-filter-oceania:checked) [data-filter]:not([data-filter~="oceania"]) { display: none; }
.chart-figure:has(#chart-filter-oceania:checked) [data-filter-note="oceania"] { display: revert; }
.chart-figure:has(#chart-filter-south-america:checked) [data-filter]:not([data-filter~="south-america"]) { display: none; }
.chart-figure:has(#chart-filter-south-america:checked) [data-filter-note="south-america"] { display: revert; }
</style>
<style>

.pt {
  position: absolute;
  display: block;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
.pt.pt-active, .pt:focus {
  box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--ink);
}
.pt:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.point-label {
  position: absolute;
  font-size: var(--label-size);
  font-weight: var(--label-weight);
  color: var(--ink);
  background: var(--ground);
  padding: 0 3px;
  border-radius: 2px;
  white-space: nowrap;
  transform: translateY(-50%);
}
.point-label.anchor-middle { transform: translate(-50%, -50%); }
.point-label.anchor-end { transform: translate(-100%, -50%); }
.axis-title {
  margin: 0;
  flex: 0 0 auto;
  font-size: var(--axis-title-size);
  color: var(--muted);
}
.y-axis-title { margin-bottom: 8px; }
.x-axis-title { text-align: center; margin-top: 2px; }

</style>

<body>
<figure class="chart-figure" style="--ground:#FFFFFF;--accent:#C1440E;--ink:#000000;--muted:#616161;--title-size:24px;--title-weight:700;--subtitle-size:14px;--source-size:13px;--axis-size:12px;--axis-title-size:13px;--label-size:13px;--label-weight:600"><div class="chart-header"><h2 class="chart-title">Among the world&#x27;s richest economies, the United States has one of the lowest life expectancies — years behind income-peer Switzerland.</h2><p class="chart-caveat">Cuba, at roughly an eighth of either country&#x27;s income, comes within a few years of both.</p></div><fieldset class="chart-filter"><legend>Filter by region</legend><div class="options"><label><input id="chart-filter-all" type="radio" name="chart-filter" checked="" value="all"/>All regions</label><label><input id="chart-filter-africa" type="radio" name="chart-filter" value="africa"/>Africa</label><label><input id="chart-filter-asia" type="radio" name="chart-filter" value="asia"/>Asia</label><label><input id="chart-filter-europe" type="radio" name="chart-filter" value="europe"/>Europe</label><label><input id="chart-filter-north-america" type="radio" name="chart-filter" value="north-america"/>North America</label><label><input id="chart-filter-oceania" type="radio" name="chart-filter" value="oceania"/>Oceania</label><label><input id="chart-filter-south-america" type="radio" name="chart-filter" value="south-america"/>South America</label></div></fieldset><div class="filter-notes" role="status"><p data-filter-note="africa">Showing Africa — 49 of 164 countries.</p><p data-filter-note="asia">Showing Asia — 45 of 164 countries.</p><p data-filter-note="europe">Showing Europe — 40 of 164 countries.</p><p data-filter-note="north-america">Showing North America — 18 of 164 countries.</p><p data-filter-note="oceania">Showing Oceania — 2 of 164 countries.</p><p data-filter-note="south-america">Showing South America — 10 of 164 countries.</p></div><p class="axis-title y-axis-title">Life expectancy at birth (years)</p><div class="chart-plot scatter-plot" style="--y-gutter:42.935546875px;--x-axis-h:24px;aspect-ratio:862.935546875 / 664"><div class="y-axis"><span class="axis-label y" style="top:100%;color:#616161">50</span><span class="axis-label y" style="top:87.5%;color:#616161">55</span><span class="axis-label y" style="top:75%;color:#616161">60</span><span class="axis-label y" style="top:62.5%;color:#616161">65</span><span class="axis-label y" style="top:50%;color:#616161">70</span><span class="axis-label y" style="top:37.5%;color:#616161">75</span><span class="axis-label y" style="top:25%;color:#616161">80</span><span class="axis-label y" style="top:12.5%;color:#616161">85</span><span class="axis-label y" style="top:0%;color:#616161">90 yrs</span></div><svg role="group" aria-label="Among the world&#x27;s richest economies, the United States has one of the lowest life expectancies — years behind income-peer Switzerland." xmlns="http://www.w3.org/2000/svg" class="chart" viewBox="0 0 820 640" preserveAspectRatio="none" font-family="Helvetica, Arial, sans-serif"><desc>Scatter plot of GDP per capita, log scale, against life expectancy at birth, for 164 countries in 2022. Switzerland (about $63,300 GDP per capita, 83.2 years) and the United States (about $58,500, 78.0 years) are highlighted: despite similar income, the United States trails Switzerland by about 5 years. Cuba (about $7,600, 77.6 years) is also highlighted, nearly matching the United States&#x27; life expectancy at roughly an eighth of its income. Most other countries form a rising cloud in which higher income tends to come with longer life expectancy, with these three points as the notable exceptions.</desc><rect x="0" y="0" width="820" height="640" fill="#FFFFFF"></rect><line x1="0" x2="820" y1="640" y2="640" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="0" x2="820" y1="560" y2="560" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="0" x2="820" y1="480" y2="480" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="0" x2="820" y1="400" y2="400" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="0" x2="820" y1="320" y2="320" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="0" x2="820" y1="240" y2="240" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="0" x2="820" y1="160" y2="160" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="0" x2="820" y1="80" y2="80" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="0" x2="820" y1="0" y2="0" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="0" x2="0" y1="0" y2="640" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="204.99999999999994" x2="204.99999999999994" y1="0" y2="640" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="410.0000000000001" x2="410.0000000000001" y1="0" y2="640" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="615" x2="615" y1="0" y2="640" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line x1="820" x2="820" y1="0" y2="640" stroke="#d1d1d1" stroke-width="1" vector-effect="non-scaling-stroke"></line><line data-key="CUB" data-filter="north-america" x1="386.13551013685696" y1="197.9344000000001" x2="386.13551013685696" y2="175.9344000000001" stroke="#C1440E" stroke-width="1" vector-effect="non-scaling-stroke"></line><line data-key="CHE" data-filter="europe" x1="574.3204609013015" y1="108.7952" x2="588.3204609013015" y2="94.7952" stroke="#C1440E" stroke-width="1" vector-effect="non-scaling-stroke"></line><line data-key="USA" data-filter="north-america" x1="567.2478736536159" y1="192.33760000000004" x2="581.2478736536159" y2="212.33760000000004" stroke="#C1440E" stroke th:11px;height:11px;background:#C1440E" tabindex="0" role="img" aria-label="Switzerland: $63,323 GDP per capita, 83.2 years life expectancy" data-key="CHE" data-filter="europe" data-country="Switzerland" data-detail="Switzerland · $63,323 · 83.2 yrs"></span><span class="pt pt-named" style="left:69.2%;top:30.1%;width:11px;height:11px;background:#C1440E" tabindex="0" role="img" aria-label="United States: $58,487 GDP per capita, 78.0 years life expectancy" data-key="USA" data-filter="north-america" data-country="United States" data-detail="United States · $58,487 · 78.0 yrs"></span><span data-key="CUB" data-filter="north-america" class="point-label anchor-middle" style="left:47.1%;top:27.5%">Cuba</span><span data-key="CHE" data-filter="europe" class="point-label anchor-start" style="left:71.7%;top:14.8%">Switzerland</span><span data-key="USA" data-filter="north-america" class="point-label anchor-start" style="left:70.9%;top:33.2%">United States</span></div><div class="x-axis"><span class="axis-label x" style="left:0%;color:#616161">$100</span><span class="axis-label x" style="left:25%;color:#616161">$1k</span><span class="axis-label x" style="left:50%;color:#616161">$10k</span><span class="axis-label x" style="left:75%;color:#616161">$100k</span><span class="axis-label x" style="left:100%;color:#616161">$1M</span></div></div><p class="axis-title x-axis-title">GDP per capita, log scale (US$)</p><p class="chart-source">Source: United Nations World Population Prospects (2024) &amp; Maddison Project Database 2023 (Bolt and van Zanden), via Our World in Data · 2022 data</p></figure>
<div id="tooltip" role="status" aria-live="polite" hidden></div>
<script>
// twin/proof/web-income-life-expectancy/scatter-interaction.mjs
//
// This beat's OWN interaction script — not `chart-web/assets/interaction.mjs`, the line-format
// skill's own copy. `render-web.mjs` inlines this one instead, the same way the skill's own
// `renderWeb` inlines its own (see that file's doc-comment for exactly how and why).
//
// Why a second implementation was needed, not a reuse: the skill's `nearestIndex(cxs, x)` resolves
// a pointer position to the reading whose `cx` (x-coordinate ONLY) is closest — correct for a line
// beat, where every reading has a distinct x (one per year) and y carries the value being read off.
// A scatter has ~164 points scattered freely in BOTH x and y; two countries can sit at nearly the
// same GDP (x) with very different life expectancies (y) — Switzerland and the United States in
// this very dataset are ~6px apart in x and ~50px apart in y. Resolving by x alone would report
// whichever of the two has the marginally closer x, regardless of which one the pointer is actually
// near vertically — silently wrong, the exact kind of defect a static render's PNG can never reveal
// (`web-discipline.md`, "Verification": this class of bug only shows up driving a live pointer).
// `nearestPointIndex` below measures real 2D distance instead.
//
// Second difference: the skill's own CSS toggles `.pt`'s FILL between transparent (rest) and muted
// (hover/focus/active), because that format's points are invisible until interacted with. This
// beat's points are visibly drawn from the start (the cloud IS the argument) and, since the fluid
// frame stretches its `viewBox`, they are HTML elements rather than SVG circles that would render
// as ellipses — see `IncomeLifeExpectancyWeb.tsx`'s own doc-comment. So hover/focus here draws a
// RING around the dot via the same `.pt-active` class name (CSS override lives in
// `render-web.mjs`'s own `EXTRA_CSS`, appended after the skill's generic stylesheet). The class name
// and the DOM wiring shape below otherwise follow `interaction.mjs` closely on purpose — same
// tooltip element, same hover/tap/keyboard parity, same `data-detail`/`aria-label` discipline — so a
// reader who has used the CO₂ beat meets the same interaction language here.
//
// `nearestPointIndex` is exported and pure — no DOM — so it can be sanity-checked directly.
// `initChart`/`initAll` are DOM wiring and are proven, per `doctrine`'s own rule, by driving a
// real browser, never by asserting against an unwatched DOM emulation.

/** Index of the point in `pts` (each `{x, y}` in the same pixel space the pointer position is
 *  given in) closest to `(x, y)` by ordinary Euclidean distance. Squared distance is compared
 *  directly — the ordering a `sqrt` would produce is identical, and skipping it is one call fewer
 *  per of the ~164 points, on every pointer move. */
function nearestPointIndex(pts, x, y) {
  let best = 0;
  let bestDist = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const dx = pts[i].x - x;
    const dy = pts[i].y - y;
    const d = dx * dx + dy * dy;
    if (d < bestDist) {
      bestDist = d;
      best = i;
    }
  }
  return best;
}

/** Wires one plot — its `.pt` dots, the `.hit-area` rectangle inside its `<svg>`, and the shared
 *  tooltip element — to hover, tap and keyboard. Every dot already carries its own `data-detail`
 *  string and its own `aria-label`, baked in server-side; this function never invents or recomputes
 *  either.
 *
 *  The dots are HTML elements now, not SVG circles, and they are measured in SCREEN pixels rather
 *  than read back as baked coordinates. Both follow from the fluid frame: the `<svg>` stretches with
 *  `preserveAspectRatio="none"`, so a `<circle>` would render as an ellipse (see
 *  `IncomeLifeExpectancyWeb.tsx`'s own doc-comment) — and once the frame's own x and y scales differ,
 *  "nearest" measured in the geometry's canonical units is no longer "nearest" on the reader's
 *  screen. The old copy inverse-transformed the pointer through `getScreenCTM()` and compared baked
 *  `data-x`/`data-y`, which was exact only while the two scales matched. Measuring each dot's real
 *  rect makes it exact at every width, at the cost of one measuring pass — taken once, and again on
 *  resize, never per pointer move. */
function initChart(plot, tooltip) {
  const points = Array.prototype.slice.call(plot.querySelectorAll(".pt"));
  if (points.length === 0) return;
  const hitArea = plot.querySelector(".hit-area");
  let coords = [];
  function measure() {
    coords = points.map((p) => {
      const r = p.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    });
  }
  measure();
  window.addEventListener("resize", measure);

  function clear() {
    points.forEach((p) => p.classList.remove("pt-active"));
    tooltip.hidden = true;
  }

  function show(point, clientX, clientY) {
    points.forEach((p) => p.classList.toggle("pt-active", p === point));
    tooltip.textContent = point.getAttribute("data-detail");
    tooltip.hidden = false;
    const tw = tooltip.offsetWidth || 160;
    const th = tooltip.offsetHeight || 28;
    const x = Math.min(Math.max(clientX - tw / 2, 8), window.innerWidth - tw - 8);
    const y = Math.max(clientY - th - 14, 8);
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }

  // Hover and tap share one path: pointer events fire for mouse, pen and touch alike. Resolution is
  // nearest-point-in-2D over the whole plot rectangle, so a touch reader never has to land a tap
  // exactly on a 2-3px circle — any tap inside the plot resolves to whichever of the ~164 dots is
  // actually closest to it.
  function fromPointer(evt) {
    const i = nearestPointIndex(coords, evt.clientX, evt.clientY);
    show(points[i], evt.clientX, evt.clientY);
  }

  if (hitArea) {
    hitArea.addEventListener("pointermove", fromPointer);
    hitArea.addEventListener("pointerdown", fromPointer);
    hitArea.addEventListener("pointerleave", clear);
  }

  // Keyboard: every point is already `tabIndex={0}` at build time (works with this script absent
  // entirely — the same invariant `web-discipline.md`, "Keyboard and touch", states for the line
  // format). This layer adds the same detail box hover shows, plus Left/Right/Home/End to move
  // between points in DOM order (this beat's own DOM order is the CSV's own row order, i.e.
  // alphabetical by country — an intuitive-enough sequence for a reader stepping through by
  // keyboard, and simpler than trying to derive a 2D "next nearest" ordering no reader would expect
  // to be stable anyway).
  points.forEach((point, i) => {
    point.addEventListener("focus", function () {
      const rect = point.getBoundingClientRect();
      show(point, rect.left + rect.width / 2, rect.top);
    });
    point.addEventListener("blur", clear);
    point.addEventListener("keydown", function (evt) {
      let nextIndex = null;
      if (evt.key === "ArrowRight") nextIndex = Math.min(i + 1, points.length - 1);
      else if (evt.key === "ArrowLeft") nextIndex = Math.max(i - 1, 0);
      else if (evt.key === "Home") nextIndex = 0;
      else if (evt.key === "End") nextIndex = points.length - 1;
      else if (evt.key === "Escape") {
        clear();
        point.blur();
        return;
      }
      if (nextIndex !== null && nextIndex !== i) {
        evt.preventDefault();
        points[nextIndex].focus();
      }
    });
  });

  document.addEventListener("pointerdown", function (evt) {
    if (plot.contains(evt.target) || tooltip.contains(evt.target)) return;
    clear();
  });
}

function initAll() {
  const tooltip = document.getElementById("tooltip");
  if (!tooltip) return;
  document.querySelectorAll(".chart-plot").forEach(function (plot) {
    initChart(plot, tooltip);
  });
}

// Guarded rather than a bare top-level call: this file can also be read/imported in a context with
// no `document` (e.g. inspecting `nearestPointIndex` directly). In the browser the guard is always
// true, so the inlined `<script>` self-starts the moment it is parsed, unchanged.
if (typeof document !== "undefined") initAll();

</script>
