:root {
  --ground: #FFFCEE;
  --accent: #1757B6;
  --ink: #000000;
  --muted: #61605a;
  --grid: #d1cfc3;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  /* The beat's OWN face, read off the markup it just drew (dominantFontStack) — not a literal.
     This rule used to say "Helvetica, Arial, sans-serif", which set every word the components do
     not style themselves, the tooltip above all, in a typeface nobody chose and nothing embedded. */
  font-family: Open Sans, Helvetica, Arial, sans-serif;
}

/* THE FLUID FILL — the redesign this file exists to ship. .chart-figure and everything inside
   .chart-plot take the FULL width of whatever contains them, edge to edge, no max-width cap and
   no fixed rung to swap between. Height is never independently set on the plot: aspect-ratio
   (set per-render on .chart-plot's own inline style, from the component's real geometry) grows
   the height WITH the width, so a very wide container gets a taller chart rather than a flat,
   letterboxed strip -- the failure mode capping the width would otherwise avoid at the cost of
   empty gutters, and the failure mode letting width AND height both float freely would risk
   instead. The header block and the source line USED to carry a 640px reading-measure cap; they
   no longer do. A title that stops at 640px above a chart running to 1600 reads as a broken box,
   not as a comfortable measure -- see references/web-discipline.md, "The words take the same width
   as the graphic," for the reversal and what now bounds the line length instead.

   "Fills the container" is a claim about the FRAME's own edges, never about the content inside
   it -- FRAME_PAD_PX is the fixed inner margin that keeps that distinction real: title, caveat,
   filter, every axis label, the end label and the source line all sit inside it, so nothing ever
   touches the frame's own edge at any width. box-sizing:border-box (above) is what makes width:100%
   plus this padding still equal exactly 100% of the parent -- no overflow, no second width to
   reconcile. */
.chart-figure {
  margin: 0;
  width: 100%;
  padding: 24px;
  display: flex;
  flex-direction: column;
  /* THE WINDOW-FIT CLAMP IS GONE, AND THE COMMENT IT REPLACES IS QUOTED SO THE TRADE IS MET RATHER
     THAN LOST: "THE WINDOW FIT. A beat is one thing a reader looks at, not a document they scroll
     through: the whole figure must be visible at once. [...] Clamping here, rather than capping
     the width or shortening the geometry, is what keeps the fill and the fit true at the same
     time." That was true of a plot whose cell was free to change shape. It stopped being true the
     day the cell was made to carry its own viewBox ratio, because from then on the three things
     could not all hold at once, and one of them had to go:

       1. the drawing keeps its own proportions (a circle is round);
       2. the drawing takes the whole width the figure has;
       3. the whole figure fits inside the window's height.

     (1) is not negotiable -- on a map it is not a style defect, it is a false geography. (2) and
     (3) are the arbitration, and the owner made it on a render: "la carte ne prend pas toute la
     largeur tout comme les charts, fais en sorte qu'ils prennent toute la largeur en respectant
     les marges." So (3) goes. On a wide, short window the figure is now TALLER than the window and
     the page scrolls.

     DELETED RATHER THAN REPLACED BY AN INNER SCROLLER, and the reason is the sentence the old
     comment ended on: this file is embedded inside an article as often as it is opened on its own.
     An 'overflow: auto' here would put a second scrollbar inside the article's own, and a reader
     who scrolls the page would stop at the figure's edge instead of moving through it. The
     DOCUMENT's own vertical scroll is the honest overflow: it is the one the reader already has.
     Horizontal overflow stays forbidden -- see 'assertPlotCellFillsItsTrack' and 'checkFit'. */
}
/* Everything except the plot keeps its natural height: words are never squeezed to make a chart
   fit, the chart is. flex-shrink:0 is the half of that rule the browser does not default to. */
.chart-header, .chart-source { flex: 0 0 auto; }
.chart-title {
  margin: 0 0 4px;
  font-size: var(--title-size);
  font-weight: var(--title-weight);
  color: var(--ink);
}
.chart-caveat, .chart-source {
  margin: 0;
  font-size: var(--subtitle-size);
  color: var(--muted);
}
.chart-source { font-size: var(--source-size); margin-top: 10px; }



.chart-plot {
  position: relative;
  width: 100%;
  display: grid;
  /* THREE COLUMNS, THE THIRD NORMALLY EMPTY. The format has always had a left gutter and an
     x-axis band; a beat whose marks END somewhere meaningful (the bump's final ranks) also needs a
     right gutter, and it used to get one by declaring an IMPLICIT third column of its own. That was
     invisible to this stylesheet, and invisible is exactly what '--track-w' below cannot afford:
     the cell IS the track, so a track 127px wider than the beat actually has puts the drawing 127px
     wider than the column it sits in. Declared here, defaulting to nothing, it costs a beat that
     has no end gutter exactly zero.
     The first ROW is '1fr' in a box whose own height is indefinite, which resolves to its items'
     own contribution -- and every item in it is exactly '--cell-h'. That is how the plot's height
     comes to be the cell's height plus the x-axis band, with no ratio typed over the whole box. */
  grid-template-columns: var(--y-gutter) 1fr var(--end-gutter, 0px);
  grid-template-rows: 1fr var(--x-axis-h);
  /* THE PLOT NEVER SHRINKS AND NEVER CARRIES A FLOOR, AND THE COMMENT THIS REPLACES IS QUOTED SO
     NOTHING IS LOST: "The one shrinkable item in the figure's column [...] Only when the column
     overflows does 1 (flex-shrink) let this box give the height back." and "min-height is BOTH the
     floor and the override of flexbox's own min-height:auto".
     Both existed to serve the window-fit clamp, which is gone (see .chart-figure above). With the
     clamp gone there is no shortfall to absorb, so 'flex: 0 0 auto'; and the floor was, measured,
     the WORST stretcher of the lot -- the pictogram at 375x812 came to 2.15x the wrong way because
     the floor pinned the height while the width collapsed. Nothing here pins a height any more:
     this box's height is its content's, and its content is one cell derived from its width.
     A LENGTH in the plane may follow the stretch, because it is a distance and it belongs to the
     plane, but a SHAPE never may. The format already knew this for TEXT (which is why every word
     lives in HTML outside the viewBox) and for STROKES (vector-effect="non-scaling-stroke"); it
     had never written it down for filled shapes. The owner read it off a render before any guard
     did: "les cercles sont pas parfaits tout comme les fleches, on dirait que c'est etire". */
  flex: 0 0 auto;

  /* THE CELL IS DRIVEN BY THE WIDTH, ALWAYS, AND ITS HEIGHT FOLLOWS FROM ITS OWN viewBox RATIO.
     That is what makes preserveAspectRatio="none" a uniform SCALE rather than a distortion, and it
     is what puts the drawing edge to edge in the width the figure has.
     THE COMMENT THIS REPLACES IS QUOTED, BECAUSE ITS REASONING WAS SOUND AND ITS RESULT WAS
     REFUSED: "the min() pair below is what absorbs, with ONE mechanism, all three causes of
     anisotropy: the fixed-pixel gutters [...], the height clamp, and the min-height floor" and
     "The cell is CENTRED in its track, so a wide-and-short window gets even side margins and a
     legible drawing rather than a squashed one." A min() pair is a CONTAIN: under a height clamp
     it is the HEIGHT that ends up driving, and the drawing shrinks away from the frame's two
     sides. The owner refused exactly that, on a map, in one line: "la carte ne prend pas toute la
     largeur tout comme les charts, fais en sorte qu'ils prennent toute la largeur en respectant
     les marges." So the two causes the min() was absorbing are removed at the source (no clamp, no
     floor) instead of being papered over, and the third -- the fixed-pixel gutters -- is handled
     by taking the cell's height from the TRACK's width rather than from any ratio typed over the
     whole box. --cell-w is var(--track-w) with nothing wrapped round it: no min(), no clamp(), no
     cap of any kind. An empty side gutter is now a refusal, not a cost. See
     'assertPlotCellFillsItsTrack'.
     WHY 'container-type: inline-size' AND WHY THE INLINE 'aspect-ratio' IS OVERRIDDEN. The plot's
     height must be the cell's height plus the x-axis band, exactly. It used to come from an
     'aspect-ratio: totalWidth / totalHeight' the component sets inline, which mixes fixed pixel
     gutters with viewBox units and is therefore only right at ONE width: measured across the 40
     committed beats, that ratio puts the plot's box out by up to 115px (the diverging bar at
     1464px) and 84px (the gantt) -- far too much to absorb as slack. So the height is taken from
     the content instead, which is the cell this rule just derived. 'container-type: size' implies
     contain: size and would forbid that (a size container may not be sized by its contents);
     'inline-size' contains only the axis that is actually definite. The inline aspect-ratio is
     overridden with !important because forty shipped components set it in their style attribute,
     and an important author declaration is the one thing that outranks a normal inline one; the
     seed no longer writes it at all. Nothing in the tree queries THIS box's block axis -- every
     beat with an '@container (max-height:)' rule (columns, grouped bar, marimekko, treemap, the
     life-expectancy note) declares its own size container on the box it actually measures.
     The numbers are the beat's own, read off the <svg> it just drew -- never typed here. */
  container-type: inline-size;
  aspect-ratio: auto !important;
  --track-w: calc(100cqw - var(--y-gutter) - var(--end-gutter, 0px));
  --cell-w: var(--track-w);
  --cell-h: calc(var(--track-w) * 424 / 653.8);
}
/* BOTH GUTTERS FOLLOW THE CELL. Each is the cell's own height, so a label at 'top: 62%' lands on
   the same 62 % of the geometry it names. There is no translate any more and no slack to cross:
   the cell fills its track in both axes by construction, so the drawing's edge and the track's
   edge are the same edge. */
.chart-plot .y-axis {
  grid-column: 1;
  grid-row: 1;
  position: relative;
  height: var(--cell-h);
  min-height: 0;
  margin-block: auto;
}
.chart-plot .end-axis {
  grid-column: 3;
  grid-row: 1;
  position: relative;
  height: var(--cell-h);
  min-height: 0;
  margin-block: auto;
}
/* Every box that SHARES the plot cell takes the cell's exact size and centres in the track: the
   geometry itself, the HTML overlay that annotates it, and any layer a beat adds over both (the
   tree's own convention names one '...-layer' -- 'option-layer', 'verdict-layer', 'cell-layer').
   min-width/min-height: 0 overrides a grid item's automatic minimum size, which would otherwise
   refuse to let a box carrying intrinsic geometry shrink below it. */
svg.chart,
.chart-plot .overlay,
.chart-plot > [class*="-layer"] {
  grid-column: 2;
  grid-row: 1;
  width: var(--cell-w);
  height: var(--cell-h);
  min-width: 0;
  min-height: 0;
  margin: auto;
}
svg.chart { display: block; }
/* pointer-events:none is load-bearing, not decoration: .overlay shares the exact grid cell the
   svg's own .hit-area occupies, and a plain div with no pointer-events override intercepts every
   mouse/touch event over the WHOLE plot before it ever reaches the svg beneath it -- caught only by
   driving a real browser (page.mouse.move landed on .overlay, not the hit-area, and the tooltip
   never appeared), never by the markup or a unit test. Inherited by every span inside it, which is
   correct: none of them is a control. */
.chart-plot .overlay { position: relative; pointer-events: none; }
/* The x-axis band is the y-axis's mirror: the cell's width, directly under the cell. It used to be
   lifted by 'translateY(0px - var(--cell-slack-y))' across the vertical slack a contained cell left
   above it; a width-driven cell leaves none, so the lift is gone rather than computed as zero. */
.chart-plot .x-axis {
  grid-column: 2;
  grid-row: 2;
  position: relative;
  width: var(--cell-w);
  min-width: 0;
  margin-inline: auto;
}

.axis-label {
  position: absolute;
  font-size: var(--axis-size);
  white-space: nowrap;
}
.axis-label.y { right: 10px; transform: translateY(-50%); }
.axis-label.x { top: 6px; transform: translateX(-50%); }

.note, .end-label {
  position: absolute;
  font-size: var(--note-size);
  white-space: nowrap;
  background: var(--ground);
  padding: 1px 4px;
  border-radius: 2px;
}
.note.reference-label { transform: translateY(-100%) translateY(-4px); }
.note.peak-label.above { transform: translate(-50%, -100%) translateY(-6px); }
.end-label {
  font-size: var(--label-size);
  font-weight: var(--label-weight);
  transform: translate(-100%, -50%) translateX(-10px);
}

/* THE HOVERABLE LINE's own contract with the components that draw one. pointer-events:stroke is
   the whole mechanism: it makes the STROKE the hit region rather than the bounding box, which for
   a diagonal connector is mostly empty space -- a reader aiming at the line they can see would
   otherwise be answered by a rectangle that also covers everything between the line and the frame.
   The twin is transparent and generously wide (the component states the width as a knob); nothing
   here paints it. .line-active is what a component may style to bring the visible line forward. */
.line-hit { pointer-events: stroke; cursor: pointer; fill: none; }
.line-hit:focus { outline: none; }
.line-hit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.pt { cursor: pointer; }
.pt:hover, .pt:focus, .pt-active {
  fill: var(--muted);
  outline: none;
}
/* THE MARK ANSWERS, NOT A DOT ON TOP OF IT.
   A .pt is a circle r=5 at the reading's own position, and filling it is exactly right for a
   LINE: the reading is a point there, and the dot IS the mark. It is wrong for a bar or a column,
   where the mark is the whole rectangle and the dot prints a grey spot floating at its top -- the
   owner's own reading of the ranking beat, and the reason these two rules exist.
   A component says which it has by giving the point a data-mark-ref naming the shape that
   answers for it; interaction.mjs then puts .mark-active on [data-mark="<that name>"] on
   hover, focus and tap, and the point itself stays invisible. A beat that names no shape is
   unchanged to the byte: a line beat keeps its dot.
   WHAT THE ACTIVE MARK BECOMES IS THE BEAT'S, NEVER THIS FILE'S. --mark-active is read off the
   mark, so the one place that knows a column is drawn in the accent or in the neutral is the one
   place that says what it takes under a pointer -- and it is measured there against the ground, in
   each direction, rather than nudged here with a brightness filter, which lightens on a light
   ground and on a dark one alike. --muted is the fallback, which is what a mark with no declared
   colour already got. */
.pt[data-mark-ref]:hover, .pt[data-mark-ref]:focus, .pt[data-mark-ref].pt-active {
  fill: transparent;
}
.mark-active { fill: var(--mark-active, var(--muted)); }
.pt:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
#tooltip {
  position: fixed;
  max-width: 220px;
  padding: 6px 10px;
  font-size: 13px;
  line-height: 1.3;
  background: var(--ground);
  color: var(--ink);
  border: 1px solid var(--muted);
  border-radius: 3px;
  pointer-events: none;
  z-index: 10;
}
#tooltip[hidden] { display: none; }
</style>
</head>
<body>
<figure class="chart-figure" style="--ground:#FFFCEE;--accent:#1757B6;--ink:#000000;--muted:#61605a;--title-size:30px;--title-weight:700;--title-family:&quot;Merriweather&quot;, Georgia, serif;--subtitle-size:13px;--subtitle-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;--subtitle-style:normal;--source-size:13px;--source-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;--axis-size:11px;--axis-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;--label-size:15px;--label-weight:600;--label-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;--note-size:13px;--note-family:&quot;Merriweather&quot;, Georgia, serif;--eyebrow-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;--eyebrow-weight:600;--eyebrow-tracking:1.9px;--filter-size:13px"><style>.chart-figure .chart-pool {
  flex: 0 0 auto;
  margin: 10px 0 0;
  padding: 0;
  border: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  align-items: center;
  font-size: var(--filter-size);
  /* A fieldset's default min-inline-size is min-content and a flex item's default min-width is auto,
     so a row of pills simply grows to its content and takes the DOCUMENT with it — measured at
     1351px wide in a 375px window on proof/web-slope-europe-lowcarbon. Both are load-bearing. */
  min-inline-size: 0;
  min-width: 0;
}
/* float:left is the HTML spec's own opt-out from becoming the "rendered legend" the browser lifts
   into the fieldset's border — inside a flex container the float itself does nothing. Without it
   the legend takes a row of its own, which this format's window-fit rule pays for in plot height. */
.chart-figure .chart-pool legend { float: left; font-weight: 600; padding: 0; color: var(--ink); }
.chart-figure .chart-pool .options { display: inline-flex; flex: 0 1 auto; flex-wrap: wrap; gap: 4px 12px; align-items: center; min-width: 0; }
.chart-figure .chart-pool label { position: relative; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--muted); }
.chart-figure .chart-pool input { cursor: pointer; margin: 0; }

/* THE SENTENCE THE CONTROL OWES THE READER. Its row is reserved whether or not an option is
   chosen, so choosing one never moves the plot underneath it. role="status" belongs on the
   container rather than on each note: the notes come and go by display, and a live region that
   itself comes and goes announces nothing. */
.chart-figure .pool-notes {
  flex: 0 0 auto;
  margin: 4px 0 0;
  /* The two sentences wrap to two and three lines at 375px on this beat's own words, and a revealed
     sentence that grows its row pushes the whole grid down — the movement the owner's first
     arbitration refuses. Stacked in one cell, the row is always as tall as the longest sentence and
     the map never moves. */
  min-height: 3.6em;
  font-size: var(--source-size);
  color: var(--muted);
  /* EVERY SENTENCE IN ONE GRID CELL. These sentences wrap to different heights, so revealing one
     with display grew the row and pushed the drawing down. Stacked in one cell the container is
     always as tall as the LONGEST sentence, whichever is showing, and the plot never moves. */
  display: grid;
}
.chart-figure .pool-notes p { grid-area: 1 / 1; margin: 0; }

.chart-figure [data-pool-figure] { pointer-events: none; }
.chart-figure [data-pool-seam] { pointer-events: none; fill: none; }

@supports selector(:has(*)) {
  .chart-figure .chart-pool .options {
    gap: 0;
    padding: 3px;
    border: 1px solid var(--grid);
    border-radius: 999px;
  }
  /* THE RING IS PAID FOR OUT OF THE PADDING. A transparent 1,5px edge at rest and an accent one when
     chosen means the pill's outer box is the same either way, so the row cannot shift sideways when
     a reader changes their mind. min-height rather than arithmetic on the direction's own font size
     is what keeps the 24x24 target real in every direction (WCAG 2.2 SC 2.5.8). */
  .chart-figure .chart-pool label {
    gap: 0;
    min-height: 24px;
    padding: 4px 10px;
    border: 1.5px solid transparent;
    border-radius: 999px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .chart-figure .chart-pool label input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 999px;
  }
  /* THREE DISTINCT STATES, AND NO TWO OF THEM ARE THE SAME CUE. Hover darkens the words and nothing
     else. Chosen fills the capsule, rings it and darkens the words. Focus draws an outline OUTSIDE
     the box, in ink, so a chosen pill that is also focused shows both and neither is mistaken for
     the other. Order matters and is the whole mechanism: hover and chosen weigh the same, so the
     later rule is what a hovered chosen pill takes. */
  .chart-figure .chart-pool label:hover { color: var(--ink); }
  /* NOT A SLAB OF INK — see this file's header for the three refusals and the three measured cues.
     An opaque color-mix and not a translucency: what the page paints behind the words is exactly the
     colour measured against them. Where color-mix is not understood the declaration drops and the
     ring and the darkened words still separate the chosen option, which is the same posture the
     @supports wrapper already takes. */
  .chart-figure .chart-pool label:has(input:checked) {
    background: color-mix(in srgb, var(--accent) 22%, var(--ground));
    border-color: var(--accent);
    color: var(--ink);
  }
  .chart-figure .chart-pool label:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
}
/* THE ONLY MOTION THIS CHROME EMITS, AND IT IS EMITTED LAST, INSIDE @media
   (prefers-reduced-motion: no-preference), where `reduce` cannot reach it. It used to be one more
   declaration in the pill's own rule, outside every query — so a reader who had asked their system
   for no motion still got twelve chrome animations on a page whose own travel correctly snapped,
   on every vocabulary that calls this module, which is every beat with a control. The three
   declarations that SET the chosen state stay outside: the wash, the ring and the darkened words
   arrive instantly under `reduce` rather than not at all. Top level and last, which is the idiom
   every vocabulary already uses for its own motion (side.ts, reorder.ts, count.ts) rather than a
   second convention; and outside the @supports block, where nesting a query is refused, because in
   an engine without :has() nothing here changes a colour at all and a transition over changes that
   never happen costs a reader nothing. */
@media (prefers-reduced-motion: no-preference) {
  .chart-figure .chart-pool label {
    transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
  }
}

/* The grain this beat declared: 3 windows over "À quelle échelle la case met sa valeur en commun".
   Radios plus :checked/:has(), generated once at build time — the same mechanism filter.ts
   narrows with, and the reason this control needs no script and survives one being blocked. */
.chart-figure [data-pool] { fill: #FFFCEE; }
.chart-figure [data-pool-figure] { display: none; }
.chart-figure [data-pool-seam] { opacity: 0; }
.chart-figure [data-stack-note] { display: none; }
.chart-figure [data-pool~="pays-c0"] { fill: #8d908f; }
.chart-figure [data-pool~="pays-c1"] { fill: #6e7b8b; }
.chart-figure [data-pool~="pays-c2"] { fill: #4f6787; }
.chart-figure [data-pool~="pays-c3"] { fill: #2f5283; }
.chart-figure [data-pool~="pays-c4"] { fill: #103d7f; }
.chart-figure [data-pool-figure="pays"] { display: inline; }
.chart-figure [data-pool-seam="pays"] { opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .chart-figure [data-pool] { transition: fill 420ms cubic-bezier(0.4, 0, 0.2, 1); }
  .chart-figure [data-pool-seam] { transition: opacity 420ms cubic-bezier(0.4, 0, 0.2, 1); }
}
.chart-figure:has(#mw-stack-pays:checked) [data-pool] { fill: #FFFCEE; }
.chart-figure:has(#mw-stack-pays:checked) [data-pool~="pays-c0"] { fill: #8d908f; }
.chart-figure:has(#mw-stack-pays:checked) [data-pool~="pays-c1"] { fill: #6e7b8b; }
.chart-figure:has(#mw-stack-pays:checked) [data-pool~="pays-c2"] { fill: #4f6787; }
.chart-figure:has(#mw-stack-pays:checked) [data-pool~="pays-c3"] { fill: #2f5283; }
.chart-figure:has(#mw-stack-pays:checked) [data-pool~="pays-c4"] { fill: #103d7f; }
.chart-figure:has(#mw-stack-pays:checked) [data-pool-figure] { display: none; }
.chart-figure:has(#mw-stack-pays:checked) [data-pool-figure="pays"] { display: inline; }
.chart-figure:has(#mw-stack-pays:checked) [data-pool-seam] { opacity: 0; }
.chart-figure:has(#mw-stack-pays:checked) [data-pool-seam="pays"] { opacity: 1; }
.chart-figure:has(#mw-stack-pays:checked) [data-stack-note] { display: none; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-pool] { fill: #FFFCEE; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-pool~="voisinage-c0"] { fill: #8d908f; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-pool~="voisinage-c1"] { fill: #6e7b8b; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-pool~="voisinage-c2"] { fill: #4f6787; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-pool~="voisinage-c3"] { fill: #2f5283; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-pool~="voisinage-c4"] { fill: #103d7f; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-pool-figure] { display: none; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-pool-figure="voisinage"] { display: inline; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-pool-seam] { opacity: 0; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-pool-seam="voisinage"] { opacity: 1; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-stack-note] { display: none; }
.chart-figure:has(#mw-stack-voisinage:checked) [data-stack-note="voisinage"] { display: revert; }
.chart-figure:has(#mw-stack-region:checked) [data-pool] { fill: #FFFCEE; }
.chart-figure:has(#mw-stack-region:checked) [data-pool~="region-c0"] { fill: #8d908f; }
.chart-figure:has(#mw-stack-region:checked) [data-pool~="region-c1"] { fill: #6e7b8b; }
.chart-figure:has(#mw-stack-region:checked) [data-pool~="region-c2"] { fill: #4f6787; }
.chart-figure:has(#mw-stack-region:checked) [data-pool~="region-c3"] { fill: #2f5283; }
.chart-figure:has(#mw-stack-region:checked) [data-pool~="region-c4"] { fill: #103d7f; }
.chart-figure:has(#mw-stack-region:checked) [data-pool-figure] { display: none; }
.chart-figure:has(#mw-stack-region:checked) [data-pool-figure="region"] { display: inline; }
.chart-figure:has(#mw-stack-region:checked) [data-pool-seam] { opacity: 0; }
.chart-figure:has(#mw-stack-region:checked) [data-pool-seam="region"] { opacity: 1; }
.chart-figure:has(#mw-stack-region:checked) [data-stack-note] { display: none; }
.chart-figure:has(#mw-stack-region:checked) [data-stack-note="region"] { display: revert; }

#tooltip { max-width: min(460px, 100vw - 32px); }</style><div class="chart-header"><p class="chart-eyebrow" style="font-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;font-size:10px;font-weight:600;font-style:normal;line-height:1.2000326171875;letter-spacing:1.9px;text-transform:uppercase;color:#1757B6;margin:0 0 6px">Migrations · Europe</p><h2 class="chart-title" style="font-family:&quot;Merriweather&quot;, Georgia, serif;font-size:30px;font-weight:700;font-style:normal;line-height:1.2200442;letter-spacing:-0.2px;text-transform:none;color:#000000;margin:0 0 6px">Par habitant, ce n&#x27;est pas l&#x27;Allemagne : la Tchéquie accueille 36,1 Ukrainiens pour 1 000 habitants</h2><p class="chart-caveat" style="font-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400;font-style:normal;line-height:1.450062109375;letter-spacing:0px;text-transform:none;color:#61605a;margin:0">Une case par pays d&#x27;accueil, toutes de la même taille : la carte abandonne la surface et achète ce qu&#x27;un choroplèthe des mêmes données ne peut pas donner — chaque pays également visible. Six voisins, tous par une arête. Ce que la planche fixe a dû trancher pour vous est en dessous : à quelle échelle une case met sa valeur en commun.</p></div><fieldset class="chart-pool"><legend>À quelle échelle la case met sa valeur en commun</legend><div class="options"><label><input id="mw-stack-pays" type="radio" aria-label="Chaque case mesure le pays, et le pays seul — le pays" name="mw-stack" checked="" value="pays"/>le pays</label><label><input id="mw-stack-voisinage" type="radio" aria-label="Chaque case est mise en commun avec ses voisines par une arête — le voisinage" name="mw-stack" value="voisinage"/>le voisinage</label><label><input id="mw-stack-region" type="radio" aria-label="Chaque case prend le taux de son bloc régional — la région" name="mw-stack" value="region"/>la région</label></div></fieldset><div class="pool-notes" role="status"><p data-stack-note="voisinage" style="font-family:&quot;Merriweather&quot;, Georgia, serif;font-size:13px;font-weight:400;font-style:italic;line-height:1.4000465999999998;letter-spacing:0px;text-transform:none;color:#61605a;margin:0">Chaque case additionne ses personnes et ses habitants avec ceux de ses voisines par une arête, puis divise : 21 cases sur 31 changent de classe. Liechtenstein passe de 23,9 à 1,8 pour 1 000, parce que ses 39 622 habitants sont mis en commun avec les 66 438 828 de France, assis à côté de lui DANS LE DESSIN. Un voisinage n&#x27;est pas un découpage : les fenêtres se recouvrent, donc il n&#x27;y a aucun bloc à contourner ici.</p><p data-stack-note="region" style="font-family:&quot;Merriweather&quot;, Georgia, serif;font-size:13px;font-weight:400;font-style:italic;line-height:1.4000465999999998;letter-spacing:0px;text-transform:none;color:#61605a;margin:0">Les 31 pays sont réunis en 6 blocs nommés, et chaque bloc divise la somme de ses personnes par la somme de ses habitants : 21 cases sur 31 changent de classe et le contour des blocs apparaît. Europe de l&#x27;Ouest tombe à 4,3 quand la moyenne des taux de ses 7 membres est 11,0 : le quotient des sommes n&#x27;est pas la moyenne des quotients, et c&#x27;est ce que coûte un découpage.</p></div><div style="display:flex;flex-wrap:wrap;align-items:center;gap:0 10px;margin:6px 0 2px;flex:0 0 auto"><span style="font-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;font-size:11px;font-weight:500;font-style:normal;line-height:1.2000326171875;letter-spacing:0.4px;text-transform:none;color:#61605a;display:inline-flex;align-items:center;gap:5px"><span style="width:14px;height:14px;background:#8d908f;display:inline-block;border:1px solid #939089"></span>moins de 5</span><span style="font-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;font-size:11px;font-weight:500;font-style:normal;line-height:1.2000326171875;letter-spacing:0.4px;text-transform:none;color:#61605a;display:inline-flex;align-items:center;gap:5px"><span style="width:14px;height:14px;background:#6e7b8b;display:inline-block;border:1px solid #939089"></span>5–10</span><span style="font-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;font-size:11px;font-weight:500;font-style:normal;line-height:1.2000326171875;letter-spacing:0.4px;text-transform:none;color:#61605a;display:inline-flex;align-items:center;gap:5px"><span style="width:14px;height:14px;background:#4f6787;display:inline-block;border:1px solid #939089"></span>10–20</span><span style="font-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;font-size:11px;font-weight:500;font-style:normal;line-height:1.2000326171875;letter-spacing:0.4px;text-transform:none;color:#61605a;display:inline-flex;align-items:center;gap:5px"><span style="width:14px;height:14px;background:#2f5283;display:inline-block;border:1px solid #939089"></span>20–30</span><span style="font-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;font-size:11px;font-weight:500;font-style:normal;line-height:1.2000326171875;letter-spacing:0.4px;text-transform:none;color:#61605a;display:inline-flex;align-items:center;gap:5px"><span style="width:14px;height:14px;background:#103d7f;display:inline-block;border:1px solid #939089"></span>30 et plus</span><span style="font-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;font-size:11px;font-weight:500;font-style:normal;line-height:1.2000326171875;letter-spacing:0.4px;text-transform:none;color:#61605a;display:inline-flex;align-items:center;gap:5px"><span style="width:14px;height:14px;background:#FFFCEE;display:inline-block;border:1px solid #8c8b83"></span>Ukraine · origine</span></div><div class="chart-plot" style="--y-gutter:0px;--x-axis-h:0px;aspect-ratio:653.8 / 424"><div class="y-axis"></div><svg role="group" aria-label="Par habitant, ce n&#x27;est pas l&#x27;Allemagne : la Tchéquie accueille 36,1 Ukrainiens pour 1 000 habitants" xmlns="http://www.w3.org/2000/svg" class="chart" data-hit="cell" viewB ing" style="font-family:&quot;Merriweather&quot;, Georgia, serif;font-size:13px;font-weight:400;font-style:italic;line-height:1.4000465999999998;letter-spacing:0px;text-transform:none;color:#61605a;margin:6px 0 0">En nombre absolu l&#x27;ordre s&#x27;inverse : Allemagne 1 250 825 personnes (11e par habitant), Tchéquie 390 095 (1re par habitant). Aucun des deux chiffres n&#x27;est le plus vrai — ils répondent à deux questions.</p><p class="chart-reading" style="font-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400;font-style:normal;line-height:1.450062109375;letter-spacing:0px;text-transform:none;color:#61605a;margin:6px 0 0">Lecture : changez le grain et les mêmes 32 cases, aux mêmes 32 places et sous la même légende, disent autre chose — 21 sur 31 changent de classe d&#x27;un grain à l&#x27;autre. Mise en commun sur toute l&#x27;Europe, la protection vaut 9,7 pour 1 000 quand la moyenne des 31 taux vaut 12,2. Survolez, touchez ou tabulez une case pour lire ses trois taux d&#x27;un coup, les personnes, la population qui les divise et son rang dans LES DEUX classements.</p><p class="chart-source" style="font-family:&quot;Open Sans&quot;, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400;font-style:normal;line-height:1.450062109375;letter-spacing:0px;text-transform:none;color:#61605a;margin:4px 0 0">Source : Eurostat, migr_asytpsm — bénéficiaires de la protection temporaire, 2026-06 · population 2023, via Our World in Data</p></figure>

<script>
// twin/skills/chart-web/assets/interaction.mjs
//
// The one script the web format ships, inlined verbatim into the self-contained HTML by
// `scripts/render-web.mjs` (which strips the `export` keyword from each top-level declaration so
// this file can also sit as a plain classic `<script>` — no `type="module"`, no bundler, so it
// keeps working in a CMS iframe or a sandboxed embed that restricts module scripts).
//
// `nearestIndex` is exported and pure — no DOM — so it is unit-tested directly
// (`test/interaction.test.ts`). `initChart`/`initAll` are DOM wiring and are NOT unit-tested here:
// per `doctrine`'s own verification rule, an interactive format is verified by driving a real
// browser, not by asserting against a DOM emulation nobody looked at
// (`references/web-discipline.md`, "Verification").
//
// What this file does NOT do: recompute any geometry. Every point's `cx`/`cy` and its exact
// `data-detail` string were already computed server-side, from the same `crossingGeometry`/`fr`
// the static and video formats use, and baked into the SVG at build time. This script only reads
// those attributes back off the DOM and positions a tooltip — it never re-derives a coordinate or
// re-formats a number, so there is exactly one implementation of "what year is this" for all three
// formats to disagree about, and it lives in the story's own `crossing-geometry.ts` (for the CO₂
// beat, `proof/co2-suisse/crossing-geometry.ts`).

/** Index of the entry in `cxs` closest to `x`. Pure, so it is testable without a DOM — the same
 *  boundary `crossingGeometry`'s own geometry/drawing split draws. */
function nearestIndex(cxs, x) {
  let best = 0;
  let bestDist = Infinity;
  for (let i = 0; i < cxs.length; i++) {
    const d = Math.abs(cxs[i] - x);
    if (d < bestDist) {
      bestDist = d;
      best = i;
    }
  }
  return best;
}

/** Index of the entry closest to `(x, y)` in BOTH axes. Pure, like `nearestIndex`.
 *
 *  WHY THIS EXISTS, AND WHY IT IS NOT THE DEFAULT. `nearestIndex` resolves a pointer by x alone,
 *  which is exactly right for a series: every reading owns a column, and a reader aiming anywhere in
 *  that column means that reading. It is exactly WRONG for a grid — a calendar's twelve months, a
 *  heatmap's rows, a cartogram's tiles all put several marks at the same x, and an x-only answer
 *  picks whichever of them the markup happened to list first. That is not a near miss, it is a
 *  confident wrong answer, which is the worst thing an interactive chart can give.
 *
 *  A beat opts in by putting `data-hit="cell"` on its own `<svg class="chart">`. Nothing already
 *  shipped changes: without the attribute this function is never called. */
function nearestCell(cxs, cys, x, y) {
  let best = 0;
  let bestDist = Infinity;
  for (let i = 0; i < cxs.length; i++) {
    const dx = cxs[i] - x;
    const dy = cys[i] - y;
    const d = dx * dx + dy * dy;
    if (d < bestDist) {
      bestDist = d;
      best = i;
    }
  }
  return best;
}

/** Wires one `<svg class="chart">` — its `.pt` points, its `.hit-area` overlay, and the shared
 *  tooltip element — to hover, tap and keyboard. Every point already carries its own `data-detail`
 *  string and its own `aria-label`; this function never invents either. */
function initChart(svg, tooltip) {
  const points = Array.prototype.slice.call(svg.querySelectorAll(".pt"));
  if (points.length === 0) return;
  /**
   * WHICH SHAPE EACH POINT ANSWERS FOR, AND WHY THE POINT IS NOT ALWAYS THE ANSWER.
   *
   * A `.pt` is a 5px circle at the reading's own position. On a LINE that circle IS the mark, and
   * filling it is the whole of "you are pointing here". On a BAR or a COLUMN it is not: the mark is
   * the rectangle, and a filled circle at its top is a grey dot floating over the chart — which is
   * what this format shipped until the owner looked at the ranking beat and said so.
   *
   * So a component may name the shape its point speaks for: `data-mark-ref="<key>"` on the point,
   * `data-mark="<key>"` on the shape. This layer then carries `.mark-active` between them, and the
   * format's stylesheet keeps such a point invisible (`.pt[data-mark-ref]`) and paints the shape
   * instead, in a colour the BEAT declared and measured (`--mark-active`). Nothing is recomputed
   * here and no colour is named here, exactly as with `data-detail`.
   *
   * Resolved ONCE at init, off attributes baked server-side — the same discipline as `cxs`. A
   * beat that names no shape gets an empty list per point and this costs it nothing.
   */
  const marksOf = points.map(function (point) {
    const key = point.getAttribute("data-mark-ref");
    if (!key) return [];
    return Array.prototype.slice.call(
      svg.querySelectorAll('[data-mark="' + key + '"]'),
    );
  });
  const allMarks = marksOf.reduce(function (into, marks) {
    return into.concat(marks);
  }, []);
  const hitArea = svg.querySelector(".hit-area");
  const cxs = points.map((p) => parseFloat(p.getAttribute("cx")));
  // A mark drawn as a rect carries no cx/cy; a beat in cell mode gives its own marks a `data-cx`
  // and `data-cy` so this layer never has to know what shape they are.
  const cys = points.map((p) =>
    parseFloat(p.getAttribute("cy") ?? p.getAttribute("data-cy") ?? "0"),
  );
  const byCell = svg.getAttribute("data-hit") === "cell";

  function clear() {
    points.forEach((p) => p.classList.remove("pt-active"));
    allMarks.forEach((m) => m.classList.remove("mark-active"));
    tooltip.hidden = true;
  }

  function show(point, clientX, clientY) {
    points.forEach((p) => p.classList.toggle("pt-active", p === point));
    // The shape the active point speaks for takes the class; every other shape gives it back. Two
    // passes and not one, because a shape may be named by more than one point.
    allMarks.forEach((m) => m.classList.remove("mark-active"));
    marksOf[points.indexOf(point)].forEach((m) => m.classList.add("mark-active"));
    tooltip.textContent = point.getAttribute("data-detail");
    tooltip.hidden = false;
    const tw = tooltip.offsetWidth || 160;
    const th = tooltip.offsetHeight || 28;
    const x = Math.min(Math.max(clientX - tw / 2, 8), window.innerWidth - tw - 8);
    const y = Math.max(clientY - th - 14, 8);
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }

  // Hover and tap share one path: pointer events fire for mouse, pen and touch alike, and the
  // nearest-point-by-x overlay means a touch reader does not have to land a tap on a 5px circle —
  // any tap inside the plot resolves to the reading closest to it.
  function fromPointer(evt) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return;
    const svgPoint = svg.createSVGPoint();
    svgPoint.x = evt.clientX;
    svgPoint.y = evt.clientY;
    const local = svgPoint.matrixTransform(ctm.inverse());
    const index = byCell
      ? nearestCell(cxs, cys, local.x, local.y)
      : nearestIndex(cxs, local.x);
    // THE ANSWER SITS ON THE MARK IT NAMES, NOT ON THE POINTER — ON BOTH AXES. The overlay resolves
    // the NEAREST mark, so the pointer is routinely not over it — in the gap between two columns, or
    // anywhere off a wide mark's centre. Anchoring the box to `evt.clientX` therefore drew an answer
    // about one column on top of its neighbour, which reads as a confident wrong answer: the reader
    // believes the box belongs to what it covers. Measured on the ten-column ranking, the box for
    // India sat over the United States.
    //
    // THE SAME ARGUMENT IS TRUE OF `evt.clientY` AND THAT HALF WAS LEFT STANDING, which the owner
    // found on the grouped bar: with the height taken from the pointer, the box floats at whatever
    // height the reader's hand happens to be, i.e. across the MIDDLE of the columns, and on a short
    // mark it lands over its neighbours. Measured on `web-grouped-bar-wind-vs-solar` at 1280x800,
    // pointing at Pologne put the box over Pologne's own wind column in all three directions; at
    // 375x812 it covered Allemagne's and Suède's. The keyboard path never had either half — it has
    // always anchored on the mark's own rect, top included — so this makes the pointer agree with
    // the key on both axes instead of only one, and the box now rises out of the empty space above
    // the mark it names.
    anchorOn(points[index]);
  }

  /** Place the answer on the mark's own rect: centred on its horizontal centre, rising from its
   *  top. Nothing about the pointer enters, which is what keeps the box off the picture. */
  function anchorOn(point) {
    const rect = point.getBoundingClientRect();
    show(point, rect.left + rect.width / 2, rect.top);
  }

  if (hitArea) {
    hitArea.addEventListener("pointermove", fromPointer);
    hitArea.addEventListener("pointerdown", fromPointer);
    hitArea.addEventListener("pointerleave", clear);
  }

  // Keyboard: every point is already `tabIndex={0}` at build time (works with this script absent
  // entirely — see the component's own doc-comment). This layer adds the same detail box that
  // hover shows, plus Left/Right/Home/End to move between readings without leaving focus.
  points.forEach((point, i) => {
    point.addEventListener("focus", function () {
      anchorOn(point);
    });
    point.addEventListener("blur", clear);
    point.addEventListener("keydown", function (evt) {
      let nextIndex = null;
      if (evt.key === "ArrowRight") nextIndex = Math.min(i + 1, points.length - 1);
      else if (evt.key === "ArrowLeft") nextIndex = Math.max(i - 1, 0);
      else if (evt.key === "Home") nextIndex = 0;
      else if (evt.key === "End") nextIndex = points.length - 1;
      else if (evt.key === "Escape") {
        clear();
        point.blur();
        return;
      }
      if (nextIndex !== null && nextIndex !== i) {
        evt.preventDefault();
        points[nextIndex].focus();
      }
    });
  });

  document.addEventListener("pointerdown", function (evt) {
    if (svg.contains(evt.target) || tooltip.contains(evt.target)) return;
    clear();
  });
}

/**
 * THE HOVERABLE LINE. Wires every `.line-hit` in the page — the transparent stroked twin a
 * component draws immediately after a visible path — to hover, tap and keyboard focus.
 *
 * WHY A LINE NEEDS ITS OWN WIRING AT ALL. Every other target in this format is a point or a box, and
 * `initChart` above resolves a pointer to the nearest of them by x. A line has no x: a slope's
 * connector is a diagonal whose bounding box is mostly empty space, and a route's segment doubles
 * back on itself. The reading a line carries is also different in kind — it is what LINKS its two
 * ends (both values, the change between them, the category), which is exactly the thing a
 * per-endpoint tooltip cannot say however many endpoints it answers.
 *
 * `pointer-events: stroke` is the load-bearing property, and it is set in the format's stylesheet
 * rather than here: it makes the STROKE the hit region instead of the bounding box. The twin is
 * transparent and generously wide (`LINE_HIT_WIDTH` in the component that draws it), so the reader
 * aims at the line they can see and hits a target twice the touch-target floor.
 *
 * This function never invents a reading: it reads back the `data-detail` string the component baked
 * server-side from the beat's own frozen data, into the same `#tooltip` every other mode uses.
 */
function initLines(root, tooltip) {
  const lines = Array.prototype.slice.call(root.querySelectorAll(".line-hit"));
  if (lines.length === 0) return;

  // WHY A LINE IS RESOLVED BY NEAREST AND NOT BY WHICHEVER TWIN CAUGHT THE EVENT. The twin is
  // deliberately wide, so on a chart whose lines converge it covers its neighbours, and the one the
  // browser hands the event to is simply the last in document order. Measured on the slope beat at
  // 375 x 812 before this existed: 21 of 60 probes taken ON a line's own stroke were answered by a
  // DIFFERENT line — "pointing 50% along Switzerland answered with Spain". Same shape as the
  // nearest-by-x rule `initChart` already applies to points, in the coordinate a line actually has:
  // distance to the stroke. Sampled rather than solved, because a `<path>` may be any shape and
  // `getPointAtLength` is the only thing that knows.
  const SAMPLES = 48;
  let cache = null;
  function samples() {
    const key = window.innerWidth + "x" + window.innerHeight;
    if (cache && cache.key === key) return cache.points;
    const points = lines.map(function (line) {
      const total = line.getTotalLength ? line.getTotalLength() : 0;
      const m = line.getScreenCTM();
      const out = [];
      if (!total || !m) return out;
      for (let i = 0; i <= SAMPLES; i++) {
        const p = line.getPointAtLength((total * i) / SAMPLES);
        out.push({
          x: p.x * m.a + p.y * m.c + m.e,
          y: p.x * m.b + p.y * m.d + m.f,
        });
      }
      return out;
    });
    cache = { key: key, points: points };
    return points;
  }

  function nearest(clientX, clientY) {
    const points = samples();
    let best = null;
    let bestDist = Infinity;
    for (let i = 0; i < lines.length; i++)
      for (const p of points[i]) {
        const d = (p.x - clientX) * (p.x - clientX) + (p.y - clientY) * (p.y - clientY);
        if (d < bestDist) {
          bestDist = d;
          best = lines[i];
        }
      }
    return best;
  }

  function clear() {
    lines.forEach(function (l) {
      l.classList.remove("line-active");
    });
    tooltip.hidden = true;
  }

  function show(line, clientX, clientY) {
    lines.forEach(function (l) {
      l.classList.toggle("line-active", l === line);
    });
    tooltip.textContent = line.getAttribute("data-detail");
    tooltip.hidden = false;
    const tw = tooltip.offsetWidth || 160;
    const th = tooltip.offsetHeight || 28;
    const x = Math.min(
      Math.max(clientX - tw / 2, 8),
      window.innerWidth - tw - 8,
    );
    const y = Math.max(clientY - th - 14, 8);
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }

  function fromPointer(evt) {
    const line = nearest(evt.clientX, evt.clientY);
    if (line) show(line, evt.clientX, evt.clientY);
  }

  lines.forEach(function (line) {
    line.addEventListener("pointerenter", fromPointer);
    line.addEventListener("pointermove", fromPointer);
    line.addEventListener("pointerdown", fromPointer);
    line.addEventListener("pointerleave", clear);
    // Keyboard parity: the twin is focusable at build time, so Tab reaches every line and its
    // `aria-label` is read with this script absent. Focus is unambiguous about which line was
    // addressed, so it never goes through `nearest`.
    line.addEventListener("focus", function () {
      const r = line.getBoundingClientRect();
      show(
        line,
        Math.round(r.left + r.width / 2),
        Math.round(r.top + r.height / 2),
      );
    });
    line.addEventListener("blur", clear);
  });

  document.addEventListener("pointerdown", function (evt) {
    if (evt.target && evt.target.closest && evt.target.closest(".line-hit"))
      return;
    if (tooltip.contains(evt.target)) return;
    clear();
  });
}

/**
 * THE ENTRANCE TRIGGER — the whole of this format's entrance that is script, and it is one class.
 *
 * WHAT IT DOES NOT DO, which is the point. It writes no opacity, no transform and no length. Every
 * number the entrance uses was computed server-side from the beat's own geometry and the entrance
 * contract (`assets/entrance.ts`) and written on the elements as custom properties; the keyframes
 * and the delays live in the stylesheet, inside `@media (prefers-reduced-motion: no-preference)`.
 * This function's entire job is to say WHEN, once, per figure.
 *
 * WHY AN OBSERVER AND NOT `DOMContentLoaded`. This format's delivery model is an embed: a CMS drops
 * the file into an article and the figure may sit two screens below the fold. An entrance that
 * plays on load plays to nobody, and a reader who scrolls to it finds a finished chart with a
 * two-second build they never saw — strictly worse than never having animated it. So the trigger is
 * the figure ENTERING THE READER'S VIEW.
 *
 * THE MARGIN IS A FRACTION OF THE WINDOW, NOT OF THE FIGURE, and that is deliberate: a
 * `threshold: 0.35` never fires for a figure taller than the viewport, which on a phone is most of
 * them. `rootMargin: "0px 0px -15% 0px"` shrinks the observed region by 15 % of the window's own
 * height instead, so the entrance starts once the figure's top has come a sixth of the way up the
 * screen — reachable at every figure height there is.
 *
 * ONCE, AND THEN NEVER AGAIN: `unobserve` on the first intersection. A graphic that rebuilt itself
 * every time it scrolled past would be decoration, and the contract has no loop in it.
 *
 * NO OBSERVER AT ALL (an engine without `IntersectionObserver`): the class goes on immediately. The
 * entrance plays on load, which is the behaviour this function exists to improve on but is still
 * strictly better than a figure that never gets its class and — with `animation-fill-mode:
 * backwards` scoped to `.entered` — is complete either way. It is never the settled page that is at
 * risk here; only when the build runs.
 *
 * A figure whose beat declared no layers gets no observer: the query below finds nothing to watch.
 * Inert in a page that did not ask for it, exactly as `initLines` above is inert in a page with no
 * `.line-hit` — the shape this file already had.
 */
function initEntrance(root) {
  const figures = Array.prototype.slice
    .call(root.querySelectorAll(".chart-figure"))
    .filter(function (figure) {
      return figure.querySelector("[data-entrance-motion]") !== null;
    });
  if (figures.length === 0) return;

  if (typeof IntersectionObserver === "undefined") {
    figures.forEach(function (figure) {
      figure.classList.add("entered");
    });
    return;
  }

  const observer = new IntersectionObserver(
    function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add("entered");
        observer.unobserve(entry.target);
      });
    },
    { threshold: 0, rootMargin: "0px 0px -15% 0px" },
  );
  figures.forEach(function (figure) {
    observer.observe(figure);
  });
}

function initAll() {
  const tooltip = document.getElementById("tooltip");
  if (!tooltip) return;
  document.querySelectorAll("svg.chart").forEach(function (svg) {
    initChart(svg, tooltip);
    initLines(svg, tooltip);
  });
  initEntrance(document);
}

// Guarded rather than a bare top-level call: this file is also imported directly by
// `test/render-web.test.ts` (for the pure `nearestIndex` helper), in a context with no `document`.
// In the browser the guard is always true, so the inlined `<script>` still self-starts the moment
// it is parsed, unchanged.
if (typeof document !== "undefined") initAll();

</script>
</body>
</html>
