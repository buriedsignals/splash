<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Seize petits panneaux, un par pays européen : part de l’électricité bas-carbone en 2000 et en 2024, tous dessinés sur la même échelle de 0 à 100 %. Les seize ont progressé. Danemark gagne le plus, +74 points depuis 15,5 % ; Suède le moins, +2 depuis 96,7 %. Les pays partis de plus bas sont ceux qui ont le plus avancé."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LES SEIZE ONT TOUS</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PROGRESSÉ — ET</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">CEUX QUI PARTAIENT</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DE PLUS BAS ONT LE</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">PLUS AVANCÉ</text><text x="56" y="309.9970399800781" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Part de l’électricité bas-carbone — renouvelables et nucléaire réunis — en</text><text x="56" y="328.1228163472656" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">2000 et en 2024, un panneau par pays, tous à la même échelle.</text><text x="56" y="346.24859271445314" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Danemark gagne le plus, +74 points depuis 15,5 % ; Suède le moins, +2,</text><text x="56" y="364.3743690816406" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">en partant de 96,7 %.</text><text x="56" y="811.7475872656249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE PANNEAU EST UN PAYS, DESSINÉ SUR LA</text><text x="56" y="825.747802265625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">MÊME ÉCHELLE DE 0 À 100 % QUE LES QUINZE AUTRES — C’EST</text><text x="56" y="839.748017265625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">CE QUI REND LES PANNEAUX COMPARABLES. LE NOMBRE SOUS</text><text x="56" y="853.7482322656249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">CHAQUE PAIRE EST L’ÉCART, EN POINTS.</text><text x="56" y="885.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">(2025), via Our World in Data</text><g><g><rect x="56" y="384.5001454488281" width="5.6000000000000005" height="5.6000000000000005" fill="#295f73"></rect><text x="67.6" y="390.10014544882813" font-family="Montserrat" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.8" fill="#618997">2000</text></g><g><rect x="116.66000083982945" y="384.5001454488281" width="5.6000000000000005" height="5.6000000000000005" fill="#4FE0C0"></rect><text x="128.26000083982