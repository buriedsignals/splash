<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Seize petits panneaux, un par pays européen : part de l’électricité bas-carbone en 2000 et en 2024, tous dessinés sur la même échelle de 0 à 100 %. Les seize ont progressé. Danemark gagne le plus, +74 points depuis 15,5 % ; Suède le moins, +2 depuis 96,7 %. Les pays partis de plus bas sont ceux qui ont le plus avancé."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Les seize ont tous progressé</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">— et ceux qui partaient de</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">plus bas ont le plus avancé</text><text x="52" y="219.9053924521875" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Part de l’électricité bas-carbone — renouvelables et nucléaire réunis —</text><text x="52" y="238.7561998740625" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">en 2000 et en 2024, un panneau par pays, tous à la même échelle.</text><text x="52" y="257.6070072959375" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Danemark gagne le plus, +74 points depuis 15,5 % ; Suède le moins, +2,</text><text x="52" y="276.4578147178125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">en partant de 96,7 %.</text><text x="52" y="815.6965677562501" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque panneau est un pays, dessiné sur la même échelle de</text><text x="52" y="833.8971735562501" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">0 à 100 % que les quinze autres — c’est ce qui rend les panneaux</text><text x="52" y="852.0977793562502" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">comparables. Le nombre sous chaque paire est l’écart, en points.</text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">(2025), via Our World in Data</text><g><g><rect x="52" y="297.3086221396875" width="7.826000976562501" height="7.826000976562501" fill="#a7bdd9"></rect><text x="65.8260009765625" y="305.13462311625" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#687587">2000</text></g><g><rect x="114.1508406996727" y="297.3086221396875" width="7.826000976562501" height="7.826000976562501" fill="#1757B6"></rect><text x="127.9768416762352" y="305.13462311625" font-family="Merriweather" font-size="13" font-weight="700" font-style="italic" letter-spacing="0" fill="#1755b2">2024</text></g><text x="488" y="305.13462311625" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">part bas-carbone, 0–100 %</text></g><g><text x="106.5" y="328.38363434671874" text-anchor="middle" font-family="Merriweather" font-siz