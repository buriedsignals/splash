<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Seize petits panneaux, un par pays européen : part de l’électricité bas-carbone en 2000 et en 2024, tous dessinés sur la même échelle de 0 à 100 %. Les seize ont progressé. Danemark gagne le plus, +74 points depuis 15,5 % ; Suède le moins, +2 depuis 96,7 %. Les pays partis de plus bas sont ceux qui ont le plus avancé."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Les seize ont tous progressé — et ceux qui partaient de plus bas</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">ont le plus avancé</text><text x="46" y="166.03308223926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Part de l’électricité bas-carbone — renouvelables et nucléaire réunis — en 2000 et en 2024, un panneau par pays, tous à la même échelle.</text><text x="46" y="184.88242573926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Danemark gagne le plus, +74 points depuis 15,5 % ; Suède le moins, +2, en partant de 96,7 %.</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><g><rect x="46" y="205.73176923926093" width="5.7109375" height="5.7109375" fill="#aac1d3"></rect><text x="57.7109375" y="211.44270673926093" font-family="Ope