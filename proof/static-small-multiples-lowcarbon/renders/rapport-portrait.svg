<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Seize petits panneaux, un par pays européen : part de l’électricité bas-carbone en 2000 et en 2024, tous dessinés sur la même échelle de 0 à 100 %. Les seize ont progressé. Danemark gagne le plus, +74 points depuis 15,5 % ; Suède le moins, +2 depuis 96,7 %. Les pays partis de plus bas sont ceux qui ont le plus avancé."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Les seize ont tous progressé — et</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">ceux qui partaient de plus bas ont</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">le plus avancé</text><text x="46" y="198.97427563926092" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Part de l’électricité bas-carbone — renouvelables et nucléaire réunis —</text><text x="46" y="217.82361913926093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">en 2000 et en 2024, un panneau par pays, tous à la même échelle.</text><text x="46" y="236.6729626392609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Danemark gagne le plus, +74 points depuis 15,5 % ; Suède le moins, +2,</text><text x="46" y="255.5223061392609" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">en partant de 96,7 %.</text><text x="46" y="820.303422375" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE PANNEAU EST UN PAYS, DESSINÉ SUR LA MÊME</text><text x="46" y="834.3028950312499" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">ÉCHELLE DE 0 À 100 % QUE LES QUINZE AUTRES — C’EST CE QUI REND LES</text><text x="46" y="848.3023676875" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">PANNEAUX COMPARABLES. LE NOMBRE SOUS CHAQUE PAIRE EST L’ÉCART,</text><text x="46" y="862.30184034375" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">EN POINTS.</text><text x="46" y="895.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="46" y="914" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">(2025), via Our World in Data</text><g><g><rect x="46" y="276.3716496392609" width="5.7109375" height="5.7109375" fill="#aac1d3"></rect><text x="57.7109375" y="282.0825871392609" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#697883">2000</text></g><g><rect x="102.4048828125" y="276.3716496392609" width="5.7109375" height="5.7109375" fill="#1F5C8B"></rect><text x="114.1158203125" y="282.0825871392609" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">2024</text></g><text x="494" y="282.0825871392609" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">part bas-carbon