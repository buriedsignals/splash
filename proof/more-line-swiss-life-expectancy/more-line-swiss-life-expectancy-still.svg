<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Line chart of life expectancy at birth in Switzerland, 1950 to 2023. The line rises from 68.9 years in 1950 to 84.0 years in 2023, a gain of 15.0 years, first crossing 80 years in 2001. Two small real dips interrupt the climb around 2020 and 2022, the COVID-19 era.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="138" fill="#000000" font-size="53" font-weight="700">Life expectancy in Switzerland rose by 15.0 years between 1950 and</text><text x="85" y="204" fill="#000000" font-size="53" font-weight="700">2023, from 68.9 to 84.0, crossing 80 in 2001.</text><text x="85" y="995" fill="#616161" font-size="31">Source: UN, World Population Prospects (2024), via Our World in Data · Switzerland, 1950–2023, extracted 8 August 2026</text><g><line x1="217.18017578125" x2="1449.17431640625" y1="801.375" y2="801.375" stroke="#d1d1d1" stroke-width="1"></line><text x="195.18017578125" y="810.375" fill="#616161" font-size="29" text-anchor="end">70</text></g><g><line x1="217.18017578125" x2="1449.17431640625" y1="614.8125" y2="614.8125" stroke="#d1d1d1" stroke-width="1"></line><text x="195.18017578125" y="623.8125" fill="#616161" font-size="29" text-anchor="end">75</text></g><g><line x1="217.18017578125" x2="1449.17431640625" y1="428.25" y2="428.25" stroke="#d1d1d1" stroke-width="1"></line><text x="195.18017578125" y="437.25" fill="#616161" font-size="29" text-anchor="end">80 years</text></g><text x="217.18017578125" y="929" fill="#616161" font-size="29" text-anchor="middle">1950</text><text x="385.94649641481163" y="929" fill="#616161" font-size="29" text-anchor="middle">1960</text><text x="554.7128170483733" y="929" fill="#616161" font-size="29" text-anchor="middle">1970</text><text x="723.479137681935" y="929" fill="#616161" font-size="29" text-anchor="middle">1980</text><text x="892.24545831