<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · SUISSE</text><text x="52" y="101" font-family="Georgia" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La moitié du CO₂ suisse depuis 1858 a été émise après</text><text x="52" y="137.6" font-family="Georgia" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">1986 — en 38 ans sur 167</text><text x="52" y="184.6" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les 38 années qui suivent 1986 en portent 49,9 %, les 129 précédentes 50,1</text><text x="52" y="203.45" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">% — les deux surfaces teintées sont de même taille. La hauteur, elle, ne dit que le débit d’une année : 46,2 Mt au pic de 1973, 32,1 Mt en 2024.</text><text x="52" y="243.28179931640625" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">millions de tonnes de CO₂ par an</text><g><line x1="72.25799989104272" x2="908" y1="409.59699462890626" y2="409.59699462890626" stroke="#403f3c" stroke-width="1"></line><text x="66.25799989104272" y="413.52399658203126" text-anchor="end" font-family="Helvetica Neue" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">0</text></g><g><line x1="72.25799989104272" x2="908" y1="330.31691624413725" y2="330.31691624413725" stroke="#e0ded1" stroke-width="0.6"></line><text x="66.25799989104272" y="334.24391819726225" text-anchor="end" font-family="Helvetica Neue" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">25</text></g><g><line x1="72.25799989104272" x2="908" y1="266.89285353632215" y2="266.89285353632215" stroke="#e0ded1" stroke-width="0.6"></line><text x="66.25799989104272" y="270.81985548944715" text-anchor="end" font-family="Helvetica Neue" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">45</text></g><path d="M 72.3 409.6 L 72.3 409.1 L 77.3 408.9 L 82.3 408.6 L 87.4 408.2 L 92.4 408.1 L 97.4 408.1 L 102.5 407.8 L 107.5 407.4 L 112.5 407.4 L 117.6 407.5 L 122.6 407.2 L 127.6 407.2 L 132.7 406.8 L 137.7 406.1 L 142.7 405.6 L 147.8 405.7 L 152.8 405.9 L 157.8 405.5 L 162.9 404.9 L 167.9 405.1 L 172.9 405.3 L 178.0 405.0 L 183.0 404.3 L 188.1 404.6 L 193.1 404.1 L 198.1 403.5 L 203.2 403.4 L 208.2 403.1 L 213.2 403.0 L 218.3 402.4 L 223.3 402.3 L 228.3 401.5 L 233.4 400.5 L 238.4 398.4 L 243.4 398.6 L 248.5 400.5 L 253.5 398.2 L 258.5 397.4 L 263.6 396.2 L 268.6 395.5 L 273.6 394.5 L 278.7 393.4 L 283.7 391.6 L 288.7 393.2 L 293.8 393.0 L 298.8 391.6 L 303.8 390.7 L 308.9 389.8 L 313.9 387.7 L 319.0 384.2 L 324.0 384.2 L 329.0 384.0 L 334.1 384.9 L 339.1 382.3 L 344.1 381.8 L 349.2 380.3 L 354.2 382.9 L 359.2 381.3 L 364.3 382.7 L 369.3 390.2 L 374.3 391.4 L 379.4 395.0 L 384.4 386.7 L 389.4 395.4 L 394.5 390.1 L 399.5 385.3 L 404.5 386.7 L 409.6 385.7 L 414.6 386.0 L 419.6 382.3 L 424.7 381.2 L 429.7 377.0 L 434.7 379.3 L 439.8 377.6 L 444.8 377.2 L 449.9 379.3 L 454.9 379.3 L 459.9 379.5 L 465.0 378.1 L 470.0 376.4 L 475.0 376.4 L 480.1 372.0 L 485.1 383.2 L 490.1 388.6 L 495.2 391.1 L 500.2 390.0 L 505.2 