666102765" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#fffcee">1987–2024 · 49,9 %</text><g><circle cx="908" cy="320.0015464659881" r="2.4" fill="#FFFCEE"></circle><text x="908" y="339.7095542784881" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#fffcee">32,1 Mt</text></g><text x="72.3775390625" y="424.93725722141437" text-anchor="start" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1858</text><text x="157.95333325489457" y="424.93725722141437" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1875</text><text x="283.8000894201807" y="424.93725722141437" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1900</text><text x="409.6468455854669" y="424.93725722141437" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1925</text><text x="535.493601750753" y="424.93725722141437" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1950</text><text x="661.3403579160391" y="424.93725722141437" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1975</text><text x="787.1871140813253" y="424.93725722141437" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000</text><text x="908" y="424.93725722141437" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2024</text><text x="52" y="449.0635060359375" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : la hauteur est le débit d’une année, l’aire est le stock accumulé. C’est tout ce qu’une aire dit de plus qu’une courbe — et elle ne le</text><text x="52" y="467.2641118359375" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">dit que si la base est à zéro.</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Global Carbon Budget 2025, via Our World in Data · émissions territoriales</text></svg>