la hauteur est le débit d’une année, l’aire est le stock accumulé. C’est tout ce qu’une aire dit de plus qu’une</text><text x="52" y="467.265" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">courbe — et elle ne le dit que si la base est à zéro.</text><text x="52" y="488" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Global Carbon Budget 2025, via Our World in Data · émissions territoriales</text></svg>