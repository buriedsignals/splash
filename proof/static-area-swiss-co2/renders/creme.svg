<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · SUISSE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La moitié du CO₂ suisse depuis 1858 a été émise après 1986</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">— en 38 ans sur 167</text><text x="52" y="184.6028870835547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les 38 années qui suivent 1986 en portent 49,9 %, les 129 précédentes</text><text x="52" y="203.4536945054297" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">50,1 % — les deux surfaces teintées sont de même taille. La hauteur, elle, ne dit que le débit d’une année : 46,2 Mt au pic de 1973, 32,1 Mt en</text><text x="52" y="222.3045019273047" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">2024.</text><text x="52" y="261.96758191498157" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">millions de tonnes de CO₂ par an</text><g><line x1="72.3775390625" x2="908" y1="409.08471815891437" y2="409.08471815891437" stroke="#403f3c" stroke-width="1"></line><text x="66.3775390625" y="413.01098769016437" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">0</text></g><g><line x1="72.3775390625" x2="848.9580078125" y1="339.64409802346177" y2="339.64409802346177" stroke="#e0ded1" stroke-width="0.6"></line><text x="66.3775390625" y="343.57036755471177" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">25</text></g><g><line x1="72.3775390625" x2="908" y1="284.09160191509966" y2="284.09160191509966" stroke="#e0ded1" stroke-width="0.6"></line><text x="66.3775390625" y="288.01787144634966" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">45</text></g><path d="M 72.4 409.1 L 72.4 408.7 L 77.4 408.5 L 82.4 408.2 L 87.5 407.9 L 92.5 407.8 L 97.5 407.8 L 102.6 407.5 L 107.6 407.2 L 112.6 407.2 L 117.7 407.2 L 122.7 406.9 L 127.8 407.0 L 132.8 406.6 L 137.8 406.0 L 142.9 405.5 L 147.9 405.6 L 152.9 405.8 L 158.0 405.5 L 163.0 404.9 L 168.0 405.1 L 173.1 405.3 L 178.1 405.1 L 183.1 404.4 L 188.2 404.7 L 193.2 404.3 L 198.2 403.8 L 203.3 403.6 L 208.3 403.4 L 213.3 403.3 L 218.4 402.8 L 223.4 402.7 L 228.4 402.0 L 233.5 401.1 L 238.5 399.3 L 243.5 399.4 L 248.6 401.1 L 253.6 399.1 L 258.6 398.4 L 263.7 397.4 L 268.7 396.7 L 273.7 395.9 L 278.8 394.9 L 283.8 393.3 L 288.8 394.7 L 293.9 394.5 L 298.9 393.3 L 303.9 392.5 L 309.0 391.8 L 314.0 389.9 L 319.0 386.9 L 324.1 386.8 L 329.1 386.7 L 334.1 387.4 L 339.2 385.2 L 344.2 384.8 L 349.2 383.4 L 354.3 385.7 L 359.3 384.3 L 364.3 385.5 L 369.4 392.1 L 374.4 393.1 L 379.4 396.3 L 384.5 389.0 L 389.5 396.7 L 394.5 392.0 L 399.6 387.8 L 404.6 389.0 L 409.6 388.2 L 414.7 388.4 L 419.7 385.2 L 424.7 384.2 L 429.8 380.6 L 434.8 382.5 L 439.9 381.0