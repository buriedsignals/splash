<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · SUISSE</text><text x="46" y="91.05" font-family="Georgia" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La moitié du CO₂ suisse depuis 1858 a été émise après 1986 —</text><text x="46" y="123.99" font-family="Georgia" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">en 38 ans sur 167</text><text x="46" y="167.33" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les 38 années qui suivent 1986 en portent 49,9 %, les</text><text x="46" y="186.18" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">129 précédentes 50,1 % — les deux surfaces teintées sont de même taille. La hauteur, elle, ne dit que le débit d’une</text><text x="46" y="205.03" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">année : 46,2 Mt au pic de 1973, 32,1 Mt en 2024.</text><text x="46" y="238.0559765625" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">MILLIONS DE TONNES DE CO₂ PAR AN</text><g><line x1="66.21500054001808" x2="914" y1="425.0319982910156" y2=