6" y="459.265" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : LA HAUTEUR EST LE DÉBIT D’UNE ANNÉE, L’AIRE EST LE STOCK ACCUMULÉ. C’EST TOUT CE QU’UNE AIRE DIT DE PLUS QU’UNE</text><text x="46" y="473.265" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">COURBE — ET ELLE NE LE DIT QUE SI LA BASE EST À ZÉRO.</text><text x="46" y="494" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Global Carbon Budget 2025, via Our World in Data · émissions territoriales</text></svg>