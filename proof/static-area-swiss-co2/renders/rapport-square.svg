<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="540" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · SUISSE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La moitié du CO₂ suisse depuis</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">1858 a été émise après 1986 — en</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">38 ans sur 167</text><text x="46" y="200.27299540641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les 38</text><text x="46" y="219.12233890641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">années qui suivent 1986 en portent 49,9 %, les 129 précédentes 50,1 % —</text><text x="46" y="237.97168240641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">les deux surfaces teintées sont de même taille. La hauteur, elle, ne dit</text><text x="46" y="256.8210259064109" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">que le débit d’une année : 46,2 Mt au pic de 1973, 32,1 Mt en 2024.</text><text x="46" y="289.9732777618797" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">MILLIONS DE TONNES DE CO₂ PAR AN</text><g><line x1="66.4453125" x2="494" y1="391.7833833042969" y2="391.7833833042969" stroke="#404040" stroke-width="1"></line><text x="60.4453125" y="395.7096528355469" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">0</text></g><g><line x1="66.4453125" x2="435.727783203125" y1="344.4861505354499" y2="344.4861505354499" stroke="#e0e0e0" stroke-width="0.6"></line><text x="60.4453125" y="348.4124200666999" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">25</text></g><g><line x1="66.4453125" x2="494" y1="306.64836432037225" y2="306.64836432037225" stroke="#e0e0e0" stroke-width="0.6"></line><text x="60.4453125" y="310.57463385162225" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">45</text></g><path d="M 66.4 391.8 L 66.4 391.5 L 69.0 391.4 L 71.6 391.2 L 74.2 391.0 L 76.7 390.9 L 79.3 390.9 L 81.9 390.7 L 84.5 390.5 L 87.1 390.5 L 89.6 390.5 L 92.2 390.3 L 94.8 390.4 L 97.4 390.1 L 99.9 389.7 L 102.5 389.4 L 105.1 389.4 L 107.7 389.6 L 110.2 389.4 L 112.8 389.0 L 115.4 389.1 L 118.0 389.2 L 120.5 389.0 L 123.1 388.6 L 125.7 388.8 L 128.3 388.5 L 130.8 388.2 L 133.4 388.1 L 136.0 387.9 L 138.6 387.8 L 141.1 387.5 L 143.7 387.4 L 146.3 387.0 L 148.9 386.3 L 151.4 385.1 L 154.0 385.2 L 156.6 386.3 L 159.2 385.0 L 161.7 384.5 L 164.3 383.8 L 166.9 383.4 L 169.5 382.8 L 172.0 382.1 L 174.6 381.0 L 177.2 382.0 L 179.8 381.9 L 182.3 381.1 L 184.9 380.5 L 187.5 380.0 L 190.1 378.7 L 192.7 376.7 L 195.2 376.6 L 197.8 376.5 L 200.4 377