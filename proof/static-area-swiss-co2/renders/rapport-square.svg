TURE : LA HAUTEUR EST LE DÉBIT D’UNE ANNÉE, L’AIRE EST LE STOCK</text><text x="46" y="440.41690599375005" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">ACCUMULÉ. C’EST TOUT CE QU’UNE AIRE DIT DE PLUS QU’UNE COURBE —</text><text x="46" y="454.41637865" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">ET ELLE NE LE DIT QUE SI LA BASE EST À ZÉRO.</text><text x="46" y="475.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Global Carbon Budget 2025, via Our World in Data · émissions</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">territoriales</text></svg>