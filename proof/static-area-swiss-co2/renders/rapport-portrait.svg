<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · SUISSE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La moitié du CO₂ suisse depuis</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">1858 a été émise après 1986 — en</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">38 ans sur 167</text><text x="46" y="200.27299540641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les 38</text><text x="46" y="219.12233890641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">années qui suivent 1986 en portent 49,9 %, les 129 précédentes 50,1 % —</text><text x="46" y="237.97168240641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">les deux surfaces teintées sont de même taille. La hauteur, elle, ne dit</text><text x="46" y="256.8210259064109" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">que le débit d’une année : 46,2 Mt au pic de 1973, 32,1 Mt en 2024.</text><text x="46" y="289.9732777618797" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">MILLIONS DE TONNES DE CO₂ PAR AN</text><g><line x1="66.4453125" x2="494" y1="811.7833833042968" y2="811.7833833042968" stroke="#404040" stroke-width="1"></line><text x="60.4453125" y="815.7096528355468" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">0</text></g><g><line x1="66.4453125" x2="494" y1="554.0708479611304" y2="554.0708479611304" stroke="#e0e0e0" stroke-width="0.6"></line><text x="60.4453125" y="557.9971174923804" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">25</text></g><g><line x1="66.4453125" x2="494" y1="347.90081968659734" y2="347.90081968659734" stroke="#e0e0e0" stroke-width="0.6"></line><text x="60.4453125" y="351.82708921784734" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">45</text></g><path d="M 66.4 811.8 L 66.4 810.3 L 69.0 809.7 L 71.6 808.6 L 74.2 807.4 L 76.7 806.9 L 79.3 806.9 L 81.9 805.9 L 84.5 804.6 L 87.1 804.7 L 89.6 804.8 L 92.2 803.9 L 94.8 804.1 L 97.4 802.5 L 99.9 800.3 L 102.5 798.6 L 105.1 799.0 L 107.7 799.7 L 110.2 798.6 L 112.8 796.4 L 115.4 797.2 L 118.0 797.8 L 120.5 796.9 L 123.1 794.6 L 125.7 795.7 L 128.3 794.0 L 130.8 792.1 L 133.4 791.5 L 136.0 790.7 L 138.6 790.3 L 141.1 788.5 L 143.7 788.0 L 146.3 785.6 L 148.9 782.1 L 151.4 775.5 L 154.0 776.0 L 156.6 782.1 L 159.2 774.8 L 161.7 772.1 L 164.3 768.4 L 166.9 766.0 L 169.5 762.8 L 172.0 759.0 L 174.6 753.3 L 177.2 758.3 L 179.8 757.8 L 182.3 753.3 L 184.9 750.3 L 187.5 747.5 L 190.1 740.7 L 192.7 729.3 L 195.2 729.3 L 197.8 728.6 L 200.4 731.5 L 203.0 72