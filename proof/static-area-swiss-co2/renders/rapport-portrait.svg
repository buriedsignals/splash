<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">CLIMAT · SUISSE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">La moitié du CO₂ suisse depuis</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">1858 a été émise après 1986 — en</text><text x="46" y="156.93261919746095" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">38 ans sur 167</text><text x="46" y="200.27299540641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les 38</text><text x="46" y="219.12233890641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">années qui suivent 1986 en portent 49,9 %, les 129 précédentes 50,1 % —</text><text x="46" y="237.97168240641093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">les deux surfaces teintées sont de même taille. La hauteur, elle, ne dit</text><text x="46" y="256.8210259064109" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">que le débit d’une année : 46,2 Mt au pic de 1973, 32,1 Mt en 2024.</text><text x="46" y="333.3998149080882" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">MILLIONS DE TONNES DE CO₂ PAR AN</text><g><line x1="66.4453125" x2="494" y1="768.3568461580883" y2="768.3568461580883" stroke="#404040" stroke-width="1"></line><text x="60.4453125" y="772.2831156893383" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">0</text></g><g><line x1="66.4453125" x2="494" y1="554.1567296405142" y2="554.1567296405142" stroke="#e0e0e0" stroke-width="0.6"></line><text x="60.4453125" y="558.0829991717642" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">25</text></g><g><line x1="66.4453125" x2="494" y1="382.79663642645505" y2="382.79663642645505" stroke="#e0e0e0" stroke-width="0.6"></line><text x="60.4453125" y="386.72290595770505" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#5f5f5f">45</text></g><path d="M 66.4 768.4 L 66.4 767.1 L 69.0 766.6 L 71.6 765.8 L 74.2 764.7 L 76.7 764.3 L 79.3 764.3 L 81.9 763.5 L 84.5 762.4 L 87.1 762.5 L 89.6 762.6 L 92.2 761.8 L 94.8 762.0 L 97.4 760.7 L 99.9 758.8 L 102.5 757.4 L 105.1 757.7 L 107.7 758.3 L 110.2 757.4 L 112.8 755.5 L 115.4 756.2 L 118.0 756.7 L 120.5 756.0 L 123.1 754.0 L 125.7 755.0 L 128.3 753.5 L 130.8 752.0 L 133.4 751.5 L 136.0 750.8 L 138.6 750.5 L 141.1 749.0 L 143.7 748.6 L 146.3 746.6 L 148.9 743.7 L 151.4 738.2 L 154.0 738.6 L 156.6 743.7 L 159.2 737.7 L 161.7 735.4 L 164.3 732.3 L 166.9 730.3 L 169.5 727.7 L 172.0 724.5 L 174.6 719.7 L 177.2 723.9 L 179.8 723.5 L 182.3 719.8 L 184.9 717.3 L 187.5 714.9 L 190.1 709.3 L 192.7 699.8 L 195.2 699.8 L 197.8 699.2 L 200.4 701.6 L 203.0 69