<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · SUISSE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La moitié du CO₂ suisse</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">depuis 1858 a été émise après</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">1986 — en 38 ans sur 167</text><text x="52" y="221.2042130835547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les</text><text x="52" y="240.0550205054297" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">38 années qui suivent 1986 en portent 49,9 %, les 129 précédentes 50,1</text><text x="52" y="258.9058279273047" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">% — les deux surfaces teintées sont de même taille. La hauteur, elle, ne</text><text x="52" y="277.7566353491797" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">dit que le débit d’une année : 46,2 Mt au pic de 1973, 32,1 Mt en 2024.</text><text x="52" y="317.41971533685654" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">millions de tonnes de CO₂ par an</text><g><line x1="72.3775390625" x2="488" y1="792.0333049370394" y2="792.0333049370394" stroke="#403f3c" stroke-width="1"></line><text x="66.3775390625" y="795.9595744682894" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">0</text></g><g><line x1="72.3775390625" x2="488" y1="558.5206245040348" y2="558.5206245040348" stroke="#e0ded1" stroke-width="0.6"></line><text x="66.3775390625" y="562.4468940352848" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">25</text></g><g><line x1="72.3775390625" x2="488" y1="371.7104801576311" y2="371.7104801576311" stroke="#e0ded1" stroke-width="0.6"></line><text x="66.3775390625" y="375.6367496888811" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">45</text></g><path d="M 72.4 792.0 L 72.4 790.7 L 74.9 790.1 L 77.4 789.2 L 79.9 788.1 L 82.4 787.7 L 84.9 787.7 L 87.4 786.7 L 89.9 785.5 L 92.4 785.6 L 94.9 785.7 L 97.4 784.8 L 99.9 785.1 L 102.4 783.6 L 104.9 781.7 L 107.4 780.1 L 109.9 780.5 L 112.4 781.1 L 114.9 780.1 L 117.4 778.1 L 119.9 778.8 L 122.5 779.4 L 125.0 778.5 L 127.5 776.4 L 130.0 777.4 L 132.5 775.9 L 135.0 774.2 L 137.5 773.7 L 140.0 772.9 L 142.5 772.6 L 145.0 771.0 L 147.5 770.5 L 150.0 768.3 L 152.5 765.2 L 155.0 759.1 L 157.5 759.6 L 160.0 765.2 L 162.5 758.6 L 165.0 756.1 L 167.5 752.7 L 170.0 750.6 L 172.5 747.7 L 175.0 744.2 L 177.5 739.0 L 180.0 743.6 L 182.5 743.1 L 185.0 739.1 L 187.6 736.4 L 190.1 733.8 L 192.6 727.6 L 195.1 717.3 L 197.6 717.3 L 200.1 716.7 L 202.6 719.3 L 205.1 