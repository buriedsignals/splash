r-spacing="0" fill="#000000">1986</text><text x="227.61002447289155" y="751.3288515045908" text-anchor="middle" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#000000">1858–1986 · 50,1 %</text><g><circle cx="488" cy="499.6710758611821" r="2.4" fill="#1755b2"></circle><text x="488" y="374.9250784508617" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#1755b2">32,1 Mt</text></g><text x="72.3775390625" y="782.6452845510105" text-anchor="start" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1858</text><text x="177.53502917921685" y="782.6452845510105" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1900</text><text x="240.12877329631027" y="782.6452845510105" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1925</text><text x="302.7225174134036" y="782.6452845510105" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1950</text><text x="365.31626153049694" y="782.6452845510105" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1975</text><text x="427.9100056475903" y="782.6452845510105" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000</text><text x="488" y="782.6452845510105" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2024</text><text x="52" y="832.0120928140625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : la hauteur est le débit d’une année, l’aire est le stock</text><text x="52" y="850.2126986140624" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">accumulé. C’est tout ce qu’une aire dit de plus qu’une courbe — et elle</text><text x="52" y="868.4133044140625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">ne le dit que si la base est à zéro.</text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Global Carbon Budget 2025, via Our World in Data · émissions</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">territoriales</text></svg>