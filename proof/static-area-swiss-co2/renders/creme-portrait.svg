<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · SUISSE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La moitié du CO₂ suisse</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">depuis 1858 a été émise après</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">1986 — en 38 ans sur 167</text><text x="52" y="221.2042130835547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les</text><text x="52" y="240.0550205054297" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">38 années qui suivent 1986 en portent 49,9 %, les 129 précédentes 50,1</text><text x="52" y="258.9058279273047" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">% — les deux surfaces teintées sont de même taille. La hauteur, elle, ne</text><text x="52" y="277.7566353491797" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">dit que le débit d’une année : 46,2 Mt au pic de 1973, 32,1 Mt en 2024.</text><text x="52" y="342.66027478538547" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">millions de tonnes de CO₂ par an</text><g><line x1="72.3775390625" x2="488" y1="766.7927454885105" y2="766.7927454885105" stroke="#403f3c" stroke-width="1"></line><text x="66.3775390625" y="770.7190150197605" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">0</text></g><g><line x1="72.3775390625" x2="488" y1="558.5705410245882" y2="558.5705410245882" stroke="#e0ded1" stroke-width="0.6"></line><text x="66.3775390625" y="562.4968105558382" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">25</text></g><g><line x1="72.3775390625" x2="488" y1="391.99277745345057" y2="391.99277745345057" stroke="#e0ded1" stroke-width="0.6"></line><text x="66.3775390625" y="395.91904698470057" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">45</text></g><path d="M 72.4 766.8 L 72.4 765.6 L 74.9 765.1 L 77.4 764.3 L 79.9 763.3 L 82.4 762.9 L 84.9 762.9 L 87.4 762.0 L 89.9 761.0 L 92.4 761.1 L 94.9 761.2 L 97.4 760.4 L 99.9 760.6 L 102.4 759.3 L 104.9 757.5 L 107.4 756.2 L 109.9 756.5 L 112.4 757.1 L 114.9 756.1 L 117.4 754.3 L 119.9 755.0 L 122.5 755.5 L 125.0 754.7 L 127.5 752.9 L 130.0 753.8 L 132.5 752.4 L 135.0 750.9 L 137.5 750.4 L 140.0 749.8 L 142.5 749.4 L 145.0 748.0 L 147.5 747.6 L 150.0 745.6 L 152.5 742.8 L 155.0 737.5 L 157.5 737.9 L 160.0 742.8 L 162.5 736.9 L 165.0 734.7 L 167.5 731.7 L 170.0 729.8 L 172.5 727.2 L 175.0 724.1 L 177.5 719.5 L 180.0 723.6 L 182.5 723.2 L 185.0 719.6 L 187.6 717.1 L 190.1 714.8 L 192.6 709.4 L 195.1 700.2 L 197.6 700.1 L 200.1 699.6 L 202.6 701.9 L 205