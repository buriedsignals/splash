<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · SUISSE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LA MOITIÉ DU CO₂</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SUISSE DEPUIS 1858 A</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉTÉ ÉMISE APRÈS</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">1986 — EN 38 ANS</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SUR 167</text><text x="56" y="311.2459059717773" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les 38</text><text x="56" y="329.3716823389648" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">années qui suivent 1986 en portent 49,9 %, les 129 précédentes 50,1 % —</text><text x="56" y="347.4974587061523" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">les deux surfaces teintées sont de même taille. La hauteur, elle, ne dit</text><text x="56" y="365.6232350733398" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">que le débit d’une année : 46,2 Mt au pic de 1973, 32,1 Mt en 2024.</text><text x="56" y="398.1495035895273" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">MILLIONS DE TONNES DE CO₂ PAR AN</text><g><line x1="77.06000001430512" x2="484" y1="790.9444961710312" y2="790.9444961710312" stroke="#c4c3d0" stroke-width="0.8"></line><text x="71.06000001430512" y="794.4444961710312" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">0</text></g><g><line x1="77.06000001430512" x2="484" y1="597.665519752711" y2="597.665519752711" stroke="#2e2d5a" stroke-width="0.48"></line><text x="71.06000001430512" y="601.165519752711" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">25</text></g><g><line x1="77.06000001430512" x2="484" y1="443.04233861805494" y2="443.04233861805494" stroke="#2e2d5a" stroke-width="0.48"></line><text x="71.06000001430512" y="446.54233861805494" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">45</text></g><path d="M 77.1 790.9 L 77.1 789.8 L 79.5 789.4 L 82.0 788.6 L 84.4 787.7 L 86.9 787.3 L 89.3 787.3 L 91.8 786.5 L 94.2 785.6 L 96.7 785.6 L 99.1 785.7 L 101.6 785.0 L 104.0 785.2 L 106.5 784.0 L 108.9 782.4 L 111.4 781.1 L 113.8 781.4 L 116.3 781.9 L 118.7 781.1 L 121.2 779.4 L 123.6 780.0 L 126.1 780.5 L 128.5 779.8 L 131.0 778.0 L 133.4 778.8 L 135.9 777.6 L 138.3 776.2 L 140.8 775.8 L 143.2 775.1 L 145.7 774.8 L 148.2 773.5 L