a6b9">1975</text><text x="425.1653012068875" y="805.9444961710312" text-anchor="middle" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2000</text><text x="484" y="805.9444961710312" text-anchor="end" font-family="Montserrat" font-size="10" font-weight="400" font-style="normal" letter-spacing="1.2" fill="#a7a6b9">2024</text><text x="56" y="823.9352246289062" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : LA HAUTEUR EST LE DÉBIT D’UNE ANNÉE, L’AIRE EST</text><text x="56" y="837.9354396289062" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LE STOCK ACCUMULÉ. C’EST TOUT CE QU’UNE AIRE DIT DE</text><text x="56" y="851.9356546289063" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">PLUS QU’UNE COURBE — ET ELLE NE LE DIT QUE SI LA BASE</text><text x="56" y="865.9358696289062" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">EST À ZÉRO.</text><text x="56" y="885.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Global Carbon Budget 2025, via Our World in Data · émissions</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">territoriales</text></svg>