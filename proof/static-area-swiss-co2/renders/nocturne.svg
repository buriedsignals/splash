<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Futura" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">CLIMAT · SUISSE</text><text x="56" y="106.05" font-family="Helvetica Neue" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">LA MOITIÉ DU CO₂ SUISSE DEPUIS 1858 A ÉTÉ</text><text x="56" y="145.09" font-family="Helvetica Neue" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉMISE APRÈS 1986 — EN 38 ANS SUR 167</text><text x="56" y="194.13" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les 38 années qui suivent 1986 en portent 49,9 %, les 129 précédentes 50,1 % —</text><text x="56" y="212.255" font-family="Avenir Next" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">les deux surfaces teintées sont de même taille. La hauteur, elle, ne dit que le débit d’une année : 46,2 Mt au pic de 1973, 32,1 Mt en 2024.</text><text x="56" y="245.36828125" font-family="Futura" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">MILLIONS DE TONNES DE CO₂ PAR AN</text><g><line x1="75.84999988675118" x2="904" y1="416.2934265136719" y2="416.2934265136719" stroke="#c4c3d0" stroke-width="0.8"></line><text x="69.84999988675118" y="419.8634338378906" text-anchor="end" font-family="He