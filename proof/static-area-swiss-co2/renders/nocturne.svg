t" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : LA HAUTEUR EST LE DÉBIT D’UNE ANNÉE, L’AIRE EST LE STOCK ACCUMULÉ. C’EST TOUT CE QU’UNE AIRE DIT DE</text><text x="56" y="464.0625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">PLUS QU’UNE COURBE — ET ELLE NE LE DIT QUE SI LA BASE EST À ZÉRO.</text><text x="56" y="484" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Global Carbon Budget 2025, via Our World in Data · émissions territoriales</text></svg>