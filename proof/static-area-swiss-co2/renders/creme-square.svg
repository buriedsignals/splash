<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="540" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · SUISSE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">La moitié du CO₂ suisse</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">depuis 1858 a été émise après</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">1986 — en 38 ans sur 167</text><text x="52" y="221.2042130835547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les</text><text x="52" y="240.0550205054297" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">38 années qui suivent 1986 en portent 49,9 %, les 129 précédentes 50,1</text><text x="52" y="258.9058279273047" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">% — les deux surfaces teintées sont de même taille. La hauteur, elle, ne</text><text x="52" y="277.7566353491797" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">dit que le débit d’une année : 46,2 Mt au pic de 1973, 32,1 Mt en 2024.</text><text x="52" y="317.41971533685654" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">millions de tonnes de CO₂ par an</text><g><line x1="72.3775390625" x2="488" y1="390.23391073703937" y2="390.23391073703937" stroke="#403f3c" stroke-width="1"></line><text x="66.3775390625" y="394.16018026828937" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">0</text></g><g><line x1="72.3775390625" x2="428.9580078125" y1="358.0182329344425" y2="358.0182329344425" stroke="#e0ded1" stroke-width="0.6"></line><text x="66.3775390625" y="361.9445024656925" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">25</text></g><g><line x1="72.3775390625" x2="488" y1="332.245690692365" y2="332.245690692365" stroke="#e0ded1" stroke-width="0.6"></line><text x="66.3775390625" y="336.171960223615" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">45</text></g><path d="M 72.4 390.2 L 72.4 390.0 L 74.9 390.0 L 77.4 389.8 L 79.9 389.7 L 82.4 389.6 L 84.9 389.6 L 87.4 389.5 L 89.9 389.3 L 92.4 389.3 L 94.9 389.4 L 97.4 389.2 L 99.9 389.3 L 102.4 389.1 L 104.9 388.8 L 107.4 388.6 L 109.9 388.6 L 112.4 388.7 L 114.9 388.6 L 117.4 388.3 L 119.9 388.4 L 122.5 388.5 L 125.0 388.4 L 127.5 388.1 L 130.0 388.2 L 132.5 388.0 L 135.0 387.8 L 137.5 387.7 L 140.0 387.6 L 142.5 387.5 L 145.0 387.3 L 147.5 387.3 L 150.0 387.0 L 152.5 386.5 L 155.0 385.7 L 157.5 385.8 L 160.0 386.5 L 162.5 385.6 L 165.0 385.3 L 167.5 384.8 L 170.0 384.5 L 172.5 384.1 L 175.0 383.6 L 177.5 382.9 L 180.0 383.6 L 182.5 383.5 L 185.0 382.9 L 187.6 382.6 L 190.1 382.2 L 192.6 381.3 L 195.1 379.9 L 197.6 379.9 L 200.1 379.8 L 202.6 380