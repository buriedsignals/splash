al" letter-spacing="0" fill="#000000">1986</text><g><circle cx="488" cy="348.9054382767606" r="2.4" fill="#FFFCEE"></circle><text x="488" y="368.6134460892606" text-anchor="end" font-family="Open Sans" font-size="15" font-weight="600" font-style="normal" letter-spacing="0" fill="#fffcee">32,1 Mt</text></g><text x="72.3775390625" y="406.08644979953937" text-anchor="start" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1858</text><text x="114.94128506212351" y="406.08644979953937" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1875</text><text x="177.53502917921685" y="406.08644979953937" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1900</text><text x="240.12877329631027" y="406.08644979953937" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1925</text><text x="302.7225174134036" y="406.08644979953937" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1950</text><text x="365.31626153049694" y="406.08644979953937" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">1975</text><text x="427.9100056475903" y="406.08644979953937" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2000</text><text x="488" y="406.08644979953937" text-anchor="end" font-family="Open Sans" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#5f5e58">2024</text><text x="52" y="430.2126986140625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : la hauteur est le débit d’une année, l’aire est le stock. La base</text><text x="52" y="448.4133044140625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">est à zéro.</text><text x="52" y="469.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Global Carbon Budget 2025, via Our World in Data · émissions</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">territoriales</text></svg>