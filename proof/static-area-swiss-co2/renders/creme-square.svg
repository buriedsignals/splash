<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Aire remplie des émissions annuelles de CO₂ de la Suisse de 1858 à 2024, base à zéro. La courbe monte jusqu’à un pic de 46,2 Mt en 1973 puis redescend à 32,1 Mt. Un trait vertical marque 1986, l’année où le cumul atteint la moitié des 3 158 Mt émises depuis 1858 : les deux surfaces de part et d’autre sont de même taille."><rect x="0" y="0" width="540" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">CLIMAT · SUISSE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Le CO₂ suisse depuis 1858</text><text x="52" y="148.0015610835547" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">L’aire sous la courbe est le stock : 3 158 Mt cumulées depuis 1858. Les</text><text x="52" y="166.8523685054297" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">38 années qui suivent 1986 en portent 49,9 %, les 129 précédentes 50,1</text><text x="52" y="185.7031759273047" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">% — les deux surfaces teintées sont de même taille. La hauteur, elle, ne</text><text x="52" y="204.5539833491797" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">dit que le débit d’une année : 46,2 Mt au pic de 1973, 32,1 Mt en 2024.</text><text x="52" y="244.2170633368566" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">millions de tonnes de CO₂ par an</text><g><line x1="72.3775390625" x2="488" y1="428.033106484375" y2="428.0331064843