<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Cartogramme en tuiles : 41 pays européens, une tuile égale chacun, rangés à peu près comme sur la carte et teintés par leur part d’électricité bas-carbone en 2024. Comptée par pays la moyenne est de 65,1 % ; pondérée par le territoire que chaque pays occupe sur un choroplèthe, 44,9 %. L’Ukraine, sans donnée 2024, est dans un neutre hors rampe."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Compté par pays, le bas-carbone européen est à</text><text x="52" y="137.6" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">65,1 % ; compté au kilomètre carré, à 44,9 %</text><text x="52" y="183.29999999999998" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Une tuile égale par pays, rangée à peu près comme la carte. Sur un choroplèthe l’encre est proportionnelle au TERRITOIRE : la Russie occupe 73</text><text x="52" y="202.14999999999998" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">% du dessin à 35,9 % de bas-carbone, et tire la lecture vers le bas. Les deux moyennes sont vraies ; un choroplèthe ne peut en montrer qu’une.</text><text x="52" y="450.95" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : une tuile par pays, toutes de même taille. La disposition est dessinée, pas mesurée.</text><text x="52" y="488" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data · fonds Natural Earth 50 m</text><g><rect x="237.2347869466146" y="227.49999999999997" width="46.44543465169271" height="17.173101888020835" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><text x="260.45750427246094" y="238.66054081217445" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#adadad">ISL</text></g><g><rect x="578.7453358561198" y="227.49999999999997" width="46.44543465169271" height="17.173101888020835" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><text x="601.9680531819662" y="238.66054081217445" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#adadad">NOR</text></g><g><rect x="627.5325571289063" y="227.49999999999997" width="46.44543465169271" height="17.173101888020835" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><text x="650.7552744547527" y="238.66054081217445" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#adadad">SWE</text></g><g><rect x="676.3197784016927" y="227.49999999999997" width="46.44543465169271" height="17.173101888020835" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><text x="699.5424957275391" y="238.66054081217445" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#adadad">FIN</text></g><g><rect x="676.3197784016927" y="247.01488850911454" width="46.44543465169271" height="17.173101888020835" fill="#707d8c" stroke="#d1cfc3" stroke-width="0.6"></rect><text x="699.5424957275391" y="258.175429321289" text-anchor="middle" font-family="Avenir Next" font-size="11" font-weight="500" font-style="normal" letter-spacing="0.4" fill="#000000">EST</text>