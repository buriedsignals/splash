<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Cartogramme en tuiles : 41 pays européens, une tuile égale chacun, rangés à peu près comme sur la carte et teintés par leur part d’électricité bas-carbone en 2024. Comptée par pays la moyenne est de 65,1 % ; pondérée par le territoire que chaque pays occupe sur un choroplèthe, 44,9 %. L’Ukraine, sans donnée 2024, est dans un neutre hors rampe."><rect x="0" y="0" width="540" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">Une tuile par pays</text><text x="52" y="146.7027404521875" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Une tuile égale par pays. Sur un choroplèthe l’encre suit le territoire :</text><text x="52" y="165.5535478740625" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">44,9 % au kilomètre carré contre 65,1 % par pays.</text><text x="52" y="413.89717355625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : une tuile par pays, toutes de même taille. La disposition est</text><text x="52" y="432.09777935625" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">dessinée, pas mesurée.</text><text x="52" y="469.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="norm