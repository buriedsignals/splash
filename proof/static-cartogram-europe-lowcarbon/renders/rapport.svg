<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Cartogramme en tuiles : 41 pays européens, une tuile égale chacun, rangés à peu près comme sur la carte et teintés par leur part d’électricité bas-carbone en 2024. Comptée par pays la moyenne est de 65,1 % ; pondérée par le territoire que chaque pays occupe sur un choroplèthe, 44,9 %. L’Ukraine, sans donnée 2024, est dans un neutre hors rampe."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Compté par pays, le bas-carbone européen est à 65,1 % ;</text><text x="46" y="123.99" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">compté au kilomètre carré, à 44,9 %</text><text x="46" y="166.03" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Une tuile égale par pays, rangée à peu près comme la carte. Sur un choroplèthe l’encre est proportionnelle au</text><text x="46" y="184.88" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">TERRITOIRE : la Russie occupe 73 % du dessin à 35,9 % de bas-carbone, et tire la lecture vers le bas. Les deux</text><text x="46" y="203.73" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">moyennes sont vraies ; un choroplèthe ne peut en montrer qu’une.</text><text x="46" y="442.29999999999995" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : UNE TUILE PAR PAYS, TOUTES DE MÊME TAILLE. 