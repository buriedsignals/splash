<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Cartogramme en tuiles : 41 pays européens, une tuile égale chacun, rangés à peu près comme sur la carte et teintés par leur part d’électricité bas-carbone en 2024. Comptée par pays la moyenne est de 65,1 % ; pondérée par le territoire que chaque pays occupe sur un choroplèthe, 44,9 %. L’Ukraine, sans donnée 2024, est dans un neutre hors rampe."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">Compté par pays, le bas-carbone européen est à 65,1 % ; compté au</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">kilomètre carré, à 44,9 %</text><text x="46" y="166.03308223926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Une tuile égale par pays, rangée à peu près comme la carte. Sur un choroplèthe l’encre est proportionnelle au TERRITOIRE : la Russie occupe</text><text x="46" y="184.88242573926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">73 % du dessin à 35,9 % de bas-carbone, et tire la lecture vers le bas. Les deux moyennes sont vraies ; un choroplèthe ne peut en montrer</text><text x="46" y="203.73176923926093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">qu’une.</text><text x="46" y="447.15171118750004" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE TUILE EST UN PAYS ET VAUT AUTANT QUE LES AUTRES — C’EST CE QUE CETTE FORME ACHÈTE, ET ELLE LE PAIE EN</text><text x="46" y="461.15118384375006" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">GÉOMÉTRIE. LA DISPOSITION EST DESSINÉE À LA MAIN POUR RESTER RECONNAISSABLE ; ELLE N’EST MESURÉE SUR RIEN.</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data · fonds Natural Earth 50 m</text><g><rect x="239.8738030678506" y="229.08036637806092" width="45.94054249988068" height="16.986419075586134" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><text x="262.84407431779096" y="240.17855638460398" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#a8a8a8">ISL</text></g><g><rect x="577.6719096846202" y="229.08036637806092" width="45.94054249988068" height="16.986419075586134" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><text x="600.6421809345605" y="240.17855638460398" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#a8a8a8">NOR</text></g><g><rect x="625.9287820584445" y="229.08036637806092" width="45.94054249988068" height="16.986419075586134" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><text x="648.8990533083849" y="240.17855638460398" text-anchor="middle" font-family="Open Sans" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.5" fill="#a8a8a8">SWE</text></g><g><rect x="674.1856544322688" y="229.08036637806092" width="45.94054249988068" height="16.986419075586134" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><text x="697.1559256822092" y="240.17855638460398" text-anchor="middle" font-family="Open 