<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Grille d’unités : un carré par pays, pour les 40 pays européens dont la production électrique de 2024 est rapportée, en trois blocs. 16 carrés au-dessus de 75 % d’électricité bas-carbone, 6 entre 60 et 75 %, 18 sous 60 %. La teinte de chaque carré donne sa classe."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’Europe électrique est aux deux bouts : 6 pays seulement au</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">milieu</text><text x="46" y="166.03308223926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Un carré, un pays : les 40 pays européens dont la production électrique de 2024 est rapportée, rangés par part d’électricité bas-carbone —</text><text x="46" y="184.88242573926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">renouvelables et nucléaire réunis. 16 dépassent 75 %, 18 sont sous 60 %, et 6 seulement se tiennent entre les deux.</text><text x="46" y="447.15171118750004" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE CARRÉ EST UN PAYS ET SE COMPTE. LA TEINTE DU CARRÉ DONNE SA CLASSE, DONT LES BORNES SONT SOUS LA GRILLE ; LE</text><text x="46" y="461.15118384375006" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">NOMBRE DEVANT CHAQUE BLOC EST LE COMPTE DE CE BLOC, EN PAYS.</text><text x="46" y="494" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><text x="46" y="216.07097498591094" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">16</text><text x="70.107177734375" y="216.07097498591094" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">PAYS AU-DESSUS DE 75 % D’ÉLECTRICITÉ BAS-CARBONE</text><rect x="46" y="224.47331873591094" width="36.47826365553628" height="36.47826365553628" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="88.41658564597242" y="224.47331873591094" width="36.47826365553628" height="36.47826365553628" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="130.83317129194484" y="224.47331873591094" width="36.47826365553628" height="36.47826365553628" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="173.24975693791725" y="224.47331873591094" width="36.47826365553628" height="36.47826365553628" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="215.66634258388967" y="224.47331873591094" width="36.47826365553628" height="36.47826365553628" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="258.0829282298621" y="224.47331873591094" width="36.47826365553628" height="36.47826365553628" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="300.4995138758345" y="224.47331873591094" width="36.47826365553628" height="36.47826365553628" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="342.9160995218069" y="224.47331873591094" width="36.47826365553628" height="36.47826365553628" fill="#4b6c86" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="385.33268516777935" y="224.473318735910