<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Grille d’unités : un carré par pays, pour les 40 pays européens dont la production électrique de 2024 est rapportée, en trois blocs. 16 carrés au-dessus de 75 % d’électricité bas-carbone, 6 entre 60 et 75 %, 18 sous 60 %. La teinte de chaque carré donne sa classe."><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Avenir Next" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’Europe électrique est aux deux bouts : 6 pays</text><text x="46" y="123.99" font-family="Superclarendon" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">seulement au milieu</text><text x="46" y="166.03" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Un carré, un pays : les 40 pays européens dont la production électrique de 2024 est rapportée, rangés par part</text><text x="46" y="184.88" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">d’électricité bas-carbone — renouvelables et nucléaire réunis. 16 dépassent 75 %, 18 sont sous 60 %, et 6 seulement se</text><text x="46" y="203.73" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">tiennent entre les deux.</text><text x="46" y="447.15" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE CARRÉ EST UN PAYS ET SE COMPTE. LA TEINTE DU CARRÉ DONNE SA CLASSE, DONT LES BORNES SONT SOUS LA GRILLE ; LE</text><text x="46" y="461.15" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">NOMBRE DEVANT CHAQUE BLOC EST LE COMPTE DE CE BLOC, EN PAYS.</text><text x="46" y="494" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><text x="46" y="234.8599865722656" font-family="Avenir Next" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">16</text><text x="72.0814995765686" y="234.8599865722656" font-family="Avenir Next" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">PAYS AU-DESSUS DE 75 % D’ÉLECTRICITÉ BAS-CARBONE</text><rect x="46" y="243.25998046874997" width="31.164695817057293" height="31.164695817057293" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="82.23801839192708" y="243.25998046874997" width="31.164695817057293" height="31.164695817057293" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="118.47603678385417" y="243.25998046874997" width="31.164695817057293" height="31.164695817057293" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="154.71405517578125" y="243.25998046874997" width="31.164695817057293" height="31.164695817057293" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="190.95207356770834" y="243.25998046874997" width="31.164695817057293" height="31.164695817057293" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="227.19009195963542" y="243.25998046874997" width="31.164695817057293" height="31.164695817057293" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="263.4281103515625" y="243.25998046874997" width="31.164695817057293" height="31.164695817057293" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="299.6661287434896" y="243.25998046874997" width="31.164695817057293" height="31.1646958170572