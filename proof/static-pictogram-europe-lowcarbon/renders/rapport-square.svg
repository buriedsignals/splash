<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540" role="img" aria-label="Grille d’unités : un carré par pays, pour les 40 pays européens dont la production électrique de 2024 est rapportée, en trois blocs. 16 carrés au-dessus de 75 % d’électricité bas-carbone, 6 entre 60 et 75 %, 18 sous 60 %. La teinte de chaque carré donne sa classe."><rect x="0" y="0" width="540" height="540" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’Europe électrique est aux deux</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">bouts : 6 pays seulement au milieu</text><text x="46" y="166.03308223926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Un carré, un pays : les 40 pays européens dont la production électrique</text><text x="46" y="184.88242573926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">de 2024 est rapportée, rangés par part d’électricité bas-carbone —</text><text x="46" y="203.73176923926093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">renouvelables et nucléaire réunis. 16 dépassent 75 %, 18 sont sous 60 %,</text><text x="46" y="222.58111273926093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">et 6 seulement se tiennent entre les deux.</text><text x="46" y="414.30289503125005" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fi