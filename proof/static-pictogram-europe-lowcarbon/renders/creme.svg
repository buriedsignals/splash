<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Grille d’unités : un carré par pays, pour les 40 pays européens dont la production électrique de 2024 est rapportée, en trois blocs. 16 carrés au-dessus de 75 % d’électricité bas-carbone, 6 entre 60 et 75 %, 18 sous 60 %. La teinte de chaque carré donne sa classe."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">L’Europe électrique est aux deux bouts : 6 pays seulement</text><text x="52" y="137.6" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">au milieu</text><text x="52" y="183.29999999999998" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Un carré, un pays : les 40 pays européens dont la production électrique de 2024 est rapportée, rangés par part d’électricité bas-carbone —</text><text x="52" y="202.14999999999998" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">renouvelables et nucléaire réunis. 16 dépassent 75 %, 18 sont sous 60 %, et 6 seulement se tiennent entre les deux.</text><text x="52" y="432.75" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque carré est un pays et se compte. La teinte du carré donne sa classe, dont les bornes sont sous la grille ; le nombre devant</text><text x="52" y="450.95" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">chaque bloc est le compte de ce bloc, en pays.</text><text x="52" y="488" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><text x="52" y="235.98250122070309" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">16</text><text x="76.54541015625" y="235.98250122070309" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">pays au-dessus de 75 % d’électricité bas-carbone</text><rect x="52" y="245.49251098632809" width="23.141112426757818" height="23.141112426757818" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="78.90827026367188" y="245.49251098632809" width="23.141112426757818" height="23.141112426757818" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="105.81654052734376" y="245.49251098632809" width="23.141112426757818" height="23.141112426757818" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="132.72481079101564" y="245.49251098632809" width="23.141112426757818" height="23.141112426757818" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="159.63308105468752" y="245.49251098632809" width="23.141112426757818" height="23.141112426757818" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="186.5413513183594" y="245.49251098632809" width="23.141112426757818" height="23.141112426757818" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="213.44962158203128" y="245.49251098632809" width="23.141112426757818" height="23.141112426757818" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="240.35789184570316" y="245.49251098632809" width="23.141112426757818" height="23.141112426757818" fill="#466999" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="267.26616210937505" y="245.49251098632809" width="23.141112426757818" height="23.141