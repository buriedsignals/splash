<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Grille d’unités : un carré par pays, pour les 40 pays européens dont la production électrique de 2024 est rapportée, en trois blocs. 16 carrés au-dessus de 75 % d’électricité bas-carbone, 6 entre 60 et 75 %, 18 sous 60 %. La teinte de chaque carré donne sa classe."><rect x="0" y="0" width="960" height="540" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Avenir Next" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">L’Europe électrique est aux deux bouts : 6 pays</text><text x="52" y="137.6" font-family="Superclarendon" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">seulement au milieu</text><text x="52" y="183.29999999999998" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Un carré, un pays : les 40 pays européens dont la production électrique de 2024 est rapportée, rangés par part d’électricité bas-carbone —</text><text x="52" y="202.14999999999998" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">renouvelables et nucléaire réunis. 16 dépassent 75 %, 18 sont sous 60 %, et 6 seulement se tiennent entre les deux.</text><text x="52" y="432.75" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque carré est un pays et se compte. La teinte du carré donne sa classe, dont les bornes sont sous la</text><text x="52" y="450.95" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">grille ; le nombre devant chaque bloc est le compte de ce bloc, en pays.</text><text x="52" y="488" font-family="Avenir Next" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><text x="52" y="235.8589965820312" font-family="Avenir Next" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">16</text><text x="77.57999813556671" y="235.8589965820312" font-family="Superclarendon" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">pays au-dessus de 75 % d’électricité bas-carbone</text><rect x="52" y="244.9269897460937" width="23.665201171875005" height="23.665201171875005" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="79.51767578125" y="244.9269897460937" width="23.665201171875005" height="23.665201171875005" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="107.03535156250001" y="244.9269897460937" width="23.665201171875005" height="23.665201171875005" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="134.55302734375002" y="244.9269897460937" width="23.665201171875005" height="23.665201171875005" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="162.07070312500002" y="244.9269897460937" width="23.665201171875005" height="23.665201171875005" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="189.58837890625003" y="244.9269897460937" width="23.665201171875005" height="23.665201171875005" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="217.10605468750003" y="244.9269897460937" width="23.665201171875005" height="23.665201171875005" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="244.62373046875004" y="244.9269897460937" width="23.665201171875005" height="23.665201171875005" fill="#466999" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="272.14140625000005" y="244.9269897460937" width="23.665201171875005" heig