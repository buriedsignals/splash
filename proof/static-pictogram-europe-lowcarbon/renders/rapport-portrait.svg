<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Grille d’unités : un carré par pays, pour les 40 pays européens dont la production électrique de 2024 est rapportée, en trois blocs. 16 carrés au-dessus de 75 % d’électricité bas-carbone, 6 entre 60 et 75 %, 18 sous 60 %. La teinte de chaque carré donne sa classe."><rect x="0" y="0" width="540" height="960" fill="#FFFFFF"></rect><text x="46" y="55.5" font-family="Open Sans" font-size="9.5" font-weight="700" font-style="normal" letter-spacing="1.6" fill="#1F5C8B">ÉNERGIE · EUROPE</text><text x="46" y="91.05023239746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">L’Europe électrique est aux deux</text><text x="46" y="123.99142579746093" font-family="Merriweather" font-size="27" font-weight="700" font-style="normal" letter-spacing="-0.3" fill="#000000">bouts : 6 pays seulement au milieu</text><text x="46" y="166.03308223926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Un carré, un pays : les 40 pays européens dont la production électrique</text><text x="46" y="184.88242573926095" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">de 2024 est rapportée, rangés par part d’électricité bas-carbone —</text><text x="46" y="203.73176923926093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">renouvelables et nucléaire réunis. 16 dépassent 75 %, 18 sont sous 60 %,</text><text x="46" y="222.58111273926093" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">et 6 seulement se tiennent entre les deux.</text><text x="46" y="834.3028950312499" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">LECTURE : CHAQUE CARRÉ EST UN PAYS ET SE COMPTE. LA TEINTE DU</text><text x="46" y="848.3023676874999" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">CARRÉ DONNE SA CLASSE, DONT LES BORNES SONT SOUS LA GRILLE ; LE</text><text x="46" y="862.30184034375" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#5f5f5f">NOMBRE DEVANT CHAQUE BLOC EST LE COMPTE DE CE BLOC, EN PAYS.</text><text x="46" y="895.1506565" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="46" y="914" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#616161">(2025), via Our World in Data</text><g><text x="46" y="253.76966198591094" font-family="Open Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0" fill="#1e5a88">16</text><text x="70.107177734375" y="253.76966198591094" font-family="Open Sans" font-size="10" font-weight="700" font-style="normal" letter-spacing="1.3" fill="#1e5a88">PAYS AU-DESSUS DE 75 % D’ÉLECTRICITÉ BAS-CARBONE</text><rect x="46" y="262.17200573591094" width="48.16" height="48.16" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="102" y="262.17200573591094" width="48.16" height="48.16" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="158" y="262.17200573591094" width="48.16" height="48.16" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="214" y="262.17200573591094" width="48.16" height="48.16" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="270" y="262.17200573591094" width="48.16" height="48.16" fill="#164061" stroke="#d1d1d1" stroke-width="0.6"></rect><rect x="326" y="262.17200573591094" width="48.16" height="48.16" fill="#164061" stroke="#d1d1d1" stro