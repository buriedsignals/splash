<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Grille d’unités : un carré par pays, pour les 40 pays européens dont la production électrique de 2024 est rapportée, en trois blocs. 16 carrés au-dessus de 75 % d’électricité bas-carbone, 6 entre 60 et 75 %, 18 sous 60 %. La teinte de chaque carré donne sa classe."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.05" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">L’EUROPE ÉLECTRIQUE EST AUX DEUX</text><text x="56" y="145.09" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">BOUTS : 6 PAYS SEULEMENT AU MILIEU</text><text x="56" y="192.88" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Un carré, un pays : les 40 pays européens dont la production électrique de 2024 est rapportée, rangés par part d’électricité bas-carbone —</text><text x="56" y="211.005" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">renouvelables et nucléaire réunis. 16 dépassent 75 %, 18 sont sous 60 %, et 6 seulement se tiennent entre les deux.</text><text x="56" y="437.875" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE CARRÉ EST UN PAYS ET SE COMPTE. LA TEINTE DU CARRÉ DONNE SA CLASSE, DONT LES BORNES SONT</text><text x="56" y="451.875" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SOUS LA GRILLE ; LE NOMBRE DEVANT CHAQUE BLOC EST LE COMPTE DE CE BLOC, EN PAYS.</text><text x="56" y="484" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy (2025), via Our World in Data</text><g><text x="56" y="241.13" font-family="Montserrat" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">16</text><text x="77.7760005146265" y="241.13" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#53e1c1">PAYS AU-DESSUS DE 75 % D’ÉLECTRICITÉ BAS-CARBONE</text><rect x="56" y="249.13" width="27.7364361328125" height="27.7364361328125" fill="#84e9d3" stroke="#3c3b66" stroke-width="0.48"></rect><rect x="88.25166992187499" y="249.13" width="27.7364361328125" height="27.7364361328125" fill="#84e9d3" stroke="#3c3b66" stroke-width="0.48"></rect><rect x="120.50333984375" y="249.13" width="27.7364361328125" height="27.7364361328125" fill="#84e9d3" stroke="#3c3b66" stroke-width="0.48"></rect><rect x="152.755009765625" y="249.13" width="27.7364361328125" height="27.7364361328125" fill="#84e9d3" stroke="#3c3b66" stroke-width="0.48"></rect><rect x="185.0066796875" y="249.13" width="27.7364361328125" height="27.7364361328125" fill="#84e9d3" stroke="#3c3b66" stroke-width="0.48"></rect><rect x="217.258349609375" y="249.13" width="27.7364361328125" height="27.7364361328125" fill="#84e9d3" stroke="#3c3b66" stroke-width="0.48"></rect><rect x="249.51001953125" y="249.13" width="27.7364361328125" height="27.7364361328125" fill="#84e9d3" stroke="#3c3b66" stroke-width="0.48"></rect><rect x="281.761689453125" y="249.13" width="27.7364361328125" height="27.7364361328125" fill="#69b8b2" stroke="#3c3b66" stroke-width="0.48"></rect><rect x="314.013359375" y="249.13" width="27.7364361328125" height="27.7364361328125" fill="#69b8b2" stroke="#3c3b66" stroke-width="0.48"></rect><rect x="346.265029296875" y="249.13" width="27.7364361328125" height="27.7364361328125" fill="#69b8b2" stroke="#3c3b