<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Grille d’unités : un carré par pays, pour les 40 pays européens dont la production électrique de 2024 est rapportée, en trois blocs. 16 carrés au-dessus de 75 % d’électricité bas-carbone, 6 entre 60 et 75 %, 18 sous 60 %. La teinte de chaque carré donne sa classe."><rect x="0" y="0" width="960" height="540" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">L’EUROPE ÉLECTRIQUE EST AUX DEUX</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">BOUTS : 6 PAYS SEULEMENT AU MILIEU</text><text x="56" y="192.8794207800781" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Un carré, un pays : les 40 pays européens dont la production électrique de 2024 est rapportée, rangés par part d’électricité bas-carbone —</text><text x="56" y="211.00519714726562" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">renouvelables et nucléaire réunis. 16 dépassent 75 %, 18 sont sous 60 %, et 6 seulement se tiennent entre les deux.</text><text x="56" y="437.8737936328125" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE CARRÉ EST UN PAYS ET SE COMPTE. LA TEINTE DU CARRÉ DONNE SA CLASSE, DONT LES BORNES SONT</text><text x="56" y="451.87400863281255" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SOUS LA GRILLE ; LE NOMBRE DEVANT CHAQUE BLOC EST 