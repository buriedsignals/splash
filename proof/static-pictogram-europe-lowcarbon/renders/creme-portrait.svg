<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Grille d’unités : un carré par pays, pour les 40 pays européens dont la production électrique de 2024 est rapportée, en trois blocs. 16 carrés au-dessus de 75 % d’électricité bas-carbone, 6 entre 60 et 75 %, 18 sous 60 %. La teinte de chaque carré donne sa classe."><rect x="0" y="0" width="540" height="960" fill="#FFFCEE"></rect><text x="52" y="62" font-family="Open Sans" font-size="10" font-weight="600" font-style="normal" letter-spacing="1.9" fill="#1757B6">ÉNERGIE · EUROPE</text><text x="52" y="101.00024462890624" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">L’Europe électrique est aux</text><text x="52" y="137.60157062890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">deux bouts : 6 pays seulement</text><text x="52" y="174.20289662890625" font-family="Merriweather" font-size="30" font-weight="700" font-style="normal" letter-spacing="-0.2" fill="#000000">au milieu</text><text x="52" y="219.9053924521875" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Un carré, un pays : les 40 pays européens dont la production électrique</text><text x="52" y="238.7561998740625" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">de 2024 est rapportée, rangés par part d’électricité bas-carbone —</text><text x="52" y="257.6070072959375" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">renouvelables et nucléaire réunis. 16 dépassent 75 %, 18 sont sous 60</text><text x="52" y="276.4578147178125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">%, et 6 seulement se tiennent entre les deux.</text><text x="52" y="815.6965677562501" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">Lecture : chaque carré est un pays et se compte. La teinte du carré</text><text x="52" y="833.8971735562501" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">donne sa classe, dont les bornes sont sous la grille ; le nombre devant</text><text x="52" y="852.0977793562502" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#5f5e58">chaque bloc est le compte de ce bloc, en pays.</text><text x="52" y="889.149192578125" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="52" y="908" font-family="Open Sans" font-size="13" font-weight="400" font-style="normal" letter-spacing="0" fill="#61605a">(2025), via Our World in Data</text><g><text x="52" y="310.29206112808595" font-family="Open Sans" font-size="15" font-weight="700" font-style="normal" letter-spacing="0" fill="#1755b2">16</text><text x="76.54541015625" y="310.29206112808595" font-family="Merriweather" font-size="13" font-weight="400" font-style="italic" letter-spacing="0" fill="#1755b2">pays au-dessus de 75 % d’électricité bas-carbone</text><rect x="52" y="319.80207089371095" width="46.87" height="46.87" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="106.5" y="319.80207089371095" width="46.87" height="46.87" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="161" y="319.80207089371095" width="46.87" height="46.87" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="215.5" y="319.80207089371095" width="46.87" height="46.87" fill="#103d7f" stroke="#d1cfc3" stroke-width="0.6"></rect><rect x="270" y="319.80207089371095" width="46.87" height="46.87" fill="#103d7f