<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-label="Grille d’unités : un carré par pays, pour les 40 pays européens dont la production électrique de 2024 est rapportée, en trois blocs. 16 carrés au-dessus de 75 % d’électricité bas-carbone, 6 entre 60 et 75 %, 18 sous 60 %. La teinte de chaque carré donne sa classe."><rect x="0" y="0" width="540" height="960" fill="#111044"></rect><text x="56" y="65.5" font-family="Montserrat" font-size="9.5" font-weight="500" font-style="normal" letter-spacing="2.6" fill="#4FE0C0">ÉNERGIE · EUROPE</text><text x="56" y="106.04988315" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">L’EUROPE</text><text x="56" y="145.08908954999998" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">ÉLECTRIQUE EST AUX</text><text x="56" y="184.12829595" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">DEUX BOUTS : 6 PAYS</text><text x="56" y="223.16750235" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">SEULEMENT AU</text><text x="56" y="262.20670874999996" font-family="Montserrat" font-size="32" font-weight="400" font-style="normal" letter-spacing="3.4" fill="#FFFFFF">MILIEU</text><text x="56" y="309.9970399800781" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Un carré, un pays : les 40 pays européens dont la production électrique</text><text x="56" y="328.1228163472656" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">de 2024 est rapportée, rangés par part d’électricité bas-carbone —</text><text x="56" y="346.24859271445314" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">renouvelables et nucléaire réunis. 16 dépassent 75 %, 18 sont sous 60 %,</text><text x="56" y="364.3743690816406" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">et 6 seulement se tiennent entre les deux.</text><text x="56" y="811.7475872656249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">LECTURE : CHAQUE CARRÉ EST UN PAYS ET SE COMPTE. LA</text><text x="56" y="825.747802265625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">TEINTE DU CARRÉ DONNE SA CLASSE, DONT LES BORNES SONT</text><text x="56" y="839.748017265625" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">SOUS LA GRILLE ; LE NOMBRE DEVANT CHAQUE BLOC EST LE</text><text x="56" y="853.7482322656249" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#a7a6b9">COMPTE DE CE BLOC, EN PAYS.</text><text x="56" y="885.8742236328125" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">Source : Ember, Energy Institute – Statistical Review of World Energy</text><text x="56" y="904" font-family="Open Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0" fill="#a5a4b8">(2025), via Our World in Data</text><g><text x="56" y="394.5010471485351" font-family="Montserrat" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="#53e1c1">16</text><text x="77.7760005146265" y="394.5010471485351" font-family="Montserrat" font-size="10" font-weight="500" font-style="normal" letter-spacing="1.8" fill="#53e1c1">PAYS AU-DESSUS DE 75 % D’ÉLECTRICITÉ BAS-CARBONE</text><rect x="56" y="402.5010471485351" width="40.889701203036616" height="40.889701203036616" fill="#84e9d3" stroke="#3c3b66"