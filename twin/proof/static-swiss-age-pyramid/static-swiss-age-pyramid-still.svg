<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif" data-ladder="the zero spine is fully occupied by band labels at this size — the label column reads as the axis and no rule is drawn; R4: the peak callout keeps its MARK (an outline on the band, its label in bold) and loses its sentence, which the title already states"><desc>Population pyramid of Switzerland by age and sex, 2023. The widest band is 55-59 at 669,962 people, not the youngest band: 0-4 year-olds total 434,030, about 65% of the peak band&#x27;s width. Women outnumber men in every band from 60-64 upward.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="138" fill="#000000" font-size="53" font-weight="700">Switzerland&#x27;s population bulges at ages 55-59, not among the</text><text x="85" y="204" fill="#000000" font-size="53" font-weight="700">youngest</text><text x="85" y="266" fill="#616161" font-size="31">Age bands run in their natural sequence, oldest at top — sorting by population size would destroy the shape this chart exists to</text><text x="85" y="310" fill="#616161" font-size="31">show.</text><text x="85" y="995" fill="#616161" font-size="31">Source: UN, World Population Prospects (2024), via Our World in Data · 2023 data, extracted 8 August 2026</text><g><rect x="758.0234375" y="345" width="26" height="26" fill="#0072B2"></rect><text x="798.0234375" y="367" fill="#000000" font-size="29" font-weight="600">Men</text></g><g><rect x="1065.8173828125" y="345" width="26" height="26" fill="#D55E00"></rect><text x="1105.8173828125" y="367" fill="#000000" font-size="29" font-weight="600">Women</text></g><g><line x1="677.4161551339286" x2="677.4161551339286" y1="415" y2="889" stroke="#d1d1d1" stroke-width="1"></line><text x="677.4161551339286" y="929" fill="#616161" font-size="26" text-anchor="middle">100k</text></g><g><line x1="447.64969308035717" x2="447.64969308035717" y