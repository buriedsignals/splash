<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif" data-ladder="none"><desc>100%-stacked bar chart of 6 countries&#x27; 2024 electricity generation by renewables, nuclear and fossil fuel: Norway 99% renewable, 0% nuclear, 1% fossil; Sweden 69% renewable, 29% nuclear, 1% fossil; Switzerland 67% renewable, 31% nuclear, 2% fossil; Germany 59% renewable, 0% nuclear, 41% fossil; Poland 31% renewable, 0% nuclear, 69% fossil; France 27% renewable, 68% nuclear, 5% fossil. Norway has the highest renewable share of the 6, Poland the highest fossil share.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="140" fill="#000000" font-size="55" font-weight="700">Norway ran its grid on 99% renewables in 2024 — Poland leaned</text><text x="85" y="210" fill="#000000" font-size="55" font-weight="700">on fossil fuel</text><text x="85" y="272" fill="#616161" font-size="31">Each column is 100% of that country&#x27;s own 2024 electricity generation; totals in TWh differ a lot between them.</text><text x="85" y="951" fill="#616161" font-size="31">Source: Ember, Energy Institute — Statistical Review of World Energy (2025), via Our World in Data · 2024 generation,</text><text x="85" y="995" fill="#616161" font-size="31">extracted 8 August 2026</text><g><rect x="85" y="312" width="26" height="26" fill="#009E73"></rect><text x="124" y="334" fill="#000000" font-size="29" font-weight="600">Renewables (hydro, wind, solar, bio)</text></g><g><rect x="685.83935546875" y="312" width="26" height="26" fill="#0072B2"></rect><text x="724.83935546875" y="334" fill="#000000" font-size="29" font-weight="600">Nuclear</text></g><g><rect x="892.7431640625" y="312" width="26" height="26" fill="#D55E00"></rect><text x="931.7431640625" y="334" fill="#000000" font-size="29" font-weight="600">Fossil (gas, oil, coal)</text></g><g><line x1="188.1376953125" x2="1835" y1="816" y2="816" stro