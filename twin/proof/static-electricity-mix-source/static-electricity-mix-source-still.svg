<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>100%-stacked bar chart of 6 countries&#x27; 2024 electricity generation by renewables, nuclear and fossil fuel: Norway 99% renewable, 0% nuclear, 1% fossil; Sweden 69% renewable, 29% nuclear, 1% fossil; Switzerland 67% renewable, 31% nuclear, 2% fossil; Germany 59% renewable, 0% nuclear, 41% fossil; Poland 31% renewable, 0% nuclear, 69% fossil; France 27% renewable, 68% nuclear, 5% fossil. Norway has the highest renewable share of the 6, Poland the highest fossil share.</desc><rect x="0" y="0" width="900" height="560" fill="#FFFFFF"></rect><text x="40" y="65" fill="#000000" font-size="25" font-weight="700">Norway ran its grid on 99% renewables in 2024 — Poland leaned on</text><text x="40" y="97" fill="#000000" font-size="25" font-weight="700">fossil fuel</text><text x="40" y="125" fill="#616161" font-size="14">Each column is 100% of that country&#x27;s own 2024 electricity generation; totals in TWh differ a lot between them.</text><text x="40" y="500" fill="#616161" font-size="14">Source: Ember, Energy Institute — Statistical Review of World Energy (2025), via Our World in Data · 2024 generation, extracted 8</text><text x="40" y="520" fill="#616161" font-size="14">August 2026</text><g><rect x="40" y="143" width="12" height="12" fill="#009E73"></rect><text x="58" y="153" fill="#000000" font-size="13" font-weight="600">Renewables (hydro, wind, solar, bio)</text></g><g><rect x="310.06591796875" y="143" width="12" height="12" fill="#0072B2"></rect><text x="328.06591796875" y="153" fill="#000000" font-size="13" font-weight="600">Nuclear</text></g><g><rect x="403.5400390625" y="143" width="12" height="12" fill="#D55E00"></rect><text x="421.5400390625" y="153" fill="#000000" font-size="13" font-weight="600">Fossil (gas, oil, coal)</text></g><g><line x1="86.3720703125" x2="860" y1="452" y2="452" stroke="#616161" stroke-width="1"></line><text x="76.3720703125" y="456" fill="#616161" font-size="13" text-anchor="end">0</text></g><g><line x1="86.3720703125" x2="860" y1="397" y2="397" stroke="#d1d1d1" stroke-width="1"></line><text x="76.3720703125" y="401" fill="#616161" font-size="13" text-anchor="end">20</text></g><g><line x1="86.3720703125" x2="860" y1="342" y2="342" stroke="#d1d1d1" stroke-width="1"></line><text x="76.3720703125" y="346" fill="#616161" font-size="13" text-anchor="end">40</text></g><g><line x1="86.3720703125" x2="860" y1="287" y2="287" stroke="#d1d1d1" stroke-width="1"></line><text x="76.3720703125" y="291" fill="#616161" font-size="13" text-anchor="end">60</text></g><g><line x1="86.3720703125" x2="860" y1="231.99999999999997" y2="231.99999999999997" stroke="#d1d1d1" stroke-width="1"></line><text x="76.3720703125" y="235.99999999999997" fill="#616161" font-size="13" text-anchor="end">80</text></g><g><line x1="86.3720703125" x2="860" y1="177" y2="177" stroke="#d1d1d1" stroke-width="1"></line><text x="76.3720703125" y="181" fill="#616161" font-size="13" text-anchor="end">100 %</text></g><g><g><rect x="86.3720703125" y="180.83330150849721" width="110.60465494791667" height="271.16669849150276" fill="#009E73"></rect><text x="141.67439778645834" y="320.4166507542486" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">99%</text></g><g><rect x="86.3720703125" y="180.83330150849721" width="110.60465494791667" height="0" fill="#0072B2"></rect></g><g><rect x="86.3720703125" y="177" width="110.60465494791667" height="3.8333015084972146" fill="#D55E00"></rect></g><text x="141.67439778645834" y="474" fill="#616161" font-size="13" text-anchor="middle">Norway</text></g><g><g><rect x="218.97672526041669" y="261.26517571884983" width="110.60465494791667" height="190.73482428115017" fill="#009E73"></rect><text x="274.279052734375" y="360.6325878594249" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">69%</text></g><g><rect x="218.97672526041669" y="180.322