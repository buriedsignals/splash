<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>100%-stacked bar chart of six countries&#x27; 2024 electricity generation by renewables, nuclear and fossil fuel. Norway is 99% renewable. Sweden and Switzerland are roughly two-thirds renewable with the rest split between nuclear and a small fossil share. Germany is 59% renewable and 41% fossil, with no nuclear. Poland is 69% fossil, the highest fossil share of the six.</desc><rect x="0" y="0" width="900" height="560" fill="#FFFFFF"></rect><text x="40" y="65" fill="#000000" font-size="25" font-weight="700">Norway ran its grid on 99% renewables in 2024 — Poland leaned on</text><text x="40" y="97" fill="#000000" font-size="25" font-weight="700">fossil fuel</text><text x="40" y="125" fill="#616161" font-size="14">Each column is 100% of that country&#x27;s own 2024 electricity generation; totals in TWh differ a lot between them.</text><text x="40" y="147" fill="#616161" font-size="14">Source: Ember, Energy Institute — Statistical Review of World Energy (2025), via Our World in Data · 2024 generation, extracted 8</text><text x="40" y="167" fill="#616161" font-size="14">August 2026</text><g><rect x="40" y="185" width="12" height="12" fill="#009E73"></rect><text x="58" y="195" fill="#000000" font-size="13" font-weight="600">Renewables (hydro, wind, solar, bio)</text></g><g><rect x="310.06591796875" y="185" width="12" height="12" fill="#0072B2"></rect><text x="328.06591796875" y="195" fill="#000000" font-size="13" font-weight="600">Nuclear</text></g><g><rect x="403.5400390625" y="185" width="12" height="12" fill="#D55E00"></rect><text x="421.5400390625" y="195" fill="#000000" font-size="13" font-weight="600">Fossil (gas, oil, coal)</text></g><g><line x1="86.3720703125" x2="860" y1="496" y2="496" stroke="#616161" stroke-width="1"></line><text x="76.3720703125" y="500" fill="#616161" font-size="13" text-anchor="end">0</text></g><g><line x1="86.3720703125" x2="860" y1="440.6" y2="440.6" stroke="#d1d1d1" stroke-width="1"></line><text x="76.3720703125" y="444.6" fill="#616161" font-size="13" text-anchor="end">20</text></g><g><line x1="86.3720703125" x2="860" y1="385.2" y2="385.2" stroke="#d1d1d1" stroke-width="1"></line><text x="76.3720703125" y="389.2" fill="#616161" font-size="13" text-anchor="end">40</text></g><g><line x1="86.3720703125" x2="860" y1="329.8" y2="329.8" stroke="#d1d1d1" stroke-width="1"></line><text x="76.3720703125" y="333.8" fill="#616161" font-size="13" text-anchor="end">60</text></g><g><line x1="86.3720703125" x2="860" y1="274.4" y2="274.4" stroke="#d1d1d1" stroke-width="1"></line><text x="76.3720703125" y="278.4" fill="#616161" font-size="13" text-anchor="end">80</text></g><g><line x1="86.3720703125" x2="860" y1="219" y2="219" stroke="#d1d1d1" stroke-width="1"></line><text x="76.3720703125" y="223" fill="#616161" font-size="13" text-anchor="end">100 %</text></g><g><g><rect x="86.3720703125" y="222.86118006492265" width="110.60465494791667" height="273.1388199350773" fill="#009E73"></rect><text x="141.67439778645834" y="363.4305900324613" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">99%</text></g><g><rect x="86.3720703125" y="222.86118006492265" width="110.60465494791667" height="0" fill="#0072B2"></rect></g><g><rect x="86.3720703125" y="219" width="110.60465494791667" height="3.8611800649226495" fill="#D55E00"></rect></g><text x="141.67439778645834" y="518" fill="#616161" font-size="13" text-anchor="middle">Norway</text></g><g><g><rect x="218.97672526041669" y="303.8780133604415" width="110.60465494791667" height="192.1219866395585" fill="#009E73"></rect><text x="274.279052734375" y="403.93900668022076" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">69%</text></g><g><rect x="218.97672526041669" y="222.34684867847807" width="110.60465494791667" height="81.53116468196345" fill="#0072B2"></rect><text x="274.279052734375" y="267.1