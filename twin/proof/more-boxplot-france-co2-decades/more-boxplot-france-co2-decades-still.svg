<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Box plot of France&#x27;s annual per-capita CO2 emissions by decade, 1950s to 2020s, in tonnes per capita. The median rises from 5.41 in the 1950s to a peak of 9.96 in the 1970s, then falls every decade after that to 4.27 in the 2020s (n=5, a partial decade covering 2020-2024 only; every other decade shown is a full n=10). 1980s has 1 outlier reading beyond the whisker: 9.5, from the tail end of the prior decade&#x27;s higher emissions.</desc><rect x="0" y="0" width="900" height="560" fill="#FFFFFF"></rect><text x="40" y="64" fill="#000000" font-size="24" font-weight="700">France&#x27;s per-capita CO₂ emissions peaked in the 1970s and have fallen</text><text x="40" y="94" fill="#000000" font-size="24" font-weight="700">in every decade since</text><text x="40" y="520" fill="#616161" font-size="14">Source: Global Carbon Budget 2025, via Our World in Data · France, 1950–2024, extracted 8 August 2026</text><g><line x1="158.83056640625" x2="820" y1="425.7857142857143" y2="425.7857142857143" stroke="#d1d1d1" stroke-width="1"></line><text x="148.83056640625" y="429.7857142857143" fill="#616161" font-size="13" text-anchor="end">4</text></g><g><line x1="158.83056640625" x2="820" y1="379.35714285714283" y2="379.35714285714283" stroke="#d1d1d1" stroke-width="1"></line><text x="148.83056640625" y="383.35714285714283" fill="#616161" font-size="13" text-anchor="end">5</text></g><g><line x1="158.83056640625" x2="820" y1="332.9285714285714" y2="332.9285714285714" stroke="#d1d1d1" stroke-width="1"></line><text x="148.83056640625" y="336.9285714285714" fill="#616161" font-size="13" text-anchor="end">6</text></g><g><line x1="158.83056640625" x2="820" y1="286.5" y2="286.5" stroke="#d1d1d1" stroke-width="1"></line><text x="148.83056640625" y="290.5" fill="#616161" font-size="13" text-anchor="end">7</text></g><g><line x1="158.83056640625" x2="