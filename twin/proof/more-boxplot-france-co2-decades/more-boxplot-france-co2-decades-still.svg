<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Box plot of France&#x27;s annual per-capita CO2 emissions by decade, 1950s to 2020s, in tonnes per capita. The median rises from 5.41 in the 1950s to a peak of 9.96 in the 1970s, then falls every decade after that to 4.27 in the 2020s (n=5, a partial decade covering 2020-2024 only; every other decade shown is a full n=10). 1980s has 1 outlier reading beyond the whisker: 9.5, from the tail end of the prior decade&#x27;s higher emissions.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="138" fill="#000000" font-size="53" font-weight="700">France&#x27;s per-capita CO₂ emissions peaked in the 1970s and have</text><text x="85" y="204" fill="#000000" font-size="53" font-weight="700">fallen in every decade since</text><text x="85" y="995" fill="#616161" font-size="31">Source: Global Carbon Budget 2025, via Our World in Data · France, 1950–2024, extracted 8 August 2026</text><g><line x1="349.77587890625" x2="1747" y1="822.5000000000001" y2="822.5000000000001" stroke="#d1d1d1" stroke-width="1"></line><text x="327.77587890625" y="831.5000000000001" fill="#616161" font-size="29" text-anchor="end">4</text></g><g><line x1="349.77587890625" x2="1747" y1="737.5" y2="737.5" stroke="#d1d1d1" stroke-width="1"></line><text x="327.77587890625" y="746.5" fill="#616161" font-size="29" text-anchor="end">5</text></g><g><line x1="349.77587890625" x2="1747" y1="652.5" y2="652.5" stroke="#d1d1d1" stroke-width="1"></line><text x="327.77587890625" y="661.5" fill="#616161" font-size="29" text-anchor="end">6</text></g><g><line x1="349.77587890625" x2="1747" y1="567.5" y2="567.5" stroke="#d1d1d1" stroke-width="1"></line><text x="327.77587890625" y="576.5" fill="#616161" font-size="29" text-anchor="end">7</text></g><g><line x1="349.77587890625" x2="1747" y1="482.5" y2="482.5" stroke="#d1d1d1" stroke-width="1"><