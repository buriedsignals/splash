<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Grouped bar chart of wind and solar shares of 2024 electricity generation for 6 countries. In France, Germany, Norway, Poland and Sweden, wind&#x27;s share is larger than solar&#x27;s. Switzerland is the reverse: solar 7.2%, wind 0.2%.</desc><rect x="0" y="0" width="900" height="560" fill="#FFFFFF"></rect><text x="40" y="66" fill="#000000" font-size="26" font-weight="700">Switzerland is the outlier: everywhere else here, wind beats solar</text><text x="40" y="96" fill="#616161" font-size="14">Share of each country&#x27;s total electricity generation in 2024, from generation by source in terawatt-hours.</text><text x="40" y="500" fill="#616161" font-size="14">Source: Ember, Energy Institute — Statistical Review of World Energy (2025), via Our World in Data · 2024 generation, extracted 8</text><text x="40" y="520" fill="#616161" font-size="14">August 2026</text><rect x="40" y="114" width="12" height="12" fill="#0072B2"></rect><text x="58" y="124" fill="#000000" font-size="13" font-weight="600">Wind</text><rect x="114" y="114" width="12" height="12" fill="#E69F00"></rect><text x="132" y="124" fill="#000000" font-size="13" font-weight="600">Solar</text><g><line x1="79.14208984375" x2="860" y1="432" y2="432" stroke="#616161" stroke-width="1"></line><text x="69.14208984375" y="436" fill="#616161" font-size="13" text-anchor="end">0</text></g><g><line x1="79.14208984375" x2="860" y1="385" y2="385" stroke="#d1d1d1" stroke-width="1"></line><text x="69.14208984375" y="389" fill="#616161" font-size="13" text-anchor="end">5</text></g><g><line x1="79.14208984375" x2="860" y1="338.00000000000006" y2="338.00000000000006" stroke="#d1d1d1" stroke-width="1"></line><text x="69.14208984375" y="342.00000000000006" fill="#616161" font-size="13" text-anchor="end">10</text></g><g><line x1="79.14208984375" x2="860" y1="291" y2="291" stroke="#d1d1d