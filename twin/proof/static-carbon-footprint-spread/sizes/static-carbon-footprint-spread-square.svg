<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Histogram of CO2 emissions per capita across 213 countries in 2023, in 4-tonne bins from 0 to 36 and above. The distribution is heavily right-skewed: 127 countries sit in the 0-4 tonne bin, more than any other bin; the rest thin out into a long tail, topped by Qatar alone above 36 tonnes, at 40.1 tonnes. A dashed median line sits at 3.1 tonnes.</desc><rect x="0" y="0" width="1080" height="1080" fill="#FFFFFF"></rect><text x="72" y="147" fill="#000000" font-size="75" font-weight="700">Six in ten countries emit</text><text x="72" y="243" fill="#000000" font-size="75" font-weight="700">under 4 tonnes of CO2</text><text x="72" y="339" fill="#000000" font-size="75" font-weight="700">per person a year</text><text x="72" y="423" fill="#616161" font-size="42">Per-country distribution for 2023 — each of the</text><text x="72" y="483" fill="#616161" font-size="42">213 countries counts equally here, not weighted</text><text x="72" y="543" fill="#616161" font-size="42">by population. A few oil and gas producers sit far</text><text x="72" y="603" fill="#616161" font-size="42">out on the right.</text><text x="72" y="888" fill="#616161" font-size="42">Source: Global Carbon Budget (2025), via Our</text><text x="72" y="948" fill="#616161" font-size="42">World in Data · 2023 data, extracted 8 August</text><text x="72" y="1008" fill="#616161" font-size="42">2026</text><g><line x1="334.7431640625" x2="984" y1="693" y2="693" stroke="#616161" stroke-width="1"></line><text x="304.7431640625" y="705" fill="#616161" font-size="39" text-anchor="end">0</text></g><g><line x1="334.7431640625" x2="984" y1="697.6153846153848" y2="697.6153846153848" stroke="#d1d1d1" stroke-width="1"></line><text x="304.7431640625" y="709.6153846153848" fill="#616161" font-size="39" text-anchor="end">50</text></g><g><line x1="334.7431640625" x2="984" y1="702.23076923