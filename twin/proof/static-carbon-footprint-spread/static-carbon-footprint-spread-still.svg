<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Histogram of CO2 emissions per capita across 213 countries in 2023, in 4-tonne bins from 0 to 40. The distribution is heavily right-skewed: 127 countries sit in the 0-4 tonne bin, more than any other bin; the rest thin out into a long tail, topped by Qatar alone in the 36-40 tonne bin. A dashed median line sits at 3.1 tonnes.</desc><rect x="0" y="0" width="900" height="560" fill="#FFFFFF"></rect><text x="40" y="65" fill="#000000" font-size="25" font-weight="700">Six in ten countries emit under 4 tonnes of CO2 per person a year</text><text x="40" y="93" fill="#616161" font-size="14">Per-country distribution for 2023 — each of the 213 countries counts equally here, not weighted by population. A few oil and gas</text><text x="40" y="113" fill="#616161" font-size="14">producers sit far out on the right.</text><text x="40" y="135" fill="#616161" font-size="14">Source: Global Carbon Budget (2025), via Our World in Data · 2023 data, extracted 8 August 2026</text><g><line x1="127.5810546875" x2="852" y1="477" y2="477" stroke="#616161" stroke-width="1"></line><text x="117.5810546875" y="481" fill="#616161" font-size="13" text-anchor="end">0</text></g><g><line x1="127.5810546875" x2="852" y1="429.6153846153846" y2="429.6153846153846" stroke="#d1d1d1" stroke-width="1"></line><text x="117.5810546875" y="433.6153846153846" fill="#616161" font-size="13" text-anchor="end">20</text></g><g><line x1="127.5810546875" x2="852" y1="382.2307692307692" y2="382.2307692307692" stroke="#d1d1d1" stroke-width="1"></line><text x="117.5810546875" y="386.2307692307692" fill="#616161" font-size="13" text-anchor="end">40</text></g><g><line x1="127.5810546875" x2="852" y1="334.8461538461538" y2="334.8461538461538" stroke="#d1d1d1" stroke-width="1"></line><text x="117.5810546875" y="338.8461538461538" fill="#616161" font-size="13" text-anchor="end">60</tex