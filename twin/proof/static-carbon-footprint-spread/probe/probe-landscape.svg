<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Histogram of CO2 emissions per capita across 213 countries in 2023, in 4-tonne bins from 0 to 36 and above. The distribution is heavily right-skewed: 127 countries sit in the 0-4 tonne bin, more than any other bin; the rest thin out into a long tail, topped by Qatar alone above 36 tonnes, at 40.1 tonnes. A dashed median line sits at 3.1 tonnes.</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="84" y="137" fill="#000000" font-size="53" font-weight="700">Six in ten countries emit under 4 tonnes of CO2 per person a year</text><text x="84" y="196" fill="#616161" font-size="29">Per-country distribution for 2023 — each of the 213 countries counts equally here, not weighted by population. A few oil and gas</text><text x="84" y="238" fill="#616161" font-size="29">producers sit far out on the right.</text><text x="84" y="284" fill="#616161" font-size="29">Source: Global Carbon Budget (2025), via Our World in Data · 2023 data, extracted 8 August 2026</text><g><line x1="266.1298828125" x2="1819" y1="906" y2="906" stroke="#616161" stroke-width="1"></line><text x="245.1298828125" y="914" fill="#616161" font-size="27" text-anchor="end">0</text></g><g><line x1="266.1298828125" x2="1819" y1="821.2307692307693" y2="821.2307692307693" stroke="#d1d1d1" stroke-width="1"></line><text x="245.1298828125" y="829.2307692307693" fill="#616161" font-size="27" text-anchor="end">20</text></g><g><line x1="266.1298828125" x2="1819" y1="736.4615384615385" y2="736.4615384615385" stroke="#d1d1d1" stroke-width="1"></line><text x="245.1298828125" y="744.4615384615385" fill="#616161" font-size="27" text-anchor="end">40</text></g><g><line x1="266.1298828125" x2="1819" y1="651.6923076923076" y2="651.6923076923076" stroke="#d1d1d1" stroke-width="1"></line><text x="245.1298828125" y="659.6923076923076" fill="#616161" font-size