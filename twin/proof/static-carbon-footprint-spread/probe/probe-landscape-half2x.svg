<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Histogram of CO2 emissions per capita across 213 countries in 2023, in 4-tonne bins from 0 to 36 and above. The distribution is heavily right-skewed: 127 countries sit in the 0-4 tonne bin, more than any other bin; the rest thin out into a long tail, topped by Qatar alone above 36 tonnes, at 40.1 tonnes. A dashed median line sits at 3.1 tonnes.</desc><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"></rect><text x="42" y="68" fill="#000000" font-size="26" font-weight="700">Six in ten countries emit under 4 tonnes of CO2 per person a year</text><text x="42" y="97" fill="#616161" font-size="15">Per-country distribution for 2023 — each of the 213 countries counts equally here, not weighted by population. A few oil and gas</text><text x="42" y="118" fill="#616161" font-size="15">producers sit far out on the right.</text><text x="42" y="141" fill="#616161" font-size="15">Source: Global Carbon Budget (2025), via Our World in Data · 2023 data, extracted 8 August 2026</text><g><line x1="136.548828125" x2="910" y1="453" y2="453" stroke="#616161" stroke-width="1"></line><text x="125.548828125" y="457" fill="#616161" font-size="14" text-anchor="end">0</text></g><g><line x1="136.548828125" x2="910" y1="410.53846153846155" y2="410.53846153846155" stroke="#d1d1d1" stroke-width="1"></line><text x="125.548828125" y="414.53846153846155" fill="#616161" font-size="14" text-anchor="end">20</text></g><g><line x1="136.548828125" x2="910" y1="368.07692307692304" y2="368.07692307692304" stroke="#d1d1d1" stroke-width="1"></line><text x="125.548828125" y="372.07692307692304" fill="#616161" font-size="14" text-anchor="end">40</text></g><g><line x1="136.548828125" x2="910" y1="325.6153846153846" y2="325.6153846153846" stroke="#d1d1d1" stroke-width="1"></line><text x="125.548828125" y="329.6153846153846" fill="#616161" font-size="14" text-anc