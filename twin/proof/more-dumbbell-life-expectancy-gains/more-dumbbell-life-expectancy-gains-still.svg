<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Dumbbell chart of life expectancy at birth in 2000 (blue) and 2023 (vermillion) for ten countries, sorted by the size of the gain, largest first. Every country&#x27;s 2023 dot sits to the right of its 2000 dot. Poland rose from 73.6 to 78.6 years, the largest gain (+5.0); United States rose from 76.8 to 79.3 years, the smallest gain (+2.5).</desc><rect x="0" y="0" width="900" height="860" fill="#FFFFFF"></rect><text x="40" y="62" fill="#000000" font-size="22" font-weight="700">Every one of these ten countries added years of life expectancy between 2000</text><text x="40" y="90" fill="#000000" font-size="22" font-weight="700">and 2023 — Poland gained the most, +5.0 years; United States gained the</text><text x="40" y="118" fill="#000000" font-size="22" font-weight="700">least, +2.5 years</text><text x="40" y="820" fill="#616161" font-size="14">Source: UN, World Population Prospects (2024), via Our World in Data · 2000 and 2023, extracted 8 August 2026</text><circle cx="46" cy="144" r="6" fill="#0072B2"></circle><text x="58" y="148" fill="#000000" font-size="13" font-weight="600">2000</text><circle cx="130" cy="144" r="6" fill="#D55E00"></circle><text x="142" y="148" fill="#000000" font-size="13" font-weight="600">2023</text><g><line x1="252.16727701822913" x2="252.16727701822913" y1="174" y2="762" stroke="#d1d1d1" stroke-width="1"></line><text x="252.16727701822913" y="784" fill="#616161" font-size="12" text-anchor="middle">74</text></g><g><line x1="356.3319091796875" x2="356.3319091796875" y1="174" y2="762" stroke="#d1d1d1" stroke-width="1"></line><text x="356.3319091796875" y="784" fill="#616161" font-size="12" text-anchor="middle">76</text></g><g><line x1="460.49654134114587" x2="460.49654134114587" y1="174" y2="762" stroke="#d1d1d1" stroke-width="1"></line><text x="460.49654134114587" y="784" fill="#616161" font-size="