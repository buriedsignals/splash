<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" font-family="Helvetica, Arial, sans-serif"><desc>A diverging bar chart of the change in CO₂ emissions per person between 1990 and 2024 for all 27 EU member states, sorted from the largest rise to the largest fall. Exactly one bar points right of the zero line: Croatia, at +0.03 tonnes per person, drawn in the accent colour on a highlighted row. The other 26 point left, from Cyprus at −0.52 down to Luxembourg at −20.48. A dashed rule marks the average of those falls, −4.93.</desc><rect x="0" y="0" width="900" height="1000" fill="#FFFFFF"></rect><text x="40" y="64" fill="#000000" font-size="24" font-weight="700">Croatia is the only EU country emitting more CO₂ per person than in</text><text x="40" y="94" fill="#000000" font-size="24" font-weight="700">1990</text><text x="40" y="120" fill="#616161" font-size="15">Croatia&#x27;s rise is +0.03 tonnes per person — the only one, and a small one: 4.73 in 1990 against 4.76 in 2024. The other 26</text><text x="40" y="140" fill="#616161" font-size="15">member states all emit less per person than they did, by 4.93 tonnes on average — Luxembourg by 20.48, the largest fall in</text><text x="40" y="160" fill="#616161" font-size="15">the union.</text><text x="40" y="941" fill="#616161" font-size="14">Source: Global Carbon Budget (2025); population based on various sources (2024) – with major processing by Our World in Data ·</text><text x="40" y="960" fill="#616161" font-size="14">fossil fuels and industry only</text><text x="40" y="194" fill="#616161" font-size="13" font-weight="500">Change in CO₂ emissions per person, 1990 to 2024, tonnes</text><g><line x1="212.88237100595998" x2="212.88237100595998" y1="256" y2="917" stroke="#d1d1d1" stroke-width="1"></line><text x="212.88237100595998" y="222" fill="#616161" font-size="13" font-weight="500" text-anchor="middle">−20</text></g><g><line x1="355.5977493672594" x2="355.5977493672594" y