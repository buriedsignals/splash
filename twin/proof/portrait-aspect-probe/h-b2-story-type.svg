<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Histogram of CO2 emissions per capita across 213 countries in 2023, in 4-tonne bins from 0 to 36 and above. The distribution is heavily right-skewed: 127 countries sit in the 0-4 tonne bin, more than any other bin; the rest thin out into a long tail, topped by Qatar alone above 36 tonnes, at 40.1 tonnes. A dashed median line sits at 3.1 tonnes.</desc><rect x="0" y="0" width="1080" height="1920" fill="#FFFFFF"></rect><text x="76" y="141" fill="#000000" font-size="65" font-weight="700">Six in ten countries emit</text><text x="76" y="224" fill="#000000" font-size="65" font-weight="700">under 4 tonnes of CO2 per</text><text x="76" y="307" fill="#000000" font-size="65" font-weight="700">person a year</text><text x="76" y="360" fill="#616161" font-size="36">Per-country distribution for 2023 — each of the 213</text><text x="76" y="412" fill="#616161" font-size="36">countries counts equally here, not weighted by population.</text><text x="76" y="464" fill="#616161" font-size="36">A few oil and gas producers sit far out on the right.</text><text x="76" y="506" fill="#616161" font-size="27">Source: Global Carbon Budget (2025), via Our World in Data · 2023 data,</text><text x="76" y="558" fill="#616161" font-size="27">extracted 8 August 2026</text><g><line x1="244.1943359375" x2="989" y1="934" y2="934" stroke="#616161" stroke-width="1"></line><text x="225.1943359375" y="942" fill="#616161" font-size="25" text-anchor="end">0</text></g><g><line x1="244.1943359375" x2="989" y1="886.1538461538461" y2="886.1538461538461" stroke="#d1d1d1" stroke-width="1"></line><text x="225.1943359375" y="894.1538461538461" fill="#616161" font-size="25" text-anchor="end">20</text></g><g><line x1="244.1943359375" x2="989" y1="838.3076923076924" y2="838.3076923076924" stroke="#d1d1d1" stroke-width="1"></line><text x="225.1943359375" y="846.3076923076924" fill="#616161" font-size="25" text-anchor="end">40</text></g><g><line x1="244.1943359375" x2="989" y1="790.4615384615385" y2="790.4615384615385" stroke="#d1d1d1" stroke-width="1"></line><text x="225.1943359375" y="798.4615384615385" fill="#616161" font-size="25" text-anchor="end">60</text></g><g><line x1="244.1943359375" x2="989" y1="742.6153846153846" y2="742.6153846153846" stroke="#d1d1d1" stroke-width="1"></line><text x="225.1943359375" y="750.6153846153846" fill="#616161" font-size="25" text-anchor="end">80</text></g><g><line x1="244.1943359375" x2="989" y1="694.7692307692307" y2="694.7692307692307" stroke="#d1d1d1" stroke-width="1"></line><text x="225.1943359375" y="702.7692307692307" fill="#616161" font-size="25" text-anchor="end">100</text></g><g><line x1="244.1943359375" x2="989" y1="646.9230769230769" y2="646.9230769230769" stroke="#d1d1d1" stroke-width="1"></line><text x="225.1943359375" y="654.9230769230769" fill="#616161" font-size="25" text-anchor="end">120 countries</text></g><rect x="244.1943359375" y="630.1769230769231" width="73.48056640624998" height="303.8230769230769" fill="#616161"></rect><rect x="318.67490234375" y="807.2076923076924" width="73.48056640625003" height="126.79230769230765" fill="#616161"></rect><rect x="393.15546875" y="898.1153846153845" width="73.48056640624998" height="35.88461538461547" fill="#616161"></rect><rect x="467.63603515625" y="912.4692307692309" width="73.48056640625003" height="21.530769230769124" fill="#616161"></rect><rect x="542.1166015625" y="926.8230769230769" width="73.48056640624998" height="7.176923076923117" fill="#616161"></rect><rect x="616.59716796875" y="929.2153846153847" width="73.48056640624998" height="4.784615384615336" fill="#616161"></rect><rect x="691.077734375" y="926.8230769230769" width="73.48056640624998" height="7.176923076923117" fill="#616161"></rect><rect x="765.55830078125" y="934" width="73.48056640625009" height="0" fill="#616161"></rect><rect x="840.0388671875" y="934" width="73.48056640624998" height="0" fill="#616161"></rect><rect x="914.51943359375" y="931.6076923076923" width="73.48056640624998" height="2.392307692307668" fill="#616161"></rect><text x="244.1943359375" y="972" fill="#616161" font-size="25" text-anchor="middle">0</text><text x="318.67490234375" y="972" fill="#616161" font-size="25" text-anchor="middle">4</text><text x="393.15546875" y="972" fill="#616161" font-size="25" text-anchor="middle">8</text><text x="467.63603515625" y="972" fill="#616161" font-size="25" text-anchor="middle">12</text><text x="542.1166015625" y="972" fill="#616161" font-size="25" text-anchor="middle">16</text><text x="616.59716796875" y="972" fill="#616161" font-size="25" text-anchor="middle">20</text><text x="691.077734375" y="972" fill="#616161" font-size="25" text-anchor="middle">24</text><text x="765.55830078125" y="972" fill="#616161" font-size="25" text-anchor="middle">28</text><text x="840.0388671875" y="972" fill="#616161" font-size="25" text-anchor="middle">32</text><text x="914.51943359375" y="972" fill="#616161" font-size="25" text-anchor="middle">36</text><text x="989" y="972" fill="#616161" font-size="25" text-anchor="middle">40</text><text x="616.59716796875" y="1016" fill="#616161" font-size="25" font-weight="600" text-anchor="middle">CO2 emissions per capita (tonnes/year)</text><line x1="302.64618170930174" x2="302.64618170930174" y1="623" y2="934" stroke="#0B7A75" stroke-width="2" stroke-dasharray="6 4"></line><text x="317.64618170930174" y="653" fill="#000000" font-size="25" font-weight="700">Median: 3.1 t</text><line x1="76" x2="1004" y1="1102" y2="1102" stroke="#d1d1d1" stroke-width="1"></line><g><text x="76" y="1190" fill="#0B7A75" font-size="39" font-weight="700">The bulk.</text><text x="263.54931640625" y="1190" fill="#000000" font-size="39">127 of the 213 countries — 60% — emit</text><text x="263.54931640625" y="1250" fill="#000000" font-size="39">less than 4 tonnes a head, and the first bar</text><text x="263.54931640625" y="1310" fill="#000000" font-size="39">is 2.4 times the height of the second.</text></g><g><text x="76" y="1397" fill="#0B7A75" font-size="39" font-weight="700">The middle.</text><text x="309.06201171875" y="1397" fill="#000000" font-size="39">Half of all countries fall below 3.1</text><text x="309.06201171875" y="1457" fill="#000000" font-size="39">tonnes and half above it. That is the</text><text x="309.06201171875" y="1517" fill="#000000" font-size="39">dashed rule, and it sits inside the first</text><text x="309.06201171875" y="1577" fill="#000000" font-size="39">bar rather than in the middle of the axis</text><text x="309.06201171875" y="1637" fill="#000000" font-size="39">— which is what a right-skewed</text><text x="309.06201171875" y="1697" fill="#000000" font-size="39">distribution looks like.</text></g><g><text x="76" y="1784" fill="#0B7A75" font-size="39" font-weight="700">The tail.</text><text x="239.7265625" y="1784" fill="#000000" font-size="39">Qatar alone sits above 36 tonnes, at 40.1 —</text><text x="239.7265625" y="1844" fill="#000000" font-size="39">13 times the median country.</text></g></svg>