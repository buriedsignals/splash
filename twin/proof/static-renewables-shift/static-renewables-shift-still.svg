<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Slope chart of six countries&#x27; renewable share of electricity generation, 2015 versus 2024. Germany rises from 29% to 59%, the steepest climb. Norway stays flat near the top, from 98% to 99%. Poland rises from 14% to 31%, France from 16% to 27%. Sweden and Switzerland both rise a few points, staying in the mid-60s.</desc><rect x="0" y="0" width="900" height="560" fill="#FFFFFF"></rect><text x="40" y="64" fill="#000000" font-size="24" font-weight="700">Germany&#x27;s renewable electricity share nearly doubled in nine years</text><text x="40" y="92" fill="#616161" font-size="14">Share of each country&#x27;s own total generation. Norway was already near-total renewable in 2015, so it had almost no room left to</text><text x="40" y="112" fill="#616161" font-size="14">climb.</text><text x="40" y="134" fill="#616161" font-size="14">Source: Ember, Energy Institute — Statistical Review of World Energy (2025), via Our World in Data · extracted 8 August 2026</text><text x="164.3408203125" y="168" fill="#000000" font-size="14" font-weight="700" text-anchor="middle">2015</text><text x="735.6591796875" y="168" fill="#000000" font-size="14" font-weight="700" text-anchor="middle">2024</text><g><line x1="164.3408203125" y1="195.10303030303024" x2="735.6591796875" y2="192.83228311374194" stroke="#616161" stroke-width="1.5"></line><circle cx="164.3408203125" cy="195.10303030303024" r="3.5" fill="#616161"></circle><circle cx="735.6591796875" cy="192.83228311374194" r="3.5" fill="#616161"></circle><line x1="156.3408203125" y1="195.10303030303024" x2="156.3408203125" y2="195.10303030303024" stroke="#616161" stroke-width="1" stroke-dasharray="2 2" opacity="0"></line><text x="152.3408203125" y="199.10303030303024" fill="#000000" font-size="13" font-weight="600" text-anchor="end">Norway 98.0%</text><line x1="743.6591796875" y1="192.832283113