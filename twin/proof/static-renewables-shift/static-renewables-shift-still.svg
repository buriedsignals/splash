<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Slope chart of 6 countries&#x27; renewable share of electricity generation, 2015 versus 2024. Germany rises from 29% to 59%, the steepest climb at 29 percentage points. Norway moves least, from 98% to 99%, already near the top of the scale. The others: Sweden 63% to 69%, Switzerland 62% to 67%, Poland 14% to 31%, France 16% to 27%.</desc><rect x="0" y="0" width="900" height="560" fill="#FFFFFF"></rect><text x="40" y="64" fill="#000000" font-size="24" font-weight="700">Germany&#x27;s renewable electricity share nearly doubled in nine years</text><text x="40" y="92" fill="#616161" font-size="14">Share of each country&#x27;s own total generation. Norway was already near-total renewable in 2015, so it had almost no room left to</text><text x="40" y="112" fill="#616161" font-size="14">climb.</text><text x="40" y="520" fill="#616161" font-size="14">Source: Ember, Energy Institute — Statistical Review of World Energy (2025), via Our World in Data · extracted 8 August 2026</text><text x="164.3408203125" y="146" fill="#000000" font-size="14" font-weight="700" text-anchor="middle">2015</text><text x="735.6591796875" y="146" fill="#000000" font-size="14" font-weight="700" text-anchor="middle">2024</text><g><line x1="164.3408203125" y1="173.057498057498" x2="735.6591796875" y2="170.8013069399359" stroke="#616161" stroke-width="1.5"></line><circle cx="164.3408203125" cy="173.057498057498" r="3.5" fill="#616161"></circle><circle cx="735.6591796875" cy="170.8013069399359" r="3.5" fill="#616161"></circle><line x1="156.3408203125" y1="173.057498057498" x2="156.3408203125" y2="173.057498057498" stroke="#616161" stroke-width="1" stroke-dasharray="2 2" opacity="0"></line><text x="152.3408203125" y="177.057498057498" fill="#000000" font-size="13" font-weight="600" text-anchor="end">Norway 98.0%</text><line x1="743.6591796875" y1="170.8013069399359" x2="743.6591796875" y2="170.8013069399359" stroke="#616161" stroke-width="1" stroke-dasharray="2 2" opacity="0"></line><text x="747.6591796875" y="174.8013069399359" fill="#000000" font-size="13" font-weight="600" text-anchor="start">Norway 98.6%</text></g><g><line x1="164.3408203125" y1="292.5089163237311" x2="735.6591796875" y2="271.5442604963372" stroke="#616161" stroke-width="1.5"></line><circle cx="164.3408203125" cy="292.5089163237311" r="3.5" fill="#616161"></circle><circle cx="735.6591796875" cy="271.5442604963372" r="3.5" fill="#616161"></circle><line x1="156.3408203125" y1="292.5089163237311" x2="156.3408203125" y2="286.29069918569553" stroke="#616161" stroke-width="1" stroke-dasharray="2 2" opacity="1"></line><text x="152.3408203125" y="290.29069918569553" fill="#000000" font-size="13" font-weight="600" text-anchor="end">Sweden 63.3%</text><line x1="743.6591796875" y1="271.5442604963372" x2="743.6591796875" y2="266.83170519890086" stroke="#616161" stroke-width="1" stroke-dasharray="2 2" opacity="1"></line><text x="747.6591796875" y="270.83170519890086" fill="#000000" font-size="13" font-weight="600" text-anchor="start">Sweden 69.4%</text></g><g><line x1="164.3408203125" y1="296.0724820476599" x2="735.6591796875" y2="278.11914990146454" stroke="#616161" stroke-width="1.5"></line><circle cx="164.3408203125" cy="296.0724820476599" r="3.5" fill="#616161"></circle><circle cx="735.6591796875" cy="278.11914990146454" r="3.5" fill="#616161"></circle><line x1="156.3408203125" y1="296.0724820476599" x2="156.3408203125" y2="302.29069918569553" stroke="#616161" stroke-width="1" stroke-dasharray="2 2" opacity="1"></line><text x="152.3408203125" y="306.29069918569553" fill="#000000" font-size="13" font-weight="600" text-anchor="end">Switzerland 62.2%</text><line x1="743.6591796875" y1="278.11914990146454" x2="743.6591796875" y2="282.83170519890086" stroke="#616161" stroke-width="1" stroke-dasharray="2 2" opacity="1"></line><text x="747.6591796875" y="286.8317051