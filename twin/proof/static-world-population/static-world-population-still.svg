<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Area chart of world population from 1800 to 2023, rising from about 1 billion to about 8.1 billion, with the growth rate visibly steepening through the 20th century.</desc><rect x="0" y="0" width="900" height="560" fill="#FFFFFF"></rect><text x="40" y="66" fill="#000000" font-size="26" font-weight="700">World population passed 8 billion in 2023 — more than eight</text><text x="40" y="100" fill="#000000" font-size="26" font-weight="700">times its 1800 level</text><text x="40" y="130" fill="#616161" font-size="14">1800-1949 are HYDE/Gapminder historical estimates, not census counts; 1950 onward is the UN&#x27;s own recorded and revised series.</text><text x="40" y="152" fill="#616161" font-size="14">Source: HYDE (2023), Gapminder (2022) &amp; UN World Population Prospects (2024), via Our World in Data · extracted 8 August 2026</text><g><line x1="79.833984375" x2="733.9033203125" y1="496" y2="496" stroke="#616161" stroke-width="1"></line><text x="69.833984375" y="500" fill="#616161" font-size="13" text-anchor="end">0.0</text></g><g><line x1="79.833984375" x2="733.9033203125" y1="427.1111111111111" y2="427.1111111111111" stroke="#d1d1d1" stroke-width="1"></line><text x="69.833984375" y="431.1111111111111" fill="#616161" font-size="13" text-anchor="end">2.0</text></g><g><line x1="79.833984375" x2="733.9033203125" y1="358.2222222222222" y2="358.2222222222222" stroke="#d1d1d1" stroke-width="1"></line><text x="69.833984375" y="362.2222222222222" fill="#616161" font-size="13" text-anchor="end">4.0</text></g><g><line x1="79.833984375" x2="733.9033203125" y1="289.33333333333337" y2="289.33333333333337" stroke="#d1d1d1" stroke-width="1"></line><text x="69.833984375" y="293.33333333333337" fill="#616161" font-size="13" text-anchor="end">6.0</text></g><g><line x1="79.833984375" x2="733.9033203125" y1="220.44444444444446" y2="220.444444