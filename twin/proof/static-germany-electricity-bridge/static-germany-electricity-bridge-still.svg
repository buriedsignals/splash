<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Waterfall chart of Germany&#x27;s electricity generation, 2015 to 2024, in terawatt-hours: 639.2 TWh in 2015, plus 102.7 TWh from renewables growth, minus 91.8 TWh from the nuclear phase-out, minus 154.1 TWh from a falling fossil share, arriving at 496.0 TWh in 2024 — a net drop of 143.2 TWh.</desc><rect x="0" y="0" width="900" height="560" fill="#FFFFFF"></rect><text x="40" y="64" fill="#000000" font-size="24" font-weight="700">Germany generated 143 fewer terawatt-hours of electricity in 2024 than</text><text x="40" y="94" fill="#000000" font-size="24" font-weight="700">in 2015</text><text x="40" y="122" fill="#616161" font-size="14">The nuclear phase-out and a falling fossil share together outweighed the renewables build-out — renewables alone grew, but not</text><text x="40" y="142" fill="#616161" font-size="14">enough to offset the other two.</text><text x="40" y="164" fill="#616161" font-size="14">Source: Ember, Energy Institute — Statistical Review of World Energy (2025), via Our World in Data · extracted 8 August 2026</text><rect x="40" y="182" width="12" height="12" fill="#0072B2"></rect><text x="58" y="192" fill="#000000" font-size="13" font-weight="600">Increase</text><rect x="140" y="182" width="12" height="12" fill="#D55E00"></rect><text x="158" y="192" fill="#000000" font-size="13" font-weight="600">Decrease</text><rect x="245" y="182" width="12" height="12" fill="#616161"></rect><text x="263" y="192" fill="#000000" font-size="13" font-weight="600">Total</text><g><line x1="82.10009765625" x2="860" y1="481" y2="481" stroke="#616161" stroke-width="1"></line><text x="72.10009765625" y="485" fill="#616161" font-size="13" text-anchor="end">0</text></g><g><line x1="82.10009765625" x2="860" y1="415.25" y2="415.25" stroke="#d1d1d1" stroke-width="1"></line><text x="72.10009765625" y="419.25" fill="#616161" font-size="13" text-anchor="end">200</text></g><g><line x1="82.10009765625" x2="860" y1="349.5" y2="349.5" stroke="#d1d1d1" stroke-width="1"></line><text x="72.10009765625" y="353.5" fill="#616161" font-size="13" text-anchor="end">400</text></g><g><line x1="82.10009765625" x2="860" y1="283.75" y2="283.75" stroke="#d1d1d1" stroke-width="1"></line><text x="72.10009765625" y="287.75" fill="#616161" font-size="13" text-anchor="end">600</text></g><g><line x1="82.10009765625" x2="860" y1="218" y2="218" stroke="#d1d1d1" stroke-width="1"></line><text x="72.10009765625" y="222" fill="#616161" font-size="13" text-anchor="end">800</text></g><line x1="216.880078125" x2="242.880078125" y1="270.863" y2="270.863" stroke="#616161" stroke-width="1" stroke-dasharray="3 3"></line><line x1="377.66005859375" x2="403.66005859375" y1="237.10037499999999" y2="237.10037499999999" stroke="#616161" stroke-width="1" stroke-dasharray="3 3"></line><line x1="538.4400390625001" x2="564.4400390625001" y1="237.10037499999999" y2="237.10037499999999" stroke="#616161" stroke-width="1" stroke-dasharray="3 3"></line><line x1="699.22001953125" x2="725.22001953125" y1="267.27962499999995" y2="267.27962499999995" stroke="#616161" stroke-width="1" stroke-dasharray="3 3"></line><g><rect x="82.10009765625" y="270.863" width="134.77998046875" height="210.137" fill="#616161"></rect><text x="149.490087890625" y="262.863" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">639.2</text><text x="149.490087890625" y="503" fill="#616161" font-size="12" text-anchor="middle">2015 total generation</text></g><g><rect x="242.880078125" y="237.10037499999999" width="134.77998046875" height="33.762625000000014" fill="#0072B2"></rect><text x="310.27006835937505" y="229.10037499999999" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">+102.7</text><text x="310.27006835937505" y="503" fill="#616161" font-size="12" text-anchor="middle">Renewables</text></g><g><rect x="403.66005859375" y="237.10037499999999" width="134.77998046875" height="30.179249999999968" fill="#D55E00"></rect><text x="471.050048828125" y="229.10037499999999" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">−91.8</text><text x="471.050048828125" y="503" fill="#616161" font-size="12" text-anchor="middle">Nuclear</text></g><g><rect x="564.4400390625001" y="267.27962499999995" width="134.77998046875" height="50.66037499999999" fill="#D55E00"></rect><text x="631.8300292968751" y="259.27962499999995" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">−154.1</text><text x="631.8300292968751" y="503" fill="#616161" font-size="12" text-anchor="middle">Fossil fuel</text></g><g><rect x="725.22001953125" y="317.94" width="134.77998046875" height="163.06" fill="#616161"></rect><text x="792.610009765625" y="309.94" fill="#000000" font-size="13" font-weight="700" text-anchor="middle">496.0</text><text x="792.610009765625" y="503" fill="#616161" font-size="12" text-anchor="middle">2024 total generation</text></g></svg>