<title>Switzerland is the outlier: everywhere else here, wind beats solar</title>

<style>
:root {
  --ground: #FFFFFF;
  --accent: undefined;
  --ink: #000000;
  --muted: #616161;
  --grid: #d1d1d1;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  font-family: Helvetica, Arial, sans-serif;
}
.chart-figure { margin: 0; max-width: 900px; }
svg.chart { display: block; width: 100%; height: auto; }
/* Two pre-rendered layouts (web-discipline.md, "Responsive behaviour") — the narrow one hidden
   by default, swapped in below a fixed breakpoint. No layout is computed in the browser; the
   media query only chooses which server-rendered frame is on screen. */
svg.chart[data-layout="narrow"] { display: none; }
@media (max-width: 480px) {
  svg.chart[data-layout="desktop"] { display: none; }
  svg.chart[data-layout="narrow"] { display: block; }
}
.pt { cursor: pointer; }
.pt:hover, .pt:focus, .pt-active {
  fill: var(--muted);
  outline: none;
}
.pt:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
#tooltip {
  position: fixed;
  max-width: 220px;
  padding: 6px 10px;
  font-size: 13px;
  line-height: 1.3;
  background: var(--ground);
  color: var(--ink);
  border: 1px solid var(--muted);
  border-radius: 3px;
  pointer-events: none;
  z-index: 10;
}
#tooltip[hidden] { display: none; }

.bar-hit { cursor: pointer; }
.bar-hit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>

-detail="Sweden · Solar 2,42% (4,2 TWh)"></rect></g><g><rect x="303.7361653645833" y="387.3156820211816" width="16.631917317708332" height="1.6843179788183988" fill="#0072B2"></rect><rect x="323.36808268229163" y="336.0375568882651" width="16.631917317708332" height="52.9624431117349" fill="#E69F00"></rect><text x="312.0521240234375" y="381.3156820211816" fill="#000000" font-size="10" font-weight="700" text-anchor="middle">0,2</text><text x="331.6840413411458" y="330.0375568882651" fill="#000000" font-size="10" font-weight="700" text-anchor="middle">7,2</text><text x="321.86808268229163" y="409" fill="#616161" font-size="10" text-anchor="middle">Switzerland</text><rect class="bar-hit" x="303.7361653645833" y="169" width="16.631917317708332" height="220" fill="transparent" tabindex="0" role="img" aria-label="Switzerland, wind: 0,23% of generation, 0,2 TWh" data-detail="Switzerland · Wind 0,23% (0,2 TWh)"></rect><rect class="bar-hit" x="323.36808268229163" y="169" width="16.631917317708332" height="220" fill="transparent" tabindex="0" role="img" aria-label="Switzerland, solar: 7,22% of generation, 5,7 TWh" data-detail="Switzerland · Solar 7,22% (5,7 TWh)"></rect></g><g><line x1="321.86808268229163" x2="321.86808268229163" y1="177" y2="330.0375568882651" stroke="#616161" stroke-width="1" stroke-dasharray="3 3"></line><text x="242.50000131130219" y="177" fill="#000000" font-size="10" font-weight="600" text-anchor="middle">Solar leads wind here — the only reversal in</text><text x="242.50000131130219" y="192" fill="#000000" font-size="10" font-weight="600" text-anchor="middle">this group</text></g></svg>

<script>
// twin/skills/twin-chart-web/assets/interaction.mjs
//
// The one script the web genre ships, inlined verbatim into the self-contained HTML by
// `scripts/render-web.mjs` (which strips the `export` keyword from each top-level declaration so
// this file can also sit as a plain classic `<script>` — no `type="module"`, no bundler, so it
// keeps working in a CMS iframe or a sandboxed embed that restricts module scripts).
//
// `nearestIndex` is exported and pure — no DOM — so it is unit-tested directly
// (`test/interaction.test.ts`). `initChart`/`initAll` are DOM wiring and are NOT unit-tested here:
// per `twin-doctrine`'s own verification rule, an interactive genre is verified by driving a real
// browser, not by asserting against a DOM emulation nobody looked at
// (`references/web-discipline.md`, "Verification").
//
// What this file does NOT do: recompute any geometry. Every point's `cx`/`cy` and its exact
// `data-detail` string were already computed server-side, from the same `crossingGeometry`/`fr`
// the static and video genres use, and baked into the SVG at build time. This script only reads
// those attributes back off the DOM and positions a tooltip — it never re-derives a coordinate or
// re-formats a number, so there is exactly one implementation of "what year is this" for all three
// genres to disagree about, and it lives in the story's own `crossing-geometry.ts` (for the CO₂
// beat, `proof/co2-suisse/crossing-geometry.ts`).

/** Index of the entry in `cxs` closest to `x`. Pure, so it is testable without a DOM — the same
 *  boundary `crossingGeometry`'s own geometry/drawing split draws. */
function nearestIndex(cxs, x) {
  let best = 0;
  let bestDist = Infinity;
  for (let i = 0; i < cxs.length; i++) {
    const d = Math.abs(cxs[i] - x);
    if (d < bestDist) {
      bestDist = d;
      best = i;
    }
  }
  return best;
}

/** Wires one `<svg class="chart">` — its `.pt` points, its `.hit-area` overlay, and the shared
 *  tooltip element — to hover, tap and keyboard. Every point already carries its own `data-detail`
 *  string and its own `aria-label`; this function never invents either. */
function initChart(svg, tooltip) {
  const points = Array.prototype.slice.call(svg.querySelectorAll(".pt"));
  if (points.length === 0) return;
  const hitArea = svg.querySelector(".hit-area");
  const cxs = points.map((p) => parseFloat(p.getAttribute("cx")));

  function clear() {
    points.forEach((p) => p.classList.remove("pt-active"));
    tooltip.hidden = true;
  }

  function show(point, clientX, clientY) {
    points.forEach((p) => p.classList.toggle("pt-active", p === point));
    tooltip.textContent = point.getAttribute("data-detail");
    tooltip.hidden = false;
    const tw = tooltip.offsetWidth || 160;
    const th = tooltip.offsetHeight || 28;
    const x = Math.min(Math.max(clientX - tw / 2, 8), window.innerWidth - tw - 8);
    const y = Math.max(clientY - th - 14, 8);
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }

  // Hover and tap share one path: pointer events fire for mouse, pen and touch alike, and the
  // nearest-point-by-x overlay means a touch reader does not have to land a tap on a 5px circle —
  // any tap inside the plot resolves to the reading closest to it.
  function fromPointer(evt) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return;
    const svgPoint = svg.createSVGPoint();
    svgPoint.x = evt.clientX;
    svgPoint.y = evt.clientY;
    const local = svgPoint.matrixTransform(ctm.inverse());
    show(points[nearestIndex(cxs, local.x)], evt.clientX, evt.clientY);
  }

  if (hitArea) {
    hitArea.addEventListener("pointermove", fromPointer);
    hitArea.addEventListener("pointerdown", fromPointer);
    hitArea.addEventListener("pointerleave", clear);
  }

  // Keyboard: every point is already `tabIndex={0}` at build time (works with this script absent
  // entirely — see the component's own doc-comment). This layer adds the same detail box that
  // hover shows, plus Left/Right/Home/End to move between readings without leaving focus.
  points.forEach((point, i) => {
    point.addEventListener("focus", function () {
      const rect = point.getBoundingClientRect();
      show(point, rect.left + rect.width / 2, rect.top);
    });
    point.addEventListener("blur", clear);
    point.addEventListener("keydown", function (evt) {
      let nextIndex = null;
      if (evt.key === "ArrowRight") nextIndex = Math.min(i + 1, points.length - 1);
      else if (evt.key === "ArrowLeft") nextIndex = Math.max(i - 1, 0);
      else if (evt.key === "Home") nextIndex = 0;
      else if (evt.key === "End") nextIndex = points.length - 1;
      else if (evt.key === "Escape") {
        clear();
        point.blur();
        return;
      }
      if (nextIndex !== null && nextIndex !== i) {
        evt.preventDefault();
        points[nextIndex].focus();
      }
    });
  });

  document.addEventListener("pointerdown", function (evt) {
    if (svg.contains(evt.target) || tooltip.contains(evt.target)) return;
    clear();
  });
}

function initAll() {
  const tooltip = document.getElementById("tooltip");
  if (!tooltip) return;
  document.querySelectorAll("svg.chart").forEach(function (svg) {
    initChart(svg, tooltip);
  });
}

// Guarded rather than a bare top-level call: this file is also imported directly by
// `test/render-web.test.ts` (for the pure `nearestIndex` helper), in a context with no `document`.
// In the browser the guard is always true, so the inlined `<script>` still self-starts the moment
// it is parsed, unchanged.
if (typeof document !== "undefined") initAll();

</script>
<script>
// twin/proof/webx-wind-vs-solar/grouped-bar-interaction.mjs
//
// This beat's OWN interaction script — the skill's own `assets/interaction.mjs` resolves a pointer
// to the NEAREST of many points along one continuous axis (built for a line); twelve already-large
// bars have nothing to interpolate between, every bar is already its own direct hit target. The
// same reasoning `proof/web-co2-ranking/bar-interaction.mjs` gives for its own rows.
//
// What hover/tap/keyboard-focus reveals here that the static frame omits: the exact share to two
// decimals AND the absolute terawatt-hours behind it (`data-detail`) — never printed on the static
// frame, which only prints the rounded one-decimal share.
//
// Plain script (no ES module `export`) — no pure helper worth unit-testing on its own, only direct
// DOM wiring, proven by driving a real browser (`web-discipline.md`, "Verification").

function initBars() {
  const tooltip = document.getElementById("tooltip");
  if (!tooltip) return;
  const bars = Array.prototype.slice.call(document.querySelectorAll(".bar-hit"));
  if (bars.length === 0) return;

  function clear() {
    bars.forEach(function (b) {
      b.classList.remove("bar-active");
    });
    tooltip.hidden = true;
  }

  function show(bar, clientX, clientY) {
    bars.forEach(function (b) {
      b.classList.toggle("bar-active", b === bar);
    });
    tooltip.textContent = bar.getAttribute("data-detail");
    tooltip.hidden = false;
    const tw = tooltip.offsetWidth || 160;
    const th = tooltip.offsetHeight || 28;
    const x = Math.min(Math.max(clientX - tw / 2, 8), window.innerWidth - tw - 8);
    const y = Math.max(clientY - th - 14, 8);
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }

  bars.forEach(function (bar) {
    bar.addEventListener("pointerenter", function (evt) {
      show(bar, evt.clientX, evt.clientY);
    });
    bar.addEventListener("pointermove", function (evt) {
      show(bar, evt.clientX, evt.clientY);
    });
    bar.addEventListener("pointerdown", function (evt) {
      show(bar, evt.clientX, evt.clientY);
    });
    bar.addEventListener("pointerleave", clear);
    bar.addEventListener("focus", function () {
      const rect = bar.getBoundingClientRect();
      show(bar, rect.left + rect.width / 2, rect.top);
    });
    bar.addEventListener("blur", clear);
  });

  document.addEventListener("pointerdown", function (evt) {
    const target = evt.target;
    if (target && typeof target.closest === "function" && target.closest(".bar-hit")) return;
    clear();
  });
}

if (typeof document !== "undefined") initBars();

</script>
