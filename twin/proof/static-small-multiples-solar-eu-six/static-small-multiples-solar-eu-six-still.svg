<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Six small line charts, one per country, all on the same scale, showing solar&#x27;s share of electricity generation from 2010 to 2024. Every line rises. Spain rises furthest, from 2.4% to 20.7%, a gain of 18.3 percentage points. Spain, Germany, Italy, Poland all end above 10%. France&#x27;s line is close to flat by comparison, ending at 4.4%, and Poland and Romania started the period at zero.</desc><rect x="0" y="0" width="900" height="620" fill="#FFFFFF"></rect><text x="40" y="64" fill="#000000" font-size="24" font-weight="700">Solar supplied under 3% of electricity in every one of the EU&#x27;s six</text><text x="40" y="94" fill="#000000" font-size="24" font-weight="700">largest countries in 2010. By 2024 it supplied more than a tenth in four</text><text x="40" y="124" fill="#000000" font-size="24" font-weight="700">of them</text><text x="40" y="150" fill="#616161" font-size="15">Solar&#x27;s share of each country&#x27;s own electricity generation, %. Every panel is drawn on the same scale, so a flat panel is a</text><text x="40" y="170" fill="#616161" font-size="15">flat trend — France really is at 4.4% while Spain is at 20.7%.</text><text x="40" y="194" fill="#616161" font-size="14">Source: Ember, via Our World in Data · annual data to 2024, extracted 9 August 2026</text><g><text x="71.56640625" y="238" fill="#000000" font-size="15" font-weight="700">Spain</text><g><line x1="71.56640625" x2="314.37760416666663" y1="372" y2="372" stroke="#d1d1d1" stroke-width="1"></line><text x="63.56640625" y="376" fill="#616161" font-size="12" text-anchor="end">0</text></g><g><line x1="71.56640625" x2="314.37760416666663" y1="343.3636363636364" y2="343.3636363636364" stroke="#d1d1d1" stroke-width="1"></line><text x="63.56640625" y="347.3636363636364" fill="#616161" font-size="12" text-anchor="end">5</text></g><g><line x1="71.56640625