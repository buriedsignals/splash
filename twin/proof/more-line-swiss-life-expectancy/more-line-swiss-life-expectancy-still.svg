<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Line chart of life expectancy at birth in Switzerland, 1950 to 2023. The line rises from 68.9 years in 1950 to 84.0 years in 2023, a gain of 15.0 years, first crossing 80 years in 2001. Two small real dips interrupt the climb around 2020 and 2022, the COVID-19 era.</desc><rect x="0" y="0" width="900" height="560" fill="#FFFFFF"></rect><text x="40" y="64" fill="#000000" font-size="24" font-weight="700">Life expectancy in Switzerland rose by 15.0 years between 1950 and</text><text x="40" y="94" fill="#000000" font-size="24" font-weight="700">2023, from 68.9 to 84.0, crossing 80 in 2001.</text><text x="40" y="120" fill="#616161" font-size="14">Source: UN, World Population Prospects (2024), via Our World in Data · Switzerland, 1950–2023, extracted 8 August 2026</text><g><line x1="99.39111328125" x2="684.44287109375" y1="453.25" y2="453.25" stroke="#d1d1d1" stroke-width="1"></line><text x="89.39111328125" y="457.25" fill="#616161" font-size="13" text-anchor="end">70</text></g><g><line x1="99.39111328125" x2="684.44287109375" y1="346.375" y2="346.375" stroke="#d1d1d1" stroke-width="1"></line><text x="89.39111328125" y="350.375" fill="#616161" font-size="13" text-anchor="end">75</text></g><g><line x1="99.39111328125" x2="684.44287109375" y1="239.5" y2="239.5" stroke="#d1d1d1" stroke-width="1"></line><text x="89.39111328125" y="243.5" fill="#616161" font-size="13" text-anchor="end">80 years</text></g><text x="99.39111328125" y="520" fill="#616161" font-size="13" text-anchor="middle">1950</text><text x="179.5351896939212" y="520" fill="#616161" font-size="13" text-anchor="middle">1960</text><text x="259.6792661065924" y="520" fill="#616161" font-size="13" text-anchor="middle">1970</text><text x="339.8233425192637" y="520" fill="#616161" font-size="13" text-anchor="middle">1980</text><text x="419.9674189319349" y="520" fill="#61616