<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" font-family="Helvetica, Arial, sans-serif"><desc>A bump chart of world rank by annual CO₂ emissions, 1990 to 2024, for the 6 countries inside the top 10 in every one of those years. The top row is the world&#x27;s largest emitter. Every line is named at both ends. India&#x27;s line, the only one in the accent colour, starts at rank 8 in 1990 and climbs to rank 3 by 2024; three ringed crossings on it are captioned Germany in 1999, Japan in 2006 and Russia in 2009. The other lines are China, the United States, Russia, Japan and Germany. At the top of the chart China takes the top row from the United States in 2006; that swap is drawn but not marked, because this beat&#x27;s claim is India&#x27;s climb.</desc><rect x="0" y="0" width="900" height="720" fill="#FFFFFF"></rect><text x="40" y="64" fill="#000000" font-size="24" font-weight="700">India has risen from eighth to third among the world&#x27;s biggest CO₂</text><text x="40" y="94" fill="#000000" font-size="24" font-weight="700">emitters</text><text x="40" y="120" fill="#616161" font-size="15">World rank by annual CO₂ emissions, 1990–2024. Only the 6 countries that held a top-10 place in every year are drawn;</text><text x="40" y="140" fill="#616161" font-size="15">other countries hold the ranks left empty. Rank is position, not size — nothing here says how far ahead anyone is.</text><text x="40" y="661" fill="#616161" font-size="14">Source: Global Carbon Budget (2025) – with major processing by Our World in Data · fossil fuels and industry only; land-use change</text><text x="40" y="680" fill="#616161" font-size="14">is not included</text><text x="40" y="170" fill="#616161" font-size="13" font-weight="500">World rank</text><g><line x1="160.484375" x2="763.42333984375" y1="192" y2="192" stroke="#d1d1d1" stroke-width="1"></line><text x="53.90771484375" y="196.42" fill="#616161" font-size="13" font-weight="500" text-anchor="end">1</text></g><g><line x1="160.484375" x2="763.42333984375" y1="233" y2="233" stroke="#d1d1d1" stroke-width="1"></line><text x="53.90771484375" y="237.42" fill="#616161" font-size="13" font-weight="500" text-anchor="end">2</text></g><g><line x1="160.484375" x2="763.42333984375" y1="274" y2="274" stroke="#d1d1d1" stroke-width="1"></line><text x="53.90771484375" y="278.42" fill="#616161" font-size="13" font-weight="500" text-anchor="end">3</text></g><g><line x1="160.484375" x2="763.42333984375" y1="315" y2="315" stroke="#d1d1d1" stroke-width="1"></line><text x="53.90771484375" y="319.42" fill="#616161" font-size="13" font-weight="500" text-anchor="end">4</text></g><g><line x1="160.484375" x2="763.42333984375" y1="356" y2="356" stroke="#d1d1d1" stroke-width="1"></line><text x="53.90771484375" y="360.42" fill="#616161" font-size="13" font-weight="500" text-anchor="end">5</text></g><g><line x1="160.484375" x2="763.42333984375" y1="397" y2="397" stroke="#d1d1d1" stroke-width="1"></line><text x="53.90771484375" y="401.42" fill="#616161" font-size="13" font-weight="500" text-anchor="end">6</text></g><g><line x1="160.484375" x2="763.42333984375" y1="438" y2="438" stroke="#d1d1d1" stroke-width="1"></line><text x="53.90771484375" y="442.42" fill="#616161" font-size="13" font-weight="500" text-anchor="end">7</text></g><g><line x1="160.484375" x2="763.42333984375" y1="479" y2="479" stroke="#d1d1d1" stroke-width="1"></line><text x="53.90771484375" y="483.42" fill="#616161" font-size="13" font-weight="500" text-anchor="end">8</text></g><g><line x1="160.484375" x2="763.42333984375" y1="520" y2="520" stroke="#d1d1d1" stroke-width="1"></line><text x="53.90771484375" y="524.42" fill="#616161" font-size="13" font-weight="500" text-anchor="end">9</text></g><g><line x1="160.484375" x2="763.42333984375" y1="561" y2="561" stroke="#d1d1d1" stroke-width="1"></line><text x="53.90771484375" y="565.42" fill="#616161" font-size="13" font-weight="500" text-anchor="end">10</text></g><text x