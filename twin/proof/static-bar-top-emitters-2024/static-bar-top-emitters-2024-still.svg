<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Column chart ranking the ten countries with the highest CO₂ emissions in 2024. China is far ahead at 12.3 billion tonnes, 2.5 times the United States&#x27; 4.9 billion tonnes, and more than the United States, India, Russia, Japan and Indonesia added together. The remaining columns fall from 3.2 billion tonnes (India) to 0.57 billion tonnes (Germany).</desc><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"></rect><text x="85" y="138" fill="#000000" font-size="53" font-weight="700">China emitted more CO₂ in 2024 than the next five countries put</text><text x="85" y="204" fill="#000000" font-size="53" font-weight="700">together</text><text x="85" y="261" fill="#616161" font-size="33">Annual territorial CO₂ from fossil fuels and industry, billion tonnes. These ten countries account for 69% of the world</text><text x="85" y="305" fill="#616161" font-size="33">total; emissions embodied in imported goods are counted where the goods are made, not where they are used.</text><text x="85" y="995" fill="#616161" font-size="31">Source: Global Carbon Budget 2025, via Our World in Data · 2024 data, extracted 9 August 2026</text><g><rect x="109.5" y="406" width="126" height="444" fill="#0B7A75"></rect><text x="172.5" y="388" fill="#000000" font-size="31" font-weight="600" text-anchor="middle">12.3</text><text x="172.5" y="890" fill="#000000" font-size="29" text-anchor="middle">China</text></g><g><rect x="284.5" y="672.8153044050564" width="126" height="177.1846955949436" fill="#616161"></rect><text x="347.5" y="654.8153044050564" fill="#000000" font-size="31" font-weight="600" text-anchor="middle">4.9</text><text x="347.5" y="890" fill="#000000" font-size="29" text-anchor="middle">United</text><text x="347.5" y="925" fill="#000000" font-size="29" text-anchor="middle">States</text></g><g><rect x="459.5" y="734.620391622224" width="126" height="115.37960837777598" fill="#616161"></rect><text x="522.5" y="716.620391622224" fill="#000000" font-size="31" font-weight="600" text-anchor="middle">3.2</text><text x="522.5" y="890" fill="#000000" font-size="29" text-anchor="middle">India</text></g><g><rect x="634.5" y="785.6700745876183" width="126" height="64.32992541238173" fill="#616161"></rect><text x="697.5" y="767.6700745876183" fill="#000000" font-size="31" font-weight="600" text-anchor="middle">1.8</text><text x="697.5" y="890" fill="#000000" font-size="29" text-anchor="middle">Russia</text></g><g><rect x="809.5" y="815.2479619680533" width="126" height="34.752038031946654" fill="#616161"></rect><text x="872.5" y="797.2479619680533" fill="#000000" font-size="31" font-weight="600" text-anchor="middle">0.96</text><text x="872.5" y="890" fill="#000000" font-size="29" text-anchor="middle">Japan</text></g><g><rect x="984.5" y="820.6546762940009" width="126" height="29.345323705999135" fill="#616161"></rect><text x="1047.5" y="802.6546762940009" fill="#000000" font-size="31" font-weight="600" text-anchor="middle">0.81</text><text x="1047.5" y="890" fill="#000000" font-size="29" text-anchor="middle">Indonesia</text></g><g><rect x="1159.5" y="821.3624222304807" width="126" height="28.63757776951934" fill="#616161"></rect><text x="1222.5" y="803.3624222304807" fill="#000000" font-size="31" font-weight="600" text-anchor="middle">0.79</text><text x="1222.5" y="890" fill="#000000" font-size="29" text-anchor="middle">Iran</text></g><g><rect x="1334.5" y="824.9933803600721" width="126" height="25.006619639927862" fill="#616161"></rect><text x="1397.5" y="806.9933803600721" fill="#000000" font-size="31" font-weight="600" text-anchor="middle">0.69</text><text x="1397.5" y="890" fill="#000000" font-size="29" text-anchor="middle">Saudi</text><text x="1397.5" y="925" fill="#000000" font-size="29" text-anchor="middle">Arabia</text></g><g><rect x="1509.5" y="828.9118096495274" width="126" height="21.088190350472587" fill="#616161"></rect><text x="1572.5" y="810.9118096495274" fill="#000000" font-size="31" font-weight="600" text-anchor="middle">0.58</text><text x="1572.5" y="890" fill="#000000" font-size="29" text-anchor="middle">South</text><text x="1572.5" y="925" fill="#000000" font-size="29" text-anchor="middle">Korea</text></g><g><rect x="1684.5" y="829.3222437624689" width="126" height="20.67775623753107" fill="#616161"></rect><text x="1747.5" y="811.3222437624689" fill="#000000" font-size="31" font-weight="600" text-anchor="middle">0.57</text><text x="1747.5" y="890" fill="#000000" font-size="29" text-anchor="middle">Germany</text></g><line x1="235.5" x2="1835" y1="406" y2="406" stroke="#0B7A75" stroke-width="3" stroke-dasharray="11 9"></line><text x="266.5" y="380" fill="#000000" font-size="31">more than the United States, India, Russia, Japan and Indonesia added together (11.7 bn t)</text><line x1="85" x2="1835" y1="850" y2="850" stroke="#000000" stroke-width="1"></line></svg>