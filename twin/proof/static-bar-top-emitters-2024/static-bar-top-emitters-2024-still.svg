<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" font-family="Helvetica, Arial, sans-serif"><desc>Column chart ranking the ten countries with the highest CO₂ emissions in 2024. China is far ahead at 12.3 billion tonnes, 2.5 times the United States&#x27; 4.9 billion tonnes, and more than the United States, India, Russia, Japan and Indonesia added together. The remaining columns fall from 3.2 billion tonnes (India) to 0.57 billion tonnes (Germany).</desc><rect x="0" y="0" width="900" height="560" fill="#FFFFFF"></rect><text x="40" y="64" fill="#000000" font-size="24" font-weight="700">China emitted more CO₂ in 2024 than the next five countries put</text><text x="40" y="94" fill="#000000" font-size="24" font-weight="700">together</text><text x="40" y="120" fill="#616161" font-size="15">Annual territorial CO₂ from fossil fuels and industry, billion tonnes. These ten countries account for 69% of the world total;</text><text x="40" y="140" fill="#616161" font-size="15">emissions embodied in imported goods are counted where the goods are made, not where they are used.</text><text x="40" y="164" fill="#616161" font-size="14">Source: Global Carbon Budget 2025, via Our World in Data · 2024 data, extracted 9 August 2026</text><g><rect x="51.47999999999996" y="210" width="59.04" height="268" fill="#0B7A75"></rect><text x="80.99999999999996" y="202" fill="#000000" font-size="14" font-weight="600" text-anchor="middle">12.3</text><text x="80.99999999999996" y="496" fill="#000000" font-size="13" text-anchor="middle">China</text></g><g><rect x="133.47999999999996" y="371.0506792354845" width="59.04" height="106.9493207645155" fill="#616161"></rect><text x="162.99999999999997" y="363.0506792354845" fill="#000000" font-size="14" font-weight="600" text-anchor="middle">4.9</text><text x="162.99999999999997" y="496" fill="#000000" font-size="13" text-anchor="middle">United</text><text x="162.99999999999997" y="512" fill="#000000" font-size="13" text-anchor="middle">States</text></g><g><rect x="215.47999999999996" y="408.35645260080184" width="59.04" height="69.64354739919816" fill="#616161"></rect><text x="244.99999999999997" y="400.35645260080184" fill="#000000" font-size="14" font-weight="600" text-anchor="middle">3.2</text><text x="244.99999999999997" y="496" fill="#000000" font-size="13" text-anchor="middle">India</text></g><g><rect x="297.47999999999996" y="439.17022520153535" width="59.04" height="38.829774798464655" fill="#616161"></rect><text x="326.99999999999994" y="431.17022520153535" fill="#000000" font-size="14" font-weight="600" text-anchor="middle">1.8</text><text x="326.99999999999994" y="496" fill="#000000" font-size="13" text-anchor="middle">Russia</text></g><g><rect x="379.47999999999996" y="457.02354461134746" width="59.04" height="20.97645538865254" fill="#616161"></rect><text x="408.99999999999994" y="449.02354461134746" fill="#000000" font-size="14" font-weight="600" text-anchor="middle">0.96</text><text x="408.99999999999994" y="496" fill="#000000" font-size="13" text-anchor="middle">Japan</text></g><g><rect x="461.47999999999996" y="460.2870568621447" width="59.04" height="17.71294313785529" fill="#616161"></rect><text x="490.99999999999994" y="452.2870568621447" fill="#000000" font-size="14" font-weight="600" text-anchor="middle">0.81</text><text x="490.99999999999994" y="496" fill="#000000" font-size="13" text-anchor="middle">Indonesia</text></g><g><rect x="543.48" y="460.7142548598397" width="59.04" height="17.285745140160316" fill="#616161"></rect><text x="573" y="452.7142548598397" fill="#000000" font-size="14" font-weight="600" text-anchor="middle">0.79</text><text x="573" y="496" fill="#000000" font-size="13" text-anchor="middle">Iran</text></g><g><rect x="625.48" y="462.9059142713949" width="59.04" height="15.09408572860508" fill="#616161"></rect><text x="655" y="454.9059142713949" fill="#000000" font-size="14" font-weight="600" text-anchor="middle">0.69</text><text x="655" y="496" fill="#000000" font-size="13" text-anchor="middle">Saudi</text><text x="655" y="512" fill="#000000" font-size="13" text-anchor="middle">Arabia</text></g><g><rect x="707.48" y="465.2710923109761" width="59.04" height="12.728907689023913" fill="#616161"></rect><text x="737" y="457.2710923109761" fill="#000000" font-size="14" font-weight="600" text-anchor="middle">0.58</text><text x="737" y="496" fill="#000000" font-size="13" text-anchor="middle">South</text><text x="737" y="512" fill="#000000" font-size="13" text-anchor="middle">Korea</text></g><g><rect x="789.48" y="465.51883182058936" width="59.04" height="12.481168179410645" fill="#616161"></rect><text x="819" y="457.51883182058936" fill="#000000" font-size="14" font-weight="600" text-anchor="middle">0.57</text><text x="819" y="496" fill="#000000" font-size="13" text-anchor="middle">Germany</text></g><line x1="40" x2="860" y1="210" y2="210" stroke="#0B7A75" stroke-width="1.5" stroke-dasharray="5 4"></line><text x="124.51999999999995" y="198" fill="#000000" font-size="14">more than the United States, India, Russia, Japan and Indonesia added together (11.7 bn t)</text><line x1="40" x2="860" y1="478" y2="478" stroke="#000000" stroke-width="1"></line></svg>