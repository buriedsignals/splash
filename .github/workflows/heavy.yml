name: Heavy lane

# The heavy lane (browser, video renderer, rasteriser, map engine) is derived by
# scripts/test-lanes.mjs and used to take about an hour run file by file; it now runs across every core
# (see scripts/test-lanes.mjs, "THE HEAVY LANE RUNS IN TWO PHASES"). CI's `check` job runs only the
# fast lane, so heavy failures used to pile up unseen until a release. Run this
# before tagging a release, or after a change to renders, fonts or shared
# drawing code. macOS, not Ubuntu: several guards compare rasters byte for byte
# and were measured against macOS font rasterisation.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14  # --parallel; the fast job's 1.3.11 predates it

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Install the pinned Chrome for Testing the heavy guards were measured on
        run: bun run chrome:install  # into ~/.cache/puppeteer, where every script looks first (scripts/chrome-for-testing.mjs)

      - name: Assert the job carries no provider credentials
        run: |
          for name in MAPTILER_KEY VITE_MAPTILER_KEY REMOTION_MAPTILER_KEY DATAWRAPPER_TOKEN CLOUDFLARE_API_TOKEN; do
            if [ -n "${!name}" ]; then echo "$name is set in the secretless job"; exit 1; fi
          done

      - name: Heavy lane — parallel files across every core, then the files that write into proof/ alone
        run: bun run test:heavy
