name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Run secretless contract tests
        run: |
          bun test \
            skills/deliver/test \
            skills/intake/test \
            skills/newsroom-charter/test \
            skills/palette/test \
            skills/doctrine/test/traits.test.ts \
            skills/doctrine/test/guard-parity.test.ts \
            skills/doctrine/test/guard-walker-contract.test.ts \
            skills/doctrine/test/guard-path-boundaries.test.ts \
            skills/doctrine/test/guard-walker-bounds.test.ts \
            skills/doctrine/test/guard-cli-failure.test.ts \
            skills/storyboard/test \
            skills/splash/test/skill-md-matches-code.test.ts \
            skills/splash/test/phases.test.ts \
            skills/splash/test/where.test.ts \
            skills/splash/test/landing-matches-the-catalogue.test.ts
      - name: Verify the capability matrix
        run: bun run matrix:check

      - name: Verify the type survey
        run: bun run survey:check

      - name: Verify the visual catalogue derivative
        run: bun run catalog:check

      - name: Verify trait-derived guard coverage
        run: bun run guards:check

      - name: Verify the landing inventory
        run: bun run landing:check

  render-map:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
      VITE_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
      REMOTION_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies from the lockfile
        if: env.MAPTILER_KEY != ''
        run: bun install --frozen-lockfile

      - name: Write the ephemeral map-render environment
        if: env.MAPTILER_KEY != ''
        run: |
          printf 'MAPTILER_KEY=%s\nVITE_MAPTILER_KEY=%s\nREMOTION_MAPTILER_KEY=%s\n' \
            "$MAPTILER_KEY" "$VITE_MAPTILER_KEY" "$REMOTION_MAPTILER_KEY" > .env
          chmod 600 .env

      - name: Run the credential-gated live-map browser verification
        if: env.MAPTILER_KEY != ''
        run: bun test skills/map-web/test/live-map.test.ts
