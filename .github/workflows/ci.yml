name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Run secretless contract tests
        run: |
          bun test \
            skills/deliver/test \
            skills/intake/test \
            skills/newsroom-charter/test \
            skills/palette/test \
            skills/storyboard/test \
            skills/splash/test/skill-md-matches-code.test.ts \
            skills/splash/test/phases.test.ts \
            skills/splash/test/where.test.ts

      - name: Verify the capability matrix
        run: bun run matrix:check

      - name: Verify the type survey
        run: bun run survey:check

  render-map:
    if: ${{ secrets.MAPTILER_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
      REMOTION_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Write the ephemeral map-render environment
        run: |
          printf 'VITE_MAPTILER_KEY=%s\nREMOTION_MAPTILER_KEY=%s\n' \
            "$VITE_MAPTILER_KEY" "$REMOTION_MAPTILER_KEY" > .env
          chmod 600 .env

      - name: Run credential-gated map rendering tests
        run: |
          bun test \
            skills/map-beat/test \
            skills/map-web/test \
            skills/splash/test/every-extent-band-is-produced.test.ts \
            skills/splash/test/map-scrollys-are-live.test.ts
