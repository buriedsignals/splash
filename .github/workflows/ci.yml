name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Fast lane — every test that needs no browser, renderer or subprocess (derived, not listed)
        run: bun run test:lanes && bun run test

      - name: Assert the secretless job carries no provider credentials
        run: |
          for name in MAPTILER_KEY VITE_MAPTILER_KEY REMOTION_MAPTILER_KEY DATAWRAPPER_TOKEN CLOUDFLARE_API_TOKEN; do
            if [ -n "${!name}" ]; then echo "$name is set in the secretless job"; exit 1; fi
          done
      - name: Verify the capability matrix
        run: bun run matrix:check

      - name: Verify the type survey
        run: bun run survey:check

      - name: Verify the visual catalogue derivative
        run: bun run catalog:check

      - name: Verify the landing inventory
        run: bun run landing:check

      - name: Journalist install CTAs (join, no curl)
        run: bash tests/journalist-install-cta-check.sh

  render-map:

    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies from the lockfile
        if: env.MAPTILER_KEY != ''
        run: bun install --frozen-lockfile

      - name: Run the credential-gated live-map browser verification
        if: env.MAPTILER_KEY != ''
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          VITE_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          REMOTION_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: bun test skills/map-web/test/live-map.test.ts

